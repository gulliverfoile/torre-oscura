<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pinball Defense - Tower Defense + Pinball</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a1a; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: monospace; overflow: hidden; }
    canvas { border: 2px solid #4a4a6a; border-radius: 8px; background: #1a1a2e; }
    #ui-panel {
      position: fixed; top: 10px; left: 10px; color: #fff; z-index: 10;
      background: rgba(0,0,0,0.8); padding: 10px; border-radius: 8px; font-size: 14px;
      border: 1px solid #444; max-width: 320px;
    }
    #ui-panel h3 { color: #ffd93d; margin: 0 0 8px; }
    #ui-panel button {
      background: #4ecdc4; color: #000; border: none; padding: 6px 14px;
      margin: 3px; cursor: pointer; font-weight: bold; border-radius: 4px; font-family: monospace;
    }
    #ui-panel button:disabled { opacity: 0.4; cursor: default; }
    #ui-panel button.build-btn { background: #ffd93d; }
    #ui-panel button.build-btn.selected { background: #fff; box-shadow: 0 0 10px #ffd93d; }
    #enemy-list { margin: 8px 0; font-size: 13px; }
    #enemy-list span { margin-right: 8px; }
    #log-panel {
      position: fixed; bottom: 10px; left: 10px; right: 10px;
      background: rgba(0,0,0,0.85); color: #0f0; font-size: 12px; padding: 6px;
      border-radius: 6px; border: 1px solid #333; max-height: 80px; overflow-y: auto;
      pointer-events: none; z-index: 10;
    }
    #reward-panel {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(10,10,30,0.96); color: #fff; padding: 20px; border-radius: 12px;
      border: 2px solid #ffd93d; z-index: 100; display: none; text-align: center;
      min-width: 320px;
    }
    #reward-panel h2 { color: #ffd700; }
    #reward-panel button { margin: 8px; padding: 8px 18px; }
    .stat-row { display: flex; justify-content: space-between; margin: 4px 0; }
    .stat-row span:last-child { color: #ffd93d; font-weight: bold; }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="800" height="900"></canvas>
  <div id="ui-panel">
    <h3>🛡️ Pinball Defense</h3>
    <div>❤️ Vida núcleo: <span id="core-hp">100</span></div>
    <div>💎 PD: <span id="destiny-points">50</span></div>
    <div>🌊 Oleada: <span id="wave-num">1</span> | ⏱️ <span id="wave-timer">Prep</span></div>
    <div id="enemy-list"></div>
    <button id="btn-start-wave">⚡ Iniciar Oleada</button>
    <button id="btn-reset">🔄 Reiniciar</button>
    <div style="margin-top:8px;">
      <button class="build-btn" data-type="bumper">🟡 Bumper (5 PD)</button>
      <button class="build-btn" data-type="wall">🧱 Muro (8 PD)</button>
      <button class="build-btn" data-type="hole">🕳️ Agujero (15 PD)</button>
      <button class="build-btn" data-type="turret">🔫 Torreta (20 PD)</button>
    </div>
    <div style="margin-top:6px; font-size:11px; color:#aaa;">
      Click en el tablero para colocar | Click derecho para eliminar
    </div>
  </div>
  <div id="log-panel"></div>
  <div id="reward-panel">
    <h2>🏆 Oleada Completada</h2>
    <div id="reward-content"></div>
    <button id="btn-next-wave">▶️ Siguiente Oleada</button>
    <button id="btn-go-shop">🏪 Tienda de Mejoras</button>
  </div>

  <script type="importmap">
    { "imports": { "matter-js": "https://cdn.jsdelivr.net/npm/matter-js@0.19.0/+esm" } }
  </script>

  <script type="module">
    import * as Matter from 'matter-js';

    // ==================== UTILIDADES ====================
    const rand = (min, max) => Math.random() * (max - min) + min;
    const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
    const logEl = document.getElementById('log-panel');
    function log(msg) {
      const entry = document.createElement('div');
      entry.textContent = msg;
      logEl.appendChild(entry);
      logEl.scrollTop = logEl.scrollHeight;
      if (logEl.children.length > 30) logEl.removeChild(logEl.firstChild);
    }

    // ==================== DEFINICIÓN DE ENEMIGOS ====================
    const ENEMY_TYPES = {
      basic:   { name:'Básica', icon:'🔵', speed:2.5, hp:30, damage:1, color:'#4a9eff', radius:12, ability:null },
      fast:    { name:'Rápida', icon:'🔴', speed:4.5, hp:15, damage:1, color:'#ff4444', radius:9, ability:'esquiva' },
      heavy:   { name:'Pesada', icon:'🟢', speed:1.5, hp:80, damage:2, color:'#44cc44', radius:18, ability:'rompe_muros' },
      bouncy:  { name:'Rebotona', icon:'🟡', speed:2.8, hp:35, damage:1, color:'#ffcc00', radius:11, ability:'rebote_fuerte' },
      explosive:{ name:'Explosiva', icon:'🟣', speed:2.5, hp:25, damage:2, color:'#cc44cc', radius:12, ability:'explota_al_morir' },
      shielded:{ name:'Blindada', icon:'⚪', speed:2.2, hp:50, damage:1, color:'#cccccc', radius:14, ability:'escudo' },
      fire:    { name:'Fuego', icon:'🔥', speed:3.2, hp:20, damage:1, color:'#ff6600', radius:11, ability:'rastro_fuego' },
      ice:     { name:'Hielo', icon:'❄️', speed:1.8, hp:40, damage:1, color:'#88ccff', radius:13, ability:'ralentiza_torretas' },
      boss_roller:{ name:'Núcleo Rodante', icon:'💀', speed:1.0, hp:250, damage:3, color:'#ff8800', radius:24, ability:'genera_basicas' },
    };

    // ==================== CLASE DEL JUEGO (ORQUESTADOR) ====================
    class PinballDefenseGame {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.width = canvas.width;
        this.height = canvas.height;

        // Motor de física
        this.engine = Matter.Engine.create({ gravity: { x:0, y:0.6, scale:0.001 } });
        this.world = this.engine.world;

        // Estado del juego
        this.destinyPoints = 50;
        this.coreHP = 100;
        this.maxCoreHP = 100;
        this.wave = 1;
        this.waveActive = false;
        this.waveComplete = false;
        this.gameOver = false;
        this.totalKills = 0;
        this.waveKills = 0;
        this.waveEnemiesTotal = 0;

        // Listas de objetos
        this.defenses = [];       // { type, body, hp, ... }
        this.enemies = [];        // { type, body, hp, ... }
        this.drops = [];          // { x, y, type, value, collected }
        this.zones = [];          // zonas elementales temporales

        // Fase de construcción
        this.selectedBuildType = null;
        this.waveEnemyList = [];

        // Mejoras permanentes
        this.permanentUpgrades = {
          turretDamage: 0,
          turretFireRate: 0,
          coreArmor: 0,
          extraStartingPD: 0,
          bonusDropChance: 0
        };

        // Configurar mundo físico
        this._setupWorld();
        // Eventos de colisión
        Matter.Events.on(this.engine, 'collisionStart', (e) => this._onCollision(e));
        // Input
        this._setupInput();
        // UI
        this._setupUI();
        // Generar primera oleada
        this._generateWaveEnemyList();
        this._updateUI();
        // Bucle
        this.lastTime = performance.now();
        requestAnimationFrame((t) => this._loop(t));

        log('🟢 Pinball Defense iniciado. Coloca defensas y prepárate.');
      }

      // ==================== CONFIGURACIÓN DEL MUNDO ====================
      _setupWorld() {
        const w = this.width, h = this.height;
        const wallOpts = { isStatic: true, friction: 0.3, restitution: 0.4, label: 'boundary' };
        // Paredes del tablero
        const walls = [
          Matter.Bodies.rectangle(w/2, -5, w, 10, wallOpts),                // techo
          Matter.Bodies.rectangle(w/2, h+5, w, 10, { ...wallOpts, label:'floor' }), // suelo (núcleo)
          Matter.Bodies.rectangle(-5, h/2, 10, h, wallOpts),                // izquierda
          Matter.Bodies.rectangle(w+5, h/2, 10, h, wallOpts),               // derecha
        ];
        walls.forEach(wall => Matter.Composite.add(this.world, wall));

        // Compuertas de salida (sensores invisibles arriba)
        this.gates = [
          { x: w*0.25, y: 30, width: 60, active: true },
          { x: w*0.5, y: 30, width: 60, active: true },
          { x: w*0.75, y: 30, width: 60, active: true },
        ];
        // Aleatoriamente desactivar alguna compuerta
        if (Math.random() < 0.4) this.gates[Math.floor(Math.random()*3)].active = false;
      }

      // ==================== INPUT ====================
      _setupInput() {
        this.canvas.addEventListener('click', (e) => this._handleClick(e));
        this.canvas.addEventListener('contextmenu', (e) => { e.preventDefault(); this._handleRightClick(e); });
      }

      _handleClick(e) {
        if (this.waveActive || this.gameOver) return;
        const rect = this.canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) * (this.width / rect.width);
        const y = (e.clientY - rect.top) * (this.height / rect.height);

        if (y < 80) return; // No colocar en zona de compuertas
        if (y > this.height - 100) return; // No colocar en zona del núcleo

        if (this.selectedBuildType) {
          const cost = this._getBuildCost(this.selectedBuildType);
          if (this.destinyPoints >= cost) {
            this._placeDefense(this.selectedBuildType, x, y);
            this.destinyPoints -= cost;
            this._updateUI();
          } else {
            log('❌ Puntos insuficientes');
          }
        }
      }

      _handleRightClick(e) {
        if (this.waveActive || this.gameOver) return;
        const rect = this.canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) * (this.width / rect.width);
        const y = (e.clientY - rect.top) * (this.height / rect.height);

        for (let i = this.defenses.length-1; i >= 0; i--) {
          const def = this.defenses[i];
          if (dist(x, y, def.body.position.x, def.body.position.y) < 25) {
            this._removeDefense(i);
            break;
          }
        }
      }

      // ==================== UI ====================
      _setupUI() {
        document.getElementById('btn-start-wave').addEventListener('click', () => this.startWave());
        document.getElementById('btn-reset').addEventListener('click', () => this.resetGame());
        document.getElementById('btn-next-wave').addEventListener('click', () => this.nextWave());
        document.getElementById('btn-go-shop').addEventListener('click', () => this._openShop());

        document.querySelectorAll('.build-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            if (this.waveActive || this.gameOver) return;
            const type = btn.dataset.type;
            if (this.selectedBuildType === type) {
              this.selectedBuildType = null;
              btn.classList.remove('selected');
            } else {
              document.querySelectorAll('.build-btn').forEach(b => b.classList.remove('selected'));
              this.selectedBuildType = type;
              btn.classList.add('selected');
            }
          });
        });
      }

      _updateUI() {
        document.getElementById('core-hp').textContent = Math.max(0, this.coreHP);
        document.getElementById('destiny-points').textContent = this.destinyPoints;
        document.getElementById('wave-num').textContent = this.wave;
        document.getElementById('wave-timer').textContent = this.waveActive ? '⚔️ En curso' : '🛠️ Preparación';

        // Lista de enemigos de la oleada
        const listEl = document.getElementById('enemy-list');
        let listHTML = '<strong>Próximos enemigos:</strong><br>';
        const counts = {};
        this.waveEnemyList.forEach(e => counts[e.type] = (counts[e.type]||0)+1);
        for (const [type, count] of Object.entries(counts)) {
          const info = ENEMY_TYPES[type];
          listHTML += `${info.icon} ${info.name} x${count}<br>`;
        }
        listEl.innerHTML = listHTML;

        document.getElementById('btn-start-wave').disabled = this.waveActive || this.gameOver;
      }

      // ==================== COLOCACIÓN DE DEFENSAS ====================
      _getBuildCost(type) {
        return { bumper:5, wall:8, hole:15, turret:20 }[type] || 5;
      }

      _placeDefense(type, x, y) {
        let body;
        const restitutionMap = { bumper:1.2, wall:0.3, hole:0.1, turret:0.2 };
        const restitution = restitutionMap[type] || 0.4;

        if (type === 'bumper') {
          body = Matter.Bodies.circle(x, y, 18, {
            isStatic: true, restitution, friction:0.1, label:'bumper'
          });
        } else if (type === 'wall') {
          body = Matter.Bodies.rectangle(x, y, 20, 50, {
            isStatic: true, restitution, friction:0.5, label:'wall'
          });
        } else if (type === 'hole') {
          body = Matter.Bodies.circle(x, y, 22, {
            isStatic: true, isSensor: true, label:'hole'
          });
        } else if (type === 'turret') {
          body = Matter.Bodies.rectangle(x, y, 16, 16, {
            isStatic: true, isSensor: true, label:'turret'
          });
        }

        Matter.Composite.add(this.world, body);
        this.defenses.push({
          type, body,
          hp: type === 'wall' ? 100 : 999,
          fireTimer: 0,
          fireInterval: 0.8 - this.permanentUpgrades.turretFireRate * 0.1,
          damage: 8 + this.permanentUpgrades.turretDamage * 2,
        });
        log(`✅ ${type} colocado en (${Math.round(x)},${Math.round(y)})`);
      }

      _removeDefense(index) {
        const def = this.defenses[index];
        Matter.Composite.remove(this.world, def.body);
        this.defenses.splice(index, 1);
        const refund = Math.floor(this._getBuildCost(def.type) * 0.5);
        this.destinyPoints += refund;
        log(`🗑️ ${def.type} eliminado. Reembolso: ${refund} PD`);
        this._updateUI();
      }

      // ==================== GENERACIÓN DE OLEADA ====================
      _generateWaveEnemyList() {
        this.waveEnemyList = [];
        const baseCount = 6 + this.wave * 3;
        const types = ['basic', 'basic', 'basic', 'fast', 'heavy', 'bouncy'];
        if (this.wave >= 2) types.push('explosive', 'shielded');
        if (this.wave >= 3) types.push('fire', 'ice');
        if (this.wave >= 4 && Math.random() < 0.3) types.push('boss_roller');

        for (let i = 0; i < baseCount; i++) {
          const type = types[Math.floor(Math.random() * types.length)];
          this.waveEnemyList.push({ type, spawned: false });
        }
        this.waveEnemiesTotal = this.waveEnemyList.length;
        this.waveKills = 0;
        // Activar/desactivar compuertas aleatoriamente
        this.gates.forEach(g => g.active = Math.random() < 0.8);
      }

      startWave() {
        if (this.waveActive || this.gameOver) return;
        this.waveActive = true;
        this.waveComplete = false;
        this._spawnTimer = 0;
        this._spawnInterval = 0.8;
        this._spawnIndex = 0;
        log(`🌊 Oleada ${this.wave} iniciada!`);
        this._updateUI();
      }

      _spawnEnemy() {
        if (this._spawnIndex >= this.waveEnemyList.length) return;
        const entry = this.waveEnemyList[this._spawnIndex];
        const info = ENEMY_TYPES[entry.type];
        // Elegir compuerta activa aleatoria
        const activeGates = this.gates.filter(g => g.active);
        if (activeGates.length === 0) return;
        const gate = activeGates[Math.floor(Math.random() * activeGates.length)];
        const x = gate.x + (Math.random() - 0.5) * gate.width;
        const y = gate.y;

        const body = Matter.Bodies.circle(x, y, info.radius, {
          restitution: entry.type === 'bouncy' ? 1.5 : 0.5,
          friction: 0.05,
          density: entry.type === 'heavy' ? 0.03 : 0.01,
          label: 'enemy'
        });
        Matter.Composite.add(this.world, body);
        this.enemies.push({
          type: entry.type,
          body,
          hp: info.hp + this.wave * 5,
          maxHp: info.hp + this.wave * 5,
          damage: info.damage,
          ability: info.ability,
          shieldActive: entry.type === 'shielded',
          fireTrailTimer: 0,
        });
        entry.spawned = true;
        this._spawnIndex++;
      }

      // ==================== BUCLE PRINCIPAL ====================
      _loop(timestamp) {
        const dt = Math.min(100, timestamp - this.lastTime) / 1000;
        this.lastTime = timestamp;

        if (!this.gameOver) {
          Matter.Engine.update(this.engine, dt * 1000);

          if (this.waveActive && !this.waveComplete) {
            this._spawnTimer += dt;
            if (this._spawnTimer >= this._spawnInterval && this._spawnIndex < this.waveEnemyList.length) {
              this._spawnEnemy();
              this._spawnTimer = 0;
            }
            this._updateEnemies(dt);
            this._updateTurrets(dt);
            this._updateZones(dt);
            this._checkWaveComplete();
          }

          this._updateDrops(dt);
        }

        this._render();
        requestAnimationFrame((t) => this._loop(t));
      }

      _updateEnemies(dt) {
        for (let i = this.enemies.length-1; i >= 0; i--) {
          const enemy = this.enemies[i];
          const body = enemy.body;

          // Rastro de fuego
          if (enemy.ability === 'rastro_fuego') {
            enemy.fireTrailTimer += dt;
            if (enemy.fireTrailTimer > 0.3) {
              enemy.fireTrailTimer = 0;
              this.zones.push({ x:body.position.x, y:body.position.y, type:'fire', timer:2.0, radius:18 });
            }
          }

          // Comprobar si llegó al suelo (núcleo)
          if (body.position.y > this.height - 30) {
            this.coreHP -= enemy.damage - this.permanentUpgrades.coreArmor;
            this._removeEnemy(i);
            if (this.coreHP <= 0) {
              this.coreHP = 0;
              this._gameOver();
            }
            continue;
          }

          // Comprobar zonas
          for (const zone of this.zones) {
            if (dist(body.position.x, body.position.y, zone.x, zone.y) < zone.radius + 10) {
              if (zone.type === 'fire') enemy.hp -= 5 * dt;
              if (zone.type === 'ice') {
                Matter.Body.setVelocity(body, {
                  x: body.velocity.x * 0.5,
                  y: body.velocity.y * 0.5
                });
              }
            }
          }
        }
      }

      _updateTurrets(dt) {
        for (const def of this.defenses) {
          if (def.type !== 'turret') continue;
          def.fireTimer += dt;
          if (def.fireTimer < def.fireInterval) continue;

          // Buscar enemigo más cercano
          let target = null, minDist = 200;
          for (const enemy of this.enemies) {
            const d = dist(def.body.position.x, def.body.position.y, enemy.body.position.x, enemy.body.position.y);
            if (d < minDist) { minDist = d; target = enemy; }
          }

          if (target) {
            def.fireTimer = 0;
            target.hp -= def.damage;
            // Efecto visual: línea de disparo
            this._addShotEffect(def.body.position, target.body.position);
            if (target.hp <= 0) {
              this._onEnemyKilled(target, this.enemies.indexOf(target));
            }
          }
        }
      }

      _updateZones(dt) {
        for (let i = this.zones.length-1; i >= 0; i--) {
          this.zones[i].timer -= dt;
          if (this.zones[i].timer <= 0) this.zones.splice(i, 1);
        }
      }

      _updateDrops(dt) {
        for (const drop of this.drops) {
          drop.timer -= dt;
          if (drop.collected) continue;
        }
        this.drops = this.drops.filter(d => d.timer > 0 || !d.collected);
      }

      // ==================== COLISIONES ====================
      _onCollision(event) {
        event.pairs.forEach(pair => {
          const { bodyA, bodyB } = pair;
          const enemyBody = [bodyA, bodyB].find(b => b.label === 'enemy');
          const defenseBody = [bodyA, bodyB].find(b => ['bumper','wall','hole','turret'].includes(b.label));

          if (enemyBody && defenseBody) {
            const enemy = this.enemies.find(e => e.body === enemyBody);
            if (!enemy) return;

            if (defenseBody.label === 'hole') {
              // Agujero: elimina enemigo instantáneamente
              enemy.hp = 0;
              this._onEnemyKilled(enemy, this.enemies.indexOf(enemy));
            } else if (defenseBody.label === 'wall' && enemy.ability === 'rompe_muros') {
              // Pesada rompe muro
              const def = this.defenses.find(d => d.body === defenseBody);
              if (def) {
                def.hp -= 30;
                if (def.hp <= 0) {
                  const idx = this.defenses.indexOf(def);
                  if (idx !== -1) this._removeDefense(idx);
                }
              }
            }
          }

          // Enemigo toca el suelo
          if (enemyBody && bodyA.label === 'floor' || enemyBody && bodyB.label === 'floor') {
            const enemy = this.enemies.find(e => e.body === enemyBody);
            if (enemy) {
              this.coreHP -= enemy.damage - this.permanentUpgrades.coreArmor;
              this._removeEnemy(this.enemies.indexOf(enemy));
              if (this.coreHP <= 0) this._gameOver();
            }
          }
        });
      }

      // ==================== GESTIÓN DE ENEMIGOS ====================
      _onEnemyKilled(enemy, index) {
        // Drops RNG
        const dropChance = 0.5 + this.permanentUpgrades.bonusDropChance;
        if (Math.random() < dropChance) {
          const dropType = Math.random() < 0.3 ? 'module' : 'pd';
          const value = dropType === 'pd' ? Math.floor(rand(2, 8 + this.wave)) : null;
          this.drops.push({
            x: enemy.body.position.x,
            y: enemy.body.position.y,
            type: dropType,
            value,
            collected: false,
            timer: 5.0
          });
        }

        this._removeEnemy(index);
        this.waveKills++;
        this.totalKills++;
        this.destinyPoints += Math.floor(rand(1, 3));
        this._updateUI();
      }

      _removeEnemy(index) {
        if (index < 0 || index >= this.enemies.length) return;
        const enemy = this.enemies[index];
        Matter.Composite.remove(this.world, enemy.body);
        this.enemies.splice(index, 1);
      }

      _checkWaveComplete() {
        if (this._spawnIndex >= this.waveEnemyList.length && this.enemies.length === 0) {
          this.waveComplete = true;
          this.waveActive = false;
          this._showRewardScreen();
        }
      }

      // ==================== RECOMPENSAS Y PROGRESIÓN ====================
      _showRewardScreen() {
        const panel = document.getElementById('reward-panel');
        const content = document.getElementById('reward-content');

        // Recolectar drops automáticamente
        let collectedPD = 0;
        let collectedModules = 0;
        for (const drop of this.drops) {
          if (!drop.collected) {
            drop.collected = true;
            if (drop.type === 'pd') collectedPD += drop.value;
            else collectedModules++;
          }
        }
        this.drops = [];
        this.destinyPoints += collectedPD;

        const waveBonus = this.wave * 10;
        this.destinyPoints += waveBonus;

        content.innerHTML = `
          <div class="stat-row"><span>💎 PD recogidos:</span><span>+${collectedPD}</span></div>
          <div class="stat-row"><span>🧩 Módulos recogidos:</span><span>${collectedModules}</span></div>
          <div class="stat-row"><span>🌟 Bonus de oleada:</span><span>+${waveBonus} PD</span></div>
          <div class="stat-row"><span>💀 Enemigos eliminados:</span><span>${this.waveKills}/${this.waveEnemiesTotal}</span></div>
          <div class="stat-row"><span>❤️ Vida del núcleo:</span><span>${Math.max(0,this.coreHP)}/${this.maxCoreHP}</span></div>
          <div class="stat-row"><span>💰 Total PD:</span><span>${this.destinyPoints}</span></div>
        `;
        panel.style.display = 'block';
        log('🏆 Oleada completada. Revisa tus recompensas.');
      }

      nextWave() {
        document.getElementById('reward-panel').style.display = 'none';
        this.wave++;
        this.waveActive = false;
        this.waveComplete = false;
        this._generateWaveEnemyList();
        this._updateUI();
        log(`🌊 Preparando oleada ${this.wave}...`);
      }

      _openShop() {
        document.getElementById('reward-panel').style.display = 'none';
        // Tienda simple inline
        const shopHTML = `
          <h3>🏪 Tienda de Mejoras Permanentes</h3>
          <div style="font-size:13px; text-align:left;">
            <button onclick="window.__game.buyUpgrade('turretDamage')">⚔️ +Daño Torreta (10 PD)</button><br>
            <button onclick="window.__game.buyUpgrade('turretFireRate')">⏱️ +Cadencia Torreta (15 PD)</button><br>
            <button onclick="window.__game.buyUpgrade('coreArmor')">🛡️ +Armadura Núcleo (20 PD)</button><br>
            <button onclick="window.__game.buyUpgrade('extraStartingPD')">💰 +PD Iniciales (25 PD)</button><br>
            <button onclick="window.__game.buyUpgrade('bonusDropChance')">🎁 +Probabilidad Drop (15 PD)</button><br>
          </div>
          <button onclick="window.__game.closeShop()">🔙 Volver</button>
        `;
        document.getElementById('reward-content').innerHTML = shopHTML;
        document.getElementById('reward-panel').style.display = 'block';
        document.getElementById('btn-next-wave').style.display = 'none';
        document.getElementById('btn-go-shop').style.display = 'none';
      }

      closeShop() {
        document.getElementById('reward-panel').style.display = 'none';
        document.getElementById('btn-next-wave').style.display = 'inline-block';
        document.getElementById('btn-go-shop').style.display = 'inline-block';
        this._updateUI();
      }

      buyUpgrade(upgrade) {
        const costs = { turretDamage:10, turretFireRate:15, coreArmor:20, extraStartingPD:25, bonusDropChance:15 };
        if (this.destinyPoints >= costs[upgrade]) {
          this.destinyPoints -= costs[upgrade];
          this.permanentUpgrades[upgrade] = (this.permanentUpgrades[upgrade]||0) + 1;
          log(`✅ Mejora adquirida: ${upgrade}`);
          this._openShop(); // Refrescar
        } else {
          log('❌ PD insuficientes');
        }
      }

      // ==================== GAME OVER ====================
      _gameOver() {
        this.gameOver = true;
        this.waveActive = false;
        const totalPD = this.destinyPoints;
        log(`💀 GAME OVER. Oleada ${this.wave}. Total PD acumulados: ${totalPD}`);
        // Guardar PD para próxima partida (simulado con localStorage)
        const saved = JSON.parse(localStorage.getItem('pinballDefense_save') || '{}');
        saved.bankPD = (saved.bankPD || 0) + totalPD;
        localStorage.setItem('pinballDefense_save', JSON.stringify(saved));
        this._updateUI();
      }

      resetGame() {
        // Cargar PD guardados
        const saved = JSON.parse(localStorage.getItem('pinballDefense_save') || '{}');
        const bankPD = saved.bankPD || 0;

        // Limpiar mundo
        this.defenses.forEach(d => Matter.Composite.remove(this.world, d.body));
        this.enemies.forEach(e => Matter.Composite.remove(this.world, e.body));
        this.defenses = [];
        this.enemies = [];
        this.drops = [];
        this.zones = [];

        this.coreHP = this.maxCoreHP;
        this.destinyPoints = 50 + bankPD + this.permanentUpgrades.extraStartingPD * 10;
        this.wave = 1;
        this.waveActive = false;
        this.waveComplete = false;
        this.gameOver = false;
        this.totalKills = 0;
        this.waveKills = 0;
        this.selectedBuildType = null;
        document.querySelectorAll('.build-btn').forEach(b => b.classList.remove('selected'));
        document.getElementById('reward-panel').style.display = 'none';

        this._generateWaveEnemyList();
        this._updateUI();
        log('🔄 Juego reiniciado. Mejoras permanentes conservadas.');
      }

      // ==================== RENDERIZADO ====================
      _addShotEffect(from, to) {
        // Simple: guardamos para dibujar una línea esta frame
        if (!this._shotEffects) this._shotEffects = [];
        this._shotEffects.push({ from, to, timer: 0.1 });
      }

      _render() {
        const ctx = this.ctx;
        const w = this.width, h = this.height;

        // Fondo
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, w, h);

        // Cuadrícula
        ctx.strokeStyle = '#2a2a40';
        ctx.lineWidth = 1;
        for (let x = 0; x < w; x += 50) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
        for (let y = 0; y < h; y += 50) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }

        // Zona del núcleo (rojo abajo)
        ctx.fillStyle = 'rgba(255,0,0,0.3)';
        ctx.fillRect(0, h-60, w, 60);
        ctx.fillStyle = '#ff4444';
        ctx.font = '16px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('⚠️ NÚCLEO ⚠️', w/2, h-30);

        // Compuertas
        this.gates.forEach(gate => {
          if (gate.active) {
            ctx.fillStyle = '#ffd93d';
            ctx.fillRect(gate.x - gate.width/2, gate.y-10, gate.width, 20);
            ctx.strokeStyle = '#fff';
            ctx.strokeRect(gate.x - gate.width/2, gate.y-10, gate.width, 20);
          } else {
            ctx.fillStyle = '#444';
            ctx.fillRect(gate.x - gate.width/2, gate.y-10, gate.width, 20);
          }
        });

        // Defensas
        this.defenses.forEach(def => {
          const pos = def.body.position;
          if (def.type === 'bumper') {
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 18, 0, Math.PI*2);
            ctx.fillStyle = '#ffd93d';
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.fillStyle = '#000';
            ctx.font = '10px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('B', pos.x, pos.y+4);
          } else if (def.type === 'wall') {
            ctx.fillStyle = '#8b7355';
            ctx.fillRect(pos.x-10, pos.y-25, 20, 50);
            ctx.strokeStyle = '#fff';
            ctx.strokeRect(pos.x-10, pos.y-25, 20, 50);
          } else if (def.type === 'hole') {
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 22, 0, Math.PI*2);
            ctx.fillStyle = '#111';
            ctx.fill();
            ctx.strokeStyle = '#ff4444';
            ctx.lineWidth = 3;
            ctx.setLineDash([4,4]);
            ctx.stroke();
            ctx.setLineDash([]);
          } else if (def.type === 'turret') {
            ctx.fillStyle = '#4ecdc4';
            ctx.fillRect(pos.x-8, pos.y-8, 16, 16);
            ctx.strokeStyle = '#fff';
            ctx.strokeRect(pos.x-8, pos.y-8, 16, 16);
            ctx.fillStyle = '#000';
            ctx.font = '10px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('T', pos.x, pos.y+4);
          }
        });

        // Zonas elementales
        this.zones.forEach(zone => {
          ctx.beginPath();
          ctx.arc(zone.x, zone.y, zone.radius, 0, Math.PI*2);
          ctx.fillStyle = zone.type === 'fire' ? 'rgba(255,100,0,0.4)' : 'rgba(0,180,255,0.4)';
          ctx.fill();
        });

        // Drops
        this.drops.forEach(drop => {
          if (drop.collected) return;
          ctx.beginPath();
          ctx.arc(drop.x, drop.y, 8, 0, Math.PI*2);
          ctx.fillStyle = drop.type === 'pd' ? '#ffd700' : '#ff00ff';
          ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.font = '10px monospace';
          ctx.textAlign = 'center';
          ctx.fillText(drop.type === 'pd' ? 'PD' : 'M', drop.x, drop.y+4);
        });

        // Enemigos
        this.enemies.forEach(enemy => {
          const pos = enemy.body.position;
          const info = ENEMY_TYPES[enemy.type];
          ctx.beginPath();
          ctx.arc(pos.x, pos.y, info.radius, 0, Math.PI*2);
          ctx.fillStyle = info.color;
          ctx.fill();
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 2;
          ctx.stroke();

          // Barra de vida
          const hpPct = enemy.hp / enemy.maxHp;
          ctx.fillStyle = '#222';
          ctx.fillRect(pos.x-12, pos.y-info.radius-8, 24, 4);
          ctx.fillStyle = hpPct > 0.5 ? '#4ade80' : '#ef4444';
          ctx.fillRect(pos.x-12, pos.y-info.radius-8, 24*hpPct, 4);

          // Escudo
          if (enemy.shieldActive) {
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, info.radius+4, 0, Math.PI*2);
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.setLineDash([3,3]);
            ctx.stroke();
            ctx.setLineDash([]);
          }

          ctx.fillStyle = '#fff';
          ctx.font = '14px monospace';
          ctx.textAlign = 'center';
          ctx.fillText(info.icon, pos.x, pos.y+5);
        });

        // Efectos de disparo
        if (this._shotEffects) {
          this._shotEffects = this._shotEffects.filter(s => {
            ctx.beginPath();
            ctx.moveTo(s.from.x, s.from.y);
            ctx.lineTo(s.to.x, s.to.y);
            ctx.strokeStyle = 'rgba(255,255,0,0.5)';
            ctx.lineWidth = 2;
            ctx.stroke();
            s.timer -= 0.016;
            return s.timer > 0;
          });
        }

        // Mensaje de game over
        if (this.gameOver) {
          ctx.fillStyle = 'rgba(0,0,0,0.7)';
          ctx.fillRect(0, 0, w, h);
          ctx.fillStyle = '#ff4757';
          ctx.font = 'bold 48px monospace';
          ctx.textAlign = 'center';
          ctx.fillText('💀 GAME OVER', w/2, h/2);
        }

        // Texto de fase
        if (!this.waveActive && !this.gameOver) {
          ctx.fillStyle = 'rgba(255,255,255,0.8)';
          ctx.font = '18px monospace';
          ctx.textAlign = 'center';
          ctx.fillText('🛠️ Fase de construcción - Coloca defensas y pulsa Iniciar Oleada', w/2, h/2);
        }
      }
    }

    // ==================== INICIALIZACIÓN ====================
    const canvas = document.getElementById('gameCanvas');
    const game = new PinballDefenseGame(canvas);
    window.__game = game; // Exponer para los botones de la tienda
  </script>
</body>
