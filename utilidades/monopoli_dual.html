<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏛️ El Juego del Propietario v3 · Multijugador</title>
<style>
  :root {
    --bg:#0d0d18; --panel:#161628; --card:#1e1e3a; --card-dark:#14142a;
    --ink:#e8e8f0; --muted:#7a7a9a;
    --gold:#f5c842; --prosper:#4ecca3; --mono:#e94560;
    --border:#2a2a44; --radius:10px;
    --font:'Segoe UI',system-ui,sans-serif;
    --g-barrio:#8b4513; --g-comercio:#87ceeb; --g-centro:#ff69b4;
    --g-elite:#1e3a8a; --g-tren:#3a3a3a; --g-servicio:#6b7280;
    --p0:#f5c842; --p1:#e94560; --p2:#4ea5ff; --p3:#4ecca3;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:var(--font); background:var(--bg); color:var(--ink);
    min-height:100vh; padding:10px; font-size:13px;
  }

  header {
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    max-width:1500px; margin:0 auto 10px;
    padding:10px 14px; background:var(--panel);
    border-radius:var(--radius); border:1px solid var(--border);
  }
  header h1 { font-size:1rem; color:var(--gold); letter-spacing:.5px; }
  #btnNewGame {
    margin-left:auto;
    background:var(--gold); color:#000; border:none;
    padding:7px 16px; border-radius:20px; cursor:pointer;
    font-family:inherit; font-size:.82rem; font-weight:700;
  }
  #phase-indicator {
    padding:5px 14px; border-radius:20px; font-size:.78rem; font-weight:700;
    background:var(--card); color:var(--muted); border:1px solid var(--border);
  }
  #phase-indicator.active { color:var(--gold); border-color:var(--gold); }

  main {
    display:grid; grid-template-columns:230px 1fr 340px;
    gap:10px; max-width:1500px; margin:0 auto;
  }
  @media (max-width:1100px) { main { grid-template-columns:1fr; } }

  .panel {
    background:var(--panel); border:1px solid var(--border);
    border-radius:var(--radius); padding:10px;
    display:flex; flex-direction:column; gap:6px;
  }
  .panel h3 {
    font-size:.68rem; color:var(--muted); text-transform:uppercase;
    letter-spacing:.08em; padding-bottom:4px;
    border-bottom:1px solid var(--border);
  }
  .stat-row {
    display:flex; justify-content:space-between; padding:2px 0;
    font-size:.82rem;
  }
  .stat-row .val { font-weight:600; font-variant-numeric:tabular-nums; }
  .stat-row .val.gold { color:var(--gold); }
  .stat-row .val.prosper { color:var(--prosper); }

  /* Player cards */
  .player-card {
    background:var(--card); border:2px solid var(--border);
    border-radius:8px; padding:6px 8px; margin-bottom:5px;
    display:flex; gap:8px; align-items:center;
    transition:all .2s;
  }
  .player-card.active {
    border-color:var(--gold); background:rgba(245,200,66,.1);
    box-shadow:0 0 12px rgba(245,200,66,.25);
  }
  .player-card.bankrupt { opacity:.35; }
  .player-badge {
    width:26px; height:26px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:12px; flex-shrink:0;
    border:1px solid #000;
  }
  .player-badge.p0 { background:var(--p0); color:#000; }
  .player-badge.p1 { background:var(--p1); color:#fff; }
  .player-badge.p2 { background:var(--p2); color:#fff; }
  .player-badge.p3 { background:var(--p3); color:#000; }
  .player-info { flex:1; min-width:0; }
  .player-name {
    font-size:.78rem; font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    display:flex; gap:4px; align-items:center;
  }
  .player-ai-tag { font-size:.55rem; color:var(--muted); }
  .player-stats {
    font-size:.68rem; color:var(--muted); display:flex; gap:6px;
    margin-top:1px;
  }
  .player-stats strong { color:var(--ink); font-weight:600; }

  /* Board */
  #board {
    display:grid; grid-template-columns:repeat(6, 1fr);
    grid-template-rows:repeat(6, 1fr);
    aspect-ratio:1; gap:3px;
    background:#08080f; padding:6px;
    border-radius:var(--radius); border:1px solid var(--border);
    position:relative;
  }
  .tile {
    background:var(--card); border:2px solid var(--border);
    border-radius:6px; padding:2px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center;
    justify-content:center; text-align:center;
    font-size:.58rem; line-height:1.1; overflow:hidden;
    transition:all .15s; position:relative;
  }
  .tile:hover { transform:scale(1.04); border-color:var(--gold); z-index:2; }
  .tile .icon { font-size:1rem; }
  .tile .name { font-weight:600; color:var(--ink); margin-top:1px; }
  .tile .price { font-size:.5rem; color:var(--gold); }
  .tile .owner-tag {
    font-size:.46rem; padding:1px 4px; border-radius:6px;
    background:var(--border); color:var(--muted); margin-top:1px;
  }
  .tile .houses-dots { font-size:.55rem; color:var(--prosper); letter-spacing:-1px; }
  .tile.corner { background:#12122a; }
  .tile.corner.start { border-color:var(--prosper); }
  .tile.corner.jail { border-color:var(--mono); }
  .tile.corner.free { border-color:var(--gold); }
  .tile.corner.tax { border-color:#c084fc; }
  .tile[data-group="barrio"].owned { border-color:var(--g-barrio); }
  .tile[data-group="comercio"].owned { border-color:var(--g-comercio); }
  .tile[data-group="centro"].owned { border-color:var(--g-centro); }
  .tile[data-group="elite"].owned { border-color:var(--g-elite); }
  .tile[data-group="tren"].owned { border-color:var(--g-tren); }
  .tile.group-complete { box-shadow:inset 0 0 12px rgba(245,200,66,.3); }

  .markers {
    position:absolute; bottom:1px; left:50%; transform:translateX(-50%);
    display:flex; gap:1px;
  }
  .marker-p {
    width:12px; height:12px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:7px; font-weight:800; border:1px solid #000;
  }
  .marker-p.p0 { background:var(--p0); color:#000; }
  .marker-p.p1 { background:var(--p1); color:#fff; }
  .marker-p.p2 { background:var(--p2); color:#fff; }
  .marker-p.p3 { background:var(--p3); color:#000; }

  #board-center {
    grid-row:2 / 6; grid-column:2 / 6;
    background:linear-gradient(135deg, #0f0f22, #08080f);
    border-radius:var(--radius); border:1px solid var(--border);
    display:flex; flex-direction:column; align-items:center;
    justify-content:center; padding:14px; gap:6px;
  }
  #board-center .title {
    font-size:.9rem; color:var(--gold); font-weight:700;
    letter-spacing:.5px; text-align:center;
  }
  #board-center .subtitle { font-size:.7rem; color:var(--muted); text-align:center; }
  #dice-display {
    font-size:2.2rem; margin:4px 0; color:var(--ink); min-height:44px;
    font-variant-numeric:tabular-nums; letter-spacing:2px;
    transition:all .2s;
  }
  #dice-display.rolling {
    animation:shake .3s infinite; color:var(--gold);
  }
  @keyframes shake {
    0%,100%{transform:rotate(-4deg) scale(1)}
    50%{transform:rotate(4deg) scale(1.05)}
  }
  #turn-indicator {
    font-size:.75rem; color:var(--ink); padding:4px 12px;
    background:var(--card); border-radius:10px; text-align:center;
    max-width:220px; line-height:1.35;
  }

  /* Portfolio */
  #portfolio-panel {
    overflow-y:auto; max-height:calc(100vh - 340px);
    min-height:100px;
  }
  .group-progress {
    display:grid; grid-template-columns:repeat(2, 1fr); gap:3px;
    font-size:.68rem; margin-bottom:6px;
  }
  .gp-item {
    display:flex; justify-content:space-between; padding:2px 6px;
    border-radius:6px; background:var(--card-dark);
    border-left:3px solid var(--muted);
  }
  .gp-item.complete { background:rgba(78,204,163,.15); }
  .gp-item[data-group="barrio"] { border-left-color:var(--g-barrio); }
  .gp-item[data-group="comercio"] { border-left-color:var(--g-comercio); }
  .gp-item[data-group="centro"] { border-left-color:var(--g-centro); }
  .gp-item[data-group="elite"] { border-left-color:var(--g-elite); }
  .gp-item[data-group="tren"] { border-left-color:var(--g-tren); }
  .gp-item .gp-name { color:var(--muted); }
  .gp-item .gp-count { font-weight:700; color:var(--ink); }

  .pcard {
    background:var(--card); border-radius:6px; margin-bottom:6px;
    overflow:hidden; border:1px solid var(--border);
  }
  .pcard-header {
    padding:2px 8px; font-size:.58rem; font-weight:800;
    text-transform:uppercase; letter-spacing:.1em;
    color:#fff; background:var(--muted);
  }
  .pcard[data-group="barrio"] .pcard-header { background:var(--g-barrio); }
  .pcard[data-group="comercio"] .pcard-header { background:var(--g-comercio); color:#0a1a2a; }
  .pcard[data-group="centro"] .pcard-header { background:var(--g-centro); color:#1a0a14; }
  .pcard[data-group="elite"] .pcard-header { background:var(--g-elite); }
  .pcard[data-group="tren"] .pcard-header { background:var(--g-tren); }
  .pcard[data-group="servicio"] .pcard-header { background:var(--g-servicio); }

  .pcard-body { padding:5px 8px; display:flex; gap:8px; align-items:center; }
  .pcard-info { flex:1; min-width:0; }
  .pcard-name {
    font-size:.76rem; font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .pcard-stats {
    display:flex; gap:8px; font-size:.63rem; color:var(--muted); margin-top:1px;
  }
  .pcard-stats strong { color:var(--ink); }
  .pcard-houses {
    font-size:.82rem; color:var(--prosper); letter-spacing:-1px;
    min-width:30px; text-align:center;
  }
  .pcard-houses.empty { color:#333; }
  .pcard-build {
    background:var(--gold); color:#000; border:none;
    padding:4px 8px; border-radius:6px; font-family:inherit;
    font-size:.62rem; font-weight:700; cursor:pointer; white-space:nowrap;
  }
  .pcard-build:hover:not(:disabled) { background:#ffd966; }
  .pcard-build:disabled { opacity:.3; cursor:not-allowed; }
  .empty-portfolio {
    color:var(--muted); font-size:.72rem; font-style:italic;
    text-align:center; padding:14px 0;
  }

  /* Log & actions */
  #log {
    background:#08080f; border-radius:6px;
    height:180px; overflow-y:auto; padding:6px;
    font-size:.7rem; line-height:1.42; font-family:ui-monospace,monospace;
  }
  #log .entry { padding:2px 0; border-bottom:1px solid #12121f; }
  #log .entry:last-child { border-bottom:none; }
  #log .entry.turn { color:var(--gold); font-weight:700; margin-top:4px; }
  #log .entry.roll { color:#8bc3ff; }
  #log .entry.mono { color:#ff8899; }
  #log .entry.prosper { color:#7ee8c8; }
  #log .entry.good { color:var(--prosper); }
  #log .entry.bad { color:var(--mono); }
  #log .entry.system { color:var(--muted); font-style:italic; }
  #log .entry.ai { color:#c084fc; }

  #actions { display:flex; flex-direction:column; gap:5px; margin-top:6px; }
  #actions button {
    background:var(--card); color:var(--ink); border:1px solid var(--border);
    padding:10px 14px; border-radius:8px; cursor:pointer; font-family:inherit;
    font-size:.85rem; font-weight:600; text-align:left; transition:all .15s;
  }
  #actions button:hover:not(:disabled) { border-color:var(--gold); transform:translateX(2px); }
  #actions button:disabled { opacity:.4; cursor:not-allowed; }
  #actions button.primary { background:var(--gold); color:#000; border-color:var(--gold); }
  #actions button.primary:hover { background:#ffd966; }
  #actions button.success { background:var(--prosper); color:#0a1a15; border-color:var(--prosper); }
  #actions button.danger { background:var(--mono); color:#fff; border-color:var(--mono); }
  #actions .waiting {
    padding:10px 14px; color:var(--muted); font-size:.8rem;
    font-style:italic; text-align:center;
  }

  /* Modals */
  .modal-overlay {
    position:fixed; inset:0; background:rgba(0,0,0,.85);
    display:none; align-items:center; justify-content:center;
    z-index:100; padding:20px;
  }
  .modal-overlay.active { display:flex; }
  .modal-card {
    background:var(--panel); border:1px solid var(--border);
    border-radius:var(--radius); padding:22px; max-width:520px;
    width:100%; box-shadow:0 10px 40px rgba(0,0,0,.6);
  }
  .modal-card h2 { color:var(--gold); margin-bottom:12px; font-size:1.1rem; }
  .modal-card p { color:var(--ink); line-height:1.55; margin-bottom:10px;
                  white-space:pre-line; font-size:.88rem; }
  .modal-card .setup-label {
    color:var(--muted); font-size:.78rem; text-transform:uppercase;
    letter-spacing:.05em; margin:12px 0 6px;
  }
  .modal-card .setup-buttons {
    display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px;
  }
  .modal-card .setup-buttons button {
    background:var(--card); color:var(--ink);
    border:2px solid var(--border); padding:8px 16px;
    border-radius:8px; cursor:pointer; font-family:inherit;
    font-size:.85rem; transition:all .15s;
  }
  .modal-card .setup-buttons button.selected {
    border-color:var(--gold); background:rgba(245,200,66,.15);
    color:var(--gold); font-weight:700;
  }
  .modal-card .setup-buttons button:hover:not(.selected) { border-color:var(--muted); }
  #setup-start {
    width:100%; padding:12px; background:var(--gold); color:#000;
    border:none; border-radius:8px; font-family:inherit;
    font-weight:700; font-size:.95rem; cursor:pointer; margin-top:12px;
  }
  #setup-start:hover { background:#ffd966; }

  #testpanel {
    position:fixed; bottom:0; left:0; right:0; max-height:50vh;
    overflow-y:auto; background:rgba(0,0,0,.95); color:#7ee8c8;
    font-size:11px; font-family:monospace; padding:10px; z-index:200;
    display:none;
  }
  #testpanel.open { display:block; }
  #testpanel .fail { color:#ff5566; }
  #testpanel .pass { color:#7ee8c8; }
</style>
</head>
<body>

<header>
  <h1>🏛️ El Juego del Propietario · v3</h1>
  <span id="phase-indicator">—</span>
  <button id="btnNewGame">⚙️ Nueva partida</button>
</header>

<main>
  <aside>
    <div class="panel">
      <h3>Jugadores</h3>
      <div id="players-list"></div>
    </div>
    <div class="panel" style="margin-top:10px;">
      <h3>Estado</h3>
      <div class="stat-row"><span>🏦 Fondo común</span><span class="val prosper" id="ui-fund">—</span></div>
      <div class="stat-row"><span>📈 Turno</span><span class="val" id="ui-turn">0 / 0</span></div>
      <div class="stat-row"><span>🎯 Objetivo</span><span class="val prosper" id="ui-target">—</span></div>
    </div>
  </aside>

  <section>
    <div id="board"></div>
  </section>

  <aside>
    <div class="panel">
      <h3>Portfolio · <span id="portfolio-owner">—</span></h3>
      <div class="group-progress" id="group-progress"></div>
      <div id="portfolio-panel"></div>
    </div>
    <div class="panel" style="margin-top:10px;">
      <h3>Diario</h3>
      <div id="log"></div>
      <div id="actions"></div>
    </div>
  </aside>
</main>

<!-- Modal de configuración -->
<div class="modal-overlay" id="setup-modal">
  <div class="modal-card">
    <h2>⚙️ Configurar partida</h2>
    <div class="setup-label">Modo de juego</div>
    <div class="setup-buttons" id="setup-mode">
      <button data-mode="monopolio" class="selected">🎩 Monopolio</button>
      <button data-mode="prosperidad">🌱 Prosperidad</button>
    </div>
    <div class="setup-label">Jugadores humanos (el resto son IA · total 4)</div>
    <div class="setup-buttons" id="setup-humans">
      <button data-n="1" class="selected">1</button>
      <button data-n="2">2</button>
      <button data-n="3">3</button>
      <button data-n="4">4</button>
    </div>
    <button id="setup-start">▶ Empezar partida</button>
  </div>
</div>

<!-- Modal de fin de partida -->
<div class="modal-overlay" id="game-over-modal">
  <div class="modal-card">
    <h2 id="modal-title">—</h2>
    <p id="modal-body">—</p>
    <button id="modal-close">Entendido</button>
  </div>
</div>

<div id="testpanel"></div>

<script>
'use strict';

/* ==================================================================
   1. DOMINIO · Constantes
   ================================================================== */

const MODE = Object.freeze({ MONOPOLIO:'monopolio', PROSPERIDAD:'prosperidad' });
const TILE_TYPE = Object.freeze({
  PROPERTY:'property', RAILROAD:'railroad', UTILITY:'utility',
  CHANCE:'chance', COMMUNITY:'community',
  CORNER_START:'start', CORNER_JAIL:'jail', CORNER_FREE:'free', TAX:'tax',
});

const GROUPS = Object.freeze({
  barrio:   { name:'Barrio',   size:2, properties:['barrio1','barrio2'] },
  comercio: { name:'Comercio', size:3, properties:['comercio1','comercio2','comercio3'] },
  centro:   { name:'Centro',   size:2, properties:['centro1','centro2'] },
  elite:    { name:'Élite',    size:2, properties:['elite1','elite2'] },
  tren:     { name:'Tren',     size:2, properties:['rail_n','rail_s'] },
});

const BALANCE = Object.freeze({
  startingMoney:15,
  rounds:10,           // rondas (cada ronda = todos juegan una vez)
  goBonus:2,
  jailFine:2,
  taxAmount:5,
  maxHouses:3,
  groupBonusMult:1.5,
  houseBonusMult:0.25,
  houseCostRatio:0.34,
  prosperityOwnerShare:0.4,
  prosperityFundPerHouse:1,
});

const TILE_CATALOG = Object.freeze([
  { id:'start', name:'SALIDA', type:TILE_TYPE.CORNER_START, icon:'🏁' },
  { id:'barrio1',   name:'Calle del Barrio', type:TILE_TYPE.PROPERTY, group:'barrio',   icon:'🏘️', price:6,  rent:2 },
  { id:'barrio2',   name:'Calle del Pan',    type:TILE_TYPE.PROPERTY, group:'barrio',   icon:'🍞', price:6,  rent:2 },
  { id:'chance1',   name:'Suerte',           type:TILE_TYPE.CHANCE,   icon:'🎲' },
  { id:'rail_n',    name:'Estación Norte',   type:TILE_TYPE.RAILROAD, group:'tren',     icon:'🚂', price:10, rent:3 },
  { id:'jail', name:'CÁRCEL', type:TILE_TYPE.CORNER_JAIL, icon:'🔒' },
  { id:'comercio1',  name:'Calle del Trueque',    type:TILE_TYPE.PROPERTY, group:'comercio', icon:'🛒', price:10, rent:3 },
  { id:'community1', name:'Caja de Comunidad',    type:TILE_TYPE.COMMUNITY, icon:'📦' },
  { id:'comercio2',  name:'Calle de los Oficios', type:TILE_TYPE.PROPERTY, group:'comercio', icon:'🔨', price:12, rent:4 },
  { id:'comercio3',  name:'Avenida del Mercado',  type:TILE_TYPE.PROPERTY, group:'comercio', icon:'🏪', price:12, rent:4 },
  { id:'free', name:'Plaza de la Abundancia', type:TILE_TYPE.CORNER_FREE, icon:'⛲' },
  { id:'centro1',  name:'Avenida Central',     type:TILE_TYPE.PROPERTY, group:'centro', icon:'🌳', price:14, rent:5 },
  { id:'utility1', name:'Compañía de Agua',    type:TILE_TYPE.UTILITY,  group:'servicio', icon:'💧', price:12, rent:4 },
  { id:'chance2',  name:'Suerte',              type:TILE_TYPE.CHANCE,   icon:'🎲' },
  { id:'centro2',  name:'Calle de la Riqueza', type:TILE_TYPE.PROPERTY, group:'centro', icon:'💰', price:16, rent:5 },
  { id:'tax', name:'Impuesto', type:TILE_TYPE.TAX, icon:'🧾' },
  { id:'rail_s',     name:'Estación Sur',            type:TILE_TYPE.RAILROAD, group:'tren', icon:'🚂', price:10, rent:3 },
  { id:'community2', name:'Caja de Comunidad',       type:TILE_TYPE.COMMUNITY, icon:'📦' },
  { id:'elite1',     name:'Avenida de la Bolsa',     type:TILE_TYPE.PROPERTY, group:'elite', icon:'📈', price:20, rent:7 },
  { id:'elite2',     name:'Finca de Lord Blueblood', type:TILE_TYPE.PROPERTY, group:'elite', icon:'🏰', price:26, rent:9 },
]);

const TILE_POSITIONS = [
  [1,1],[1,2],[1,3],[1,4],[1,5],[1,6],
  [2,6],[3,6],[4,6],[5,6],[6,6],
  [6,5],[6,4],[6,3],[6,2],[6,1],
  [5,1],[4,1],[3,1],[2,1],
];

const CHANCE_CARDS = Object.freeze([
  { text:'Un inversor te da 3.',            effect:{ money:3 } },
  { text:'Multa: -2.',                      effect:{ money:-2 } },
  { text:'Donas 4 al fondo común.',         effect:{ money:-4, fund:4 } },
  { text:'Ganas un premio: 5 al fondo.',    effect:{ fund:5 } },
  { text:'Volver a SALIDA.',                effect:{ move:0 } },
]);

const COMMUNITY_CARDS = Object.freeze([
  { text:'Campaña vecinal: 2 al fondo.',    effect:{ fund:2 } },
  { text:'Donación anónima: +2.',           effect:{ money:2 } },
  { text:'Cooperativa: todos +1.',          effect:{ allBonus:1 } },
  { text:'Gastos médicos: -3.',             effect:{ money:-3 } },
]);


/* ==================================================================
   2. DOMINIO · Player + GameSession
   ================================================================== */

class Player {
  constructor(name, isAI, index) {
    this.name = name;
    this.isAI = isAI;
    this.index = index;
    this.money = BALANCE.startingMoney;
    this.position = 0;
    this.properties = [];
    this.isBankrupt = false;
  }
}

class GameSession {
  constructor(mode, numHumans) {
    this.mode = mode;
    this.numHumans = numHumans;
    this.players = [];

    const humanNames = ['Tú', 'Jugador 2', 'Jugador 3', 'Jugador 4'];
    const aiNames = ['Lord Vetinari', 'El Bibliotecario', 'La Muerte'];
    const totalPlayers = 4;
    const numAI = totalPlayers - numHumans;

    for (let i = 0; i < numHumans; i++) {
      this.players.push(new Player(humanNames[i] || `Jugador ${i+1}`, false, i));
    }
    for (let i = 0; i < numAI; i++) {
      this.players.push(new Player(aiNames[i] || `IA ${i+1}`, true, numHumans + i));
    }

    this.activePlayerIndex = 0;
    this.hasRolled = false;
    this.pendingChoice = null;
    this.turnCounter = 0;
    this.maxTurns = BALANCE.rounds * this.players.length;
    this.isGameOver = false;
    this.isVictory = false;
    this.reason = '';

    this.commonFund = 0;
    this.startingWealth = BALANCE.startingMoney;
    this.poorestStarting = BALANCE.startingMoney;

    this.tiles = [];
  }

  get activePlayer() { return this.players[this.activePlayerIndex]; }
  get currentTile() { return this.tiles[this.activePlayer.position]; }

  wealthOf(p) {
    if (!p) return 0;
    const propValue = (p.properties || []).reduce((sum, id) => {
      const tile = this.tiles.find(t => t.id === id);
      if (!tile) return sum;
      return sum + (tile.price || 0) + ((tile.houses || 0) * houseCost(tile));
    }, 0);
    return p.money + propValue;
  }

  poorestWealth() {
    const alive = this.players.filter(p => !p.isBankrupt);
    if (alive.length === 0) return 0;
    return Math.min(...alive.map(p => this.wealthOf(p)));
  }

  totalHouses() {
    return this.tiles.reduce((sum, t) => sum + (t.houses || 0), 0);
  }
}


/* ==================================================================
   3. DOMINIO · Helpers puros
   ================================================================== */

function houseCost(tile) {
  return Math.max(1, Math.floor((tile.price || 0) * BALANCE.houseCostRatio));
}

function isGroupComplete(session, ownerName, groupId) {
  const g = GROUPS[groupId];
  if (!g) return false;
  return g.properties.every(pid => {
    const tile = session.tiles.find(t => t.id === pid);
    return tile && tile.owner === ownerName;
  });
}

function calculateRent(session, tile) {
  if (!tile.owner || tile.rent === undefined) return 0;
  let rent = tile.rent;
  if (tile.group && GROUPS[tile.group] && isGroupComplete(session, tile.owner, tile.group)) {
    rent *= BALANCE.groupBonusMult;
  }
  if (tile.houses && tile.houses > 0) {
    rent *= (1 + tile.houses * BALANCE.houseBonusMult);
  }
  return Math.floor(rent);
}

function canBuildHouse(session, playerName, tile) {
  if (!tile || tile.owner !== playerName) return { ok:false, reason:'no es tuya' };
  if (tile.type !== TILE_TYPE.PROPERTY) return { ok:false, reason:'no edificable' };
  if (!tile.group || !GROUPS[tile.group]) return { ok:false, reason:'sin grupo' };
  if (!isGroupComplete(session, playerName, tile.group)) return { ok:false, reason:'grupo incompleto' };
  if ((tile.houses || 0) >= BALANCE.maxHouses) return { ok:false, reason:'máximo' };
  const cost = houseCost(tile);
  const player = session.players.find(p => p.name === playerName);
  if (!player || player.money < cost) return { ok:false, reason:'sin dinero', cost };
  return { ok:true, cost };
}

function findPlayerRef(session, name) {
  return session.players.find(p => p.name === name) || null;
}


/* ==================================================================
   4. DOMINIO · Reglas por modo (Strategy)
   ================================================================== */

class BaseRules {
  onBuy() { throw new Error('abstract'); }
  onRent() { throw new Error('abstract'); }
  onPassGo() { throw new Error('abstract'); }
  checkVictory() { throw new Error('abstract'); }
  housesToFundPerTurn() { return 0; }
}

class MonopolioRules extends BaseRules {
  onBuy(session, buyerName, tile) {
    const buyer = findPlayerRef(session, buyerName);
    if (buyer) buyer.money -= tile.price;
    return { paid:tile.price };
  }

  onRent(session, payerName, ownerName, tile) {
    const payer = findPlayerRef(session, payerName);
    const owner = findPlayerRef(session, ownerName);
    if (!payer) return { paid:0 };

    const rent = calculateRent(session, tile);
    if (payer.money < rent) {
      const paid = payer.money;
      payer.money = 0;
      if (owner) owner.money += paid;
      return { paid, rent, bankrupt:true };
    }
    payer.money -= rent;
    if (owner) owner.money += rent;
    return { paid:rent, rent, bankrupt:false };
  }

  onPassGo(session, playerName) {
    const p = findPlayerRef(session, playerName);
    if (p) p.money += BALANCE.goBonus;
  }

  checkVictory(session) {
    const alive = session.players.filter(p => !p.isBankrupt);

    if (alive.length === 0) {
      return { over:true, victory:false, reason:'Todos han quebrado.' };
    }
    if (alive.length === 1) {
      return { over:true, victory:true,
               reason:`¡${alive[0].name} es el único que no ha quebrado! Victoria monopolista.` };
    }
    if (session.turnCounter >= session.maxTurns) {
      const richest = alive.reduce((best, p) =>
        session.wealthOf(p) > session.wealthOf(best) ? p : best
      );
      return { over:true, victory:true,
               reason:`Fin del juego. ${richest.name} gana con ${session.wealthOf(richest)} de riqueza.` };
    }
    return { over:false, victory:false, reason:'' };
  }
}

class ProsperidadRules extends BaseRules {
  onBuy(session, buyerName, tile) {
    const buyer = findPlayerRef(session, buyerName);
    if (buyer) buyer.money -= tile.price;

    const toFund = Math.floor(tile.price / 2);
    const dividend = Math.floor(tile.price / 4);
    session.commonFund += toFund;

    for (const p of session.players) {
      if (p.name === buyerName || p.isBankrupt) continue;
      p.money += dividend;
    }
    return { paid:tile.price, fund:toFund, dividend };
  }

  onRent(session, payerName, ownerName, tile) {
    const payer = findPlayerRef(session, payerName);
    const owner = findPlayerRef(session, ownerName);
    if (!payer) return { paid:0 };

    const rent = calculateRent(session, tile);
    const toOwner = Math.floor(rent * BALANCE.prosperityOwnerShare);
    const toFund = rent - toOwner;

    if (payer.money < rent) {
      const paid = payer.money;
      payer.money = 0;
      const partialOwner = Math.floor(paid * BALANCE.prosperityOwnerShare);
      const partialFund = paid - partialOwner;
      if (owner) owner.money += partialOwner;
      session.commonFund += partialFund;
      return { paid, rent, toOwner:partialOwner, toFund:partialFund, welfare:true };
    }

    payer.money -= rent;
    if (owner) owner.money += toOwner;
    session.commonFund += toFund;
    return { paid:rent, rent, toOwner, toFund, welfare:false };
  }

  onPassGo(session, playerName) {
    const small = Math.floor(BALANCE.goBonus / 2);
    for (const p of session.players) {
      if (p.isBankrupt) continue;
      p.money += (p.name === playerName ? BALANCE.goBonus : small);
    }
  }

  housesToFundPerTurn(session) {
    return session.totalHouses() * BALANCE.prosperityFundPerHouse;
  }

  checkVictory(session) {
    const poorest = session.poorestWealth();
    const target = 2 * session.poorestStarting;

    if (poorest >= target) {
      return { over:true, victory:true,
               reason:`¡Prosperidad común! El más pobre (${poorest}) ha doblado su riqueza inicial (${session.poorestStarting}). Todos ganan.` };
    }
    if (session.turnCounter >= session.maxTurns) {
      return { over:true, victory:false,
               reason:`Fin. El más pobre tiene ${poorest} (necesitaba ${target}). No hubo prosperidad.` };
    }
    return { over:false, victory:false, reason:'' };
  }
}


/* ==================================================================
   5. APLICACIÓN · EventBus
   ================================================================== */

class EventBus {
  constructor() { this._listeners = new Map(); }
  on(ev, cb) {
    if (!this._listeners.has(ev)) this._listeners.set(ev, new Set());
    this._listeners.get(ev).add(cb);
    return () => this._listeners.get(ev)?.delete(cb);
  }
  emit(ev, payload) {
    const set = this._listeners.get(ev);
    if (set) [...set].forEach(cb => {
      try { cb(payload); } catch (e) { console.error('[bus]', ev, e); }
    });
  }
}

class UINotifier extends EventBus {}


/* ==================================================================
   6. APLICACIÓN · GameEngine
   ------------------------------------------------------------------
   FLUJO DE TURNO (auto-roll al inicio):
   
     _startTurn()  → log turno, espera 300ms
       _rollDice() → tirada + animación
         _onTileLanded() → resuelve casilla
           _finishTurn():
             · IA  → _aiDecide() + 600ms → _endTurn()
             · Hum → emite ENABLE_END_TURN (muestra botón)
   
     Usuario humano pulsa "Terminar turno":
       _onEndTurn() → aporta casas al fondo
         _advanceTurn() → siguiente jugador vivo
           _startTurn() → bucle
   
   Los turnos de IA se encadenan con setTimeout y un _gameId
   para abortar si se empieza partida nueva a mitad.
   ================================================================== */

class GameEngine {
  constructor({ random, notifier }) {
    this.random = random;
    this.notifier = notifier;
    this.bus = new EventBus();
    this.session = null;
    this.rules = null;
    this._gameId = 0;
    this._timers = [];
    this._registerHandlers();
  }

  _registerHandlers() {
    this.bus.on('START_TURN',   () => this._onStartTurn());
    this.bus.on('ROLL_DICE',    () => this._onRollDice());
    this.bus.on('TILE_LANDED',  (e) => this._onTileLanded(e));
    this.bus.on('OPTION_CHOSEN',(e) => this._onOptionChosen(e));
    this.bus.on('BUILD_HOUSE',  (e) => this._onBuildHouse(e));
    this.bus.on('END_TURN',     () => this._onEndTurn());
  }

  _schedule(fn, ms) {
    const id = this._gameId;
    const t = setTimeout(() => {
      if (this._gameId === id) fn();
    }, ms);
    this._timers.push(t);
    return t;
  }

  _clearTimers() {
    this._timers.forEach(t => clearTimeout(t));
    this._timers = [];
  }

  /* --- API pública --- */

  startNewGame(mode, numHumans) {
    this._clearTimers();
    this._gameId++;

    this.session = new GameSession(mode, numHumans);
    this.rules = mode === MODE.PROSPERIDAD ? new ProsperidadRules() : new MonopolioRules();
    this.session.tiles = TILE_CATALOG.map(t => ({ ...t, owner:null, houses:0 }));
    this.session.turnCounter = 0;

    this.notifier.emit('GAME_STARTED', { session:this.session, mode });
    this._syncUI();
    this._log(`Partida ${mode.toUpperCase()} · ${numHumans} humano(s) + ${4-numHumans} IA`, 'system');
    this._log(`Empieza ${this.session.players[0].name}.`, 'system');

    // Arranca el primer turno tras un pequeño delay
    this._schedule(() => this.bus.emit('START_TURN', {}), 300);
  }

  endTurn() {
    if (!this.session || this.session.isGameOver) return;
    if (this.session.activePlayer.isAI) return;
    this.bus.emit('END_TURN', {});
  }

  buildHouse(tileId) {
    if (!this.session || this.session.isGameOver) return;
    const p = this.session.activePlayer;
    if (p.isAI) return;
    this.bus.emit('BUILD_HOUSE', { tileId, playerName:p.name });
  }

  chooseOption(optionId) {
    if (!this.session || !this.session.pendingChoice) return;
    this.bus.emit('OPTION_CHOSEN', { optionId });
  }

  /* --- Handlers --- */

  _onStartTurn() {
    const s = this.session;
    if (s.isGameOver) return;
    const p = s.activePlayer;
    s.hasRolled = false;
    this._log(`── Turno ${s.turnCounter + 1}/${s.maxTurns} · ${p.name} ──`, 'turn');
    this._syncUI();
    this._schedule(() => this.bus.emit('ROLL_DICE', {}), 400);
  }

  _onRollDice() {
    const s = this.session;
    const p = s.activePlayer;
    if (s.hasRolled || p.isBankrupt || s.isGameOver) return;
    s.hasRolled = true;

    const d1 = this.random.d6();
    const d2 = this.random.d6();
    const total = d1 + d2;
    this.notifier.emit('DICE_RESULT', { dice:[d1,d2], total, playerName:p.name, playerIndex:p.index });
    this._log(`${p.name} tira ${d1}+${d2} = ${total}.`, 'roll');

    const oldPos = p.position;
    const newPos = (oldPos + total) % s.tiles.length;
    if (newPos < oldPos || newPos === 0) {
      this.rules.onPassGo(s, p.name);
      this._log(`${p.name} pasa por SALIDA.`, 'good');
    }
    p.position = newPos;
    const tile = s.tiles[newPos];
    this._syncUI();
    this._schedule(() => this.bus.emit('TILE_LANDED', { tile }), 250);
  }

  _onTileLanded({ tile }) {
    const s = this.session;
    const p = s.activePlayer;

    // Esquinas
    if (tile.type === TILE_TYPE.CORNER_START) {
      this.rules.onPassGo(s, p.name);
      return this._finishTurn();
    }
    if (tile.type === TILE_TYPE.CORNER_JAIL) {
      p.money = Math.max(0, p.money - BALANCE.jailFine);
      if (s.mode === MODE.PROSPERIDAD) s.commonFund += BALANCE.jailFine;
      this._log(`${p.name} paga multa en Cárcel.`, 'bad');
      return this._finishTurn();
    }
    if (tile.type === TILE_TYPE.CORNER_FREE) {
      this._log(`${p.name} descansa en la Plaza.`, 'system');
      return this._finishTurn();
    }
    if (tile.type === TILE_TYPE.TAX) {
      p.money = Math.max(0, p.money - BALANCE.taxAmount);
      if (s.mode === MODE.PROSPERIDAD) s.commonFund += BALANCE.taxAmount;
      this._log(`${p.name} paga impuesto.`, 'bad');
      return this._finishTurn();
    }

    // Propiedades
    const purchasable = [TILE_TYPE.PROPERTY, TILE_TYPE.RAILROAD, TILE_TYPE.UTILITY];
    if (purchasable.includes(tile.type)) {
      if (!tile.owner) {
        // IA: decide en _aiDecide
        if (p.isAI) return this._finishTurn();

        // Humano: ofrecer compra si puede
        if (p.money >= tile.price) {
          s.pendingChoice = { tileId: tile.id };
          this._syncUI();
          this.notifier.emit('CHOICE', {
            prompt: `${p.name}, ¿comprar ${tile.name} por ${tile.price}?`,
            options: [
              { id:'buy',  label:`💰 Comprar (${tile.price})`, kind:'primary' },
              { id:'skip', label:`🚶 No comprar`, kind:'normal' },
            ],
          });
          return;
        }
        this._log(`${p.name} no puede comprar.`, 'system');
        return this._finishTurn();
      }

      if (tile.owner === p.name) {
        this._log(`${p.name} está en su propiedad.`, 'system');
        return this._finishTurn();
      }

      // Pagar alquiler
      const res = this.rules.onRent(s, p.name, tile.owner, tile);
      const extra = res.welfare ? ' (paga lo que puede)' : '';
      this._log(`${p.name} paga ${res.paid} a ${tile.owner}${extra}.`,
        s.mode === MODE.PROSPERIDAD ? 'prosper' : 'mono');
      if (res.toFund) this._log(`Fondo +${res.toFund}.`, 'prosper');
      if (res.bankrupt) {
        p.isBankrupt = true;
        this._log(`¡${p.name} ha quebrado!`, 'bad');
      }
      return this._finishTurn();
    }

    // Suerte / Comunidad
    if (tile.type === TILE_TYPE.CHANCE || tile.type === TILE_TYPE.COMMUNITY) {
      const deck = tile.type === TILE_TYPE.CHANCE ? CHANCE_CARDS : COMMUNITY_CARDS;
      const card = this.random.pick(deck);
      this._log(`📜 ${card.text}`, 'system');
      const eff = card.effect;
      if (eff.money) p.money = Math.max(0, p.money + eff.money);
      if (eff.fund)  s.commonFund += eff.fund;
      if (eff.allBonus) {
        for (const pl of s.players) if (!pl.isBankrupt) pl.money += eff.allBonus;
      }
      if (eff.move !== undefined) {
        p.position = eff.move;
        this._log(`${p.name} se traslada a ${s.tiles[p.position].name}.`);
      }
      return this._finishTurn();
    }

    this._finishTurn();
  }

  _onOptionChosen({ optionId }) {
    const s = this.session;
    const p = s.activePlayer;
    const pending = s.pendingChoice;
    if (!pending) return;
    const tile = s.tiles.find(t => t.id === pending.tileId);
    s.pendingChoice = null;

    if (optionId === 'buy' && tile && p.money >= tile.price) {
      const res = this.rules.onBuy(s, p.name, tile);
      tile.owner = p.name;
      p.properties.push(tile.id);
      if (s.mode === MODE.PROSPERIDAD) {
        this._log(`${p.name} compra ${tile.name}. Fondo +${res.fund}, dividendos +${res.dividend}.`, 'prosper');
      } else {
        this._log(`${p.name} compra ${tile.name}.`, 'mono');
      }
      this._syncUI();
    } else {
      this._log(`${p.name} no compra.`, 'system');
    }
    this._finishTurn();
  }

  _onBuildHouse({ tileId, playerName }) {
    const s = this.session;
    const tile = s.tiles.find(t => t.id === tileId);
    if (!tile) return;
    const check = canBuildHouse(s, playerName, tile);
    if (!check.ok) {
      this._log(`No se puede construir: ${check.reason}.`, 'bad');
      return;
    }
    const player = findPlayerRef(s, playerName);
    player.money -= check.cost;
    tile.houses = (tile.houses || 0) + 1;
    const newRent = calculateRent(s, tile);
    this._log(`${playerName} construye en ${tile.name} (-${check.cost}). Alquiler: ${newRent}.`,
      s.mode === MODE.PROSPERIDAD ? 'prosper' : 'mono');
    this._syncUI();
  }

  _finishTurn() {
    const s = this.session;
    const p = s.activePlayer;

    // Verificar victoria
    const v = this.rules.checkVictory(s);
    if (v.over) return this._triggerGameOver(v);

    if (p.isAI) {
      this._aiDecide();
      this._syncUI();
      this._schedule(() => this.bus.emit('END_TURN', {}), 700);
    } else {
      this.notifier.emit('ENABLE_END_TURN', {});
    }
  }

  _onEndTurn() {
    const s = this.session;
    if (s.isGameOver) return;

    // Aporte de casas al fondo (prosperidad)
    const fund = this.rules.housesToFundPerTurn(s);
    if (fund > 0) {
      s.commonFund += fund;
      this._log(`Las casas aportan ${fund} al fondo común.`, 'prosper');
    }

    const v = this.rules.checkVictory(s);
    if (v.over) return this._triggerGameOver(v);

    this._advanceTurn();
  }

  _advanceTurn() {
    const s = this.session;
    const alive = s.players.filter(p => !p.isBankrupt);
    if (alive.length <= 1) return this._triggerGameOver(this.rules.checkVictory(s));

    // Buscar siguiente jugador vivo
    let idx = s.activePlayerIndex;
    let attempts = 0;
    do {
      idx = (idx + 1) % s.players.length;
      attempts++;
    } while (s.players[idx].isBankrupt && attempts < s.players.length);

    // Incrementar turnCounter al volver al primer índice
    if (idx <= s.activePlayerIndex) {
      s.turnCounter++;
    }

    s.activePlayerIndex = idx;
    this._syncUI();

    this._schedule(() => this.bus.emit('START_TURN', {}), 350);
  }

  _aiDecide() {
    const s = this.session;
    const p = s.activePlayer;
    const tile = s.tiles[p.position];

    // Comprar propiedad si puede
    const purchasable = [TILE_TYPE.PROPERTY, TILE_TYPE.RAILROAD, TILE_TYPE.UTILITY];
    if (purchasable.includes(tile.type) && !tile.owner && p.money >= tile.price) {
      let shouldBuy = true;
      if (tile.group && GROUPS[tile.group]) {
        const others = GROUPS[tile.group].properties.filter(id => id !== tile.id);
        const wouldComplete = others.every(id => {
          const t = s.tiles.find(x => x.id === id);
          return t && t.owner === p.name;
        });
        shouldBuy = wouldComplete || this.random.chance(0.65);
      }
      if (shouldBuy) {
        const res = this.rules.onBuy(s, p.name, tile);
        tile.owner = p.name;
        p.properties.push(tile.id);
        if (s.mode === MODE.PROSPERIDAD) {
          this._log(`${p.name} compra ${tile.name}. Fondo +${res.fund}.`, 'ai');
        } else {
          this._log(`${p.name} compra ${tile.name}.`, 'ai');
        }
      }
    }

    // Construir casa si tiene grupo completo
    const buildable = s.tiles.filter(t => {
      if (t.owner !== p.name) return false;
      return canBuildHouse(s, p.name, t).ok;
    });
    if (buildable.length > 0 && this.random.chance(0.55)) {
      const t = this.random.pick(buildable);
      const cost = houseCost(t);
      p.money -= cost;
      t.houses = (t.houses || 0) + 1;
      this._log(`${p.name} construye casa en ${t.name} (-${cost}).`, 'ai');
    }
  }

  _triggerGameOver(v) {
    const s = this.session;
    if (s.isGameOver) return;
    s.isGameOver = true;
    s.isVictory = v.victory;
    s.reason = v.reason;
    this._syncUI();
    this.notifier.emit('GAME_OVER', { victory:v.victory, reason:v.reason, session:s });
  }

  _syncUI() {
    this.notifier.emit('STATS_UPDATED', { session:this.session });
  }

  _log(text, cls) {
    this.notifier.emit('LOG', { text, cls });
  }
}


/* ==================================================================
   7. INFRAESTRUCTURA · Random + UIRenderer
   ================================================================== */

class RandomAdapter {
  d6() { return 1 + Math.floor(Math.random() * 6); }
  pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  chance(p) { return Math.random() < p; }
}

class UIRenderer {
  constructor(notifier, engine) {
    this.notifier = notifier;
    this.engine = engine;

    this.els = {
      board:          document.getElementById('board'),
      playersList:    document.getElementById('players-list'),
      fund:           document.getElementById('ui-fund'),
      turn:           document.getElementById('ui-turn'),
      target:         document.getElementById('ui-target'),
      portfolioOwner: document.getElementById('portfolio-owner'),
      groupProgress:  document.getElementById('group-progress'),
      portfolio:      document.getElementById('portfolio-panel'),
      log:            document.getElementById('log'),
      actions:        document.getElementById('actions'),
      phase:          document.getElementById('phase-indicator'),
      modal:          document.getElementById('game-over-modal'),
      modalTitle:     document.getElementById('modal-title'),
      modalBody:      document.getElementById('modal-body'),
      modalClose:     document.getElementById('modal-close'),
    };

    this._wireNotifier();
    document.getElementById('modal-close').addEventListener('click', () => {
      this.els.modal.classList.remove('active');
    });
  }

  _wireNotifier() {
    this.notifier.on('GAME_STARTED',  ({ session, mode }) => this._onGameStarted(session, mode));
    this.notifier.on('STATS_UPDATED', ({ session }) => this._renderAll(session));
    this.notifier.on('LOG',           ({ text, cls }) => this._appendLog(text, cls));
    this.notifier.on('DICE_RESULT',   (data) => this._renderDice(data));
    this.notifier.on('CHOICE',        ({ prompt, options }) => this._renderChoice(prompt, options));
    this.notifier.on('ENABLE_END_TURN',() => this._enableEndTurn());
    this.notifier.on('GAME_OVER',     ({ victory, reason }) => this._renderGameOver(victory, reason));
  }

  _onGameStarted(session, mode) {
    this.els.board.innerHTML = '';

    const center = document.createElement('div');
    center.id = 'board-center';
    center.innerHTML = `
      <div class="title">EL JUEGO DEL PROPIETARIO</div>
      <div class="subtitle">${mode === MODE.PROSPERIDAD ? '🌱 PROSPERIDAD' : '🎩 MONOPOLIO'}</div>
      <div id="dice-display">🎲</div>
      <div id="turn-indicator">Preparando…</div>
    `;
    this.els.board.appendChild(center);
    this.els.dice = document.getElementById('dice-display');
    this.els.turnIndicator = document.getElementById('turn-indicator');

    session.tiles.forEach((tile, i) => {
      const [r, c] = TILE_POSITIONS[i];
      const el = document.createElement('div');
      el.className = 'tile';
      el.dataset.tileId = tile.id;
      el.dataset.index = i;
      if (tile.group) el.dataset.group = tile.group;
      el.style.gridRow = r;
      el.style.gridColumn = c;
      if ([0,5,10,15].includes(i)) {
        el.classList.add('corner');
        if (tile.type === TILE_TYPE.CORNER_START) el.classList.add('start');
        if (tile.type === TILE_TYPE.CORNER_JAIL)  el.classList.add('jail');
        if (tile.type === TILE_TYPE.CORNER_FREE)  el.classList.add('free');
        if (tile.type === TILE_TYPE.TAX)          el.classList.add('tax');
      }
      this.els.board.appendChild(el);
    });

    this._renderAll(session);
  }

  _renderAll(session) {
    if (!session) return;
    const s = session;

    // Lista de jugadores
    this._renderPlayers(s);

    // Estado global
    this.els.fund.textContent = s.mode === MODE.PROSPERIDAD ? s.commonFund : '—';
    this.els.turn.textContent = `${Math.min(s.turnCounter + 1, s.maxTurns)} / ${s.maxTurns}`;

    if (s.mode === MODE.PROSPERIDAD) {
      this.els.target.textContent = `${2 * s.poorestStarting} (doblar)`;
    } else {
      const richest = Math.max(0, ...s.players.filter(p => !p.isBankrupt).map(p => s.wealthOf(p)));
      this.els.target.textContent = richest;
    }

    // Fase
    const active = s.activePlayer;
    if (s.isGameOver) {
      this.els.phase.textContent = 'Partida terminada';
      this.els.phase.classList.remove('active');
    } else if (active.isAI) {
      this.els.phase.textContent = `🤖 ${active.name} jugando…`;
      this.els.phase.classList.add('active');
    } else {
      this.els.phase.textContent = `🎮 Turno de ${active.name}`;
      this.els.phase.classList.add('active');
    }

    this._renderBoard(s);
    this._renderGroupProgress(s);
    this._renderPortfolio(s);
  }

  _renderPlayers(s) {
    const cont = this.els.playersList;
    cont.innerHTML = '';
    for (const p of s.players) {
      const isActive = p === s.activePlayer && !s.isGameOver;
      const card = document.createElement('div');
      card.className = 'player-card' + (isActive ? ' active' : '') + (p.isBankrupt ? ' bankrupt' : '');
      const wealth = s.wealthOf(p);
      const playerColorClass = 'p' + p.index;
      card.innerHTML = `
        <div class="player-badge ${playerColorClass}">${p.index + 1}</div>
        <div class="player-info">
          <div class="player-name">${p.name}${p.isAI ? '<span class="player-ai-tag">IA</span>' : ''}</div>
          <div class="player-stats">
            <span>💰<strong>${p.money}</strong></span>
            <span>🏠<strong>${p.properties.length}</strong></span>
            <span>📊<strong>${wealth}</strong></span>
          </div>
        </div>
      `;
      cont.appendChild(card);
    }
  }

  _renderBoard(s) {
    s.tiles.forEach((tile, i) => {
      const el = this.els.board.querySelector(`[data-index="${i}"]`);
      if (!el) return;

      el.classList.remove('owned', 'group-complete');
      el.innerHTML = '';

      const icon = document.createElement('div');
      icon.className = 'icon';
      icon.textContent = tile.icon || '⬜';
      el.appendChild(icon);

      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = tile.name;
      el.appendChild(name);

      if (tile.price) {
        const price = document.createElement('div');
        price.className = 'price';
        const currentRent = tile.owner ? calculateRent(s, tile) : tile.rent;
        price.textContent = `${tile.price} · ${currentRent}/t`;
        el.appendChild(price);
      }

      if (tile.owner) {
        const owner = document.createElement('div');
        owner.className = 'owner-tag';
        owner.textContent = tile.owner;
        el.appendChild(owner);
        el.classList.add('owned');
        if (tile.group && isGroupComplete(s, tile.owner, tile.group)) {
          el.classList.add('group-complete');
        }
      }

      if (tile.houses) {
        const h = document.createElement('div');
        h.className = 'houses-dots';
        h.textContent = '🏠'.repeat(tile.houses);
        el.appendChild(h);
      }

      // Marcadores de jugadores en esta casilla
      const playersHere = s.players.filter(p => !p.isBankrupt && p.position === i);
      if (playersHere.length > 0) {
        const markers = document.createElement('div');
        markers.className = 'markers';
        playersHere.forEach(p => {
          const m = document.createElement('span');
          m.className = 'marker-p p' + p.index;
          m.textContent = p.index + 1;
          markers.appendChild(m);
        });
        el.appendChild(markers);
      }

      el.onclick = () => this._inspectTile(tile);
    });
  }

  _inspectTile(tile) {
    const s = this.engine.session;
    const currentRent = tile.owner ? calculateRent(s, tile) : tile.rent;
    let body = `Tipo: ${tile.type}\n`;
    if (tile.price) body += `Precio: ${tile.price}\nAlquiler base: ${tile.rent}\n`;
    if (tile.owner) {
      body += `Propietario: ${tile.owner}\n`;
      body += `Alquiler actual: ${currentRent}\n`;
      if (tile.houses) body += `Casas: ${tile.houses}\n`;
      if (tile.group && isGroupComplete(s, tile.owner, tile.group)) {
        body += `✨ Grupo completo\n`;
      }
    } else {
      body += `Propietario: nadie\n`;
    }
    this.els.modalTitle.textContent = `${tile.icon || ''} ${tile.name}`;
    this.els.modalBody.textContent = body;
    this.els.modal.classList.add('active');
  }

  _renderGroupProgress(s) {
    const cont = this.els.groupProgress;
    cont.innerHTML = '';
    const active = s.activePlayer;
    for (const [groupId, g] of Object.entries(GROUPS)) {
      const owned = g.properties.filter(pid => {
        const t = s.tiles.find(x => x.id === pid);
        return t && t.owner === active.name;
      }).length;
      const complete = owned === g.size;
      const div = document.createElement('div');
      div.className = 'gp-item' + (complete ? ' complete' : '');
      div.dataset.group = groupId;
      div.innerHTML = `
        <span class="gp-name">${g.name}</span>
        <span class="gp-count">${owned}/${g.size}</span>
      `;
      cont.appendChild(div);
    }
  }

  _renderPortfolio(s) {
    const cont = this.els.portfolio;
    const active = s.activePlayer;
    this.els.portfolioOwner.textContent = active.name;
    cont.innerHTML = '';

    const owned = s.tiles.filter(t => t.owner === active.name);

    if (owned.length === 0) {
      cont.innerHTML = '<div class="empty-portfolio">Sin propiedades todavía.</div>';
      return;
    }

    for (const tile of owned) {
      const currentRent = calculateRent(s, tile);
      const groupComplete = tile.group && isGroupComplete(s, active.name, tile.group);
      const buildCheck = canBuildHouse(s, active.name, tile);
      const cost = houseCost(tile);
      const canBuild = buildCheck.ok && !active.isAI && !s.isGameOver;

      const card = document.createElement('div');
      card.className = 'pcard';
      card.dataset.group = tile.group || 'servicio';

      const groupLabel = tile.group && GROUPS[tile.group] ? GROUPS[tile.group].name : 'Servicio';

      card.innerHTML = `
        <div class="pcard-header">${groupLabel}${groupComplete ? ' ✨' : ''}</div>
        <div class="pcard-body">
          <div class="pcard-info">
            <div class="pcard-name">${tile.icon || ''} ${tile.name}</div>
            <div class="pcard-stats">
              <span>Alquiler <strong>${currentRent}</strong></span>
              ${groupComplete ? '<span style="color:var(--gold)">×1.5</span>' : ''}
            </div>
          </div>
          <div class="pcard-houses ${tile.houses ? '' : 'empty'}">
            ${tile.houses ? '🏠'.repeat(tile.houses) : '·····'}
          </div>
          ${tile.type === TILE_TYPE.PROPERTY ? `
            <button class="pcard-build" data-tile-id="${tile.id}" ${canBuild ? '' : 'disabled'}>
              +Casa ${cost}
            </button>
          ` : ''}
        </div>
      `;

      const btn = card.querySelector('.pcard-build');
      if (btn && canBuild) {
        btn.addEventListener('click', () => this.engine.buildHouse(tile.id));
      }

      cont.appendChild(card);
    }
  }

  _appendLog(text, cls) {
    const d = document.createElement('div');
    d.className = `entry ${cls || ''}`;
    d.textContent = text;
    this.els.log.appendChild(d);
    this.els.log.scrollTop = this.els.log.scrollHeight;
  }

  _renderDice({ dice, total, playerName }) {
    if (!this.els.dice) return;
    this.els.dice.classList.add('rolling');
    setTimeout(() => {
      this.els.dice.classList.remove('rolling');
      this.els.dice.textContent = `${dice[0]} + ${dice[1]} = ${total}`;
    }, 280);
    if (this.els.turnIndicator) {
      this.els.turnIndicator.textContent = `${playerName}: ${total}`;
    }
  }

  _renderChoice(prompt, options) {
    this.els.actions.innerHTML = '';
    for (const opt of options) {
      const btn = document.createElement('button');
      btn.className = opt.kind === 'primary' ? 'primary' : '';
      btn.textContent = opt.label;
      btn.onclick = () => {
        this.els.actions.innerHTML = '';
        this.engine.chooseOption(opt.id);
      };
      this.els.actions.appendChild(btn);
    }
  }

  _enableEndTurn() {
    this.els.actions.innerHTML = '';
    const endBtn = document.createElement('button');
    endBtn.className = 'success';
    endBtn.textContent = '⏭ Terminar turno';
    endBtn.onclick = () => {
      this.els.actions.innerHTML = '';
      this.engine.endTurn();
    };
    this.els.actions.appendChild(endBtn);

    if (this.els.turnIndicator) {
      const active = this.engine.session.activePlayer;
      this.els.turnIndicator.textContent = `${active.name}: puedes construir o terminar.`;
    }
  }

  _renderGameOver(victory, reason) {
    this.els.actions.innerHTML = '';
    this.els.modalTitle.textContent = victory ? '🏆 ¡Victoria!' : '💀 Fin de la partida';
    this.els.modalBody.textContent = reason;
    this.els.modal.classList.add('active');

    const newGameBtn = document.createElement('button');
    newGameBtn.className = 'success';
    newGameBtn.textContent = '🔄 Nueva partida';
    newGameBtn.onclick = () => {
      this.els.modal.classList.remove('active');
      document.getElementById('setup-modal').classList.add('active');
    };
    this.els.actions.appendChild(newGameBtn);
  }
}


/* ==================================================================
   8. TESTS
   ================================================================== */

function runTests() {
  const results = [];
  const t = (name, fn) => {
    try { fn(); results.push({ name, pass:true }); }
    catch (e) { results.push({ name, pass:false, err:e.message }); }
  };
  const assert = (c, m) => { if (!c) throw new Error(m || 'assert'); };
  const eq = (a, b, m) => { if (a !== b) throw new Error(`${m||''}: ${a} !== ${b}`); };

  t('Catálogo 20 casillas', () => eq(TILE_CATALOG.length, 20));

  t('GameSession con 2 humanos crea 4 jugadores', () => {
    const s = new GameSession(MODE.MONOPOLIO, 2);
    eq(s.players.length, 4);
    eq(s.players.filter(p => !p.isAI).length, 2);
    eq(s.players.filter(p => p.isAI).length, 2);
  });

  t('GameSession con 4 humanos no crea IA', () => {
    const s = new GameSession(MODE.MONOPOLIO, 4);
    eq(s.players.length, 4);
    eq(s.players.filter(p => p.isAI).length, 0);
  });

  t('calculateRent sin sinergias', () => {
    const s = new GameSession(MODE.MONOPOLIO, 1);
    s.tiles = [{ id:'t1', price:10, rent:3, owner:'A', group:'barrio' }];
    eq(calculateRent(s, s.tiles[0]), 3);
  });

  t('calculateRent con grupo completo ×1.5', () => {
    const s = new GameSession(MODE.MONOPOLIO, 1);
    s.tiles = [
      { id:'barrio1', price:6, rent:2, owner:'A', group:'barrio' },
      { id:'barrio2', price:6, rent:2, owner:'A', group:'barrio' },
    ];
    eq(calculateRent(s, s.tiles[0]), 3);
  });

  t('calculateRent con casas', () => {
    const s = new GameSession(MODE.MONOPOLIO, 1);
    s.tiles = [
      { id:'barrio1', price:6, rent:2, owner:'A', group:'barrio', houses:2 },
      { id:'barrio2', price:6, rent:2, owner:'A', group:'barrio' },
    ];
    // 2 × 1.5 (grupo) × 1.5 (2 casas) = 4.5 → 4
    eq(calculateRent(s, s.tiles[0]), 4);
  });

  t('canBuildHouse rechaza grupo incompleto', () => {
    const s = new GameSession(MODE.MONOPOLIO, 1);
    s.tiles = [
      { id:'barrio1', price:6, owner:'Tú', group:'barrio', type:'property' },
      { id:'barrio2', price:6, owner:null, group:'barrio', type:'property' },
    ];
    const p = s.players.find(x => x.name === 'Tú');
    p.money = 100;
    const r = canBuildHouse(s, 'Tú', s.tiles[0]);
    assert(!r.ok);
    eq(r.reason, 'grupo incompleto');
  });

  t('canBuildHouse ok con grupo completo y dinero', () => {
    const s = new GameSession(MODE.MONOPOLIO, 1);
    s.tiles = [
      { id:'barrio1', price:6, owner:'Tú', group:'barrio', type:'property', houses:0 },
      { id:'barrio2', price:6, owner:'Tú', group:'barrio', type:'property' },
    ];
    const p = s.players.find(x => x.name === 'Tú');
    p.money = 100;
    const r = canBuildHouse(s, 'Tú', s.tiles[0]);
    assert(r.ok);
  });

  t('Monopolio: rent va al dueño', () => {
    const r = new MonopolioRules();
    const s = new GameSession(MODE.MONOPOLIO, 1);
    s.tiles = [{ id:'t1', price:10, rent:3, owner:'Lord Vetinari', group:null, houses:0 }];
    s.players[0].money = 20;
    s.players[1].money = 10;
    r.onRent(s, 'Tú', 'Lord Vetinari', s.tiles[0]);
    eq(s.players[0].money, 17);
    eq(s.players[1].money, 13);
  });

  t('Prosperidad: dividendos al comprar', () => {
    const r = new ProsperidadRules();
    const s = new GameSession(MODE.PROSPERIDAD, 1);
    s.tiles = [{ id:'t1', price:10 }];
    s.players[0].money = 20;
    s.players[1].money = 10;
    r.onBuy(s, 'Tú', s.tiles[0]);
    eq(s.commonFund, 5);
    eq(s.players[0].money, 10);
    eq(s.players[1].money, 12);
  });

  t('Prosperidad: 40/60 en alquiler', () => {
    const r = new ProsperidadRules();
    const s = new GameSession(MODE.PROSPERIDAD, 1);
    s.tiles = [{ id:'t1', price:10, rent:10, owner:'Lord Vetinari', group:null, houses:0 }];
    s.players[0].money = 20;
    s.players[1].money = 10;
    const res = r.onRent(s, 'Tú', 'Lord Vetinari', s.tiles[0]);
    eq(res.toOwner, 4);
    eq(res.toFund, 6);
    eq(s.players[0].money, 10);
    eq(s.players[1].money, 14);
    eq(s.commonFund, 6);
  });

  t('Prosperidad: victoria colectiva', () => {
    const r = new ProsperidadRules();
    const s = new GameSession(MODE.PROSPERIDAD, 1);
    s.poorestStarting = 10;
    s.players.forEach(p => { p.money = 30; p.properties = []; });
    s.tiles = [];
    const v = r.checkVictory(s);
    eq(v.over, true);
    eq(v.victory, true);
  });

  t('Monopolio: victoria por riqueza en maxTurns', () => {
    const r = new MonopolioRules();
    const s = new GameSession(MODE.MONOPOLIO, 1);
    s.tiles = [];
    s.maxTurns = 5;
    s.turnCounter = 5;
    s.players[0].money = 100;
    s.players[1].money = 10;
    s.players[2].money = 10;
    s.players[3].money = 10;
    const v = r.checkVictory(s);
    eq(v.over, true);
    eq(v.victory, true);
    assert(v.reason.includes('Tú'));
  });

  const panel = document.getElementById('testpanel');
  if (panel) {
    panel.classList.add('open');
    const pass = results.filter(r => r.pass).length;
    const fail = results.length - pass;
    panel.innerHTML =
      `<div style="margin-bottom:6px;">Tests: ${pass}/${results.length} OK${fail > 0 ? ' · ' + fail + ' FALLOS' : ''}</div>` +
      results.map(r =>
        `<div class="${r.pass ? 'pass' : 'fail'}">${r.pass ? '✓' : '✗'} ${r.name}${r.err ? ' — ' + r.err : ''}</div>`
      ).join('');
  }
  return results;
}


/* ==================================================================
   9. BOOTSTRAP
   ================================================================== */

(function bootstrap() {
  const random = new RandomAdapter();
  const notifier = new UINotifier();
  const engine = new GameEngine({ random, notifier });
  const renderer = new UIRenderer(notifier, engine);

  // Setup modal
  const setupModal = document.getElementById('setup-modal');
  let setupMode = 'monopolio';
  let setupHumans = 1;

  const modeButtons = document.querySelectorAll('#setup-mode button');
  const humansButtons = document.querySelectorAll('#setup-humans button');

  modeButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      modeButtons.forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      setupMode = btn.dataset.mode;
    });
  });
  humansButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      humansButtons.forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      setupHumans = parseInt(btn.dataset.n);
    });
  });

  document.getElementById('setup-start').addEventListener('click', () => {
    setupModal.classList.remove('active');
    engine.startNewGame(setupMode, setupHumans);
  });

  document.getElementById('btnNewGame').addEventListener('click', () => {
    setupModal.classList.add('active');
  });

  window.__game = engine;
  window.__gameTests = runTests;

  // Mostrar setup al arrancar
  setupModal.classList.add('active');

  if (location.search.includes('test')) setTimeout(runTests, 200);
})();
</script>
