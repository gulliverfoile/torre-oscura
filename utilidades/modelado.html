<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador Procedural de Casas · MVP Mejorado v2</title>
    <style>
        * { box-sizing: border-box; margin: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { font-weight: 300; margin-bottom: 20px; letter-spacing: 1px; color: #3b82f6; }
        .container {
            max-width: 1200px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        .panel {
            background: #1e293b;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #334155;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .panel h3 {
            color: #94a3b8;
            font-weight: 400;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-group { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
        .btn {
            background: #3b82f6;
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover { background: #2563eb; transform: scale(1.02); }
        .btn:active { transform: scale(0.98); }
        .btn.secondary { background: #334155; }
        .btn.secondary:hover { background: #475569; }
        .btn.success { background: #10b981; }
        .btn.success:hover { background: #059669; }
        canvas {
            width: 100%;
            aspect-ratio: 4/3;
            background: #0f172a;
            border-radius: 12px;
            border: 1px solid #334155;
            display: block;
        }
        .flex-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 8px 0; }
        .flex-row label { display: flex; align-items: center; gap: 4px; font-size: 0.85rem; color: #94a3b8; }
        .flex-row input[type="number"], .flex-row select {
            background: #0f172a;
            border: 1px solid #334155;
            color: #e2e8f0;
            padding: 4px 8px;
            border-radius: 8px;
            width: auto;
        }
        .status { font-size: 0.8rem; color: #94a3b8; padding: 4px 0; }
        .json-output {
            background: #0f172a;
            padding: 12px;
            border-radius: 12px;
            max-height: 250px;
            overflow-y: auto;
            font-size: 0.8rem;
            white-space: pre-wrap;
            border: 1px solid #334155;
            margin-top: 8px;
            font-family: 'Courier New', monospace;
        }
        @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <h1>🏠 Generador Procedural de Casas · MVP Mejorado v2</h1>

    <div class="container">
        <div class="panel">
            <h3>⚙️ Parámetros</h3>
            <div class="flex-row">
                <label>Semilla <input type="number" id="seedInput" value="42" min="0" max="999999"></label>
                <label>Plantas 
                    <select id="floorsSelect">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                    </select>
                </label>
                <label>Estilo 
                    <select id="styleSelect">
                        <option value="medieval">Medieval</option>
                        <option value="moderno">Moderno</option>
                        <option value="rustico">Rústico</option>
                    </select>
                </label>
                <label>Densidad ventanas
                    <select id="windowDensitySelect">
                        <option value="baja">Baja</option>
                        <option value="media" selected>Media</option>
                        <option value="alta">Alta</option>
                    </select>
                </label>
            </div>
            <div class="btn-group">
                <button class="btn success" id="generateBtn">🏗️ Generar casa</button>
                <button class="btn secondary" id="randomSeedBtn">🎲 Semilla aleatoria</button>
            </div>
            <div class="status" id="statusMsg">Listo</div>
            <div class="json-output" id="houseOutput">Esperando generación...</div>
        </div>

        <div class="panel">
            <h3>🖼️ Vista frontal (2D)</h3>
            <div class="btn-group">
                <button class="btn secondary" id="exportPngBtn">⬇️ Exportar PNG</button>
                <button class="btn secondary" id="clearCanvasBtn">🧹 Limpiar</button>
            </div>
            <canvas id="houseCanvas" width="800" height="600"></canvas>
            <div class="status" id="canvasStatus">Esperando casa...</div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ============ 1. EVENT BUS ============
            class EventBus {
                constructor() { this.listeners = new Map(); }
                on(event, callback) {
                    if (!this.listeners.has(event)) this.listeners.set(event, []);
                    this.listeners.get(event).push(callback);
                    return () => this.off(event, callback);
                }
                off(event, callback) {
                    const callbacks = this.listeners.get(event);
                    if (callbacks) {
                        const idx = callbacks.indexOf(callback);
                        if (idx !== -1) callbacks.splice(idx, 1);
                    }
                }
                emit(event, payload) {
                    const callbacks = this.listeners.get(event);
                    if (callbacks) {
                        [...callbacks].forEach(cb => { try { cb(payload); } catch (e) { console.error(e); } });
                    }
                }
            }

            // ============ 2. VALUE OBJECTS ============
            class HouseComponent {
                constructor(type, variant, params = {}) {
                    this.type = type;
                    this.variant = variant;
                    this.params = params; // incluye position {x,y,w,h} en coordenadas virtuales 0-100
                }
            }

            class House {
                constructor(style, floors, components) {
                    this.style = style;
                    this.floors = floors;
                    this.components = components;
                }
            }

            // ============ 3. PUERTOS ============
            class GeneratorPort {
                generate(seed, style, floors, windowDensity) { throw new Error('No implementado'); }
            }
            class RendererPort {
                clear() { throw new Error('No implementado'); }
                drawHouse(house) { throw new Error('No implementado'); }
            }

            // ============ 4. RANDOM CON SEMILLA ============
            class SeededRandom {
                constructor(seed) {
                    this.seed = seed % 2147483647;
                    if (this.seed <= 0) this.seed += 2147483646;
                }
                next() {
                    this.seed = (this.seed * 16807) % 2147483647;
                    return (this.seed - 1) / 2147483646;
                }
                nextInt(min, max) { return Math.floor(this.next() * (max - min)) + min; }
                weightedChoice(items, weightKey = 'weight') {
                    const total = items.reduce((sum, item) => sum + (item[weightKey] || 1), 0);
                    let r = this.next() * total;
                    for (const item of items) {
                        r -= (item[weightKey] || 1);
                        if (r <= 0) return item;
                    }
                    return items[items.length - 1];
                }
            }

            // ============ 5. GENERADOR ============
            class HouseGeneratorAdapter extends GeneratorPort {
                constructor() {
                    super();
                    this.catalog = this._buildCatalog();
                    this.styles = this._buildStyles();
                    // Dimensiones base en unidades virtuales (0-100)
                    this.BASE_WALL_HEIGHT = 25;
                    this.BASE_WALL_WIDTH = 60;
                    this.GROUND_Y = 85; // suelo en y=85
                }

                _buildCatalog() {
                    return {
                        wall: {
                            variants: [
                                { id: 'plain', weight: 0.5, params: { thickness: 2 } },
                                { id: 'stone', weight: 0.3, params: { thickness: 3 } },
                                { id: 'brick', weight: 0.2, params: { thickness: 2 } }
                            ]
                        },
                        roof: {
                            variants: [
                                { id: 'gabled', weight: 0.5, params: { height: 15 } },
                                { id: 'flat', weight: 0.2, params: { height: 5 } },
                                { id: 'hipped', weight: 0.3, params: { height: 12 } }
                            ]
                        },
                        door: {
                            variants: [
                                { id: 'simple', weight: 0.6, params: { width: 8, height: 15 } },
                                { id: 'double', weight: 0.3, params: { width: 12, height: 15 } },
                                { id: 'arched', weight: 0.1, params: { width: 9, height: 16 } }
                            ]
                        },
                        window: {
                            variants: [
                                { id: 'square', weight: 0.5, params: { width: 6, height: 6 } },
                                { id: 'rect', weight: 0.3, params: { width: 7, height: 8 } },
                                { id: 'round', weight: 0.2, params: { width: 6, height: 6 } }
                            ]
                        },
                        chimney: {
                            variants: [
                                { id: 'brick', weight: 0.7, params: { width: 4, height: 10 } },
                                { id: 'stone', weight: 0.3, params: { width: 5, height: 9 } }
                            ]
                        }
                    };
                }

                _buildStyles() {
                    return {
                        medieval: {
                            wallColor: '#c4b5a0',
                            roofColor: '#6a4a3a',
                            doorColor: '#4a2a1a',
                            windowColor: '#aacfdf',
                            chimneyColor: '#7a5a4a',
                            roofPreference: ['gabled', 'hipped'],
                            doorPreference: ['arched', 'simple'],
                            windowPreference: ['square', 'rect']
                        },
                        moderno: {
                            wallColor: '#e8e8e8',
                            roofColor: '#4a5a6a',
                            doorColor: '#2a3a4a',
                            windowColor: '#8fcbdd',
                            chimneyColor: '#6a7a8a',
                            roofPreference: ['flat', 'hipped'],
                            doorPreference: ['simple'],
                            windowPreference: ['rect', 'square']
                        },
                        rustico: {
                            wallColor: '#d4c8b0',
                            roofColor: '#8a6a4a',
                            doorColor: '#5a3a2a',
                            windowColor: '#b8d8e8',
                            chimneyColor: '#8a7a6a',
                            roofPreference: ['gabled', 'hipped'],
                            doorPreference: ['double', 'simple'],
                            windowPreference: ['square', 'rect']
                        }
                    };
                }

                generate(seed, style, floors, windowDensity = 'media') {
                    const rng = new SeededRandom(seed);
                    const styleData = this.styles[style] || this.styles.medieval;
                    const components = [];

                    // Dimensiones virtuales
                    const wallWidth = this.BASE_WALL_WIDTH;
                    const wallHeight = this.BASE_WALL_HEIGHT * floors;
                    const wallX = 50 - wallWidth / 2; // centrado en x=50
                    const wallY = this.GROUND_Y - wallHeight; // suelo=85, pared hacia arriba

                    // 1. Pared
                    const wallVariant = rng.weightedChoice(this.catalog.wall.variants, 'weight');
                    components.push(new HouseComponent('wall', wallVariant.id, {
                        color: styleData.wallColor,
                        position: { x: wallX, y: wallY, w: wallWidth, h: wallHeight },
                        thickness: wallVariant.params.thickness
                    }));

                    // 2. Tejado (pegado a la pared)
                    const roofVariant = this._chooseRoof(rng, styleData);
                    const roofHeight = roofVariant.params.height;
                    const roofY = wallY - roofHeight; // justo encima de la pared
                    const roofOverhang = 2; // solape ligero
                    components.push(new HouseComponent('roof', roofVariant.id, {
                        color: styleData.roofColor,
                        position: { x: wallX - roofOverhang, y: roofY, w: wallWidth + roofOverhang*2, h: roofHeight },
                        variant: roofVariant.id
                    }));

                    // 3. Puerta (centrada en la pared)
                    const doorVariant = this._chooseDoor(rng, styleData);
                    const doorWidth = doorVariant.params.width;
                    const doorHeight = doorVariant.params.height;
                    const doorX = wallX + wallWidth/2 - doorWidth/2;
                    const doorY = this.GROUND_Y - doorHeight;
                    components.push(new HouseComponent('door', doorVariant.id, {
                        color: styleData.doorColor,
                        position: { x: doorX, y: doorY, w: doorWidth, h: doorHeight },
                        variant: doorVariant.id
                    }));

                    // 4. Ventanas
                    const windowVariant = this._chooseWindow(rng, styleData);
                    const windowCount = this._calculateWindowCount(floors, windowDensity, wallWidth, wallHeight);
                    const windowPositions = this._distributeWindows(windowCount, floors, wallX, wallY, wallWidth, wallHeight, windowVariant.params);
                    for (const pos of windowPositions) {
                        components.push(new HouseComponent('window', windowVariant.id, {
                            color: styleData.windowColor,
                            position: { x: pos.x, y: pos.y, w: windowVariant.params.width, h: windowVariant.params.height },
                            variant: windowVariant.id
                        }));
                    }

                    // 5. Chimenea (opcional)
                    if (rng.next() < 0.7) {
                        const chimneyVariant = rng.weightedChoice(this.catalog.chimney.variants, 'weight');
                        const chimneyWidth = chimneyVariant.params.width;
                        const chimneyHeight = chimneyVariant.params.height;
                        const chimneyX = wallX + wallWidth * 0.7; // a la derecha
                        const chimneyY = roofY - chimneyHeight; // encima del tejado
                        components.push(new HouseComponent('chimney', chimneyVariant.id, {
                            color: styleData.chimneyColor,
                            position: { x: chimneyX, y: chimneyY, w: chimneyWidth, h: chimneyHeight },
                            variant: chimneyVariant.id
                        }));
                    }

                    // Ordenar para render estable
                    const order = ['wall', 'window', 'door', 'roof', 'chimney'];
                    components.sort((a, b) => order.indexOf(a.type) - order.indexOf(b.type));

                    return new House(style, floors, components);
                }

                _chooseRoof(rng, styleData) {
                    const preferred = styleData.roofPreference || [];
                    const filtered = this.catalog.roof.variants.filter(v => preferred.includes(v.id));
                    if (filtered.length > 0 && rng.next() < 0.8) {
                        return rng.weightedChoice(filtered, 'weight');
                    }
                    return rng.weightedChoice(this.catalog.roof.variants, 'weight');
                }
                _chooseDoor(rng, styleData) {
                    const preferred = styleData.doorPreference || [];
                    const filtered = this.catalog.door.variants.filter(v => preferred.includes(v.id));
                    if (filtered.length > 0 && rng.next() < 0.7) {
                        return rng.weightedChoice(filtered, 'weight');
                    }
                    return rng.weightedChoice(this.catalog.door.variants, 'weight');
                }
                _chooseWindow(rng, styleData) {
                    const preferred = styleData.windowPreference || [];
                    const filtered = this.catalog.window.variants.filter(v => preferred.includes(v.id));
                    if (filtered.length > 0 && rng.next() < 0.6) {
                        return rng.weightedChoice(filtered, 'weight');
                    }
                    return rng.weightedChoice(this.catalog.window.variants, 'weight');
                }

                _calculateWindowCount(floors, density, wallWidth, wallHeight) {
                    const maxPerRow = Math.floor((wallWidth - 20) / 15); // aprox
                    const rows = floors;
                    const maxTotal = maxPerRow * rows;
                    let base = maxTotal; // por defecto densidad media
                    switch (density) {
                        case 'baja': base = Math.max(1, Math.floor(maxTotal * 0.5)); break;
                        case 'alta': base = Math.max(2, Math.floor(maxTotal * 1.2)); break;
                        default: base = maxTotal;
                    }
                    return Math.min(base, maxTotal);
                }

                _distributeWindows(count, floors, wallX, wallY, wallWidth, wallHeight, winParams) {
                    const positions = [];
                    if (count <= 0) return positions;
                    const rows = floors;
                    const colsPerRow = Math.ceil(count / rows);
                    const marginX = 5;
                    const marginY = 3;
                    const usableWidth = wallWidth - 2 * marginX;
                    const usableHeight = wallHeight - 2 * marginY;
                    const stepX = usableWidth / colsPerRow;
                    const stepY = usableHeight / rows;

                    for (let i = 0; i < count; i++) {
                        const row = Math.floor(i / colsPerRow);
                        const col = i % colsPerRow;
                        const x = wallX + marginX + col * stepX + (stepX - winParams.width) / 2;
                        const y = wallY + marginY + row * stepY + (stepY - winParams.height) / 2;
                        positions.push({ x, y });
                    }
                    return positions;
                }
            }

            // ============ 6. RENDERIZADOR ============
            class CanvasRendererAdapter extends RendererPort {
                constructor(canvas) {
                    super();
                    this.canvas = canvas;
                    this.ctx = canvas.getContext('2d');
                }

                clear() {
                    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                    this.ctx.fillStyle = '#0f172a';
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                }

                drawHouse(house) {
                    const ctx = this.ctx;
                    const canvasW = this.canvas.width;
                    const canvasH = this.canvas.height;

                    // Calcular bounding box de todos los componentes (en coordenadas virtuales 0-100)
                    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                    for (const comp of house.components) {
                        const pos = comp.params.position;
                        minX = Math.min(minX, pos.x);
                        minY = Math.min(minY, pos.y);
                        maxX = Math.max(maxX, pos.x + pos.w);
                        maxY = Math.max(maxY, pos.y + pos.h);
                    }
                    // Añadir margen virtual
                    const marginVirtual = 5;
                    minX -= marginVirtual; minY -= marginVirtual; maxX += marginVirtual; maxY += marginVirtual;
                    const virtualWidth = maxX - minX;
                    const virtualHeight = maxY - minY;

                    // Calcular escala para ajustar al canvas con margen
                    const marginPixels = 20;
                    const scaleX = (canvasW - 2 * marginPixels) / virtualWidth;
                    const scaleY = (canvasH - 2 * marginPixels) / virtualHeight;
                    const scale = Math.min(scaleX, scaleY);
                    // Centrar
                    const offsetX = (canvasW - virtualWidth * scale) / 2 - minX * scale;
                    const offsetY = (canvasH - virtualHeight * scale) / 2 - minY * scale;

                    const toPixelX = (vx) => offsetX + vx * scale;
                    const toPixelY = (vy) => offsetY + vy * scale;

                    // Dibujar cada componente
                    for (const comp of house.components) {
                        const pos = comp.params.position;
                        const px = toPixelX(pos.x);
                        const py = toPixelY(pos.y);
                        const pw = pos.w * scale;
                        const ph = pos.h * scale;
                        this._drawComponent(ctx, comp, px, py, pw, ph);
                    }

                    // Texto informativo
                    ctx.fillStyle = '#94a3b8';
                    ctx.font = '14px sans-serif';
                    ctx.fillText(`Estilo: ${house.style} | Plantas: ${house.floors} | Componentes: ${house.components.length}`, 20, 30);
                }

                _drawComponent(ctx, comp, x, y, w, h) {
                    switch (comp.type) {
                        case 'wall':
                            this._drawWall(ctx, x, y, w, h, comp);
                            break;
                        case 'window':
                            this._drawWindow(ctx, x, y, w, h, comp);
                            break;
                        case 'door':
                            this._drawDoor(ctx, x, y, w, h, comp);
                            break;
                        case 'roof':
                            this._drawRoof(ctx, x, y, w, h, comp);
                            break;
                        case 'chimney':
                            this._drawChimney(ctx, x, y, w, h, comp);
                            break;
                    }
                }

                _drawWall(ctx, x, y, w, h, comp) {
                    ctx.fillStyle = comp.params.color || '#e2d5c0';
                    ctx.fillRect(x, y, w, h);
                    ctx.strokeStyle = '#1e293b';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(x, y, w, h);
                }

                _drawWindow(ctx, x, y, w, h, comp) {
                    const variant = comp.variant;
                    ctx.fillStyle = comp.params.color || '#87ceeb';
                    ctx.strokeStyle = '#1e293b';
                    ctx.lineWidth = 1;

                    if (variant === 'round') {
                        const cx = x + w/2;
                        const cy = y + h/2;
                        const rx = w/2;
                        const ry = h/2;
                        ctx.beginPath();
                        ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                    } else {
                        ctx.fillRect(x, y, w, h);
                        ctx.strokeRect(x, y, w, h);
                        // Cruz interior
                        ctx.beginPath();
                        ctx.moveTo(x + w/2, y);
                        ctx.lineTo(x + w/2, y + h);
                        ctx.moveTo(x, y + h/2);
                        ctx.lineTo(x + w, y + h/2);
                        ctx.stroke();
                    }
                }

                _drawDoor(ctx, x, y, w, h, comp) {
                    const variant = comp.variant;
                    ctx.fillStyle = comp.params.color || '#5a3a2a';
                    ctx.strokeStyle = '#1e293b';
                    ctx.lineWidth = 1;

                    if (variant === 'arched') {
                        const archH = h * 0.3;
                        ctx.fillRect(x, y + archH, w, h - archH);
                        ctx.strokeRect(x, y + archH, w, h - archH);
                        ctx.beginPath();
                        ctx.arc(x + w/2, y + archH, w/2, Math.PI, 0);
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();
                    } else {
                        ctx.fillRect(x, y, w, h);
                        ctx.strokeRect(x, y, w, h);
                        ctx.beginPath();
                        ctx.arc(x + w * 0.7, y + h * 0.6, Math.min(w,h)*0.1, 0, Math.PI * 2);
                        ctx.fillStyle = '#f5d742';
                        ctx.fill();
                    }
                }

                _drawRoof(ctx, x, y, w, h, comp) {
                    const variant = comp.variant;
                    ctx.fillStyle = comp.params.color || '#7a4a3a';
                    ctx.strokeStyle = '#1e293b';
                    ctx.lineWidth = 1;

                    if (variant === 'flat') {
                        ctx.fillRect(x, y, w, h);
                        ctx.strokeRect(x, y, w, h);
                    } else if (variant === 'gabled') {
                        const peakX = x + w/2;
                        const peakY = y; // la base está en y, el pico arriba
                        ctx.beginPath();
                        ctx.moveTo(x, y + h);
                        ctx.lineTo(peakX, peakY);
                        ctx.lineTo(x + w, y + h);
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();
                    } else if (variant === 'hipped') {
                        const topW = w * 0.6;
                        const peakY = y;
                        ctx.beginPath();
                        ctx.moveTo(x, y + h);
                        ctx.lineTo(x + (w - topW)/2, peakY);
                        ctx.lineTo(x + (w - topW)/2 + topW, peakY);
                        ctx.lineTo(x + w, y + h);
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();
                    }
                }

                _drawChimney(ctx, x, y, w, h, comp) {
                    ctx.fillStyle = comp.params.color || '#8b4513';
                    ctx.strokeStyle = '#1e293b';
                    ctx.lineWidth = 1;
                    ctx.fillRect(x, y, w, h);
                    ctx.strokeRect(x, y, w, h);
                    ctx.fillRect(x - w*0.2, y - h*0.1, w*1.4, h*0.1);
                    ctx.strokeRect(x - w*0.2, y - h*0.1, w*1.4, h*0.1);
                }
            }

            // ============ 7. CASO DE USO ============
            class GenerateHouseUseCase {
                constructor(generator, renderer, eventBus) {
                    this.generator = generator;
                    this.renderer = renderer;
                    this.eventBus = eventBus;
                }
                execute(seed, style, floors, windowDensity) {
                    try {
                        this.eventBus.emit('generation:started');
                        const house = this.generator.generate(seed, style, floors, windowDensity);
                        this.renderer.clear();
                        this.renderer.drawHouse(house);
                        this.eventBus.emit('generation:completed', { house, seed });
                        return house;
                    } catch (e) {
                        this.eventBus.emit('generation:error', e);
                        throw e;
                    }
                }
            }

            // ============ 8. CONTENEDOR ============
            function createContainer() {
                const eventBus = new EventBus();
                const canvas = document.getElementById('houseCanvas');
                const generator = new HouseGeneratorAdapter();
                const renderer = new CanvasRendererAdapter(canvas);
                const useCase = new GenerateHouseUseCase(generator, renderer, eventBus);
                return { eventBus, generator, renderer, useCase };
            }

            // ============ 9. UI CONTROLLER ============
            class UIController {
                constructor(container) {
                    this.container = container;
                    this.eventBus = container.eventBus;
                    this.houseOutput = document.getElementById('houseOutput');
                    this.statusMsg = document.getElementById('statusMsg');
                    this.canvasStatus = document.getElementById('canvasStatus');

                    this.seedInput = document.getElementById('seedInput');
                    this.floorsSelect = document.getElementById('floorsSelect');
                    this.styleSelect = document.getElementById('styleSelect');
                    this.windowDensitySelect = document.getElementById('windowDensitySelect');

                    document.getElementById('generateBtn').addEventListener('click', () => this._handleGenerate());
                    document.getElementById('randomSeedBtn').addEventListener('click', () => this._handleRandomSeed());
                    document.getElementById('exportPngBtn').addEventListener('click', () => this._handleExportPng());
                    document.getElementById('clearCanvasBtn').addEventListener('click', () => this._handleClearCanvas());

                    this.eventBus.on('generation:started', () => {
                        this.statusMsg.textContent = '⏳ Generando...';
                    });
                    this.eventBus.on('generation:completed', (payload) => {
                        this.statusMsg.textContent = `✅ Casa generada (semilla: ${payload.seed})`;
                        this.canvasStatus.textContent = `🏠 ${payload.house.components.length} componentes · ${payload.house.style}`;
                        this.houseOutput.textContent = JSON.stringify(payload.house, null, 2);
                    });
                    this.eventBus.on('generation:error', (e) => {
                        this.statusMsg.textContent = `❌ Error: ${e.message}`;
                    });

                    this._handleGenerate();
                }

                _handleGenerate() {
                    const seed = this._validateSeed(this.seedInput.value);
                    const style = this.styleSelect.value;
                    const floors = parseInt(this.floorsSelect.value, 10);
                    const windowDensity = this.windowDensitySelect.value;

                    if (isNaN(floors) || floors < 1 || floors > 3) {
                        alert('El número de plantas debe estar entre 1 y 3.');
                        return;
                    }
                    this.container.useCase.execute(seed, style, floors, windowDensity);
                }

                _validateSeed(inputValue) {
                    let seed = parseInt(inputValue, 10);
                    if (isNaN(seed) || seed < 0) seed = 42;
                    seed = Math.min(seed, 999999);
                    this.seedInput.value = seed;
                    return seed;
                }

                _handleRandomSeed() {
                    const seed = Math.floor(Math.random() * 999999);
                    this.seedInput.value = seed;
                    this._handleGenerate();
                }

                _handleExportPng() {
                    const canvas = document.getElementById('houseCanvas');
                    const link = document.createElement('a');
                    link.download = 'casa_generada.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    this.canvasStatus.textContent = '⬇️ PNG exportado.';
                }

                _handleClearCanvas() {
                    const canvas = document.getElementById('houseCanvas');
                    const ctx = canvas.getContext('2d');
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#0f172a';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    this.canvasStatus.textContent = '🧹 Canvas limpiado.';
                    this.houseOutput.textContent = 'Esperando generación...';
                    this.statusMsg.textContent = 'Listo';
                }
            }

            // ============ 10. INICIALIZACIÓN ============
            document.addEventListener('DOMContentLoaded', () => {
                const container = createContainer();
                const ui = new UIController(container);
                window.houseApp = { container, ui };
                console.log('🏠 Generador procedural de casas mejorado v2 iniciado.');
            });

        })();
    </script>
</body>
</html>
