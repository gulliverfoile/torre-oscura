<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Metroidvania · Física + Puertas + Gancho</title>
  <style>
    /* ===== ESTILOS ===== */
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; background:#0a0a1a; touch-action:none; }
    body { display:flex; justify-content:center; align-items:center; font-family:monospace; }
    canvas { display:block; position:absolute; top:0; left:0; background:#111; }

    #side-menu {
      position:fixed; top:0; right:0; width:min(420px, 94vw); height:100vh;
      background:rgba(8,8,24,0.97); border-left:2px solid #ffd700; color:#eee;
      z-index:10000; display:none; font-size:clamp(12px, 1.8vw, 14px);
      backdrop-filter:blur(10px); overflow-y:auto; padding:0;
      font-family: 'Segoe UI', monospace;
    }
    #side-menu .tab-buttons {
      display:flex; flex-wrap:wrap; background:#16162e; border-bottom:1px solid #444;
      position:sticky; top:0; z-index:1;
    }
    #side-menu .tab-buttons button {
      flex:1; min-width:60px; background:transparent; border:none; color:#aaa;
      padding:12px 6px; cursor:pointer; font-weight:bold; font-size:inherit;
      transition:0.2s; border-bottom:2px solid transparent;
    }
    #side-menu .tab-buttons button.active { color:#ffd700; border-bottom-color:#ffd700; background:#222; }
    #side-menu .tab-content { padding:16px; }
    #side-menu .tab-content > div { display:none; }
    #side-menu .tab-content > div.active { display:block; }
    button {
      background:#ffd700; color:#000; border:none; padding:6px 12px; margin:4px 2px;
      cursor:pointer; font-weight:bold; border-radius:4px; touch-action:manipulation;
      font-family:inherit;
    }
    button.secondary { background:#2a4a7f; color:#fff; }
    button.good { background:#4ecca3; color:#000; }
    button.danger { background:#e94560; color:#fff; }
    select, input[type="range"] {
      margin:4px 0 10px; background:#222; color:#0f0; border:1px solid #0f0;
      padding:4px; border-radius:3px; font-family:monospace; width:100%;
    }
    label { display:block; margin:6px 0 2px; color:#ccc; }
    hr { border-color:#444; margin:12px 0; }
    .boss-hp {
      position:fixed; top:10px; left:50%; transform:translateX(-50%);
      width:min(300px, 70vw); height:18px; background:#333; border:2px solid #fff;
      display:none; border-radius:10px; overflow:hidden;
    }
    .boss-hp-fill { height:100%; background:#f00; width:100%; transition:width 0.2s; }
    .stat-row { display:flex; flex-wrap:wrap; gap:4px 8px; margin:4px 0; font-size:0.9em; }
    .stat-badge { background:#1a1a3a; padding:2px 8px; border-radius:12px; border:1px solid #444; }
    .skill-card {
      background:#1a1a3a; border:1px solid #333; border-radius:8px; padding:8px 12px;
      margin:6px 0; cursor:pointer; transition:0.2s;
    }
    .skill-card:hover { border-color:#ffd700; }
    .skill-card.unlocked { border-left:4px solid #4ecca3; }
    .skill-card.locked { opacity:0.6; }
    .skill-card .tags { font-size:0.8em; color:#aaa; }
    .skill-card .cost { font-size:0.8em; color:#ffd700; }
    .affinity-bar {
      display:flex; flex-wrap:wrap; gap:6px; margin:8px 0;
    }
    .affinity-tag {
      background:#1a1a3a; border-radius:20px; padding:4px 12px;
      display:flex; align-items:center; gap:6px; font-size:0.85em;
      border:1px solid #333;
    }
    .affinity-tag .bar { width:60px; height:6px; background:#333; border-radius:3px; overflow:hidden; }
    .affinity-tag .fill { height:100%; transition:width 0.3s; }
    .affinity-tag .value { font-weight:bold; min-width:24px; text-align:right; }
    .talent-item {
      background:#1a1a3a; border-radius:6px; padding:6px 10px; margin:4px 0;
      display:flex; justify-content:space-between; align-items:center; border:1px solid #333;
    }
    .talent-item .desc { font-size:0.85em; color:#aaa; }
    .talent-item .req { font-size:0.75em; color:#888; }
    .talent-item .btn-unlock { background:#4ecca3; color:#000; border:none; padding:2px 12px; border-radius:4px; cursor:pointer; font-weight:bold; }
    .talent-item .btn-unlock:disabled { opacity:0.4; cursor:not-allowed; }
    .wave-info { background:#1a1a3a; padding:8px 12px; border-radius:6px; margin:8px 0; border:1px solid #ffd700; }
    .module-slot { display:inline-block; background:#222; padding:2px 10px; border-radius:12px; margin:2px; border:1px solid #555; }
    .module-slot .remove { background:#e94560; color:#fff; border:none; border-radius:50%; width:18px; height:18px; cursor:pointer; font-weight:bold; margin-left:4px; }
    .toast-container {
      position:fixed; bottom:20px; right:20px; z-index:99999; display:flex; flex-direction:column; gap:6px; max-width:320px; pointer-events:none;
    }
    .toast {
      background:#1a1a3a; border:1px solid #444; border-radius:8px; padding:8px 14px;
      box-shadow:0 4px 20px rgba(0,0,0,0.6); color:#eee; font-size:0.9em; pointer-events:auto;
      animation:slideIn 0.3s ease; border-left:4px solid #4ecca3;
    }
    .toast.error { border-left-color:#e94560; }
    .toast.warn { border-left-color:#f9ca24; }
    @keyframes slideIn { from { opacity:0; transform:translateX(40px); } to { opacity:1; transform:translateX(0); } }
    .progress-bar { width:100%; height:4px; background:#333; border-radius:2px; overflow:hidden; margin:4px 0; }
    .progress-bar .fill { height:100%; background:linear-gradient(90deg,#e94560,#ffd700); transition:width 0.3s; }
    .flex { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .text-muted { color:#888; font-size:0.85em; }
    .mt-1 { margin-top:8px; }
    .mb-1 { margin-bottom:8px; }
    .p-1 { padding:8px; }
    .border { border:1px solid #333; border-radius:6px; }
    .bg-dark { background:#111; }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<div class="boss-hp" id="boss-hp-bar"><div class="boss-hp-fill" id="boss-hp-fill"></div></div>

<div id="side-menu">
  <div class="tab-buttons">
    <button data-tab="architect">🔧 Arquitecto</button>
    <button data-tab="tree">🌳 Árbol</button>
    <button data-tab="talents">🌟 Talentos</button>
    <button data-tab="modules">🧩 Módulos</button>
  </div>
  <div class="tab-content">
    <div id="tab-architect" class="active"></div>
    <div id="tab-tree"></div>
    <div id="tab-talents"></div>
    <div id="tab-modules"></div>
  </div>
  <div style="text-align:center; padding:12px;">
    <button id="menu-close" class="secondary">Cerrar menú [Tab]</button>
  </div>
</div>
<div class="toast-container" id="toastContainer"></div>

<script>
'use strict';

// ================================================================
//  1. CONFIGURACIÓN
// ================================================================
const CONFIG = {
  gravity: 700,
  jumpForce: 300,
  doubleJumpForce: 260,
  moveSpeed: 200,
  dashBaseSpeed: 400,
  dashLevelMultiplier: 1.3,
  dashCooldown: 0.6,
  dashDuration: 0.15,
  tileSize: 32,
  enemyDefaultHp: 3,
  enemyDefaultDamage: 1,
  enemyDefaultSpeed: 60,
  startRoomId: '0,0',
  elements: ['fuego', 'hielo', 'rayo', 'veneno'],
  dropChance: 0.5,
  maxCharges: 5,
  chargePerHit: 3,
  baseXPPerKill: 15,
  xpCurveExponent: 1.4,
  maxLevel: 20,
  grappleTileBasic: 3,
  grappleTileAdvanced: 4,
  grappleTileMaster: 5,
  modules: {
    fuego: { name: 'Fuego', element: 'fuego', color: '#f60', icon: '🔥' },
    hielo: { name: 'Hielo', element: 'hielo', color: '#6cf', icon: '❄️' },
    rayo: { name: 'Rayo', element: 'rayo', color: '#ff0', icon: '⚡' },
    veneno: { name: 'Veneno', element: 'veneno', color: '#6f6', icon: '☠️' }
  },
  skillTree: [
    { id: 'vida_1', name: 'Vida +20', cost: 1, req: { level: 1 }, effect: (p) => { p.maxHp += 20; p.hp = Math.min(p.hp + 20, p.maxHp); } },
    { id: 'vida_2', name: 'Vida +30', cost: 2, req: { level: 3, skill: 'vida_1' }, effect: (p) => { p.maxHp += 30; p.hp = Math.min(p.hp + 30, p.maxHp); } },
    { id: 'fuerza_1', name: 'Daño +2', cost: 1, req: { level: 2 }, effect: (p) => { p.stats.strength += 2; } },
    { id: 'fuerza_2', name: 'Daño +3', cost: 2, req: { level: 4, skill: 'fuerza_1' }, effect: (p) => { p.stats.strength += 3; } },
    { id: 'destreza_1', name: 'Destreza +2', cost: 1, req: { level: 2 }, effect: (p) => { p.stats.dexterity += 2; } },
    { id: 'doble_salto_plus', name: 'Doble salto +', cost: 2, req: { level: 5, ability: 'doubleJump' }, effect: (p) => { CONFIG.doubleJumpForce *= 1.15; } },
    { id: 'dash_plus', name: 'Dash mejorado', cost: 2, req: { level: 4, ability: 'dash' }, effect: (p) => { p.dashLevel = Math.min(3, p.dashLevel + 1); } },
    { id: 'gancho_plus', name: 'Gancho +', cost: 2, req: { level: 6, ability: 'hookGrab' }, effect: (p) => { p.grappleLevel = Math.min(3, p.grappleLevel + 1); } }
  ],
  talentsDB: [
    { id: 'golpes_contundentes', name: 'Golpes contundentes', desc: 'Generas 1 carga cada 2 golpes (antes 3)', req: { strength: 3 } },
    { id: 'grito_de_guerra', name: 'Grito de guerra', desc: 'Cura 20% HP (cuesta 3 cargas, tecla Q)', req: { strength: 5, vitality: 3 }, skill: true },
    { id: 'sed_de_sangre', name: 'Sed de sangre', desc: 'Al recibir daño generas 2 cargas', req: { strength: 4, vitality: 2 } },
    { id: 'parry_letal', name: 'Parry letal', desc: 'Parry perfecto otorga 3 cargas', req: { dexterity: 5 } },
    { id: 'disparo_doble', name: 'Disparo doble', desc: 'El arco dispara 2 proyectiles (cuesta 1 carga, Q)', req: { dexterity: 4 }, skill: true },
    { id: 'maestria_elemental', name: 'Maestría elemental', desc: 'Proyectiles elementales dejan charco', req: { intelligence: 4 } },
    { id: 'mente_clara', name: 'Mente clara', desc: 'Generas 1 carga cada 10 seg', req: { intelligence: 3 }, passive: true }
  ],
  trinkets: {
    medallon_martir: { id: 'medallon_martir', name: 'Medallón del mártir', desc: 'Al recibir daño +2 cargas y +10% resistencia' },
    reloj_arena: { id: 'reloj_arena', name: 'Reloj de arena', desc: 'Cada 8 seg generas 1 carga' }
  },
  affinityMaxBase: 30,
  affinityPerLevel: 5,
  affinityWeights: [1.0, 0.6, 0.3, 0.15],
  tagGraph: {
    fuego: ['magia', 'fisico', 'aire'],
    hielo: ['agua', 'magia'],
    rayo: ['magia', 'proyectil', 'aire'],
    veneno: ['naturaleza', 'sangre', 'sombra'],
    magia: ['fuego', 'hielo', 'rayo'],
    fisico: ['fuego', 'tierra', 'melee'],
    aire: ['fuego', 'agua', 'rayo'],
    naturaleza: ['agua', 'tierra', 'veneno'],
    sangre: ['fisico', 'veneno'],
    sombra: ['magia', 'veneno'],
    proyectil: ['rayo', 'aire'],
    melee: ['fisico', 'sangre']
  },
  allTags: ['fuego','hielo','rayo','veneno','magia','fisico','aire','naturaleza','sangre','sombra','proyectil','melee']
};

// ================================================================
//  2. INFRAESTRUCTURA
// ================================================================
class EventBus {
  constructor() { this.listeners = {}; }
  on(event, cb) { (this.listeners[event] = this.listeners[event] || []).push(cb); }
  off(event, cb) { if(this.listeners[event]) this.listeners[event] = this.listeners[event].filter(l=>l!==cb); }
  emit(event, data) { (this.listeners[event] || []).forEach(cb=>cb(data)); }
}

const Rng = {
  int(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; },
  pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; },
  chance(p) { return Math.random() < p; }
};

class Persistence {
  constructor() { this.key = 'metro_prog_v2'; }
  load() { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch(e){ return {}; } }
  save(data) { try { localStorage.setItem(this.key, JSON.stringify(data)); } catch(e){} }
  loadRoom(roomId) {
    const data = this.load();
    if (data.rooms && data.rooms[roomId]) return data.rooms[roomId];
    return null;
  }
  saveRoom(roomId, roomData) {
    const data = this.load();
    if (!data.rooms) data.rooms = {};
    data.rooms[roomId] = roomData;
    this.save(data);
  }
}

// ================================================================
//  3. SISTEMA DE AFINIDADES
// ================================================================
class AffinityService {
  static getMaxAffinity(level) {
    return CONFIG.affinityMaxBase + level * CONFIG.affinityPerLevel;
  }
  static tagDistance(tagA, tagB) {
    if (tagA === tagB) return 0;
    const graph = CONFIG.tagGraph;
    const queue = [[tagA, 0]];
    const visited = new Set([tagA]);
    while (queue.length) {
      const [current, dist] = queue.shift();
      for (const n of (graph[current] || [])) {
        if (n === tagB) return dist + 1;
        if (!visited.has(n)) { visited.add(n); queue.push([n, dist+1]); }
      }
    }
    return Infinity;
  }
  static train(skillTags, affinities, level, trainingCount) {
    const gains = {};
    const maxAff = this.getMaxAffinity(level);
    const baseMult = trainingCount < 5 ? 1.0 : trainingCount < 10 ? 0.75 : trainingCount < 15 ? 0.5 : 0.25;
    const tags = skillTags.slice(0, 4);
    for (let i = 0; i < tags.length; i++) {
      const tag = tags[i];
      const weight = CONFIG.affinityWeights[i] || 0.15;
      const current = affinities[tag] || 0;
      const relative = (maxAff - current) / maxAff;
      let gain = baseMult * weight * relative * 0.9;
      gain = Math.round(gain * 100) / 100;
      if (gain > 0.01) {
        const newVal = Math.min(maxAff, current + gain);
        const realGain = newVal - current;
        if (realGain > 0) {
          affinities[tag] = newVal;
          gains[tag] = (gains[tag] || 0) + realGain;
        }
      }
    }
    return gains;
  }
}

// ================================================================
//  4. CLASE HABILIDAD
// ================================================================
class Habilidad {
  constructor(id, name, tags, base) {
    this.id = id;
    this.name = name;
    this.tags = [...tags];
    this.base = { ...base };
    this.appliedMutators = [];
    this.level = 1;
    this.maxLevel = 3;
    this.cost = 1;
    this.icon = 'fa-circle';
    this.rarity = 'comun';
  }
  computeStats() {
    let stats = { ...this.base };
    for (const mutId of this.appliedMutators) {
      const mut = Mutators.find(m => m.id === mutId);
      if (mut) stats = mut.apply(stats, this);
    }
    return stats;
  }
  applyMutator(mutId) {
    const mut = Mutators.find(m => m.id === mutId);
    if (!mut) return;
    this.appliedMutators.push(mutId);
    if (mut.tag && this.tags.length < 4) {
      if (!this.tags.includes(mut.tag)) this.tags.push(mut.tag);
    }
  }
}

const Mutators = [
  { id: 'split', name: 'Dividir', tag: 'proyectil', description: '+1 proyectil, -20% daño',
    apply: (s) => ({ ...s, projectileCount: (s.projectileCount||0)+1, damage: Math.round((s.damage||0)*0.8) }) },
  { id: 'sangre', name: 'Sangre', tag: 'sangre', description: 'Coste a vida, +30% daño',
    apply: (s) => ({ ...s, costType: 'vida', costAmount: Math.round((s.costAmount||0)*1.2), damage: Math.round((s.damage||0)*1.3) }) },
  { id: 'veloz', name: 'Veloz', tag: 'rayo', description: '+50% vel, -10% daño',
    apply: (s) => ({ ...s, speed: Math.round((s.speed||0)*1.5), damage: Math.round((s.damage||0)*0.9) }) },
  { id: 'gigante', name: 'Gigante', tag: 'fisico', description: '+50% daño, -30% vel',
    apply: (s) => ({ ...s, damage: Math.round((s.damage||0)*1.5), speed: Math.round((s.speed||0)*0.7) }) },
  { id: 'arcano', name: 'Arcano', tag: 'magia', description: '+40% daño si mágica, +15% si no',
    apply: (s, skill) => ({ ...s, damage: Math.round((s.damage||0) * (skill.tags.includes('magia') ? 1.4 : 1.15)) }) },
  { id: 'toxina', name: 'Toxina', tag: 'veneno', description: 'Añade veneno (DoT)',
    apply: (s) => ({ ...s, poison: (s.poison||0) + 1 }) },
  { id: 'aereo', name: 'Aéreo', tag: 'aire', description: '+20% vel y empuje',
    apply: (s) => ({ ...s, speed: Math.round((s.speed||0)*1.2), knockback: ((s.knockback||0)+0.5) }) }
];

// ================================================================
//  5. SISTEMA DE CARGAS
// ================================================================
class ChargeService {
  constructor(eventBus, player) {
    this.eventBus = eventBus;
    this.player = player;
    this.hitCounter = 0;
    this.hitsNeeded = CONFIG.chargePerHit;
    eventBus.on('ENEMY_HIT', this.onEnemyHit.bind(this));
    eventBus.on('PLAYER_DAMAGED', this.onPlayerDamaged.bind(this));
    eventBus.on('PASSIVE_CHARGE', () => this.addCharge(1));
  }
  onEnemyHit({ enemy }) {
    if (!enemy.alive) return;
    const hasTalent = this.player.talents.includes('golpes_contundentes');
    const needed = hasTalent ? 2 : this.hitsNeeded;
    this.hitCounter++;
    if (this.hitCounter >= needed) {
      this.addCharge(1);
      this.hitCounter = 0;
    }
  }
  onPlayerDamaged() {
    if (this.player.talents.includes('sed_de_sangre')) {
      this.addCharge(2);
    }
    if (this.player.trinkets.some(t=>t.id==='medallon_martir')) {
      this.addCharge(2);
      this.player.damageResistance = 0.9;
      setTimeout(() => { this.player.damageResistance = 1.0; }, 2000);
    }
  }
  addCharge(amount) {
    this.player.currentCharges = Math.min(this.player.maxCharges, this.player.currentCharges + amount);
    this.eventBus.emit('CHARGES_UPDATED', { charges: this.player.currentCharges });
  }
  consumeCharge(amount) {
    if (this.player.currentCharges >= amount) {
      this.player.currentCharges -= amount;
      this.eventBus.emit('CHARGES_UPDATED', { charges: this.player.currentCharges });
      return true;
    }
    return false;
  }
}

// ================================================================
//  6. JUGADOR
// ================================================================
class Player {
  constructor(eventBus) {
    this.eventBus = eventBus;
    this.x = 120; this.y = 120;
    this.vx = 0; this.vy = 0;
    this.radius = 10;
    this.hp = 100; this.maxHp = 100;
    this.abilities = { doubleJump: false, dash: false, hookGrab: false, hookSwing: false, specialSkill: null };
    this.dashLevel = 1;
    this.grappleLevel = 1;
    this.invincible = false; this.invincibleTimer = 0;
    this.grounded = false;
    this._hasDoubleJumped = false;
    this.facingRight = true;
    this.modules = [];
    this.stats = { strength: 1, dexterity: 1, intelligence: 1, vitality: 1 };
    this.level = 1;
    this.xp = 0;
    this.xpToNext = 40;
    this.skillPoints = 1;
    this.talents = [];
    this.trinkets = [];
    this.currentCharges = 0;
    this.maxCharges = CONFIG.maxCharges;
    this.damageResistance = 1.0;
    this.skills = [];
    this.unlockedSkills = new Set();
    this.skillLevels = {};
    this.unlockedTreeNodes = new Set();
    this.affinities = {};
    this.skillUsage = {};
    this.chargeService = new ChargeService(eventBus, this);
    this.dashCooldown = 0;
    this.hookCooldown = 0;
    this.meleeCooldown = 0;
    this.projectileCooldown = 0;
    this.hookState = { active: false, anchor: null, tip: null, type: null };
    this.hookAirUses = 0;
    this.isWallStuck = false;
    this.wallDir = 0;
    this._swingVel = 0;
    this.meleeEffects = [];
    this.weaponType = 'sword';
    this._initBaseSkills();
    eventBus.on('PASSIVE_CHARGE', () => this.chargeService.addCharge(1));
    if (this.trinkets.some(t=>t.id==='reloj_arena')) {
      setInterval(() => { eventBus.emit('PASSIVE_CHARGE', {}); }, 8000);
    }
  }

  _initBaseSkills() {
    const baseTemplates = [
      { id: 'golpe', name: 'Golpe', tags: ['fisico', 'melee'], base: { damage: 10, costType: 'aguante', costAmount: 2, speed: 3, range: 20 } },
      { id: 'fuego', name: 'Fuego', tags: ['fuego', 'magia'], base: { damage: 12, costType: 'maná', costAmount: 4, speed: 4, range: 30 } },
      { id: 'hielo', name: 'Hielo', tags: ['hielo', 'magia'], base: { damage: 10, costType: 'maná', costAmount: 4, speed: 3, range: 30 } }
    ];
    for (const t of baseTemplates) {
      const skill = new Habilidad(t.id, t.name, t.tags, t.base);
      this.skills.push(skill);
      this.unlockedSkills.add(skill.id);
      this.skillLevels[skill.id] = 1;
      this.skillUsage[skill.id] = 0;
    }
  }

  getUnlockedSkills() {
    return this.skills.filter(s => this.unlockedSkills.has(s.id));
  }

  gainXP(amount) {
    this.xp += amount;
    while (this.xp >= this.xpToNext && this.level < CONFIG.maxLevel) {
      this.level++;
      this.xp -= this.xpToNext;
      this.xpToNext = Math.floor(this.xpToNext * CONFIG.xpCurveExponent);
      this.skillPoints++;
      const cycle = ['strength','dexterity','intelligence','vitality'];
      const idx = (this.level - 2) % cycle.length;
      this.stats[cycle[idx]]++;
      this.eventBus.emit('LEVEL_UP', { level: this.level });
      this.eventBus.emit('STATS_CHANGED', {});
    }
    this.eventBus.emit('XP_CHANGED', { xp: this.xp, xpToNext: this.xpToNext });
  }

  takeDamage(amount) {
    if (this.invincible) return false;
    amount = Math.ceil(amount * this.damageResistance);
    this.hp -= amount;
    this.eventBus.emit('PLAYER_DAMAGED', { amount });
    if (this.hp <= 0) { this.hp = 0; return true; }
    this.invincible = true;
    this.invincibleTimer = 1.5;
    return false;
  }

  applySkillTreeEffect(skillId) {
    const node = CONFIG.skillTree.find(n => n.id === skillId);
    if (!node) return false;
    if (this.skillPoints < node.cost) return false;
    if (node.req) {
      if (node.req.level && this.level < node.req.level) return false;
      if (node.req.ability && !this.abilities[node.req.ability]) return false;
      if (node.req.skill && !this.unlockedTreeNodes.has(node.req.skill)) return false;
    }
    this.skillPoints -= node.cost;
    if (node.effect) node.effect(this);
    this.unlockedTreeNodes.add(skillId);
    this.eventBus.emit('SKILL_UNLOCKED', { skillId });
    this.eventBus.emit('STATS_CHANGED', {});
    return true;
  }

  unlockTalent(talentId) {
    const talent = CONFIG.talentsDB.find(t => t.id === talentId);
    if (!talent || this.talents.includes(talentId)) return false;
    for (const [stat, val] of Object.entries(talent.req)) {
      if ((this.stats[stat] || 0) < val) return false;
    }
    this.talents.push(talentId);
    if (talent.id === 'grito_de_guerra') this.abilities.specialSkill = 'grito_de_guerra';
    if (talent.id === 'disparo_doble') this.abilities.specialSkill = 'disparo_doble';
    if (talent.id === 'mente_clara') {
      setInterval(() => { this.eventBus.emit('PASSIVE_CHARGE', {}); }, 10000);
    }
    this.eventBus.emit('TALENT_UNLOCKED', { talentId });
    return true;
  }

  addTrinket(trinketId) {
    if (this.trinkets.length >= 2) return false;
    const trinket = CONFIG.trinkets[trinketId];
    if (!trinket || this.trinkets.some(t=>t.id===trinketId)) return false;
    this.trinkets.push({ id: trinketId, ...trinket });
    if (trinketId === 'reloj_arena') {
      setInterval(() => { this.eventBus.emit('PASSIVE_CHARGE', {}); }, 8000);
    }
    this.eventBus.emit('TRINKET_ADDED', { trinketId });
    return true;
  }

  removeTrinket(trinketId) {
    const idx = this.trinkets.findIndex(t => t.id === trinketId);
    if (idx === -1) return false;
    this.trinkets.splice(idx, 1);
    this.eventBus.emit('TRINKET_REMOVED', { trinketId });
    return true;
  }

  // ==================== FÍSICA ====================
  update(dt, input, roomState) {
    if (!roomState) return;

    // Temporizadores
    this.dashCooldown = Math.max(0, this.dashCooldown - dt);
    this.hookCooldown = Math.max(0, this.hookCooldown - dt);
    this.meleeCooldown = Math.max(0, this.meleeCooldown - dt);
    this.projectileCooldown = Math.max(0, this.projectileCooldown - dt);
    this.invincibleTimer = Math.max(0, this.invincibleTimer - dt);
    if (this.invincibleTimer <= 0) this.invincible = false;

    // --- Movimiento horizontal (directo y fiable) ---
    const move = input.getMove();
    let targetVx = 0;
    if (move.left) targetVx = -CONFIG.moveSpeed;
    if (move.right) targetVx = CONFIG.moveSpeed;
    // Asignación directa para máxima respuesta y sin inversión
    this.vx = targetVx;

    // --- Salto (flanco de subida) ---
    const jumpJustPressed = input.wasJumpJustPressed();
    if (jumpJustPressed && this.grounded) {
      this.vy = -CONFIG.jumpForce;
      this.grounded = false;
      this._hasDoubleJumped = false;
    } else if (jumpJustPressed && this.abilities.doubleJump && !this.grounded && !this._hasDoubleJumped) {
      this.vy = -CONFIG.doubleJumpForce;
      this._hasDoubleJumped = true;
    }

    // --- Gravedad ---
    if (!this.grounded) {
      this.vy += CONFIG.gravity * dt;
      if (this.vy > 600) this.vy = 600;
    } else {
      this.vy = 0;
      this._hasDoubleJumped = false;
      this.hookAirUses = 0;
    }

    // --- Dash (flanco) ---
    if (input.wasDashJustPressed() && this.abilities.dash && this.dashCooldown <= 0) {
      const angle = this.facingRight ? 0 : Math.PI;
      const speed = CONFIG.dashBaseSpeed * (1 + (this.dashLevel - 1) * 0.3);
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.dashCooldown = CONFIG.dashCooldown / this.dashLevel;
      this.invincible = true;
      setTimeout(() => { this.invincible = false; }, CONFIG.dashDuration * 1000);
    }

    // --- Aplicar movimiento y colisiones ---
    this.y += this.vy * dt;
    this.x += this.vx * dt;
    this._resolveCollisions(roomState);

    // --- Ataques (flanco) ---
    if (input.wasMeleeJustPressed() && this.meleeCooldown <= 0) {
      this._doMelee(roomState);
      this.meleeCooldown = 0.4;
    }
    if (input.wasProjectileJustPressed() && this.projectileCooldown <= 0 && this.weaponType === 'bow') {
      this._fireProjectile(roomState, input);
      this.projectileCooldown = 0.5;
    }

    // --- Habilidad especial (Q) ---
    if (input.wasSpecialJustPressed() && this.abilities.specialSkill) {
      if (this.abilities.specialSkill === 'grito_de_guerra' && this.chargeService.consumeCharge(3)) {
        this.hp = Math.min(this.maxHp, this.hp + Math.ceil(this.maxHp * 0.2));
        this.eventBus.emit('STATS_CHANGED', {});
      } else if (this.abilities.specialSkill === 'disparo_doble' && this.chargeService.consumeCharge(1)) {
        for (let i = -1; i <= 1; i+=2) {
          const angle = this.facingRight ? i * 0.25 : Math.PI + i * 0.25;
          const mod = this.modules[0] || null;
          const elem = mod ? mod.element : 'fisico';
          const color = mod ? mod.color : '#ff0';
          const p = new Projectile(
            this.x + Math.cos(angle)*(this.radius+6), this.y + Math.sin(angle)*(this.radius+6),
            Math.cos(angle)*350, Math.sin(angle)*350,
            3 + this.stats.dexterity, elem, color, 1.5, this
          );
          roomState.playerProjectiles.push(p);
        }
      }
    }

    // --- Gancho (flanco) ---
    if (input.wasHookJustPressed() && this.hookCooldown <= 0 && !this.hookState.active) {
      const canUse = this.grounded || this.hookAirUses < 2;
      if (canUse && (this.abilities.hookGrab || this.abilities.hookSwing)) {
        const type = this.abilities.hookGrab ? 'grab' : 'swing';
        this._launchHook(type, input.getAimAngle());
        if (!this.grounded) this.hookAirUses++;
      }
    }
    if (this.hookState.tip) {
      this._updateHook(dt, roomState, input);
    }

    this.facingRight = this.vx !== 0 ? this.vx > 0 : this.facingRight;

    // Actualizar proyectiles del jugador
    for (let i=roomState.playerProjectiles.length-1; i>=0; i--) {
      const p = roomState.playerProjectiles[i];
      p.update(dt, roomState);
      if (!p.alive) roomState.playerProjectiles.splice(i,1);
    }
    this.meleeEffects = this.meleeEffects.filter(e => (e.life -= dt) > 0);
  }

  // ==================== COLISIONES ====================
  _resolveCollisions(roomState) {
    const ts = CONFIG.tileSize;
    const left = this.x - this.radius, right = this.x + this.radius;
    const top = this.y - this.radius, bottom = this.y + this.radius;
    const colL = Math.floor(left/ts), colR = Math.floor(right/ts);
    const rowT = Math.floor(top/ts), rowB = Math.floor(bottom/ts);
    this.grounded = false;

    for (let row = rowT; row <= rowB; row++) {
      for (let col = colL; col <= colR; col++) {
        if (row<0||row>=roomState.tiles.length||col<0||col>=roomState.tiles[0].length) continue;
        const tile = roomState.tiles[row][col];
        const isSolid = tile === 1 || (tile === 2 && this._isDoorClosed(roomState, col, row));
        if (isSolid) {
          const tileLeft = col*ts, tileRight = (col+1)*ts;
          const tileTop = row*ts, tileBottom = (row+1)*ts;
          const overlapX = Math.min(right - tileLeft, tileRight - left);
          const overlapY = Math.min(bottom - tileTop, tileBottom - top);
          if (overlapX > 0 && overlapY > 0) {
            if (overlapX < overlapY) {
              // Resolver eje X
              if (this.vx > 0) {
                this.x = tileLeft - this.radius;
              } else if (this.vx < 0) {
                this.x = tileRight + this.radius;
              } else {
                // Empuje mínimo según posición
                this.x += (this.x < tileLeft + ts/2) ? -overlapX : overlapX;
              }
              this.vx = 0;
            } else {
              // Resolver eje Y
              if (this.vy > 0) {
                this.y = tileTop - this.radius;
                this.grounded = true;
              } else if (this.vy < 0) {
                this.y = tileBottom + this.radius;
              } else {
                this.y += (this.y < tileTop + ts/2) ? -overlapY : overlapY;
              }
              this.vy = 0;
            }
          }
        }
      }
    }
  }

  _isDoorClosed(roomState, col, row) {
    const door = roomState.doors.find(d => d.col === col && d.row === row);
    return door && door.estado === 'cerrada';
  }

  // ==================== ATAQUES ====================
  _doMelee(roomState) {
    const mod = this.modules[0] || null;
    const element = mod ? mod.element : 'fisico';
    const color = mod ? mod.color : '#fff';
    const attackX = this.x + (this.facingRight ? 30 : -30);
    const dmg = 3 + this.stats.strength;
    this.meleeEffects.push({ x: attackX, y: this.y, color, life: 0.3 });

    const skill = this.skills.find(s => s.id === 'golpe');
    if (skill) this._trainAffinity(skill.tags, skill.id);

    for (const enemy of roomState.enemies) {
      if (!enemy.alive) continue;
      if (Math.hypot(enemy.x - attackX, enemy.y - this.y) < enemy.radius + 12) {
        let finalDmg = dmg;
        if (element === 'fuego') { enemy.status = 'quemadura'; finalDmg += 1; }
        else if (element === 'hielo') { enemy.speed *= 0.5; enemy.status = 'congelacion'; }
        enemy.hp -= finalDmg;
        if (enemy.hp <= 0) { enemy.alive = false; this.gainXP(CONFIG.baseXPPerKill); }
        this.eventBus.emit('ENEMY_HIT', { enemy });
      }
    }
  }

  _fireProjectile(roomState, input) {
    const angle = this.facingRight ? 0 : Math.PI;
    const mod = this.modules[0] || null;
    const element = mod ? mod.element : 'fisico';
    const color = mod ? mod.color : '#ff0';
    const dmg = 2 + this.stats.dexterity;

    let skillId = 'fuego';
    if (mod && mod.element === 'hielo') skillId = 'hielo';
    const skill = this.skills.find(s => s.id === skillId);
    if (skill) this._trainAffinity(skill.tags, skill.id);

    const p = new Projectile(
      this.x + Math.cos(angle)*(this.radius+6), this.y + Math.sin(angle)*(this.radius+6),
      Math.cos(angle)*350, Math.sin(angle)*350,
      dmg, element, color, 1.5, this
    );
    roomState.playerProjectiles.push(p);
  }

  _trainAffinity(tags, skillId) {
    if (!this.skillUsage[skillId]) this.skillUsage[skillId] = 0;
    this.skillUsage[skillId]++;
    const gains = AffinityService.train(tags, this.affinities, this.level, this.skillUsage[skillId]);
    if (Object.keys(gains).length > 0) {
      this.eventBus.emit('AFFINITY_GAINED', { gains });
    }
  }

  // ==================== GANCHO ====================
  _launchHook(type, angle) {
    const range = type === 'grab' ? 180 : 160;
    this.hookState.type = type;
    this.hookState.tip = {
      x: this.x + Math.cos(angle) * (this.radius + 5),
      y: this.y + Math.sin(angle) * (this.radius + 5)
    };
    this.hookState.direction = { cos: Math.cos(angle), sin: Math.sin(angle) };
    this.hookState.traveled = 0;
    this.hookState.active = true;
  }

  _updateHook(dt, roomState, input) {
    if (!this.hookState.tip) return;
    const speed = 600 * dt;
    this.hookState.tip.x += this.hookState.direction.cos * speed;
    this.hookState.tip.y += this.hookState.direction.sin * speed;
    this.hookState.traveled += speed;

    const col = Math.floor(this.hookState.tip.x / CONFIG.tileSize);
    const row = Math.floor(this.hookState.tip.y / CONFIG.tileSize);
    const maxRange = this.hookState.type === 'grab' ? 180 : 160;
    const tiles = roomState.tiles;

    if (row >= 0 && row < tiles.length && col >= 0 && col < tiles[0].length) {
      const tile = tiles[row][col];
      const canGrapple = (tile === CONFIG.grappleTileBasic && this.grappleLevel >= 1) ||
                         (tile === CONFIG.grappleTileAdvanced && this.grappleLevel >= 2) ||
                         (tile === CONFIG.grappleTileMaster && this.grappleLevel >= 3);

      if (canGrapple) {
        this.hookState.anchor = {
          x: col * CONFIG.tileSize + CONFIG.tileSize/2,
          y: row * CONFIG.tileSize + CONFIG.tileSize/2
        };
        this.hookState.tip = null;
        this.hookCooldown = this.hookState.type === 'grab' ? 2.0 : 2.0;
        this.hookState.active = true;

        if (this.hookState.type === 'grab') {
          const dx = this.hookState.anchor.x - this.x;
          const dy = this.hookState.anchor.y - this.y;
          const dist = Math.hypot(dx, dy);
          if (dist > 5) {
            this.vx = (dx / dist) * 400;
            this.vy = (dy / dist) * 400;
          }
          setTimeout(() => { this.hookState.active = false; }, 300);
        } else if (this.hookState.type === 'swing') {
          this._swingVel = 0;
        }
        return;
      } else if (tile === 1 || this.hookState.traveled >= maxRange) {
        this.hookState.tip = null;
        this.hookState.active = false;
        this.hookCooldown = this.hookState.type === 'grab' ? 2.0 : 2.0;
      }
    } else if (this.hookState.traveled >= maxRange) {
      this.hookState.tip = null;
      this.hookState.active = false;
      this.hookCooldown = this.hookState.type === 'grab' ? 2.0 : 2.0;
    }

    if (this.hookState.type === 'swing' && this.hookState.anchor) {
      const dx = this.x - this.hookState.anchor.x;
      const dy = this.y - this.hookState.anchor.y;
      const length = Math.hypot(dx, dy);
      if (length > 5) {
        const angle = Math.atan2(dy, dx);
        const gravityTangential = CONFIG.gravity * Math.sin(angle) * 0.5;
        this._swingVel += gravityTangential * dt;
        const m = input.getMove();
        if (m.left) this._swingVel -= 500 * dt;
        if (m.right) this._swingVel += 500 * dt;
        this._swingVel *= 0.99;
        const perpX = -Math.sin(angle);
        const perpY = Math.cos(angle);
        this.vx = this._swingVel * perpX;
        this.vy = this._swingVel * perpY;
        const currentDist = Math.hypot(this.x - this.hookState.anchor.x, this.y - this.hookState.anchor.y);
        if (currentDist > 1) {
          this.x = this.hookState.anchor.x + (dx / currentDist) * length;
          this.y = this.hookState.anchor.y + (dy / currentDist) * length;
        }
      }
    }
  }
}

// ================================================================
//  7. PROYECTIL
// ================================================================
class Projectile {
  constructor(x, y, vx, vy, damage, element, color, lifetime, owner) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.damage = damage; this.element = element; this.color = color;
    this.radius = 4; this.alive = true; this.life = lifetime;
    this.owner = owner;
    this.isEnemy = false;
  }
  update(dt, roomState) {
    this.x += this.vx * dt; this.y += this.vy * dt;
    this.life -= dt;
    if (this.life <= 0) { this.alive = false; return; }
    const col = Math.floor(this.x/CONFIG.tileSize), row = Math.floor(this.y/CONFIG.tileSize);
    if (row<0||row>=roomState.tiles.length||col<0||col>=roomState.tiles[0].length) { this.alive = false; return; }
    if (roomState.tiles[row][col] === 1) this.alive = false;
    if (!this.isEnemy) {
      for (const enemy of roomState.enemies) {
        if (!enemy.alive) continue;
        if (Math.hypot(this.x-enemy.x, this.y-enemy.y) < this.radius+enemy.radius) {
          enemy.hp -= this.damage;
          if (this.element === 'fuego') enemy.status = 'quemadura';
          else if (this.element === 'hielo') { enemy.speed *= 0.5; enemy.status = 'congelacion'; }
          this.alive = false;
          if (enemy.hp <= 0) { enemy.alive = false; if (this.owner) this.owner.gainXP(CONFIG.baseXPPerKill); }
          if (this.owner) this.owner.eventBus.emit('ENEMY_HIT', { enemy });
          break;
        }
      }
    }
  }
}

// ================================================================
//  8. ENEMIGO
// ================================================================
class Enemy {
  constructor(x, y, type='chase', data={}) {
    this.x = x; this.y = y; this.radius = data.radius || 12;
    this.hp = data.hp || CONFIG.enemyDefaultHp; this.maxHp = this.hp;
    this.damage = data.damage || CONFIG.enemyDefaultDamage;
    this.speed = data.speed || CONFIG.enemyDefaultSpeed;
    this.alive = true; this.type = type;
    this.color = data.color || '#f00';
    this.status = null;
    this.isBoss = data.isBoss || false;
    this.pattern = data.pattern || null;
    this.phaseIndex = 0;
    this.attackTimer = 0;
    this.currentPhaseAttacks = [];
    this.vx = 0; this.vy = 0;
    this._dropped = false;
  }

  update(dt, player, roomState) {
    if (!this.alive) return;
    if (this.isBoss && this.pattern) {
      this._updateBossAI(dt, player, roomState);
      return;
    }
    const dx = player.x - this.x, dy = player.y - this.y;
    const dist = Math.hypot(dx, dy);
    if (dist > 5) {
      this.vx = (dx/dist) * this.speed;
      this.vy = (dy/dist) * this.speed;
      this.x += this.vx * dt;
      this.y += this.vy * dt;
    }
    for (const other of roomState.enemies) {
      if (other === this || !other.alive) continue;
      const ddx = this.x - other.x, ddy = this.y - other.y;
      const d = Math.hypot(ddx, ddy);
      const minDist = this.radius + other.radius;
      if (d < minDist && d > 0) {
        const force = (minDist - d) * 0.5;
        this.x += (ddx/d) * force * dt;
        this.y += (ddy/d) * force * dt;
      }
    }
    this._collideWithTiles(roomState);
  }

  _collideWithTiles(roomState) {
    const ts = CONFIG.tileSize;
    const left = this.x - this.radius, right = this.x + this.radius;
    const top = this.y - this.radius, bottom = this.y + this.radius;
    for (let row = Math.floor(top/ts); row <= Math.floor(bottom/ts); row++) {
      for (let col = Math.floor(left/ts); col <= Math.floor(right/ts); col++) {
        if (row<0||row>=roomState.tiles.length||col<0||col>=roomState.tiles[0].length) continue;
        if (roomState.tiles[row][col] === 1 || (roomState.tiles[row][col] === 2 && this._isDoorClosed(roomState, col, row))) {
          const tileLeft = col*ts, tileRight = (col+1)*ts;
          const tileTop = row*ts, tileBottom = (row+1)*ts;
          const overlapX = Math.min(right - tileLeft, tileRight - left);
          const overlapY = Math.min(bottom - tileTop, tileBottom - top);
          if (overlapX > 0 && overlapY > 0) {
            if (overlapX < overlapY) {
              this.x += (this.x < tileLeft + ts/2) ? -overlapX : overlapX;
              this.vx = 0;
            } else {
              this.y += (this.y < tileTop + ts/2) ? -overlapY : overlapY;
              this.vy = 0;
            }
          }
        }
      }
    }
  }

  _isDoorClosed(roomState, col, row) {
    const door = roomState.doors.find(d => d.col === col && d.row === row);
    return door && door.estado === 'cerrada';
  }

  _updateBossAI(dt, player, roomState) {
    if (!this.pattern) return;
    let newPhaseIdx = 0;
    for (let i=0; i<this.pattern.length; i++) {
      if (this.hp/this.maxHp <= (this.pattern[i].hpThreshold || 1.0)) newPhaseIdx = i;
    }
    if (newPhaseIdx !== this.phaseIndex) {
      this.phaseIndex = newPhaseIdx;
      this.attackTimer = 0;
      this.currentPhaseAttacks = [...(this.pattern[this.phaseIndex].attacks || [])];
    }
    if (this.currentPhaseAttacks.length === 0) return;
    this.attackTimer -= dt;
    if (this.attackTimer <= 0) {
      const attack = this.currentPhaseAttacks[Rng.int(0, this.currentPhaseAttacks.length-1)];
      this._executeBossAttack(attack, player, roomState);
      this.attackTimer = (attack.cooldown || 2.0) + (Math.random() * 0.5);
    }
    this.x += Math.sin(performance.now()*0.001) * 20 * dt;
  }

  _executeBossAttack(attack, player, roomState) {
    if (attack.type === 'spread') {
      const count = attack.count || 6;
      const angleStep = (Math.PI * 2) / count;
      for (let i=0; i<count; i++) {
        const angle = angleStep * i + Math.random()*0.3;
        const speed = attack.speed || 200;
        const p = new Projectile(
          this.x, this.y,
          Math.cos(angle)*speed, Math.sin(angle)*speed,
          this.damage, 'fisico', attack.color || '#f0f', 3.0, null
        );
        p.isEnemy = true;
        if (!roomState.enemyProjectiles) roomState.enemyProjectiles = [];
        roomState.enemyProjectiles.push(p);
      }
    } else if (attack.type === 'charge') {
      const dx = player.x - this.x, dy = player.y - this.y;
      const dist = Math.hypot(dx, dy) || 1;
      this.vx = (dx/dist) * attack.speedMultiplier * 100;
      this.vy = (dy/dist) * attack.speedMultiplier * 100;
      setTimeout(() => { this.vx = 0; this.vy = 0; }, 500);
    }
  }
}

// ================================================================
//  9. SALAS Y MAPA
// ================================================================
class RoomState {
  constructor(id, tiles, doors, enemies, objects, widthTiles, heightTiles) {
    this.id = id;
    this.tiles = tiles;
    this.doors = doors;
    this.enemies = enemies;
    this.objects = objects;
    this.playerProjectiles = [];
    this.enemyProjectiles = [];
    this.drops = [];
    this.visited = false;
    this.width = widthTiles * CONFIG.tileSize;
    this.height = heightTiles * CONFIG.tileSize;
    this.waveConfig = null;
    this.waveState = null;
  }
}

// ================================================================
//  10. RENDERER Y INPUT
// ================================================================
class CanvasRenderer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
  }
  clear() { this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height); }

  drawRoom(roomState, player, camera) {
    const ctx = this.ctx;
    const {x:cx, y:cy} = camera;
    const ts = CONFIG.tileSize;

    for (let row=0; row<roomState.tiles.length; row++) {
      for (let col=0; col<roomState.tiles[row].length; col++) {
        const tile = roomState.tiles[row][col];
        const x = col*ts - cx, y = row*ts - cy;
        if (tile === 1) {
          ctx.fillStyle = '#2a2a4a'; ctx.fillRect(x, y, ts, ts);
          ctx.strokeStyle = '#1a1a2a'; ctx.strokeRect(x, y, ts, ts);
        } else if (tile === 2) {
          const door = roomState.doors.find(d=>d.col===col&&d.row===row);
          ctx.fillStyle = door && door.estado === 'abierta' ? '#0f0' : '#f00';
          ctx.fillRect(x, y, ts, ts);
          ctx.fillStyle = '#fff';
          ctx.font = '10px monospace';
          ctx.fillText('F', x+4, y+14);
        } else if (tile >= 3 && tile <= 5) {
          const colors = ['#a0522d','#8b4513','#654321'];
          const labels = ['G1','G2','G3'];
          ctx.fillStyle = colors[tile-3]; ctx.fillRect(x, y, ts, ts);
          ctx.fillStyle = '#fff'; ctx.font = '10px monospace'; ctx.fillText(labels[tile-3], x+2, y+14);
        }
      }
    }

    for (const enemy of roomState.enemies) {
      if (!enemy.alive) continue;
      ctx.fillStyle = enemy.color || '#f00';
      ctx.beginPath(); ctx.arc(enemy.x - cx, enemy.y - cy, enemy.radius, 0, Math.PI*2); ctx.fill();
      const hpPct = enemy.hp / enemy.maxHp;
      ctx.fillStyle = '#000'; ctx.fillRect(enemy.x-cx-10, enemy.y-cy-enemy.radius-6, 20, 3);
      ctx.fillStyle = hpPct > 0.5 ? '#0f0' : '#f00';
      ctx.fillRect(enemy.x-cx-10, enemy.y-cy-enemy.radius-6, 20*hpPct, 3);
      if (enemy.isBoss) {
        ctx.fillStyle = '#ff0'; ctx.font = 'bold 12px monospace';
        ctx.fillText('BOSS', enemy.x-cx-15, enemy.y-cy-enemy.radius-12);
      }
    }

    if (roomState.drops) {
      for (const drop of roomState.drops) {
        if (!drop.alive) continue;
        ctx.fillStyle = drop.color; ctx.fillRect(drop.x-cx-6, drop.y-cy-6, 12, 12);
      }
    }

    for (const obj of roomState.objects) {
      if (obj.collected) continue;
      ctx.fillStyle = obj.color; ctx.fillRect(obj.x-cx-8, obj.y-cy-8, 16, 16);
    }

    for (const p of roomState.playerProjectiles) {
      if (!p.alive) continue;
      ctx.fillStyle = p.color || '#ff0';
      ctx.beginPath(); ctx.arc(p.x-cx, p.y-cy, p.radius, 0, Math.PI*2); ctx.fill();
    }
    for (const p of (roomState.enemyProjectiles || [])) {
      if (!p.alive) continue;
      ctx.fillStyle = p.color || '#f0f';
      ctx.beginPath(); ctx.arc(p.x-cx, p.y-cy, p.radius, 0, Math.PI*2); ctx.fill();
    }

    if (player.hookState && player.hookState.active && player.hookState.anchor) {
      ctx.beginPath(); ctx.strokeStyle = '#888'; ctx.lineWidth = 2;
      ctx.moveTo(player.x-cx, player.y-cy);
      ctx.lineTo(player.hookState.anchor.x-cx, player.hookState.anchor.y-cy);
      ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(player.hookState.anchor.x-cx, player.hookState.anchor.y-cy, 4, 0, Math.PI*2); ctx.fill();
    }

    ctx.fillStyle = player.invincible ? 'rgba(255,255,0,0.5)' : '#ffd700';
    ctx.beginPath(); ctx.arc(player.x-cx, player.y-cy, player.radius, 0, Math.PI*2); ctx.fill();
    if (player.modules.length > 0) {
      const mod = player.modules[0];
      ctx.fillStyle = mod.color; ctx.beginPath(); ctx.arc(player.x-cx+14, player.y-cy-14, 5, 0, Math.PI*2); ctx.fill();
    }
    for (const eff of player.meleeEffects) {
      ctx.save(); ctx.globalAlpha = eff.life*3; ctx.fillStyle = eff.color;
      ctx.beginPath(); ctx.arc(eff.x-cx, eff.y-cy, 14, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }

    for (const door of roomState.doors) {
      if (door.estado === 'abierta') {
        const dx = door.col*ts + ts/2 - cx;
        const dy = door.row*ts + ts/2 - cy;
        const dist = Math.hypot(player.x - door.col*ts - ts/2, player.y - door.row*ts - ts/2);
        if (dist < ts + 10) {
          ctx.fillStyle = '#0f0';
          ctx.font = 'bold 14px monospace';
          ctx.textAlign = 'center';
          ctx.fillText('PRESIONA F', dx, dy - 20);
        }
      }
    }
  }

  drawUI(player, gameState) {
    const ctx = this.ctx;
    ctx.fillStyle = '#fff'; ctx.font = '12px monospace'; ctx.textAlign = 'left';
    ctx.fillText(`HP: ${'♥'.repeat(Math.ceil(player.hp/20))} ${player.hp}/${player.maxHp}`, 16, 22);
    ctx.fillText(`Nv.${player.level} XP: ${player.xp}/${player.xpToNext}`, 16, 42);
    ctx.fillText(`Puntos: ${player.skillPoints}  Cargas: ${player.currentCharges}/${player.maxCharges}`, 16, 62);
    const abilities = [];
    if (player.abilities.doubleJump) abilities.push('Doble salto');
    if (player.abilities.dash) abilities.push('Dash');
    if (player.abilities.hookGrab) abilities.push('Gancho');
    ctx.fillText(`Habs: ${abilities.join(', ') || 'ninguna'}`, 16, 82);
    ctx.fillText(`FUE:${player.stats.strength} DES:${player.stats.dexterity} INT:${player.stats.intelligence} VIT:${player.stats.vitality}`, 16, 102);
    ctx.fillStyle = '#888'; ctx.font = '10px monospace';
    ctx.fillText(`[Tab] menú  [WASD] mover  [Espacio] saltar  [Shift] dash  [E] gancho  [J] melee  [K] proyectil  [Q] especial`, 16, this.canvas.height-12);
  }
}

// ================================================================
//  11. INPUT MEJORADO (CON BUFFER DE FLANCOS)
// ================================================================
class WebInput {
  constructor(canvas) {
    this.canvas = canvas;
    this.keys = {};          // estado continuo de teclas
    this.justPressed = {};   // teclas presionadas desde el último frame
    this.mouse = { x:0, y:0 };
    this._bind();
  }
  _bind() {
    document.addEventListener('keydown', e => {
      const key = e.key.toLowerCase();
      if (!this.keys[key]) {
        this.justPressed[key] = true;  // solo en flanco de subida
      }
      this.keys[key] = true;
      if ([' ', 'shift','arrowup','arrowdown','arrowleft','arrowright','j','k','e','q','f','tab'].includes(key))
        e.preventDefault();
    });
    document.addEventListener('keyup', e => {
      this.keys[e.key.toLowerCase()] = false;
    });
    this.canvas.addEventListener('mousemove', e => {
      const rect = this.canvas.getBoundingClientRect();
      this.mouse.x = (e.clientX - rect.left) * (this.canvas.width / rect.width);
      this.mouse.y = (e.clientY - rect.top) * (this.canvas.height / rect.height);
    });
  }
  // Limpiar justPressed al final del frame
  update() {
    this.justPressed = {};
  }
  isKeyDown(key) { return this.keys[key] || false; }
  wasKeyJustPressed(key) { return this.justPressed[key] || false; }
  getMove() {
    return {
      left: this.keys['a'] || this.keys['arrowleft'],
      right: this.keys['d'] || this.keys['arrowright'],
      up: this.keys['w'] || this.keys['arrowup'],
      down: this.keys['s'] || this.keys['arrowdown']
    };
  }
  wasJumpJustPressed() { return this.wasKeyJustPressed(' ') || this.wasKeyJustPressed('space'); }
  wasDashJustPressed() { return this.wasKeyJustPressed('shift'); }
  wasMeleeJustPressed() { return this.wasKeyJustPressed('j'); }
  wasProjectileJustPressed() { return this.wasKeyJustPressed('k'); }
  wasInteractJustPressed() { return this.wasKeyJustPressed('f'); }
  wasHookJustPressed() { return this.wasKeyJustPressed('e'); }
  wasSpecialJustPressed() { return this.wasKeyJustPressed('q'); }
  getAimAngle() {
    const cx = this.canvas.width/2, cy = this.canvas.height/2;
    return Math.atan2(this.mouse.y - cy, this.mouse.x - cx);
  }
}

// ================================================================
//  12. TOASTS
// ================================================================
function showToast(msg, type='info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(40px)';
    setTimeout(() => toast.remove(), 300);
  }, 3500);
}

// ================================================================
//  13. GAME (ORQUESTADOR)
// ================================================================
class Game {
  constructor(canvas, input, renderer, persistence) {
    this.canvas = canvas;
    this.input = input;
    this.renderer = renderer;
    this.persistence = persistence;
    this.eventBus = new EventBus();
    this.player = new Player(this.eventBus);
    this.mapGraph = new Map();
    this.currentRoomId = null;
    this.currentRoomState = null;
    this._prevRoomId = null;
    this.camera = { x:0, y:0 };
    this.paused = false;
    this._lastTime = 0;

    this._loadPlayerData();
    this._buildRooms();
    this._switchRoom(CONFIG.startRoomId);
    this._initMenu();
    this._bindEvents();
    this._lastTime = performance.now();
    this._loop();
  }

  _loadPlayerData() {
    const data = this.persistence.load();
    if (data.player) {
      const p = data.player;
      if (p.level) this.player.level = p.level;
      if (p.xp) this.player.xp = p.xp;
      if (p.xpToNext) this.player.xpToNext = p.xpToNext;
      if (p.skillPoints !== undefined) this.player.skillPoints = p.skillPoints;
      if (p.stats) Object.assign(this.player.stats, p.stats);
      if (p.abilities) Object.assign(this.player.abilities, p.abilities);
      if (p.modules) this.player.modules = p.modules;
      if (p.talents) this.player.talents = p.talents;
      if (p.trinkets) this.player.trinkets = p.trinkets;
      if (p.skills) {
        this.player.skills = p.skills.map(s => {
          const skill = new Habilidad(s.id, s.name, s.tags, s.base);
          skill.appliedMutators = s.appliedMutators || [];
          skill.level = s.level || 1;
          skill.maxLevel = s.maxLevel || 3;
          return skill;
        });
        this.player.unlockedSkills = new Set(p.unlockedSkills || []);
        this.player.skillLevels = p.skillLevels || {};
      }
      if (p.unlockedTreeNodes) this.player.unlockedTreeNodes = new Set(p.unlockedTreeNodes);
      if (p.dashLevel !== undefined) this.player.dashLevel = p.dashLevel;
      if (p.grappleLevel !== undefined) this.player.grappleLevel = p.grappleLevel;
      if (p.hp !== undefined) this.player.hp = p.hp;
      if (p.maxHp !== undefined) this.player.maxHp = p.maxHp;
      if (p.currentCharges !== undefined) this.player.currentCharges = p.currentCharges;
      if (p.affinities) this.player.affinities = p.affinities;
      if (p.skillUsage) this.player.skillUsage = p.skillUsage;
    }
  }

  _savePlayerData() {
    const p = this.player;
    this.persistence.save({
      player: {
        level: p.level,
        xp: p.xp,
        xpToNext: p.xpToNext,
        skillPoints: p.skillPoints,
        stats: p.stats,
        abilities: p.abilities,
        modules: p.modules,
        talents: p.talents,
        trinkets: p.trinkets,
        skills: p.skills.map(s => ({ id:s.id, name:s.name, tags:s.tags, base:s.base, appliedMutators:s.appliedMutators, level:s.level, maxLevel:s.maxLevel })),
        unlockedSkills: [...p.unlockedSkills],
        skillLevels: p.skillLevels,
        unlockedTreeNodes: [...p.unlockedTreeNodes],
        dashLevel: p.dashLevel,
        grappleLevel: p.grappleLevel,
        hp: p.hp,
        maxHp: p.maxHp,
        currentCharges: p.currentCharges,
        affinities: p.affinities,
        skillUsage: p.skillUsage
      }
    });
  }

  _buildRooms() {
    // ===== SALA 0,0 (inicial) =====
    const tiles00 = new Array(15).fill().map(() => new Array(20).fill(0));
    for (let r=0; r<15; r++) { tiles00[r][0]=1; tiles00[r][19]=1; }
    for (let c=0; c<20; c++) { tiles00[0][c]=1; tiles00[14][c]=1; }
    // Plataforma para acceder a la puerta
    tiles00[11][16] = 1; tiles00[11][17] = 1; tiles00[11][18] = 1;
    tiles00[7][18] = 2; // puerta interior
    tiles00[5][7] = CONFIG.grappleTileBasic;

    const room00 = new RoomState('0,0', tiles00,
      [{col:18, row:7, targetRoomId:'1,0', requiredSkill:null, estado:'abierta'}],
      [],
      [{x:200,y:200,type:'module',collected:false,color:'#f60',moduleData:{element:'fuego',name:'Fuego',color:'#f60'}}],
      20,15);
    this.mapGraph.set('0,0', room00);

    // ===== SALA 1,0 =====
    const tiles10 = new Array(15).fill().map(() => new Array(20).fill(0));
    for (let r=0; r<15; r++) { tiles10[r][0]=1; tiles10[r][19]=1; }
    for (let c=0; c<20; c++) { tiles10[0][c]=1; tiles10[14][c]=1; }
    tiles10[7][1] = 2;
    tiles10[7][18] = 2;
    tiles10[9][10] = 1; tiles10[9][11] = 1; tiles10[9][12] = 1;
    tiles10[3][10] = CONFIG.grappleTileAdvanced;

    const room10 = new RoomState('1,0', tiles10,
      [
        {col:1, row:7, targetRoomId:'0,0', requiredSkill:null, estado:'abierta'},
        {col:18, row:7, targetRoomId:'2,0', requiredSkill:null, estado:'abierta'}
      ],
      [new Enemy(300,300,'chase',{hp:4,damage:1,speed:50,color:'#f60'}),
       new Enemy(500,300,'chase',{hp:4,damage:1,speed:50,color:'#6cf'})],
      [{x:400,y:200,type:'ability',ability:'doubleJump',collected:false,color:'#0ff'}],
      20,15);
    this.mapGraph.set('1,0', room10);

    // ===== SALA 2,0 (oleadas + jefe) =====
    const tiles20 = new Array(18).fill().map(() => new Array(24).fill(0));
    for (let r=0; r<18; r++) { tiles20[r][0]=1; tiles20[r][23]=1; }
    for (let c=0; c<24; c++) { tiles20[0][c]=1; tiles20[17][c]=1; }
    tiles20[9][1] = 2;
    tiles20[9][12] = CONFIG.grappleTileMaster;

    const bossPattern = [
      { hpThreshold: 1.0, attacks: [{ type: 'spread', count: 6, speed: 150, cooldown: 2.5, color: '#f0f' }] },
      { hpThreshold: 0.5, attacks: [{ type: 'spread', count: 10, speed: 180, cooldown: 2.0, color: '#f0f' }] }
    ];

    const room20 = new RoomState('2,0', tiles20,
      [{col:1, row:9, targetRoomId:'1,0', requiredSkill:null, estado:'abierta'}],
      [],
      [],
      24,18);
    room20.waveConfig = {
      waves: [
        { count: 3, type: 'chase', hp: 3, damage: 1, speed: 50, color: '#f60', delay: 0.8 },
        { count: 4, type: 'chase', hp: 4, damage: 1, speed: 60, color: '#6cf', delay: 0.7 },
        { count: 2, type: 'chase', hp: 5, damage: 2, speed: 70, color: '#ff0', delay: 1.0 }
      ],
      currentWave: 0,
      spawnTimer: 0,
      enemiesSpawned: 0,
      waveActive: false,
      allDone: false,
      spawned: [],
      waveDelay: 0.5
    };
    this.mapGraph.set('2,0', room20);

    // ===== SALA 3,0 =====
    const tiles30 = new Array(15).fill().map(() => new Array(20).fill(0));
    for (let r=0; r<15; r++) { tiles30[r][0]=1; tiles30[r][19]=1; }
    for (let c=0; c<20; c++) { tiles30[0][c]=1; tiles30[14][c]=1; }
    tiles30[7][1] = 2;
    tiles30[7][18] = 2;

    const room30 = new RoomState('3,0', tiles30,
      [
        {col:1, row:7, targetRoomId:'0,0', requiredSkill:null, estado:'abierta'},
        {col:18, row:7, targetRoomId:'4,0', requiredSkill:'vida_1', estado:'cerrada'}
      ],
      [new Enemy(400,300,'chase',{hp:6,damage:2,speed:40,color:'#ff0'})],
      [{x:200,y:200,type:'module',collected:false,color:'#6f6',moduleData:{element:'veneno',name:'Veneno',color:'#6f6'}}],
      20,15);
    this.mapGraph.set('3,0', room30);

    // ===== SALA 4,0 =====
    const tiles40 = new Array(12).fill().map(() => new Array(16).fill(0));
    for (let r=0; r<12; r++) { tiles40[r][0]=1; tiles40[r][15]=1; }
    for (let c=0; c<16; c++) { tiles40[0][c]=1; tiles40[11][c]=1; }
    tiles40[5][1] = 2;

    const room40 = new RoomState('4,0', tiles40,
      [{col:1, row:5, targetRoomId:'3,0', requiredSkill:null, estado:'abierta'}],
      [],
      [{x:200,y:150,type:'ability',ability:'dash',collected:false,color:'#ff0'}],
      16,12);
    this.mapGraph.set('4,0', room40);
  }

  _switchRoom(roomId) {
    if (this.currentRoomState) {
      this.persistence.saveRoom(this.currentRoomId, {
        enemies: this.currentRoomState.enemies.map(e => ({ x:e.x, y:e.y, hp:e.hp, maxHp:e.maxHp, alive:e.alive, type:e.type, damage:e.damage, speed:e.speed, color:e.color, isBoss:e.isBoss, pattern:e.pattern, radius:e.radius })),
        objects: this.currentRoomState.objects.map(o => ({ ...o })),
        drops: (this.currentRoomState.drops || []).map(d => ({ ...d })),
        visited: true
      });
    }
    this._prevRoomId = this.currentRoomId;
    this.currentRoomId = roomId;
    const saved = this.persistence.loadRoom(roomId);
    const template = this.mapGraph.get(roomId);
    if (!template) return;

    if (saved) {
      const enemies = saved.enemies.map(e => new Enemy(e.x, e.y, e.type, { hp:e.hp, damage:e.damage, speed:e.speed, color:e.color, isBoss:e.isBoss, pattern:e.pattern, radius:e.radius }));
      this.currentRoomState = new RoomState(template.id, template.tiles.map(r=>[...r]), template.doors.map(d=>({...d})), enemies, saved.objects.map(o=>({...o})), template.width/CONFIG.tileSize, template.height/CONFIG.tileSize);
      this.currentRoomState.drops = saved.drops || [];
      this.currentRoomState.visited = true;
    } else {
      this.currentRoomState = new RoomState(template.id, template.tiles.map(r=>[...r]), template.doors.map(d=>({...d})), template.enemies.map(e=>new Enemy(e.x,e.y,e.type,{hp:e.hp,damage:e.damage,speed:e.speed,color:e.color,isBoss:e.isBoss,pattern:e.pattern,radius:e.radius})), template.objects.map(o=>({...o})), template.width/CONFIG.tileSize, template.height/CONFIG.tileSize);
      this.currentRoomState.drops = [];
      this.currentRoomState.visited = true;
    }
    if (template.waveConfig) {
      this.currentRoomState.waveConfig = JSON.parse(JSON.stringify(template.waveConfig));
      this.currentRoomState.waveState = {
        currentWave: 0,
        spawnTimer: 0,
        enemiesSpawned: 0,
        waveActive: false,
        allDone: false,
        spawned: [],
        waveDelay: 0.5
      };
    }

    const entryDoor = this.currentRoomState.doors.find(d => d.targetRoomId === this._prevRoomId);
    if (entryDoor) {
      const doorWorldX = entryDoor.col * CONFIG.tileSize + CONFIG.tileSize/2;
      const doorWorldY = entryDoor.row * CONFIG.tileSize + CONFIG.tileSize/2;
      const inwardX = entryDoor.col < this.currentRoomState.width/2 ? CONFIG.tileSize : -CONFIG.tileSize;
      this.player.x = doorWorldX + inwardX;
      this.player.y = doorWorldY;
    } else {
      this.player.x = this.currentRoomState.width/2;
      this.player.y = this.currentRoomState.height/2;
    }
    this.player.x = Math.max(this.player.radius, Math.min(this.player.x, this.currentRoomState.width - this.player.radius));
    this.player.y = Math.max(this.player.radius, Math.min(this.player.y, this.currentRoomState.height - this.player.radius));
    this.player.vx = 0; this.player.vy = 0;
    this._clampCamera();
    this.eventBus.emit('ROOM_CHANGED', { roomId });
  }

  _clampCamera() {
    if (!this.currentRoomState) return;
    const w = this.currentRoomState.width, h = this.currentRoomState.height;
    const cw = this.canvas.width, ch = this.canvas.height;
    let cx = this.player.x - cw/2, cy = this.player.y - ch/2;
    cx = Math.max(0, Math.min(cx, w - cw));
    cy = Math.max(0, Math.min(cy, h - ch));
    if (w < cw) cx = -(cw - w)/2;
    if (h < ch) cy = -(ch - h)/2;
    this.camera.x = cx; this.camera.y = cy;
  }

  _checkDoors() {
    if (!this.currentRoomState) return;
    for (const door of this.currentRoomState.doors) {
      if (door.estado === 'cerrada' && door.requiredSkill) {
        if (this.player.unlockedTreeNodes.has(door.requiredSkill)) {
          door.estado = 'abierta';
          showToast(`🚪 Puerta abierta (${door.requiredSkill})`, 'success');
          this._savePlayerData();
        }
      }
      if (door.estado === 'abierta') {
        const dx = door.col*CONFIG.tileSize + CONFIG.tileSize/2;
        const dy = door.row*CONFIG.tileSize + CONFIG.tileSize/2;
        if (Math.hypot(this.player.x - dx, this.player.y - dy) < CONFIG.tileSize/2 + this.player.radius) {
          if (this.input.wasInteractJustPressed()) {
            this._switchRoom(door.targetRoomId);
            return;
          }
        }
      }
    }
  }

  _handleWaves(dt) {
    if (!this.currentRoomState || !this.currentRoomState.waveConfig) return;
    const wc = this.currentRoomState.waveConfig;
    const ws = this.currentRoomState.waveState;
    if (!ws || ws.allDone) return;

    const aliveNonBoss = this.currentRoomState.enemies.filter(e => e.alive && !e.isBoss).length;
    if (ws.waveActive && aliveNonBoss === 0 && ws.enemiesSpawned > 0) {
      ws.waveActive = false;
      ws.currentWave++;
      if (ws.currentWave >= wc.waves.length) {
        ws.allDone = true;
        const boss = new Enemy(400, 200, 'chase', {
          hp: 18, damage: 2, speed: 0, color: '#f0f', radius: 20,
          isBoss: true, pattern: [
            { hpThreshold: 1.0, attacks: [{ type: 'spread', count: 6, speed: 150, cooldown: 2.5, color: '#f0f' }] },
            { hpThreshold: 0.5, attacks: [{ type: 'spread', count: 10, speed: 180, cooldown: 2.0, color: '#f0f' }] }
          ]
        });
        this.currentRoomState.enemies.push(boss);
        showToast('👑 ¡Jefe aparece!', 'warn');
        this._savePlayerData();
        return;
      }
    }

    if (ws.allDone) return;

    if (!ws.waveActive) {
      ws.waveDelay -= dt;
      if (ws.waveDelay <= 0) {
        ws.waveActive = true;
        ws.enemiesSpawned = 0;
        ws.spawnTimer = 0;
        ws.waveDelay = 0.5;
      }
      return;
    }

    const wave = wc.waves[ws.currentWave];
    if (!wave) return;
    ws.spawnTimer += dt;
    if (ws.spawnTimer >= wave.delay && ws.enemiesSpawned < wave.count) {
      ws.spawnTimer = 0;
      const x = 100 + Math.random() * (this.currentRoomState.width - 200);
      const y = 100 + Math.random() * (this.currentRoomState.height - 200);
      const enemy = new Enemy(x, y, wave.type, {
        hp: wave.hp, damage: wave.damage, speed: wave.speed, color: wave.color
      });
      this.currentRoomState.enemies.push(enemy);
      ws.enemiesSpawned++;
    }
  }

  _bindEvents() {
    this.eventBus.on('OBJECT_COLLECTED', ({object}) => {
      if (object.type === 'module' && object.moduleData) {
        this.player.modules.push(object.moduleData);
        showToast(`🧩 Módulo ${object.moduleData.name} equipado`, 'success');
        this._savePlayerData();
      } else if (object.type === 'ability') {
        this.player.abilities[object.ability] = true;
        showToast(`🌟 Habilidad ${object.ability} desbloqueada`, 'success');
        this._savePlayerData();
      }
    });
    this.eventBus.on('ENEMY_HIT', ({enemy}) => {
      if (!enemy.alive) {
        if (Math.random() < CONFIG.dropChance) {
          const elem = Rng.pick(CONFIG.elements);
          const modData = CONFIG.modules[elem];
          if (this.currentRoomState) {
            this.currentRoomState.drops.push({ x: enemy.x, y: enemy.y, alive: true, color: modData.color, element: elem });
          }
        }
        if (enemy.isBoss) {
          for (const door of this.currentRoomState.doors) {
            if (door.requiredSkill) door.estado = 'abierta';
          }
          showToast('👑 ¡Jefe derrotado!', 'success');
        }
      }
    });
    this.eventBus.on('LEVEL_UP', ({level}) => {
      showToast(`🎉 ¡Nivel ${level}! +1 punto de habilidad`, 'success');
      this._savePlayerData();
    });
    this.eventBus.on('STATS_CHANGED', () => { this._savePlayerData(); });
    this.eventBus.on('XP_CHANGED', () => { this._savePlayerData(); });
    this.eventBus.on('SKILL_UNLOCKED', ({skillId}) => {
      const node = CONFIG.skillTree.find(n => n.id === skillId);
      if (node) showToast(`🌳 ${node.name} desbloqueado`, 'success');
      this._savePlayerData();
    });
    this.eventBus.on('TALENT_UNLOCKED', ({talentId}) => {
      const talent = CONFIG.talentsDB.find(t => t.id === talentId);
      if (talent) showToast(`🌟 ${talent.name} desbloqueado`, 'success');
      this._savePlayerData();
    });
  }

  _update(dt) {
    if (this.paused || !this.currentRoomState) return;

    this.player.update(dt, this.input, this.currentRoomState);

    for (const enemy of this.currentRoomState.enemies) {
      if (enemy.alive) enemy.update(dt, this.player, this.currentRoomState);
    }

    this._handleWaves(dt);

    for (const enemy of this.currentRoomState.enemies) {
      if (!enemy.alive) continue;
      if (Math.hypot(enemy.x-this.player.x, enemy.y-this.player.y) < enemy.radius+this.player.radius) {
        const died = this.player.takeDamage(enemy.damage);
        if (died) { this.player.hp = this.player.maxHp; this._switchRoom(CONFIG.startRoomId); showToast('💀 Has muerto', 'error'); }
      }
    }

    if (this.currentRoomState.enemyProjectiles) {
      for (let i=this.currentRoomState.enemyProjectiles.length-1; i>=0; i--) {
        const p = this.currentRoomState.enemyProjectiles[i];
        if (!p.alive) { this.currentRoomState.enemyProjectiles.splice(i,1); continue; }
        p.update(dt, this.currentRoomState);
        if (Math.hypot(p.x-this.player.x, p.y-this.player.y) < p.radius+this.player.radius) {
          const died = this.player.takeDamage(p.damage);
          p.alive = false;
          this.currentRoomState.enemyProjectiles.splice(i,1);
          if (died) { this.player.hp = this.player.maxHp; this._switchRoom(CONFIG.startRoomId); showToast('💀 Has muerto', 'error'); }
        }
      }
    }

    for (const obj of this.currentRoomState.objects) {
      if (obj.collected) continue;
      if (Math.hypot(obj.x-this.player.x, obj.y-this.player.y) < this.player.radius+8) {
        obj.collected = true;
        this.eventBus.emit('OBJECT_COLLECTED', { object: obj });
      }
    }

    if (this.currentRoomState.drops) {
      for (const drop of this.currentRoomState.drops) {
        if (!drop.alive) continue;
        if (Math.hypot(drop.x-this.player.x, drop.y-this.player.y) < this.player.radius+8) {
          drop.alive = false;
          const modData = CONFIG.modules[drop.element];
          if (modData) {
            this.player.modules.push({ name: modData.name, element: modData.element, color: modData.color });
            showToast(`🧩 Módulo ${modData.name} recogido`, 'success');
            this._savePlayerData();
          }
        }
      }
    }

    this._checkDoors();
    this._clampCamera();

    const boss = this.currentRoomState.enemies.find(e => e.isBoss && e.alive);
    const bossBar = document.getElementById('boss-hp-bar');
    const bossFill = document.getElementById('boss-hp-fill');
    if (boss) {
      bossBar.style.display = 'block';
      bossFill.style.width = (boss.hp / boss.maxHp * 100) + '%';
    } else {
      bossBar.style.display = 'none';
    }

    // Actualizar buffer de entrada al final del frame
    this.input.update();
  }

  _draw() {
    this.renderer.clear();
    if (this.currentRoomState) {
      this.renderer.drawRoom(this.currentRoomState, this.player, this.camera);
    }
    this.renderer.drawUI(this.player, { currentRoomId: this.currentRoomId });
  }

  _loop() {
    const now = performance.now();
    const dt = Math.min((now - this._lastTime) / 1000, 0.05);
    this._lastTime = now;
    this._update(dt);
    this._draw();
    requestAnimationFrame(() => this._loop());
  }

  // ===== MENÚ =====
  _initMenu() {
    this.menuPanel = document.getElementById('side-menu');
    document.getElementById('menu-close').addEventListener('click', () => this.toggleMenu());
    document.addEventListener('keydown', e => {
      if (e.key === 'Tab') { e.preventDefault(); this.toggleMenu(); }
    });
    this.tabButtons = document.querySelectorAll('#side-menu .tab-buttons button');
    this.tabContents = {
      architect: document.getElementById('tab-architect'),
      tree: document.getElementById('tab-tree'),
      talents: document.getElementById('tab-talents'),
      modules: document.getElementById('tab-modules')
    };
    this.tabButtons.forEach(btn => btn.addEventListener('click', () => this._switchTab(btn.dataset.tab)));
    this._buildArchitectTab();
    this._buildTreeTab();
    this._buildTalentsTab();
    this._buildModulesTab();
  }

  _switchTab(id) {
    this.tabButtons.forEach(b => b.classList.remove('active'));
    document.querySelector(`[data-tab="${id}"]`).classList.add('active');
    Object.values(this.tabContents).forEach(d => d.classList.remove('active'));
    this.tabContents[id].classList.add('active');
    if (id === 'tree') this._buildTreeTab();
    if (id === 'talents') this._buildTalentsTab();
    if (id === 'modules') this._buildModulesTab();
  }

  toggleMenu() {
    if (this.menuPanel.style.display === 'block') {
      this.menuPanel.style.display = 'none';
      this.paused = false;
    } else {
      this.paused = true;
      this.menuPanel.style.display = 'block';
      this._buildArchitectTab();
      this._buildTreeTab();
      this._buildTalentsTab();
      this._buildModulesTab();
      this._switchTab('architect');
    }
  }

  _buildArchitectTab() {
    const p = this.player;
    let html = `<h4>🎮 Estado</h4>
      <div class="stat-row">
        <span class="stat-badge">Nv.${p.level}</span>
        <span class="stat-badge">XP ${p.xp}/${p.xpToNext}</span>
        <span class="stat-badge">Puntos ${p.skillPoints}</span>
        <span class="stat-badge">Cargas ${p.currentCharges}/${p.maxCharges}</span>
      </div>
      <div class="stat-row">
        <span class="stat-badge">HP ${p.hp}/${p.maxHp}</span>
        <span class="stat-badge">FUE ${p.stats.strength}</span>
        <span class="stat-badge">DES ${p.stats.dexterity}</span>
        <span class="stat-badge">INT ${p.stats.intelligence}</span>
        <span class="stat-badge">VIT ${p.stats.vitality}</span>
      </div>
      <hr>
      <h4>🔧 Físicas</h4>
      <label>Gravedad <input type="range" min="200" max="1200" value="${CONFIG.gravity}" oninput="CONFIG.gravity=parseFloat(this.value)"></label>
      <label>Salto <input type="range" min="150" max="500" value="${CONFIG.jumpForce}" oninput="CONFIG.jumpForce=parseFloat(this.value)"></label>
      <label>Velocidad <input type="range" min="100" max="400" value="${CONFIG.moveSpeed}" oninput="CONFIG.moveSpeed=parseFloat(this.value)"></label>
      <hr>
      <h4>⚡ Habilidades</h4>
      <div class="flex">
        <button class="${p.abilities.doubleJump?'good':''}" onclick="window.__game.player.abilities.doubleJump=!window.__game.player.abilities.doubleJump;window.__game._savePlayerData();window.__game._buildArchitectTab();">Doble salto</button>
        <button class="${p.abilities.dash?'good':''}" onclick="window.__game.player.abilities.dash=!window.__game.player.abilities.dash;window.__game._savePlayerData();window.__game._buildArchitectTab();">Dash</button>
        <button class="${p.abilities.hookGrab?'good':''}" onclick="window.__game.player.abilities.hookGrab=!window.__game.player.abilities.hookGrab;window.__game._savePlayerData();window.__game._buildArchitectTab();">Gancho</button>
      </div>
      <div class="flex">
        <button onclick="window.__game.player.weaponType='sword';window.__game._buildArchitectTab();" class="${p.weaponType==='sword'?'good':''}">Espada</button>
        <button onclick="window.__game.player.weaponType='bow';window.__game._buildArchitectTab();" class="${p.weaponType==='bow'?'good':''}">Arco</button>
      </div>
      <button onclick="window.__game.player.hp=window.__game.player.maxHp;window.__game._savePlayerData();">Curar</button>
      <button onclick="window.__game.player.gainXP(50);window.__game._savePlayerData();window.__game._buildArchitectTab();">+50 XP</button>
      <button onclick="window.__game._switchRoom('0,0');">🏠 Inicio</button>
    `;
    html += `<hr><h4>🔥 Afinidades</h4><div class="affinity-bar">`;
    const aff = this.player.affinities || {};
    const maxAff = AffinityService.getMaxAffinity(this.player.level);
    for (const tag of CONFIG.allTags) {
      const val = aff[tag] || 0;
      const pct = maxAff > 0 ? (val / maxAff * 100) : 0;
      html += `<div class="affinity-tag">
        <span>${tag}</span>
        <div class="bar"><div class="fill" style="width:${Math.min(100,pct)}%;background:${CONFIG.modules[tag]?.color||'#fff'}"></div></div>
        <span class="value">${Math.round(val)}</span>
      </div>`;
    }
    html += `</div>`;
    this.tabContents.architect.innerHTML = html;
  }

  _buildTreeTab() {
    const p = this.player;
    let html = `<h4>🌳 Árbol de habilidades (${p.skillPoints} puntos)</h4>
      <div class="progress-bar"><div class="fill" style="width:${(p.skillPoints / 10 * 100)}%"></div></div>
      <div class="text-muted">Los puntos se obtienen al subir de nivel.</div>`;
    for (const node of CONFIG.skillTree) {
      const unlocked = p.unlockedTreeNodes.has(node.id);
      const canUnlock = !unlocked && p.skillPoints >= node.cost;
      let reqMet = true;
      if (node.req) {
        if (node.req.level && p.level < node.req.level) reqMet = false;
        if (node.req.ability && !p.abilities[node.req.ability]) reqMet = false;
        if (node.req.skill && !p.unlockedTreeNodes.has(node.req.skill)) reqMet = false;
      }
      const disabled = unlocked || !canUnlock || !reqMet;
      html += `<div class="skill-card ${unlocked?'unlocked':'locked'}" style="${unlocked?'border-left-color:#4ecca3;':''}">
        <div><strong>${node.name}</strong> <span class="cost">💰 ${node.cost}pts</span></div>
        <div class="text-muted">${node.req ? 'Req: '+Object.entries(node.req).map(([k,v])=>`${k} ${v}`).join(' ') : 'Sin requisitos'}</div>
        ${!unlocked ? `<button class="${!disabled?'btn-unlock':''}" ${disabled?'disabled':''} onclick="window.__game.player.applySkillTreeEffect('${node.id}');window.__game._buildTreeTab();window.__game._savePlayerData();">${canUnlock && reqMet ? 'Desbloquear' : 'Bloqueado'}</button>` : '<span class="good">✅ Desbloqueado</span>'}
      </div>`;
    }
    this.tabContents.tree.innerHTML = html;
  }

  _buildTalentsTab() {
    const p = this.player;
    let html = `<h4>🌟 Talentos</h4><div class="text-muted">Requieren estadísticas mínimas.</div>`;
    for (const talent of CONFIG.talentsDB) {
      const unlocked = p.talents.includes(talent.id);
      let canUnlock = !unlocked;
      for (const [stat, val] of Object.entries(talent.req)) {
        if ((p.stats[stat] || 0) < val) canUnlock = false;
      }
      html += `<div class="talent-item">
        <div><strong>${talent.name}</strong><br><span class="desc">${talent.desc}</span><br><span class="req">Req: ${Object.entries(talent.req).map(([k,v])=>`${k} ${v}`).join(' ')}</span></div>
        ${!unlocked ? `<button class="btn-unlock" ${!canUnlock?'disabled':''} onclick="window.__game.player.unlockTalent('${talent.id}');window.__game._buildTalentsTab();window.__game._savePlayerData();">${canUnlock?'Desbloquear':'🔒'}</button>` : '<span class="good">✅</span>'}
      </div>`;
    }
    html += `<hr><h4>💍 Trinkets (máx 2)</h4>`;
    for (const [id, trinket] of Object.entries(CONFIG.trinkets)) {
      const equipped = p.trinkets.some(t => t.id === id);
      html += `<div class="talent-item">
        <div><strong>${trinket.name}</strong><br><span class="desc">${trinket.desc}</span></div>
        ${equipped ? `<button onclick="window.__game.player.removeTrinket('${id}');window.__game._buildTalentsTab();window.__game._savePlayerData();" class="danger">Quitar</button>` :
                    `<button onclick="window.__game.player.addTrinket('${id}');window.__game._buildTalentsTab();window.__game._savePlayerData();" ${p.trinkets.length>=2?'disabled':''}>Equipar</button>`}
      </div>`;
    }
    this.tabContents.talents.innerHTML = html;
  }

  _buildModulesTab() {
    const p = this.player;
    let html = `<h4>🧩 Módulos equipados (${p.modules.length})</h4>`;
    if (p.modules.length === 0) html += '<p class="text-muted">Ninguno.</p>';
    else {
      html += '<div class="flex">';
      p.modules.forEach((m, i) => {
        html += `<span class="module-slot" style="background:${m.color}22;border-color:${m.color}">
          ${m.icon||'⬜'} ${m.name}
          <button class="remove" onclick="window.__game.player.modules.splice(${i},1);window.__game._buildModulesTab();window.__game._savePlayerData();">×</button>
        </span>`;
      });
      html += '</div>';
    }
    html += `<hr><h4>📊 Habilidades</h4>`;
    for (const skill of p.skills) {
      const unlocked = p.unlockedSkills.has(skill.id);
      const stats = skill.computeStats();
      html += `<div class="skill-card ${unlocked?'unlocked':'locked'}">
        <div><strong>${skill.name}</strong> ${unlocked?'✅':''}</div>
        <div class="tags">${skill.tags.join(', ')}</div>
        <div class="text-muted">Daño:${stats.damage||0} Vel:${stats.speed||0} Alcance:${stats.range||0}</div>
        ${skill.appliedMutators.length ? `<div class="text-muted">Mutadores: ${skill.appliedMutators.join(', ')}</div>` : ''}
        ${unlocked ? `<button onclick="window.__game.player.skillLevels['${skill.id}']=(window.__game.player.skillLevels['${skill.id}']||1)+1;window.__game._savePlayerData();window.__game._buildModulesTab();">⬆️ Mejorar</button>` : ''}
      </div>`;
    }
    this.tabContents.modules.innerHTML = html;
  }
}

// ================================================================
//  14. ARRANQUE
// ================================================================
document.addEventListener('DOMContentLoaded', () => {
  const canvas = document.getElementById('game');
  canvas.width = 960; canvas.height = 640;
  const input = new WebInput(canvas);
  const renderer = new CanvasRenderer(canvas);
  const persistence = new Persistence();
  window.__game = new Game(canvas, input, renderer, persistence);
  showToast('🎮 Metroidvania · Física + Puertas + Gancho', 'info');
});
</script>
