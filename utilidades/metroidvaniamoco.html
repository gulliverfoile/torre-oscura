<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Metroidvania Modular · Fase 1+2 · Completo</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; background:#000; touch-action:none; }
    body { display:flex; justify-content:center; align-items:center; }
    canvas { display:block; position:absolute; top:0; left:0; }
    #side-menu {
      position:fixed; top:0; right:0; width:min(380px, 90vw); height:100vh;
      background:rgba(10,10,25,0.96); border-left:2px solid #ffd700; color:#fff;
      z-index:10000; display:none; font-family:monospace; font-size:clamp(11px, 2vw, 13px);
      backdrop-filter:blur(8px); overflow-y:auto; padding:0;
    }
    #side-menu .tab-buttons { display:flex; flex-wrap:wrap; background:#111; border-bottom:1px solid #444; }
    #side-menu .tab-buttons button {
      flex:1; min-width:60px; background:transparent; border:none; color:#aaa;
      padding:10px 5px; cursor:pointer; font-weight:bold; font-size:inherit; transition:0.2s;
    }
    #side-menu .tab-buttons button.active { color:#ffd700; border-bottom:2px solid #ffd700; background:#222; }
    #side-menu .tab-content { padding:15px; }
    #side-menu .tab-content > div { display:none; }
    #side-menu .tab-content > div.active { display:block; }
    button {
      background:#ffd700; color:#000; border:none; padding:6px 10px; margin:4px 2px;
      cursor:pointer; font-weight:bold; border-radius:4px; touch-action:manipulation;
    }
    select, input[type="range"] { margin:2px 0 8px; background:#222; color:#0f0; border:1px solid #0f0; padding:4px; border-radius:3px; font-family:monospace; width:100%; }
    label { display:block; margin:6px 0 2px; color:#ccc; }
    hr { border-color:#444; margin:10px 0; }
    .boss-hp { position:fixed; top:10px; left:50%; transform:translateX(-50%); width:300px; height:20px; background:#333; border:2px solid #fff; display:none; }
    .boss-hp-fill { height:100%; background:#f00; width:100%; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="boss-hp" id="boss-hp-bar"><div class="boss-hp-fill" id="boss-hp-fill"></div></div>

  <div id="side-menu">
    <div class="tab-buttons">
      <button data-tab="architect">🔧 Arquitecto</button>
      <button data-tab="talents">🌟 Talentos</button>
      <button data-tab="modules">🧩 Módulos</button>
    </div>
    <div class="tab-content">
      <div id="tab-architect" class="active"></div>
      <div id="tab-talents"></div>
      <div id="tab-modules"></div>
    </div>
    <div style="text-align:center; padding:10px;">
      <button id="menu-close">Cerrar menú [Tab]</button>
    </div>
  </div>

<script>
'use strict';

// ==================== CONFIGURACIÓN GLOBAL ====================
const CONFIG = {
  gravity: 800,
  jumpForce: 320,
  doubleJumpForce: 280,
  moveSpeed: 200,
  dashBaseSpeed: 400,
  dashLevelMultiplier: 1.4,
  dashCooldown: 0.8,
  dashDuration: 0.15,
  dashSubSteps: 6,
  hookGrabSpeed: 600,
  hookGrabCooldown: 2.0,
  hookGrabRange: 180,
  hookPullStrength: 800,
  hookSwingCooldown: 2.0,
  hookSwingRange: 160,
  swingAccel: 500,
  swingDamping: 0.99,
  maxHookAirUses: 2,
  meleeRange: 30,
  meleeCooldown: 0.4,
  projectileSpeed: 350,
  projectileCooldown: 0.6,
  projectileDamage: 2,
  projectileLifetime: 1.5,
  playerRadius: 10,
  maxHp: 5,
  invulnerabilityTime: 1.5,
  tileSize: 32,
  enemyDefaultHp: 3,
  enemyDefaultDamage: 1,
  enemyDefaultSpeed: 60,
  startRoomId: '0,0',
  elements: ['fuego', 'hielo'],
  dropChance: 0.6,
  modules: {
    fuego: { name: 'Fuego', element: 'fuego', color: '#f60' },
    hielo: { name: 'Hielo', element: 'hielo', color: '#6cf' }
  },
  grappleTileBasic: 3,
  grappleTileAdvanced: 4,
  grappleTileMaster: 5,
  maxCharges: 5,
  chargePerHit: 3,
  baseXPPerKill: 20,
  xpCurveExponent: 1.5,
};

// ==================== PUERTOS ====================
class InputPort {
  getMove() { return { left: false, right: false, up: false, down: false }; }
  isJumpPressed() { return false; }
  isDashPressed() { return false; }
  isMeleePressed() { return false; }
  isProjectilePressed() { return false; }
  isInteractPressed() { return false; }
  isHookPressed() { return false; }
  isSpecialPressed() { return false; }
  getAimAngle() { return 0; }
  update() {}
}

class RendererPort {
  clear() {}
  drawRoom(roomState, player, camera) {}
  drawUI(player, gameState) {}
}

class PersistencePort {
  load() { return {}; }
  save(data) {}
  loadRoomState(roomId) { return null; }
  saveRoomState(roomId, state) {}
}

// ==================== ADAPTADORES ====================
class WebInputAdapter extends InputPort {
  constructor(canvas) {
    super();
    this.canvas = canvas;
    this.keys = {};
    this.mouse = { x: 0, y: 0, down: false };
    this._bindEvents();
  }
  _bindEvents() {
    document.addEventListener('keydown', e => {
      this.keys[e.key.toLowerCase()] = true;
      if ([' ', 'arrowup','arrowdown','arrowleft','arrowright','f','j','k','e','shift','q'].includes(e.key.toLowerCase()))
        e.preventDefault();
    });
    document.addEventListener('keyup', e => { this.keys[e.key.toLowerCase()] = false; });
    this.canvas.addEventListener('mousemove', e => {
      const rect = this.canvas.getBoundingClientRect();
      this.mouse.x = (e.clientX - rect.left) * (this.canvas.width / rect.width);
      this.mouse.y = (e.clientY - rect.top) * (this.canvas.height / rect.height);
    });
    this.canvas.addEventListener('mousedown', () => this.mouse.down = true);
    this.canvas.addEventListener('mouseup', () => this.mouse.down = false);
  }
  getMove() {
    return {
      left:  this.keys['a'] || this.keys['arrowleft'],
      right: this.keys['d'] || this.keys['arrowright'],
      up:    this.keys['w'] || this.keys['arrowup'],
      down:  this.keys['s'] || this.keys['arrowdown'],
    };
  }
  isJumpPressed()      { return this.keys[' '] || this.keys['space']; }
  isDashPressed()      { return this.keys['shift']; }
  isMeleePressed()     { return this.keys['j']; }
  isProjectilePressed(){ return this.keys['k']; }
  isInteractPressed()  { return this.keys['f']; }
  isHookPressed()      { return this.keys['e']; }
  isSpecialPressed()   { return this.keys['q']; }
  getAimAngle() {
    const dx = this.mouse.x - this.canvas.width / 2;
    const dy = this.mouse.y - this.canvas.height / 2;
    return Math.atan2(dy, dx);
  }
  update() {}
}

class CanvasRenderer extends RendererPort {
  constructor(canvas) {
    super();
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
  }
  clear() { this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height); }

  drawRoom(roomState, player, camera) {
    const ctx = this.ctx;
    const { x: cx, y: cy } = camera;
    const ts = CONFIG.tileSize;
    for (let row = 0; row < roomState.tiles.length; row++) {
      for (let col = 0; col < roomState.tiles[row].length; col++) {
        const tile = roomState.tiles[row][col];
        const x = col * ts - cx, y = row * ts - cy;
        if (tile === 1) {
          ctx.fillStyle = '#444'; ctx.fillRect(x, y, ts, ts);
          ctx.strokeStyle = '#222'; ctx.strokeRect(x, y, ts, ts);
        } else if (tile === 2) {
          const door = roomState.doors.find(d => d.col === col && d.row === row);
          ctx.fillStyle = door && door.estado === 'abierta' ? '#0f0' : '#f00';
          ctx.fillRect(x, y, ts, ts);
          ctx.fillStyle = '#fff'; ctx.font = '10px monospace'; ctx.fillText('F', x+4, y+14);
        } else if (tile >= 3 && tile <= 5) {
          let colG = '#a0522d', label = 'G1';
          if (tile === 4) { colG = '#8b4513'; label = 'G2'; }
          else if (tile === 5) { colG = '#654321'; label = 'G3'; }
          ctx.fillStyle = colG; ctx.fillRect(x, y, ts, ts);
          ctx.fillStyle = '#fff'; ctx.font = '10px monospace'; ctx.fillText(label, x+2, y+14);
        }
      }
    }
    for (const enemy of roomState.enemies) {
      if (!enemy.alive) continue;
      ctx.fillStyle = enemy.color || '#f00';
      ctx.beginPath(); ctx.arc(enemy.x - cx, enemy.y - cy, enemy.radius, 0, Math.PI*2); ctx.fill();
      const hpPct = enemy.hp / enemy.maxHp;
      ctx.fillStyle = '#000'; ctx.fillRect(enemy.x - cx - 10, enemy.y - cy - enemy.radius - 6, 20, 3);
      ctx.fillStyle = hpPct > 0.5 ? '#0f0' : '#f00';
      ctx.fillRect(enemy.x - cx - 10, enemy.y - cy - enemy.radius - 6, 20*hpPct, 3);
      if (enemy.isBoss) {
        ctx.fillStyle = '#ff0'; ctx.font = 'bold 12px monospace';
        ctx.fillText('BOSS', enemy.x - cx - 15, enemy.y - cy - enemy.radius - 12);
      }
    }
    if (roomState.drops) {
      for (const drop of roomState.drops) {
        if (!drop.alive) continue;
        ctx.fillStyle = drop.color; ctx.fillRect(drop.x - cx - 6, drop.y - cy - 6, 12, 12);
      }
    }
    for (const obj of roomState.objects) {
      if (obj.collected) continue;
      ctx.fillStyle = obj.color; ctx.fillRect(obj.x - cx - 8, obj.y - cy - 8, 16, 16);
    }
    if (roomState.playerProjectiles) {
      for (const p of roomState.playerProjectiles) {
        if (!p.alive) continue;
        ctx.fillStyle = p.color || '#ff0';
        ctx.beginPath(); ctx.arc(p.x - cx, p.y - cy, p.radius, 0, Math.PI*2); ctx.fill();
      }
    }
    if (player.hookState && player.hookState.active) {
      ctx.beginPath(); ctx.strokeStyle = '#888';
      ctx.moveTo(player.x - cx, player.y - cy);
      const tip = player.hookState.tip || player.hookState.anchor;
      ctx.lineTo(tip.x - cx, tip.y - cy);
      ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(tip.x - cx, tip.y - cy, 4, 0, Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = player.invincible ? 'rgba(255,255,0,0.5)' : '#ff0';
    if (player.profile && player.profile.name === 'slime') {
      ctx.fillStyle = player.invincible ? 'rgba(100,255,100,0.5)' : '#8f8';
    }
    ctx.beginPath(); ctx.arc(player.x - cx, player.y - cy, player.radius, 0, Math.PI*2); ctx.fill();
    if (player.profile && player.profile.name === 'slime' && player.isWallStuck) {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(player.x - cx, player.y - cy, player.radius+2, 0, Math.PI*2); ctx.stroke();
    }
    if (player.modules.length > 0) {
      const mod = player.modules[0];
      ctx.fillStyle = mod.color; ctx.beginPath(); ctx.arc(player.x - cx + 15, player.y - cy - 15, 5, 0, Math.PI*2); ctx.fill();
    }
  }

  drawUI(player, gameState) {
    const ctx = this.ctx;
    ctx.fillStyle = '#fff'; ctx.font = '12px monospace'; ctx.textAlign = 'left';
    ctx.fillText(`HP: ${'♥'.repeat(player.hp)}`, 20, 20);
    ctx.fillText(`Sala: ${gameState.currentRoomId}`, 20, 40);
    const abilities = [];
    if (player.abilities.doubleJump) abilities.push('Doble salto');
    if (player.abilities.dash) abilities.push(`Dash Nv${player.dashLevel}`);
    if (player.abilities.hookGrab) abilities.push('Gancho arrastre');
    if (player.abilities.hookSwing) abilities.push('Gancho balanceo');
    ctx.fillText(`Habilidades: ${abilities.join(', ') || 'ninguna'}`, 20, 60);
    ctx.fillText(`Perfil: ${player.profile ? player.profile.name : 'normal'}`, 20, 80);
    const chargePct = player.currentCharges / player.maxCharges;
    ctx.fillStyle = '#555'; ctx.fillRect(20, 100, 100, 10);
    ctx.fillStyle = '#0ff'; ctx.fillRect(20, 100, 100 * chargePct, 10);
    ctx.fillStyle = '#fff'; ctx.fillText(`Carga: ${player.currentCharges}/${player.maxCharges}`, 20, 125);
    const s = player.stats;
    ctx.fillText(`FUE:${s.strength} DES:${s.dexterity} INT:${s.intelligence}  Nivel:${player.level}`, 20, 145);
  }
}

class LocalStorageRepo extends PersistencePort {
  constructor() { super(); this.key = 'metro_v14'; }
  load() { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch(e) { return {}; } }
  save(data) { try { localStorage.setItem(this.key, JSON.stringify(data)); } catch(e) {} }
  loadRoomState(roomId) {
    const data = this.load();
    if (data.rooms && data.rooms[roomId]) {
      const saved = data.rooms[roomId];
      saved.enemies = saved.enemies.map(e => {
        const enemy = new Enemy(e.x, e.y, e.type, e);
        enemy.hp = e.hp; enemy.alive = e.alive; enemy.status = e.status;
        return enemy;
      });
      saved.playerProjectiles = [];
      saved.drops = (saved.drops || []).map(d => ({ ...d }));
      return saved;
    }
    return null;
  }
  saveRoomState(roomId, roomState) {
    const data = this.load();
    if (!data.rooms) data.rooms = {};
    data.rooms[roomId] = {
      id: roomState.id, tiles: roomState.tiles, doors: roomState.doors,
      objects: roomState.objects.map(o => ({ ...o })),
      enemies: roomState.enemies.map(e => ({
        x: e.x, y: e.y, hp: e.hp, maxHp: e.maxHp, alive: e.alive,
        type: e.type, radius: e.radius, damage: e.damage, speed: e.speed,
        color: e.color, reflectProjectiles: e.reflectProjectiles, status: e.status,
        isBoss: e.isBoss, pattern: e.pattern
      })),
      drops: (roomState.drops || []).map(d => ({ ...d })),
      visited: true
    };
    this.save(data);
  }
}

// ==================== BUS DE EVENTOS ====================
class EventBus {
  constructor() { this.listeners = {}; }
  on(event, cb) { (this.listeners[event] = this.listeners[event] || []).push(cb); }
  off(event, cb) { if (this.listeners[event]) this.listeners[event] = this.listeners[event].filter(l => l !== cb); }
  emit(event, data) { (this.listeners[event] || []).forEach(cb => cb(data)); }
}

// ==================== PERFILES DE MOVIMIENTO ====================
class BaseMovementProfile {
  constructor() { this.name = 'normal'; }
  getDesiredVelocity(input, player) {
    const move = input.getMove();
    let vx = 0;
    if (move.left)  vx = -CONFIG.moveSpeed;
    if (move.right) vx =  CONFIG.moveSpeed;
    return { vx, vy: player.vy, canWallStick: false };
  }
  handleWallCollision(player, colInfo, dt) { return false; }
  canDash(player) { return true; }
}

class NormalProfile extends BaseMovementProfile { constructor() { super(); this.name = 'normal'; } }
class JumpOnlyProfile extends BaseMovementProfile {
  constructor() { super(); this.name = 'jumpOnly'; }
  getDesiredVelocity(input, player) {
    if (!player.grounded) return super.getDesiredVelocity(input, player);
    return { vx: 0, vy: player.vy, canWallStick: false };
  }
}
class SlipperyProfile extends BaseMovementProfile {
  constructor() { super(); this.name = 'slippery'; }
  getDesiredVelocity(input, player) {
    const move = input.getMove();
    let targetVx = 0;
    if (move.left)  targetVx = -CONFIG.moveSpeed;
    if (move.right) targetVx =  CONFIG.moveSpeed;
    const accel = 8;
    player.vx += (targetVx - player.vx) * Math.min(1, accel * 0.016);
    return { vx: player.vx, vy: player.vy, canWallStick: false };
  }
}
class DashMasterProfile extends BaseMovementProfile { constructor() { super(); this.name = 'dashMaster'; } }
class SlimeProfile extends BaseMovementProfile {
  constructor() { super(); this.name = 'slime'; }
  getDesiredVelocity(input, player) {
    if (player.isWallStuck) return { vx: 0, vy: 0, canWallStick: true };
    let vx = 0;
    if (move.left)  vx = -CONFIG.moveSpeed;
    if (move.right) vx =  CONFIG.moveSpeed;
    return { vx, vy: player.vy, canWallStick: true };
  }
  handleWallCollision(player, colInfo, dt) {
    if (!player.grounded && colInfo.normalX !== 0 && player.vx !== 0) {
      player.isWallStuck = true;
      player.wallDir = colInfo.normalX > 0 ? 1 : -1;
      player.vx = 0;
      return true;
    }
    return false;
  }
}

// ==================== ESTADOS DEL JUGADOR ====================
class PlayerState {
  constructor(player) { this.player = player; }
  enter() {}
  exit() {}
  update(dt, input) {}
}
class IdleState extends PlayerState { update(dt, input) { this.player.vx = 0; } }
class RunState extends PlayerState {}
class JumpState extends PlayerState { update(dt, input) { if (this.player.vy > 0) this.player.setState('fall'); } }
class FallState extends PlayerState { update(dt, input) { if (this.player.grounded) this.player.setState('idle'); } }
class DashState extends PlayerState {
  enter() { this.timer = CONFIG.dashDuration; this.player.invincible = true; }
  update(dt, input) {
    this.timer -= dt;
    if (this.timer <= 0) { this.player.setState('idle'); this.player.invincible = false; }
  }
  exit() { this.player.invincible = false; }
}
class HookPullState extends PlayerState {
  enter() { this.player.hookState.active = true; }
  update(dt, input) {
    const anchor = this.player.hookState.anchor;
    const dx = anchor.x - this.player.x, dy = anchor.y - this.player.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 5 || input.isJumpPressed()) {
      this.player.hookState.active = false;
      this.player.setState('idle');
      return;
    }
    this.player.vx = (dx / dist) * CONFIG.moveSpeed * 2;
    this.player.vy = (dy / dist) * CONFIG.moveSpeed * 2;
  }
}
class HookSwingState extends PlayerState {
  enter() { this.player.hookState.active = true; }
  update(dt, input) {
    const anchor = this.player.hookState.anchor;
    const dx = this.player.x - anchor.x, dy = this.player.y - anchor.y;
    const length = Math.hypot(dx, dy);
    if (length < 5 || input.isJumpPressed()) {
      this.player.hookState.active = false;
      this.player.setState('idle');
      return;
    }
    const angle = Math.atan2(dy, dx);
    const gravityTangential = CONFIG.gravity * Math.sin(angle) * 0.5;
    let tangentialVel = this.player._swingVel || 0;
    tangentialVel += gravityTangential * dt;
    const move = input.getMove();
    if (move.left) tangentialVel -= CONFIG.swingAccel * dt;
    if (move.right) tangentialVel += CONFIG.swingAccel * dt;
    tangentialVel *= CONFIG.swingDamping;
    this.player._swingVel = tangentialVel;
    const perpX = -Math.sin(angle), perpY = Math.cos(angle);
    this.player.vx = tangentialVel * perpX;
    this.player.vy = tangentialVel * perpY;
    const currentDist = Math.hypot(this.player.x - anchor.x, this.player.y - anchor.y);
    if (currentDist > 1) {
      this.player.x = anchor.x + (dx / currentDist) * length;
      this.player.y = anchor.y + (dy / currentDist) * length;
    }
  }
  exit() { this.player._swingVel = 0; }
}

// ==================== ARMAS ====================
class Weapon {
  constructor() { this.name = 'base'; this.cooldown = 0; }
  attack(player, roomState, input) {}
  canAttack(player) { return this.cooldown <= 0; }
  update(dt) { this.cooldown = Math.max(0, this.cooldown - dt); }
}

class Sword extends Weapon {
  constructor() {
    super();
    this.name = 'Espada';
    this.cooldown = 0;
  }
  attack(player, roomState, input) {
    if (!this.canAttack(player)) return;
    this.cooldown = CONFIG.meleeCooldown;
    const mod = player.modules[0] || null;
    const element = mod ? mod.element : 'fisico';
    const color = mod ? mod.color : '#fff';
    const attackX = player.x + (player.facingRight ? CONFIG.meleeRange : -CONFIG.meleeRange);
    if (!roomState.meleeEffects) roomState.meleeEffects = [];
    roomState.meleeEffects.push({ x: attackX, y: player.y, color, life: 0.3 });
    let dmg = 2 + player.stats.strength;
    for (const enemy of roomState.enemies) {
      if (!enemy.alive) continue;
      if (Math.hypot(enemy.x - attackX, enemy.y - player.y) < enemy.radius + 10) {
        if (element === 'fuego') { dmg += 1; enemy.status = 'quemadura'; }
        else if (element === 'hielo') { enemy.speed *= 0.5; enemy.status = 'congelacion'; }
        enemy.hp -= dmg;
        if (enemy.hp <= 0) enemy.alive = false;
        player.eventBus.emit('ENEMY_HIT', { enemy });
      }
    }
  }
}

class Bow extends Weapon {
  constructor() {
    super();
    this.name = 'Arco';
    this.cooldown = 0;
  }
  attack(player, roomState, input) {
    if (!this.canAttack(player)) return;
    this.cooldown = CONFIG.projectileCooldown;
    const mod = player.modules[0] || null;
    const element = mod ? mod.element : 'fisico';
    const color = mod ? mod.color : '#ff0';
    const angle = player.facingRight ? 0 : Math.PI;
    const dmg = CONFIG.projectileDamage + player.stats.dexterity;
    const p = new PlayerProjectile(
      player.x + Math.cos(angle)*(player.radius+6), player.y + Math.sin(angle)*(player.radius+6),
      Math.cos(angle)*CONFIG.projectileSpeed, Math.sin(angle)*CONFIG.projectileSpeed,
      dmg, element, color, CONFIG.projectileLifetime, player
    );
    if (!roomState.playerProjectiles) roomState.playerProjectiles = [];
    roomState.playerProjectiles.push(p);
  }
}

class HookWeapon extends Weapon {
  constructor(mode) {
    super();
    this.name = 'Gancho';
    this.mode = mode;
    this.cooldown = 0;
  }
  attack(player, roomState, input) {
    // Se usa con la tecla E, manejado en Player
  }
}

// ==================== PROYECTIL ====================
class PlayerProjectile {
  constructor(x, y, vx, vy, damage, element, color, lifetime, player) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.damage = damage; this.element = element; this.color = color;
    this.radius = 4; this.alive = true; this.life = lifetime;
    this.player = player;
  }
  update(dt, roomState) {
    this.x += this.vx * dt; this.y += this.vy * dt;
    this.life -= dt;
    if (this.life <= 0) { this.alive = false; return; }
    const col = Math.floor(this.x/CONFIG.tileSize), row = Math.floor(this.y/CONFIG.tileSize);
    if (row<0||row>=roomState.tiles.length||col<0||col>=roomState.tiles[0].length) { this.alive = false; return; }
    if (roomState.tiles[row][col] === 1) this.alive = false;
    for (const enemy of roomState.enemies) {
      if (!enemy.alive) continue;
      if (Math.hypot(this.x-enemy.x, this.y-enemy.y) < this.radius+enemy.radius) {
        enemy.hp -= this.damage;
        if (this.element === 'fuego') enemy.status = 'quemadura';
        else if (this.element === 'hielo') { enemy.speed *= 0.5; enemy.status = 'congelacion'; }
        this.alive = false;
        if (enemy.hp <= 0) enemy.alive = false;
        if (this.player) this.player.eventBus.emit('ENEMY_HIT', { enemy });
        break;
      }
    }
  }
}

// ==================== SISTEMA DE CARGA ====================
class ChargeService {
  constructor(eventBus, player) {
    this.eventBus = eventBus;
    this.player = player;
    this.hitCounter = 0;
    this.hitsNeeded = CONFIG.chargePerHit;
    eventBus.on('ENEMY_HIT', this.onEnemyHit.bind(this));
    eventBus.on('PARRY_SUCCESS', this.onParrySuccess.bind(this));
    eventBus.on('PLAYER_DAMAGED', this.onPlayerDamaged.bind(this));
  }
  onEnemyHit({ enemy }) {
    if (this.player.talents.includes('golpes_contundentes')) {
      this.hitCounter++;
      if (this.hitCounter >= 2) {
        this.addCharge(1);
        this.hitCounter = 0;
      }
    } else {
      this.hitCounter++;
      if (this.hitCounter >= this.hitsNeeded) {
        this.addCharge(1);
        this.hitCounter = 0;
      }
    }
  }
  onParrySuccess() {
    let amount = 2;
    if (this.player.talents.includes('parry_letal')) amount = 3;
    this.addCharge(amount);
  }
  onPlayerDamaged() {
    if (this.player.talents.includes('sed_de_sangre') || this.player.trinkets.some(t=>t.id==='medallon_martir')) {
      this.addCharge(2);
    }
  }
  addCharge(amount) {
    this.player.currentCharges = Math.min(this.player.maxCharges, this.player.currentCharges + amount);
    this.eventBus.emit('CHARGES_UPDATED', { charges: this.player.currentCharges });
  }
  consumeCharge(amount) {
    if (this.player.currentCharges >= amount) {
      this.player.currentCharges -= amount;
      this.eventBus.emit('CHARGES_UPDATED', { charges: this.player.currentCharges });
      return true;
    }
    return false;
  }
}

// ==================== TALENTOS ====================
class TalentService {
  constructor() {
    this.talentsDB = [
      { id: 'golpes_contundentes', name: 'Golpes contundentes', desc: 'Generas 1 carga cada 2 golpes (antes 3)', req: { strength: 3 } },
      { id: 'grito_de_guerra', name: 'Grito de guerra', desc: 'Cura 20% HP (cuesta 3 cargas, tecla Q)', req: { strength: 5, vitality: 3 }, skill: true },
      { id: 'sed_de_sangre', name: 'Sed de sangre', desc: 'Al recibir daño generas 2 cargas', req: { strength: 4, vitality: 2 } },
      { id: 'parry_letal', name: 'Parry letal', desc: 'Parry perfecto otorga 3 cargas en lugar de 2', req: { dexterity: 5 } },
      { id: 'disparo_doble', name: 'Disparo doble', desc: 'El arco dispara 2 proyectiles (cuesta 1 carga, tecla Q)', req: { dexterity: 4 }, skill: true },
      { id: 'maestria_elemental', name: 'Maestría elemental', desc: 'Tus proyectiles elementales dejan charco de daño', req: { intelligence: 4 } },
      { id: 'mente_clara', name: 'Mente clara', desc: 'Generas 1 carga cada 10 seg', req: { intelligence: 3 }, passive: true }
    ];
  }

  getAvailableTalents(player) {
    return this.talentsDB.filter(t => !player.talents.includes(t.id) && this._meetsRequirements(t.req, player.stats));
  }
  unlockTalent(player, talentId) {
    const talent = this.talentsDB.find(t => t.id === talentId);
    if (!talent || player.talents.includes(talentId)) return false;
    if (!this._meetsRequirements(talent.req, player.stats)) return false;
    player.talents.push(talentId);
    if (talent.id === 'mente_clara') {
      player._passiveChargeInterval = setInterval(() => {
        if (player.eventBus) player.eventBus.emit('PASSIVE_CHARGE', {});
      }, 10000);
    }
    if (talent.id === 'grito_de_guerra') player.abilities.specialSkill = 'grito_de_guerra';
    if (talent.id === 'disparo_doble') player.abilities.specialSkill = 'disparo_doble';
    return true;
  }
  _meetsRequirements(req, stats) {
    for (let [stat, value] of Object.entries(req)) {
      if ((stats[stat] || 0) < value) return false;
    }
    return true;
  }
}

// ==================== JUGADOR ====================
class Player {
  constructor(eventBus) {
    this.eventBus = eventBus;
    this.x = 100; this.y = 100;
    this.vx = 0; this.vy = 0;
    this.radius = CONFIG.playerRadius;
    this.hp = CONFIG.maxHp; this.maxHp = CONFIG.maxHp;
    this.abilities = { doubleJump: false, dash: false, hookGrab: false, hookSwing: false, specialSkill: null };
    this.dashLevel = 1;
    this.grappleLevel = 1;
    this.invincible = false; this.invincibleTimer = 0;
    this.dashCooldown = 0;
    this.meleeCooldown = 0;
    this.projectileCooldown = 0;
    this.grounded = false;
    this.facingRight = true;
    this.modules = [];
    this.profile = new NormalProfile();
    this.state = null;
    this.states = {
      idle: new IdleState(this),
      run: new RunState(this),
      jump: new JumpState(this),
      fall: new FallState(this),
      dash: new DashState(this),
      hookPull: new HookPullState(this),
      hookSwing: new HookSwingState(this)
    };
    this.setState('idle');
    this.hookState = { active: false, tip: null, anchor: null, type: null };
    this.hookCooldown = 0;
    this.hookAirUses = 0;
    this.isWallStuck = false; this.wallDir = 0;

    this.stats = { strength: 1, dexterity: 1, intelligence: 1, vitality: 1 };
    this.level = 1;
    this.xp = 0;
    this.xpToNext = 100;
    this.talents = [];
    this.trinkets = [];
    this.currentCharges = 0;
    this.maxCharges = CONFIG.maxCharges;
    this.damageResistance = 1.0;
    this.weapon = new Sword();
    this.chargeService = new ChargeService(eventBus, this);
    this.talentService = new TalentService();
    eventBus.on('PASSIVE_CHARGE', () => this.chargeService.addCharge(1));
  }

  setState(name) {
    if (this.state) this.state.exit();
    this.state = this.states[name];
    this.state.enter();
  }

  setMovementProfile(profile) { this.profile = profile; }

  takeDamage(amount) {
    if (this.invincible) return false;
    amount = Math.ceil(amount * this.damageResistance);
    this.hp -= amount;
    this.eventBus.emit('PLAYER_DAMAGED', { amount });
    if (this.hp <= 0) { this.hp = 0; return true; }
    this.invincible = true;
    this.invincibleTimer = CONFIG.invulnerabilityTime;
    return false;
  }

  gainXP(amount) {
    this.xp += amount;
    while (this.xp >= this.xpToNext && this.level < 20) {
      this.level++;
      this.xp -= this.xpToNext;
      this.xpToNext = Math.floor(this.xpToNext * CONFIG.xpCurveExponent);
      const cycle = ['strength','dexterity','intelligence'];
      const idx = (this.level - 2) % 3;
      this.stats[cycle[idx]]++;
    }
  }

  update(dt, input, roomState) {
    if (!roomState) return;
    this.dashCooldown = Math.max(0, this.dashCooldown - dt);
    this.hookCooldown = Math.max(0, this.hookCooldown - dt);
    this.meleeCooldown = Math.max(0, this.meleeCooldown - dt);
    this.projectileCooldown = Math.max(0, this.projectileCooldown - dt);
    this.invincibleTimer = Math.max(0, this.invincibleTimer - dt);
    if (this.invincibleTimer <= 0) this.invincible = false;
    if (this.weapon) this.weapon.update(dt);

    const move = input.getMove();
    if (!(this.state instanceof DashState) && !(this.state instanceof HookPullState) && !(this.state instanceof HookSwingState)) {
      const vel = this.profile.getDesiredVelocity(input, this);
      this.vx = vel.vx;
    }

    const currentGravity = (this.profile.name === 'slime' && this.isWallStuck) ? 400 : CONFIG.gravity;
    if (!this.grounded && !(this.state instanceof HookSwingState)) {
      this.vy += currentGravity * dt;
    }

    if (input.isDashPressed() && this.abilities.dash && this.dashCooldown <= 0 && this.profile.canDash(this)) {
      let angle = this.facingRight ? 0 : Math.PI;
      if (this.profile.name === 'slime') angle = input.getAimAngle();
      const dashSpeed = CONFIG.dashBaseSpeed * (1 + (this.dashLevel - 1) * (CONFIG.dashLevelMultiplier - 1));
      this.vx = Math.cos(angle) * dashSpeed;
      this.vy = Math.sin(angle) * dashSpeed;
      this.dashCooldown = (this.profile.name === 'dashMaster') ? 0 : CONFIG.dashCooldown / this.dashLevel;
      if (this.profile.name === 'slime') this._slimeDashAttack(roomState);
      this.setState('dash');
    }

    const jumpPressed = input.isJumpPressed();
    if (jumpPressed && this.grounded && !(this.state instanceof DashState)) {
      this.vy = -CONFIG.jumpForce;
      this.isWallStuck = false;
      this.setState('jump');
    } else if (jumpPressed && this.abilities.doubleJump && !this.grounded && !this.isWallStuck && !(this.state instanceof DashState)) {
      this.vy = -CONFIG.doubleJumpForce;
      this.setState('jump');
    }

    this._moveWithCollision(dt, roomState);

    if (this.grounded) {
      this.isWallStuck = false;
      this.hookAirUses = 0;
    }

    if (this.state instanceof IdleState && Math.abs(this.vx) > 10 && this.grounded) this.setState('run');
    if (this.state instanceof RunState && Math.abs(this.vx) < 1 && this.grounded) this.setState('idle');
    if (!this.grounded && !(this.state instanceof JumpState) && !(this.state instanceof FallState) && !(this.state instanceof DashState) && !(this.state instanceof HookPullState) && !(this.state instanceof HookSwingState))
      this.setState('fall');

    if (input.isMeleePressed() && this.weapon instanceof Sword) {
      this.weapon.attack(this, roomState, input);
    }
    if (input.isProjectilePressed() && this.weapon instanceof Bow) {
      this.weapon.attack(this, roomState, input);
    }

    if (input.isSpecialPressed() && this.abilities.specialSkill) {
      if (this.abilities.specialSkill === 'grito_de_guerra' && this.chargeService.consumeCharge(3)) {
        this.hp = Math.min(this.maxHp, this.hp + Math.ceil(this.maxHp * 0.2));
      } else if (this.abilities.specialSkill === 'disparo_doble' && this.chargeService.consumeCharge(1)) {
        const mod = this.modules[0] || null;
        const element = mod ? mod.element : 'fisico';
        const color = mod ? mod.color : '#ff0';
        for (let i = -1; i <= 1; i+=2) {
          const angle = this.facingRight ? i * 0.2 : Math.PI + i * 0.2;
          const p = new PlayerProjectile(
            this.x + Math.cos(angle)*(this.radius+6), this.y + Math.sin(angle)*(this.radius+6),
            Math.cos(angle)*CONFIG.projectileSpeed, Math.sin(angle)*CONFIG.projectileSpeed,
            CONFIG.projectileDamage + this.stats.dexterity, element, color, CONFIG.projectileLifetime, this
          );
          if (!roomState.playerProjectiles) roomState.playerProjectiles = [];
          roomState.playerProjectiles.push(p);
        }
      }
    }

    if (input.isHookPressed() && this.hookCooldown <= 0 && !this.hookState.active) {
      const canUse = this.grounded || this.hookAirUses < CONFIG.maxHookAirUses;
      if (canUse) {
        if (this.abilities.hookGrab) {
          this._launchHook('grab', input.getAimAngle());
          if (!this.grounded) this.hookAirUses++;
        } else if (this.abilities.hookSwing) {
          this._launchHook('swing', input.getAimAngle());
          if (!this.grounded) this.hookAirUses++;
        }
      }
    }

    this.facingRight = this.vx !== 0 ? this.vx > 0 : this.facingRight;
  }

  _moveWithCollision(dt, roomState) {
    if (this.state instanceof DashState) {
      const totalSteps = CONFIG.dashSubSteps;
      const stepDt = dt / totalSteps;
      for (let i = 0; i < totalSteps; i++) {
        this.x += this.vx * stepDt;
        this.y += this.vy * stepDt;
        const collided = this._resolveCollisions(roomState);
        if (collided) { this.vx = 0; this.vy = 0; this.setState('idle'); break; }
      }
    } else {
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      this._resolveCollisions(roomState);
    }
  }

  _resolveCollisions(roomState) {
    const ts = CONFIG.tileSize;
    const left = this.x - this.radius, right = this.x + this.radius;
    const top = this.y - this.radius, bottom = this.y + this.radius;
    const colL = Math.floor(left / ts), colR = Math.floor(right / ts);
    const rowT = Math.floor(top / ts), rowB = Math.floor(bottom / ts);
    let collided = false;
    this.grounded = false;

    for (let row = rowT; row <= rowB; row++) {
      for (let col = colL; col <= colR; col++) {
        if (row < 0 || row >= roomState.tiles.length || col < 0 || col >= roomState.tiles[0].length) continue;
        if (roomState.tiles[row][col] === 1) {
          const tileLeft = col * ts, tileRight = (col+1) * ts;
          const tileTop = row * ts, tileBottom = (row+1) * ts;
          const overlapX = Math.min(right - tileLeft, tileRight - left);
          const overlapY = Math.min(bottom - tileTop, tileBottom - top);
          if (overlapX > 0 && overlapY > 0) {
            collided = true;
            if (overlapX < overlapY) {
              const pushDir = (this.x < tileLeft + ts/2) ? -1 : 1;
              this.x += pushDir * overlapX;
              this.vx = 0;
              if (this.profile.handleWallCollision(this, { normalX: pushDir, overlap: overlapX }, 0)) {}
            } else {
              const pushDir = (this.y < tileTop + ts/2) ? -1 : 1;
              this.y += pushDir * overlapY;
              this.vy = 0;
              if (pushDir > 0) this.grounded = true;
            }
          }
        }
      }
    }
    return collided;
  }

  _slimeDashAttack(roomState) {
    for (const enemy of roomState.enemies) {
      if (!enemy.alive) continue;
      if (Math.hypot(enemy.x - this.x, enemy.y - this.y) < enemy.radius + this.radius + 5) {
        enemy.hp -= 3;
        if (enemy.hp <= 0) enemy.alive = false;
      }
    }
  }

  _launchHook(type, aimAngle) {
    const range = (type === 'grab') ? CONFIG.hookGrabRange : CONFIG.hookSwingRange;
    this.hookState.type = type;
    this.hookState.tip = {
      x: this.x + Math.cos(aimAngle) * (this.radius + 5),
      y: this.y + Math.sin(aimAngle) * (this.radius + 5)
    };
    this.hookState.direction = { cos: Math.cos(aimAngle), sin: Math.sin(aimAngle) };
    this.hookState.traveled = 0;
  }

  updateHook(dt, roomState) {
    if (!this.hookState.tip) return;
    const speed = CONFIG.hookGrabSpeed * dt;
    this.hookState.tip.x += this.hookState.direction.cos * speed;
    this.hookState.tip.y += this.hookState.direction.sin * speed;
    this.hookState.traveled += speed;
    const col = Math.floor(this.hookState.tip.x / CONFIG.tileSize);
    const row = Math.floor(this.hookState.tip.y / CONFIG.tileSize);
    const maxRange = (this.hookState.type === 'grab') ? CONFIG.hookGrabRange : CONFIG.hookSwingRange;
    const tiles = roomState.tiles;
    if (row >= 0 && row < tiles.length && col >= 0 && col < tiles[0].length) {
      const tile = tiles[row][col];
      const canGrapple = (tile === CONFIG.grappleTileBasic && this.grappleLevel >= 1) ||
                         (tile === CONFIG.grappleTileAdvanced && this.grappleLevel >= 2) ||
                         (tile === CONFIG.grappleTileMaster && this.grappleLevel >= 3);
      if (canGrapple) {
        this.hookState.anchor = { x: col * CONFIG.tileSize + CONFIG.tileSize/2, y: row * CONFIG.tileSize + CONFIG.tileSize/2 };
        this.hookState.tip = null;
        this.hookCooldown = (this.hookState.type === 'grab') ? CONFIG.hookGrabCooldown : CONFIG.hookSwingCooldown;
        if (this.hookState.type === 'grab') this.setState('hookPull');
        else if (this.hookState.type === 'swing') this.setState('hookSwing');
        return;
      } else if (tile === 1 || this.hookState.traveled >= maxRange) {
        this.hookState.active = false; this.hookState.tip = null;
        this.hookCooldown = (this.hookState.type === 'grab') ? CONFIG.hookGrabCooldown : CONFIG.hookSwingCooldown;
      }
    } else if (this.hookState.traveled >= maxRange) {
      this.hookState.active = false; this.hookState.tip = null;
      this.hookCooldown = (this.hookState.type === 'grab') ? CONFIG.hookGrabCooldown : CONFIG.hookSwingCooldown;
    }
  }
}

// ==================== ENEMIGO ====================
class Enemy {
  constructor(x, y, type='chase', data={}) {
    this.x = x; this.y = y; this.radius = data.radius || 12;
    this.hp = data.hp || CONFIG.enemyDefaultHp; this.maxHp = this.hp;
    this.damage = data.damage || CONFIG.enemyDefaultDamage;
    this.speed = data.speed || CONFIG.enemyDefaultSpeed;
    this.alive = true; this.type = type;
    this.color = data.color || '#f00';
    this.reflectProjectiles = data.reflectProjectiles || false;
    this.status = null; this.vx = 0; this.vy = 0;
    this.isBoss = data.isBoss || false;
    this.pattern = data.pattern || null;
    this.phaseIndex = 0;
    this.attackTimer = 0;
    this.currentPhaseAttacks = [];
    this._dropped = false;
  }

  update(dt, player, roomState) {
    if (!this.alive) return;
    if (this.isBoss && this.pattern) {
      this._updateBossAI(dt, player, roomState);
      return;
    }
    const dx = player.x - this.x, dy = player.y - this.y;
    const dist = Math.hypot(dx, dy);
    if (dist > 1) {
      this.vx = (dx/dist) * this.speed; this.vy = (dy/dist) * this.speed;
      this.x += this.vx * dt; this.y += this.vy * dt;
    }
    for (const other of roomState.enemies) {
      if (other === this || !other.alive) continue;
      const ddx = this.x - other.x, ddy = this.y - other.y;
      const d = Math.hypot(ddx, ddy);
      const minDist = this.radius + other.radius;
      if (d < minDist && d > 0) {
        const force = (minDist - d) * 0.5;
        this.x += (ddx/d) * force * dt;
        this.y += (ddy/d) * force * dt;
      }
    }
    this._collideWithTiles(roomState);
  }

  _collideWithTiles(roomState) {
    const ts = CONFIG.tileSize;
    const left = this.x - this.radius, right = this.x + this.radius;
    const top = this.y - this.radius, bottom = this.y + this.radius;
    for (let row = Math.floor(top/ts); row <= Math.floor(bottom/ts); row++) {
      for (let col = Math.floor(left/ts); col <= Math.floor(right/ts); col++) {
        if (row<0||row>=roomState.tiles.length||col<0||col>=roomState.tiles[0].length) continue;
        if (roomState.tiles[row][col] === 1) {
          if (right > col*ts && left < col*ts) { this.x = col*ts - this.radius; this.vx = 0; }
          else if (left < (col+1)*ts && right > (col+1)*ts) { this.x = (col+1)*ts + this.radius; this.vx = 0; }
          if (bottom > row*ts && top < row*ts) { this.y = row*ts - this.radius; this.vy = 0; }
          else if (top < (row+1)*ts && bottom > (row+1)*ts) { this.y = (row+1)*ts + this.radius; this.vy = 0; }
        }
      }
    }
  }

  _updateBossAI(dt, player, roomState) {
    if (!this.pattern) return;
    let newPhaseIdx = 0;
    for (let i = 0; i < this.pattern.length; i++) {
      if (this.hp / this.maxHp <= (this.pattern[i].hpThreshold || 1.0)) {
        newPhaseIdx = i;
      }
    }
    if (newPhaseIdx !== this.phaseIndex) {
      this.phaseIndex = newPhaseIdx;
      this.attackTimer = 0;
      this.currentPhaseAttacks = [...(this.pattern[this.phaseIndex].attacks || [])];
    }
    if (this.currentPhaseAttacks.length === 0) return;
    this.attackTimer -= dt;
    if (this.attackTimer <= 0) {
      const attack = this.currentPhaseAttacks[Math.floor(Math.random() * this.currentPhaseAttacks.length)];
      this._executeBossAttack(attack, player, roomState);
      this.attackTimer = (attack.cooldown || 2.0) + (Math.random() * 0.5);
    }
    this.x += Math.sin(performance.now()*0.001) * this.speed * dt;
  }

  _executeBossAttack(attack, player, roomState) {
    if (attack.type === 'spread') {
      const count = attack.count || 5;
      const angleStep = (Math.PI * 2) / count;
      for (let i = 0; i < count; i++) {
        const angle = angleStep * i;
        const speed = attack.speed || 200;
        const projectile = new PlayerProjectile(
          this.x, this.y,
          Math.cos(angle) * speed, Math.sin(angle) * speed,
          this.damage, 'fisico', attack.color || '#f00', 3.0, null
        );
        projectile.isEnemyProjectile = true;
        if (!roomState.enemyProjectiles) roomState.enemyProjectiles = [];
        roomState.enemyProjectiles.push(projectile);
      }
    } else if (attack.type === 'charge') {
      const dx = player.x - this.x, dy = player.y - this.y;
      const dist = Math.hypot(dx, dy) || 1;
      this.vx = (dx/dist) * attack.speedMultiplier * CONFIG.enemyDefaultSpeed;
      this.vy = (dy/dist) * attack.speedMultiplier * CONFIG.enemyDefaultSpeed;
      setTimeout(() => { this.vx = 0; this.vy = 0; }, 500);
    }
  }
}

// ==================== SALA ====================
class RoomState {
  constructor(id, tiles, doors, enemies, objects, widthTiles, heightTiles) {
    this.id = id; this.tiles = tiles; this.doors = doors;
    this.enemies = enemies; this.objects = objects;
    this.playerProjectiles = []; this.meleeEffects = [];
    this.drops = []; this.visited = false;
    this.width = widthTiles * CONFIG.tileSize;
    this.height = heightTiles * CONFIG.tileSize;
  }
}

class MapGraph {
  constructor() { this.rooms = {}; }
  getRoom(id) { return this.rooms[id]; }
  addRoom(id, room) { this.rooms[id] = room; }
}

// ==================== SERVICIOS ====================
class PhysicsService {
  checkEnemyPlayerCollisions(roomState, player, eventBus) {
    if (!roomState) return;
    for (const enemy of roomState.enemies) {
      if (!enemy.alive) continue;
      if (Math.hypot(enemy.x-player.x, enemy.y-player.y) < enemy.radius+player.radius) {
        const died = player.takeDamage(enemy.damage);
        if (died) eventBus.emit('PLAYER_DIED', {});
      }
    }
    if (roomState.enemyProjectiles) {
      for (const p of roomState.enemyProjectiles) {
        if (!p.alive) continue;
        if (Math.hypot(p.x-player.x, p.y-player.y) < p.radius+player.radius) {
          const died = player.takeDamage(p.damage);
          p.alive = false;
          if (died) eventBus.emit('PLAYER_DIED', {});
        }
      }
    }
  }
  checkObjectPickups(roomState, player, eventBus) {
    if (!roomState) return;
    for (const obj of roomState.objects) {
      if (obj.collected) continue;
      if (Math.hypot(obj.x-player.x, obj.y-player.y) < player.radius+8) {
        obj.collected = true;
        eventBus.emit('OBJECT_COLLECTED', { object: obj, player });
      }
    }
  }
  updateProjectiles(roomState, player, eventBus, dt) {
    if (roomState.playerProjectiles) {
      for (let i=roomState.playerProjectiles.length-1; i>=0; i--) {
        const p = roomState.playerProjectiles[i];
        p.update(dt, roomState);
        if (!p.alive) roomState.playerProjectiles.splice(i,1);
      }
    }
    if (roomState.enemyProjectiles) {
      for (let i=roomState.enemyProjectiles.length-1; i>=0; i--) {
        const p = roomState.enemyProjectiles[i];
        p.update(dt, roomState);
        if (!p.alive) roomState.enemyProjectiles.splice(i,1);
      }
    }
  }
  updateDrops(roomState, player, eventBus) {
    if (!roomState || !roomState.drops) return;
    for (const drop of roomState.drops) {
      if (!drop.alive) continue;
      if (Math.hypot(drop.x-player.x, drop.y-player.y) < player.radius+6) {
        drop.alive = false;
        const modData = CONFIG.modules[drop.element] || { name: drop.element, element: drop.element, color: '#fff' };
        player.modules.push({ name: modData.name, element: modData.element, color: modData.color });
        eventBus.emit('MODULE_PICKED', { module: modData });
      }
    }
  }
}

// ==================== ORQUESTADOR ====================
class Game {
  constructor(canvas, inputPort, rendererPort, persistencePort) {
    this.canvas = canvas; this.input = inputPort;
    this.renderer = rendererPort; this.persistence = persistencePort;
    this.eventBus = new EventBus();
    this.physicsService = new PhysicsService();
    this.mapGraph = new MapGraph();
    this.player = new Player(this.eventBus);
    this.currentRoomId = null; this.currentRoomState = null;
    this._previousRoomId = null;
    this.camera = { x:0, y:0 };
    this.paused = false;
    this._loadPlayerPersistence();
    this._loadRooms()
      .finally(() => {
        this._switchRoom(CONFIG.startRoomId);
        this._initSideMenu();
        this._bindEvents();
        this._lastTime = performance.now();
        this._loop();
      });
  }

  async _loadRooms() {
    // Sala inicial con módulo de fuego
    const tiles00 = new Array(15).fill().map(() => new Array(20).fill(0));
    for (let r=0; r<15; r++) { tiles00[r][0]=1; tiles00[r][19]=1; }
    for (let c=0; c<20; c++) { tiles00[0][c]=1; tiles00[14][c]=1; }
    tiles00[5][7]=CONFIG.grappleTileBasic; tiles00[6][7]=CONFIG.grappleTileBasic;
    const room00 = new RoomState('0,0', tiles00,
      [{row:1,col:19,targetRoomId:'1,0',requiredAbility:null,estado:'abierta'}], [],
      [{x:200,y:200,type:'module',collected:false,color:'#f60',moduleData:{element:'fuego',name:'Fuego',color:'#f60'}}],
      20, 15);
    this.mapGraph.addRoom('0,0', room00);

    // Sala con enemigo normal y puerta a sala del jefe
    const tiles10 = new Array(15).fill().map(() => new Array(20).fill(0));
    for (let r=0; r<15; r++) { tiles10[r][0]=1; tiles10[r][19]=1; }
    for (let c=0; c<20; c++) { tiles10[0][c]=1; tiles10[14][c]=1; }
    tiles10[7][5]=CONFIG.grappleTileAdvanced;
    const room10 = new RoomState('1,0', tiles10,
      [{row:1,col:0,targetRoomId:'0,0',requiredAbility:null,estado:'abierta'},
       {row:7,col:19,targetRoomId:'2,0',requiredAbility:null,estado:'abierta'}],
      [new Enemy(400,300,'chase',{hp:3,damage:1,speed:60,color:'#f00'})],
      [{x:600,y:200,type:'ability',ability:'doubleJump',collected:false,color:'#0ff'}],
      20, 15);
    this.mapGraph.addRoom('1,0', room10);

    // Sala del jefe
    const tiles20 = new Array(20).fill().map(() => new Array(30).fill(0));
    for (let r=0; r<20; r++) { tiles20[r][0]=1; tiles20[r][29]=1; }
    for (let c=0; c<30; c++) { tiles20[0][c]=1; tiles20[19][c]=1; }
    tiles20[10][10]=CONFIG.grappleTileMaster;
    const bossPattern = [
      { hpThreshold: 1.0, attacks: [{ type: 'spread', count: 8, speed: 150, cooldown: 3.0, color: '#f0f' }] },
      { hpThreshold: 0.5, attacks: [{ type: 'spread', count: 12, speed: 180, cooldown: 2.5, color: '#f0f' }] }
    ];
    const bossEnemy = new Enemy(400, 200, 'chase', {
      hp: 15, damage: 2, speed: 0, color: '#f0f', radius: 20,
      isBoss: true, pattern: bossPattern
    });
    const room20 = new RoomState('2,0', tiles20,
      [{row:1,col:0,targetRoomId:'1,0',requiredAbility:null,estado:'abierta'}],
      [bossEnemy],
      [],
      30, 20);
    this.mapGraph.addRoom('2,0', room20);
  }

  _switchRoom(roomId) {
    if (this.currentRoomState) this.persistence.saveRoomState(this.currentRoomId, this.currentRoomState);
    this._previousRoomId = this.currentRoomId;
    this.currentRoomId = roomId;
    const template = this.mapGraph.getRoom(roomId);
    if (!template) { this.currentRoomState = null; return; }
    const saved = this.persistence.loadRoomState(roomId);
    this.currentRoomState = saved || new RoomState(
      template.id, template.tiles.map(r=>[...r]), template.doors.map(d=>({...d})),
      template.enemies.map(e=>new Enemy(e.x,e.y,e.type,{hp:e.hp,damage:e.damage,speed:e.speed,color:e.color,reflectProjectiles:e.reflectProjectiles,isBoss:e.isBoss,pattern:e.pattern,radius:e.radius})),
      template.objects.map(o=>({...o})), template.width/CONFIG.tileSize, template.height/CONFIG.tileSize
    );
    this.currentRoomState.visited = true;
    const entry = this.currentRoomState.doors.find(d=>d.targetRoomId===this._previousRoomId);
    if (entry) { this.player.x = entry.col*CONFIG.tileSize+CONFIG.tileSize/2; this.player.y = entry.row*CONFIG.tileSize+CONFIG.tileSize/2; }
    else { this.player.x = this.currentRoomState.width/2; this.player.y = this.currentRoomState.height/2; }
    if (!this.currentRoomState.playerProjectiles) this.currentRoomState.playerProjectiles = [];
    if (!this.currentRoomState.meleeEffects) this.currentRoomState.meleeEffects = [];
    if (!this.currentRoomState.drops) this.currentRoomState.drops = [];
    if (!this.currentRoomState.enemyProjectiles) this.currentRoomState.enemyProjectiles = [];
    this._clampCamera();
  }

  _clampCamera() {
    if (!this.currentRoomState) return;
    const roomW = this.currentRoomState.width, roomH = this.currentRoomState.height;
    const canvasW = this.canvas.width, canvasH = this.canvas.height;
    let camX = this.player.x - canvasW/2, camY = this.player.y - canvasH/2;
    camX = Math.max(0, Math.min(camX, roomW - canvasW));
    camY = Math.max(0, Math.min(camY, roomH - canvasH));
    if (roomW < canvasW) camX = -(canvasW - roomW)/2;
    if (roomH < canvasH) camY = -(canvasH - roomH)/2;
    this.camera.x = camX; this.camera.y = camY;
  }

  _checkDoors() {
    if (!this.currentRoomState) return;
    for (const door of this.currentRoomState.doors) {
      if (door.estado==='cerrada' && door.requiredAbility && this.player.abilities[door.requiredAbility]) {
        door.estado='abierta'; this.eventBus.emit('DOOR_OPENED', {roomId:this.currentRoomId, door});
      }
      const dx = door.col*CONFIG.tileSize+CONFIG.tileSize/2, dy = door.row*CONFIG.tileSize+CONFIG.tileSize/2;
      if (Math.hypot(this.player.x-dx, this.player.y-dy) < CONFIG.tileSize/2+this.player.radius) {
        if (door.estado==='abierta' && this.input.isInteractPressed()) {
          this._switchRoom(door.targetRoomId); break;
        }
      }
    }
  }

  _loadPlayerPersistence() {
    const s = this.persistence.load();
    if (s.abilities) Object.assign(this.player.abilities, s.abilities);
    if (s.modules) this.player.modules = s.modules;
    if (s.dashLevel) this.player.dashLevel = s.dashLevel;
    if (s.grappleLevel) this.player.grappleLevel = s.grappleLevel;
    if (s.profileName) this.player.setMovementProfile(this._createProfileByName(s.profileName));
    if (s.talents) this.player.talents = s.talents;
    if (s.trinkets) {
      s.trinkets.forEach(tId => {
        if (TRINKETS[tId]) {
          const trinket = TRINKETS[tId];
          this.player.trinkets.push(trinket);
          trinket.apply(this.player);
        }
      });
    }
    if (s.stats) Object.assign(this.player.stats, s.stats);
    if (s.level) this.player.level = s.level;
    if (s.xp) this.player.xp = s.xp;
  }

  _createProfileByName(name) {
    switch(name) {
      case 'jumpOnly': return new JumpOnlyProfile();
      case 'slippery': return new SlipperyProfile();
      case 'dashMaster': return new DashMasterProfile();
      case 'slime': return new SlimeProfile();
      default: return new NormalProfile();
    }
  }

  _savePlayerPersistence() {
    this.persistence.save({
      abilities: {...this.player.abilities},
      modules: this.player.modules,
      profileName: this.player.profile.name,
      dashLevel: this.player.dashLevel,
      grappleLevel: this.player.grappleLevel,
      talents: this.player.talents,
      trinkets: this.player.trinkets.map(t=>t.id),
      stats: this.player.stats,
      level: this.player.level,
      xp: this.player.xp
    });
  }

  _bindEvents() {
    this.eventBus.on('OBJECT_COLLECTED', ({object, player}) => {
      if (object.type==='module' && object.moduleData) {
        player.modules.push(object.moduleData);
        this._savePlayerPersistence();
      } else if (object.type==='ability' && object.ability) {
        player.abilities[object.ability] = true;
        this._savePlayerPersistence();
      }
    });
    this.eventBus.on('PLAYER_DIED', () => {
      alert('¡Has muerto!'); this.player.hp=CONFIG.maxHp;
      this._switchRoom(CONFIG.startRoomId);
    });
    this.eventBus.on('ENEMY_HIT', ({enemy}) => {
      if (!enemy.alive) {
        this.player.gainXP(CONFIG.baseXPPerKill);
        this._savePlayerPersistence();
      }
    });
  }

  _initSideMenu() {
    this.menuPanel = document.getElementById('side-menu');
    document.getElementById('menu-close').addEventListener('click', ()=>this.toggleMenu());
    document.addEventListener('keydown', e => { if (e.key==='Tab') { e.preventDefault(); this.toggleMenu(); } });
    this.tabButtons = document.querySelectorAll('#side-menu .tab-buttons button');
    this.tabContents = {
      architect: document.getElementById('tab-architect'),
      talents: document.getElementById('tab-talents'),
      modules: document.getElementById('tab-modules')
    };
    this.tabButtons.forEach(btn => btn.addEventListener('click', ()=>this._switchTab(btn.dataset.tab)));
    this._buildArchitectTab();
    this._buildTalentsTab();
  }

  _switchTab(id) {
    this.tabButtons.forEach(b=>b.classList.remove('active'));
    document.querySelector(`[data-tab="${id}"]`).classList.add('active');
    Object.values(this.tabContents).forEach(d=>d.classList.remove('active'));
    this.tabContents[id].classList.add('active');
    if (id==='modules') this._refreshModulesTab();
    if (id==='talents') this._buildTalentsTab();
  }

  toggleMenu() {
    if (this.menuPanel.style.display==='block') { this.menuPanel.style.display='none'; this.paused=false; }
    else { this.paused=true; this._refreshModulesTab(); this._buildTalentsTab(); this._switchTab('architect'); this.menuPanel.style.display='block'; }
  }

  _buildArchitectTab() {
    let html = '<h4>Físicas</h4>';
    html += `Gravedad: <input type="range" min="200" max="1500" value="${CONFIG.gravity}" oninput="CONFIG.gravity=parseFloat(this.value)"><br>`;
    html += `Salto: <input type="range" min="100" max="600" value="${CONFIG.jumpForce}" oninput="CONFIG.jumpForce=parseFloat(this.value)"><br>`;
    html += `Velocidad: <input type="range" min="100" max="500" value="${CONFIG.moveSpeed}" oninput="CONFIG.moveSpeed=parseFloat(this.value)"><br>`;
    html += '<h4>Perfiles</h4>';
    ['normal','jumpOnly','slippery','dashMaster','slime'].forEach(p => {
      html += `<button style="${this.player.profile.name===p?'background:#0f0;':''}" onclick="window.__game.player.setMovementProfile(window.__game._createProfileByName('${p}'));window.__game._savePlayerPersistence();">${p}</button> `;
    });
    html += '<h4>Habilidades</h4>';
    html += `<button style="${this.player.abilities.doubleJump?'background:#0f0;':''}" onclick="window.__game.player.abilities.doubleJump=!window.__game.player.abilities.doubleJump;window.__game._savePlayerPersistence();">Doble salto</button> `;
    html += `<button style="${this.player.abilities.dash?'background:#0f0;':''}" onclick="window.__game.player.abilities.dash=!window.__game.player.abilities.dash;window.__game._savePlayerPersistence();">Dash</button><br>`;
    html += `<button style="${this.player.abilities.hookGrab?'background:#0f0;':''}" onclick="window.__game.player.abilities.hookGrab=!window.__game.player.abilities.hookGrab;window.__game.player.abilities.hookSwing=false;window.__game._savePlayerPersistence();">Gancho arrastre</button> `;
    html += `<button style="${this.player.abilities.hookSwing?'background:#0f0;':''}" onclick="window.__game.player.abilities.hookSwing=!window.__game.player.abilities.hookSwing;window.__game.player.abilities.hookGrab=false;window.__game._savePlayerPersistence();">Gancho balanceo</button><br>`;
    html += '<h4>Estadísticas</h4>';
    html += `Fuerza: ${this.player.stats.strength} | Destreza: ${this.player.stats.dexterity} | Inteligencia: ${this.player.stats.intelligence}<br>`;
    html += `Nivel: ${this.player.level} | XP: ${this.player.xp}/${this.player.xpToNext}<br>`;
    html += '<h4>Trinkets</h4>';
    for (let [id, trinket] of Object.entries(TRINKETS)) {
      const equipped = this.player.trinkets.some(t=>t.id===id);
      html += `<button style="${equipped?'background:#0f0;':''}" onclick="window.__game._toggleTrinket('${id}')">${trinket.name}</button><br>`;
    }
    html += '<h4>Arma</h4>';
    html += `<button style="${this.player.weapon instanceof Sword?'background:#0f0;':''}" onclick="window.__game.player.weapon = new Sword();">Espada</button> `;
    html += `<button style="${this.player.weapon instanceof Bow?'background:#0f0;':''}" onclick="window.__game.player.weapon = new Bow();">Arco</button>`;
    html += '<hr><button onclick="window.__game.player.hp=CONFIG.maxHp">Curar</button>';
    this.tabContents.architect.innerHTML = html;
  }

  _buildTalentsTab() {
    let html = '<h4>🌟 Talentos disponibles</h4>';
    const available = this.player.talentService.getAvailableTalents(this.player);
    if (available.length === 0) html += '<p>No hay talentos disponibles (sube tus estadísticas).</p>';
    else {
      available.forEach(t => {
        html += `<button onclick="window.__game.player.talentService.unlockTalent(window.__game.player, '${t.id}');window.__game._savePlayerPersistence();window.__game._buildTalentsTab();">${t.name}: ${t.desc}</button><br>`;
      });
    }
    html += '<h4>Talentos aprendidos</h4>';
    if (this.player.talents.length === 0) html += '<p>Ninguno</p>';
    else {
      this.player.talents.forEach(tId => {
        const t = this.player.talentService.talentsDB.find(t=>t.id===tId);
        html += `<p>✅ ${t.name}: ${t.desc}</p>`;
      });
    }
    this.tabContents.talents.innerHTML = html;
  }

  _refreshModulesTab() {
    let html = '<h4>Módulos equipados</h4>';
    if (this.player.modules.length === 0) html += '<p>Ninguno</p>';
    else {
      html += '<ul>';
      this.player.modules.forEach((m,i) => {
        html += `<li>${m.name} (${m.element}) <button onclick="window.__game.player.modules.splice(${i},1);window.__game._refreshModulesTab()">X</button></li>`;
      });
      html += '</ul>';
    }
    this.tabContents.modules.innerHTML = html;
  }

  _toggleTrinket(trinketId) {
    const idx = this.player.trinkets.findIndex(t=>t.id===trinketId);
    if (idx >= 0) {
      const trinket = this.player.trinkets[idx];
      trinket.remove(this.player);
      this.player.trinkets.splice(idx, 1);
    } else {
      if (this.player.trinkets.length >= 2) return;
      const trinket = TRINKETS[trinketId];
      if (trinket) {
        this.player.trinkets.push(trinket);
        trinket.apply(this.player);
      }
    }
    this._savePlayerPersistence();
    this._buildArchitectTab();
  }

  _update(dt) {
    if (this.paused || !this.currentRoomState) return;
    this.input.update();
    this.player.update(dt, this.input, this.currentRoomState);
    if (this.player.hookState.tip) this.player.updateHook(dt, this.currentRoomState);
    for (const enemy of this.currentRoomState.enemies) {
      if (enemy.alive) enemy.update(dt, this.player, this.currentRoomState);
    }
    for (const enemy of this.currentRoomState.enemies) {
      if (!enemy.alive && !enemy._dropped) {
        enemy._dropped = true;
        if (Math.random() < CONFIG.dropChance) {
          const elem = CONFIG.elements[Math.floor(Math.random()*CONFIG.elements.length)];
          const modData = CONFIG.modules[elem];
          this.currentRoomState.drops.push({ x: enemy.x, y: enemy.y, alive: true, color: modData.color, element: elem });
        }
      }
    }
    this.physicsService.checkEnemyPlayerCollisions(this.currentRoomState, this.player, this.eventBus);
    this.physicsService.checkObjectPickups(this.currentRoomState, this.player, this.eventBus);
    this.physicsService.updateProjectiles(this.currentRoomState, this.player, this.eventBus, dt);
    this.physicsService.updateDrops(this.currentRoomState, this.player, this.eventBus);
    if (this.currentRoomState.meleeEffects) {
      this.currentRoomState.meleeEffects = this.currentRoomState.meleeEffects.filter(e => (e.life -= dt) > 0);
    }
    // Mostrar barra de vida del jefe si hay un jefe vivo
    const boss = this.currentRoomState.enemies.find(e => e.isBoss && e.alive);
    const bossBar = document.getElementById('boss-hp-bar');
    const bossFill = document.getElementById('boss-hp-fill');
    if (boss) {
      bossBar.style.display = 'block';
      bossFill.style.width = (boss.hp / boss.maxHp * 100) + '%';
    } else {
      bossBar.style.display = 'none';
    }
    this._checkDoors();
    this._clampCamera();
  }

  _draw() {
    this.renderer.clear();
    if (this.currentRoomState) {
      this.renderer.drawRoom(this.currentRoomState, this.player, this.camera);
      if (this.currentRoomState.meleeEffects) {
        const ctx = this.renderer.ctx;
        for (const eff of this.currentRoomState.meleeEffects) {
          ctx.save(); ctx.globalAlpha = eff.life*3; ctx.fillStyle = eff.color;
          ctx.beginPath(); ctx.arc(eff.x - this.camera.x, eff.y - this.camera.y, 12, 0, Math.PI*2); ctx.fill();
          ctx.restore();
        }
      }
    }
    this.renderer.drawUI(this.player, { currentRoomId: this.currentRoomId||'?' });
  }

  _loop() {
    const now = performance.now();
    const dt = Math.min((now - this._lastTime)/1000, 0.1);
    this._lastTime = now;
    this._update(dt);
    this._draw();
    requestAnimationFrame(() => this._loop());
  }
}

// ==================== ARRANQUE ====================
document.addEventListener('DOMContentLoaded', () => {
  const canvas = document.getElementById('game');
  canvas.width = 960; canvas.height = 640;
  const input = new WebInputAdapter(canvas);
  const renderer = new CanvasRenderer(canvas);
  const persistence = new LocalStorageRepo();
  window.__game = new Game(canvas, input, renderer, persistence);
});
