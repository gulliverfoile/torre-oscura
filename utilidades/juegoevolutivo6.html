<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Gacha Evolutivo – Hexagonal + Sprites</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { width:100%; height:100%; overflow:hidden; background:#000; touch-action:none; }
        canvas { display:block; position:absolute; top:0; left:0; }
        #side-menu {
            position:fixed; top:0; right:0; width:380px; height:100vh;
            background:rgba(10,10,25,0.96); border-left:2px solid #ffd700; color:#fff;
            z-index:10000; display:none; font-family:monospace; font-size:13px;
            backdrop-filter:blur(8px); overflow-y:auto; padding:0;
        }
        #side-menu .tab-buttons {
            display:flex; flex-wrap:wrap; background:#111; border-bottom:1px solid #444;
        }
        #side-menu .tab-buttons button {
            flex:1; min-width:60px; background:transparent; border:none; color:#aaa;
            padding:10px 5px; cursor:pointer; font-weight:bold; font-size:12px;
            transition:0.2s;
        }
        #side-menu .tab-buttons button.active { color:#ffd700; border-bottom:2px solid #ffd700; background:#222; }
        #side-menu .tab-content { padding:15px; }
        #side-menu .tab-content > div { display:none; }
        #side-menu .tab-content > div.active { display:block; }
        button { background:#ffd700; color:#000; border:none; padding:6px 10px; margin:4px 2px; cursor:pointer; font-weight:bold; border-radius:4px; }
        button:disabled { opacity:0.4; cursor:default; }
        input, select { width:100%; margin:2px 0 8px; background:#222; color:#0f0; border:1px solid #0f0; padding:4px; border-radius:3px; font-family:monospace; }
        label { display:block; margin:6px 0 2px; color:#ccc; }
        .mobile-btn {
            width:55px; height:55px; border-radius:50%; background:rgba(255,255,255,0.3); border:2px solid #fff;
            font-size:22px; display:flex; align-items:center; justify-content:center; color:#fff;
            cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent;
        }
        #mobile-controls { position:fixed; bottom:20px; right:20px; display:none; gap:12px; z-index:9999; }
        #btn-ultimate { background:rgba(255,215,0,0.3); border-color:#ffd700; }
        #levelup-panel {
            position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
            background:rgba(10,10,25,0.96); border:2px solid #ff00ff; color:#fff; padding:20px;
            z-index:10001; display:none; font-family:monospace; font-size:16px; border-radius:10px;
            text-align:center; width:320px;
        }
        #levelup-panel button { font-size:14px; width:100%; }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <div id="side-menu">
        <div class="tab-buttons">
            <button data-tab="modulos">📦 Módulos</button>
            <button data-tab="stats">📊 Stats</button>
            <button data-tab="tienda">⭐ Tienda</button>
            <button data-tab="architect">🔧 Arquitecto</button>
        </div>
        <div class="tab-content">
            <div id="tab-modulos" class="active"></div>
            <div id="tab-stats"></div>
            <div id="tab-tienda"></div>
            <div id="tab-architect"></div>
        </div>
        <div style="text-align:center; padding:10px;">
            <button id="menu-close">Cerrar menú [Tab]</button>
        </div>
    </div>
    <div id="levelup-panel">
        <h3 style="color:#ffd700;">⬆️ ¡NIVEL SUBIDO!</h3>
        <p id="levelup-desc"></p>
        <div id="levelup-options"></div>
    </div>
    <div id="mobile-controls">
        <div class="mobile-btn" id="btn-dash">💨</div>
        <div class="mobile-btn" id="btn-ultimate">⚡</div>
        <div class="mobile-btn" id="btn-menu">📋</div>
    </div>
    <script>
    'use strict';
    // ==================== CONFIGURACIÓN GLOBAL ====================
    const CONFIG = {
        input: {
            leftZone: 0.35, rightZone: 0.35, deadzone: 0.1,
            sensitivity: 1.0, inertia: 0.92,
            dashCooldown: 45, dashDuration: 8, dashSpeed: 5.5,
            vibrate: true, autoFire: true, aimAssist: 30,
            freeAutoAim: true,
            swipeDashThreshold: 40, swipeDashTime: 150
        },
        player: {
            baseSpeed: 2.8, baseHp: 120, baseDamage: 10,
            baseFireRate: 12, baseProjectiles: 1, baseArmor: 0,
            maxWeaponLevel: 6, baseCritChance: 0.0, critMultiplier: 2.0
        },
        combat: {
            spawnInterval: 90, maxEnemies: 25,
            enemyBaseHp: 25, enemyBaseSpeed: 1.2, enemyBaseSize: 14,
            scalingPerKill: 0.35,
            evolutionTable: [
                { min:1, max:3, action:'death' },
                { min:4, max:5, action:'split', count:2, hpMult:0.5, sizeMult:0.8, speedMult:1.1 },
                { min:6, max:6, action:'evolve', hpMult:1.4, sizeMult:1.2, speedMult:0.9 }
            ],
            dropChance: 0.35, moduleDropChance: 0.12, bossInterval: 50,
            ultimateChargePerKill: 4,
            xpPerKill: 8, levelBaseXP: 35, levelScaling: 1.45,
            powerBarChargePerDamage: 0.3, powerBarDuration: 180,
            specialEnemyChance: 0.15,
            barreraHP: 30, proyectilCount: 5, kamikazeArea: 80,
            spawnAdaptativo: true, oleadasPeriodicas: true
        },
        structures: { maxOnScreen: 15, hp: 30, radio: 18, builderInterval: 450 },
        elements: {
            tipos: ['fuego','hielo','veneno','agua'],
            runaToElemento: { F:'fuego', W:'hielo', E:'veneno', A:'agua', R:'fisico' },
            afinidadMax: 5,
            reacciones: {
                'fuego+hielo': { accion:'choqueTermico', daño:40, area:60 },
                'fuego+veneno': { accion:'nubeInflamable', daño:25, area:80, dejaZona:'fuego' },
                'fuego+agua': { accion:'vapor', daño:15, empuje:200, area:50 },
                'hielo+veneno': { accion:'putrefaccion', ralentizacion:0.5, dotExtra:4, duracion:180 },
                'hielo+agua': { accion:'escarcha', inmoviliza:true, dañoExtra:10, duracion:120 },
                'veneno+agua': { accion:'contaminacion', area:100, duracion:300 }
            },
            zonaDuracion: 180,
            zonaDaño: 5
        },
        modules: { maxSlots: 4, tipos: ['ataque','defensa','utilidad','orbe'], runas: ['F','W','E','A','R'] },
        drops: {
            rarezas: [
                { id:'comun', peso:60, color:'#aaa', icon:'📦' },
                { id:'poco_comun', peso:25, color:'#4ade80', icon:'📗' },
                { id:'epico', peso:10, color:'#c084fc', icon:'📘' },
                { id:'legendario', peso:5, color:'#ffd700', icon:'📕' }
            ],
            tipos: {
                hp:{ label:'Vida', base:20, porNivel:5, icon:'❤️', color:'#ff6b6b' },
                proyectiles:{ label:'Proyectiles', base:1, porNivel:0, icon:'🔫', color:'#ffd93d' },
                cadencia:{ label:'Cadencia', base:-1, porNivel:0, icon:'⏱️', color:'#74b9ff' },
                daño:{ label:'Daño', base:2, porNivel:1, icon:'⚔️', color:'#ff9f43' },
                velocidad:{ label:'Velocidad', base:0.3, porNivel:0.1, icon:'💨', color:'#00d2d3' },
                precision:{ label:'Precisión', base:0.05, porNivel:0.02, icon:'🎯', color:'#54a0ff' }
            }
        },
        gameModes: { current: 'standard' },
        persistenceKey: 'gachaHex_v1',
        ui: { showJoystick:true, showMessages:true }
    };

    const rand = (min,max) => Math.random()*(max-min)+min;
    const dist = (x1,y1,x2,y2) => Math.hypot(x2-x1, y2-y1);

    // ==================== PUERTOS (interfaces) ====================
    class InputPort {
        getMove() { return { dx:0, dy:0 }; }
        getAimVector() { return null; }
        isFireHeld() { return false; }
        isActionBuffered(action) { return false; }
        bufferAction(action) {}
        consumeBuffered(action, canExecute) { return false; }
        update() {}
    }

    class RendererPort {
        clear() {}
        drawBackground(canvas) {}
        drawPlayer(player) {}
        drawEnemy(enemy) {}
        drawBullet(bullet) {}
        drawStructure(structure) {}
        drawZone(zone) {}
        drawDrop(drop) {}
        drawUI(gameState) {}
        drawParticles(particles) {}
    }

    class PersistencePort {
        load() { return {}; }
        save(data) {}
    }

    // ==================== CLASES DE DOMINIO ====================
    class Pieza {
        constructor(tipo, runa, stats = {}, afinidad = 1) {
            this.tipo = tipo;
            this.runa = runa;
            this.afinidad = afinidad;
            const elemento = CONFIG.elements.runaToElemento[runa] || 'fisico';
            this.elemento = elemento;
            this.stats = { damage:0, speed:0, fireRate:0, projectiles:0, critChance:0, armor:0, ...stats };
            this.color = {
                ataque:'#ff4444', defensa:'#44aaff', utilidad:'#44ff44', orbe:'#ffaa00',
                fuego:'#ff6600', hielo:'#00ccff', veneno:'#99cc00', agua:'#3399ff', fisico:'#cccccc'
            }[this.elemento] || '#fff';
        }
        descripcion() {
            const e = this.elemento, a = this.afinidad;
            if (e==='fuego') return `Quemadura ${a*2}s`;
            if (e==='hielo') return `Ralentiza ${a*0.3*100}% ${a*1.5}s`;
            if (e==='veneno') return `Veneno ${a*2} daño/s ${a*2}s`;
            if (e==='agua') return `Empuje +${a*50}`;
            return `Stats básicos`;
        }
    }

    class ZonaElemental {
        constructor(x, y, tipo, duracion = CONFIG.elements.zonaDuracion) {
            this.x = x; this.y = y; this.tipo = tipo; this.duracion = duracion;
            this.radio = 30;
            this.color = { fuego:'rgba(255,100,0,0.4)', hielo:'rgba(0,200,255,0.4)', veneno:'rgba(150,200,0,0.4)', agua:'rgba(0,100,255,0.3)' }[tipo] || 'rgba(255,255,255,0.3)';
        }
        afectaJugador(jugador) {
            if (dist(this.x, this.y, jugador.x, jugador.y) < this.radio + jugador.radio) {
                if (this.tipo==='fuego') jugador.takeDamage(CONFIG.elements.zonaDaño);
                if (this.tipo==='veneno') jugador.takeDamage(CONFIG.elements.zonaDaño*0.7);
                if (this.tipo==='hielo') jugador.addBuff('speed', -1, 30);
            }
        }
        afectaEnemigo(enemigo) {
            if (dist(this.x, this.y, enemigo.x, enemigo.y) < this.radio + enemigo.radio) {
                if (this.tipo==='fuego') enemigo.applyStatusEffect('quemadura', { damage:CONFIG.elements.zonaDaño, duration:60 });
                if (this.tipo==='veneno') enemigo.applyStatusEffect('veneno', { damage:CONFIG.elements.zonaDaño*0.7, duration:90 });
                if (this.tipo==='hielo') enemigo.applyStatusEffect('congelacion', { factor:0.5, duration:60 });
                if (this.tipo==='agua') { enemigo.x += (enemigo.x - this.x) * 0.05; enemigo.y += (enemigo.y - this.y) * 0.05; }
            }
        }
    }

    class Structure {
        constructor(x, y, radio = CONFIG.structures.radio, hp = CONFIG.structures.hp) {
            this.x = x; this.y = y; this.radio = radio; this.hp = hp; this.maxHp = hp;
            this.alive = true; this.color = '#8b7355';
        }
    }

    // ==================== SPRITE GENERATOR ====================
    class SpriteGenerator {
        constructor() { this.cache = new Map(); }
        getSprite(tipo, rareza, elemento, seed) {
            const key = `${tipo}|${rareza}|${elemento}|${seed}`;
            if (this.cache.has(key)) return this.cache.get(key);
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = false;
            const pal = this._palette(elemento, rareza);
            const rng = this._rng(seed + tipo + rareza + elemento);
            // Sombra
            ctx.fillStyle = pal.skin[1];
            ctx.beginPath(); ctx.arc(32, 34, 16, 0, Math.PI*2); ctx.fill();
            // Cuerpo
            ctx.fillStyle = pal.skin[0];
            ctx.beginPath(); ctx.arc(32, 32, 16, 0, Math.PI*2); ctx.fill();
            // Brillo
            ctx.fillStyle = pal.skin[2];
            ctx.globalAlpha = 0.4;
            ctx.beginPath(); ctx.arc(28, 28, 6, 0, Math.PI*2); ctx.fill();
            ctx.globalAlpha = 1.0;
            // Ojos
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(26, 28, 4, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(38, 28, 4, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = pal.eye || '#000';
            ctx.beginPath(); ctx.arc(26, 28, 2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(38, 28, 2, 0, Math.PI*2); ctx.fill();
            // Elite / jefe
            if (rareza === 'elite' || rareza === 'jefe') {
                ctx.fillStyle = pal.metal[0];
                ctx.beginPath(); ctx.arc(32, 16, 14, Math.PI, 0); ctx.fill();
                ctx.fillStyle = pal.metal[2];
                ctx.fillRect(28, 10, 8, 6);
                if (rareza === 'jefe') {
                    ctx.fillStyle = pal.leather ? pal.leather[0] : '#553300';
                    ctx.beginPath(); ctx.moveTo(18, 18); ctx.lineTo(10, 4); ctx.lineTo(22, 14); ctx.fill();
                    ctx.beginPath(); ctx.moveTo(46, 18); ctx.lineTo(54, 4); ctx.lineTo(42, 14); ctx.fill();
                }
            }
            // Tipo especial
            if (tipo === 'barrera') {
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(32, 32, 20, 0, Math.PI*2); ctx.stroke();
            } else if (tipo === 'kamikaze') {
                ctx.fillStyle = '#ff4500'; ctx.beginPath(); ctx.arc(32, 32, 14, 0, Math.PI*2); ctx.fill();
            } else if (tipo === 'constructor') {
                ctx.fillStyle = '#a0522d';
                ctx.fillRect(24, 20, 4, 24); ctx.fillRect(36, 20, 4, 24);
            }
            // Variación aleatoria
            if (rng() > 0.7) {
                ctx.fillStyle = pal.skin[1];
                ctx.beginPath(); ctx.arc(22 + rng()*20, 30 + rng()*10, 3, 0, Math.PI*2); ctx.fill();
            }
            this.cache.set(key, canvas);
            return canvas;
        }
        _palette(elemento) {
            const base = {
                fuego:   { skin:['#ff9966','#cc6633','#ffcc99'], metal:['#ffcc00','#cc9900','#ffdd44'], leather:['#660000','#330000','#993333'], eye:'#ff0000' },
                hielo:   { skin:['#aaccff','#7799cc','#ddeeff'], metal:['#ffffff','#cccccc','#ffffff'], leather:['#334455','#112233','#556677'], eye:'#88ccff' },
                veneno:  { skin:['#99cc00','#669900','#bbdd33'], metal:['#aaaa55','#888833','#cccc77'], leather:['#443322','#221100','#665544'], eye:'#44aa22' },
                agua:    { skin:['#3399ff','#2266cc','#66bbff'], metal:['#cceeff','#99bbdd','#ffffff'], leather:['#334455','#112233','#556677'], eye:'#0044cc' },
                fisico:  { skin:['#ccaa88','#997755','#eeddcc'], metal:['#aaaaaa','#777777','#cccccc'], leather:['#553300','#331a00','#775522'], eye:'#2244aa' }
            };
            return base[elemento] || base.fisico;
        }
        _rng(seed) {
            let h = 0; for (let i = 0; i < seed.length; i++) h = ((h << 5) - h + seed.charCodeAt(i)) | 0;
            return () => { h = (h * 1664525 + 1013904223) | 0; return (h >>> 0) / 4294967296; };
        }
    }

    // ==================== SERVICIOS ====================
    class CombatService {
        updateBullets(bullets, enemies, structures, player, difficulty, powerActive, game) {
            for (let i = bullets.length-1; i >= 0; i--) {
                const b = bullets[i]; b.update(game.canvas, enemies);
                if (!b.alive) { bullets.splice(i,1); continue; }
                let destruida = false;
                for (const s of structures) {
                    if (!s.alive) continue;
                    if (dist(b.x, b.y, s.x, s.y) < b.radio + s.radio) {
                        s.hp -= b.damage;
                        if (!s.alive) game._emitParticles(s.x, s.y, '#8b7355', 8);
                        if (b.perforacion <= 0 && b.rebotes <= 0 && !b.explosivo) destruida = true;
                        break;
                    }
                }
                if (destruida) { bullets.splice(i,1); continue; }
                for (let j = enemies.length-1; j >= 0; j--) {
                    const e = enemies[j]; if (!e.alive) continue;
                    if (dist(b.x, b.y, e.x, e.y) < b.radio + e.radio) {
                        let dmg = b.damage;
                        if (powerActive) dmg *= 2.5;
                        if (Math.random() < player.critChance) {
                            dmg *= CONFIG.player.critMultiplier;
                            game.criticosRealizados++;
                            game._emitParticles(e.x, e.y, '#ffd700', 5);
                        }
                        if (e.barreraHP > 0) {
                            if (dmg >= e.barreraHP) { dmg -= e.barreraHP; e.barreraHP = 0; }
                            else { e.barreraHP -= dmg; dmg = 0; }
                        }
                        e.hp -= dmg;
                        game.powerBar = Math.min(game.maxPowerBar, game.powerBar + dmg * CONFIG.combat.powerBarChargePerDamage);
                        if (game.powerBar >= game.maxPowerBar && !game.powerActive) {
                            game.powerActive = true; game.powerTimer = CONFIG.combat.powerBarDuration;
                            game.powerBar = 0;
                        }
                        if (player.lifesteal > 0) player.heal(dmg * player.lifesteal/100);
                        if (b.elemento === 'fuego') e.applyStatusEffect('quemadura', { damage:2+(player.obtenerAfinidades().fuego||0)*0.5, duration:120 });
                        if (b.elemento === 'hielo') e.applyStatusEffect('congelacion', { factor:0.5-(player.obtenerAfinidades().hielo||0)*0.1, duration:120 });
                        if (b.elemento === 'veneno') e.applyStatusEffect('veneno', { damage:2+(player.obtenerAfinidades().veneno||0)*0.5, duration:180 });
                        if (b.elemento === 'agua') { e.x += (e.x - player.x)*0.1; e.y += (e.y - player.y)*0.1; }
                        if (!e.haMuerto && e.hp <= 0) { e.haMuerto = true; game.procesarMuerteEnemigo(e); }
                        if (b.perforacion > 0) b.perforacion--;
                        else if (b.rebotes > 0) {
                            let target = null, minD = Infinity;
                            for (let k = 0; k < enemies.length; k++) {
                                if (k === j || !enemies[k].alive) continue;
                                const d = dist(enemies[k].x, enemies[k].y, b.x, b.y);
                                if (d < minD && d < 150) { minD = d; target = enemies[k]; }
                            }
                            if (target) b.bounce(target.x, target.y);
                            else destruida = true;
                        } else destruida = true;
                        if (destruida) break;
                    }
                }
                if (destruida) bullets.splice(i,1);
            }
        }
        updateEnemies(enemies, player, canvas, game) {
            for (let i = enemies.length-1; i >= 0; i--) {
                const e = enemies[i];
                if (!e.alive) { enemies.splice(i,1); continue; }
                e.update(player, canvas, game);
                if (dist(e.x, e.y, player.x, player.y) < e.radio + player.radio) {
                    if (player.takeDamage(e.dañoContacto*0.5)) {
                        game._emitParticles(player.x, player.y, '#ff6b6b', 5);
                    }
                }
                if (e.tipo === 'constructor') {
                    e.buildTimer--;
                    if (e.buildTimer <= 0) {
                        e.buildTimer = CONFIG.structures.builderInterval;
                        game.spawnStructure(e.x+(Math.random()-0.5)*40, e.y+(Math.random()-0.5)*40);
                    }
                }
            }
        }
    }

    class EvolutionService {
        processDeath(enemy) {
            if (enemy.nivelEvo >= 3) return [{ type:'loot', enemy }, { type:'death' }];
            const dado = Math.floor(Math.random()*6)+1, table = CONFIG.combat.evolutionTable;
            let action = 'death';
            for (const r of table) if (dado >= r.min && dado <= r.max) { action = r.action; break; }
            const events = [];
            if (action === 'death') events.push({ type:'loot', enemy }, { type:'death' });
            else if (action === 'split') {
                const nv = enemy.nivelEvo+1, hp = Math.floor(enemy.hpMax*0.5), sz = enemy.radio*0.8, sp = enemy.speed*1.1;
                for (let i = 0; i < 2; i++) {
                    const h = new Enemy(enemy.x+((i===0?-30:30)+(Math.random()-0.5)*20), enemy.y+(Math.random()-0.5)*20, nv, hp, sz, sp, enemy.tipo);
                    h.evolucionando = true; setTimeout(() => h.evolucionando = false, 500);
                    events.push({ type:'spawn', enemy:h });
                }
                events.push({ type:'death' });
            } else if (action === 'evolve') {
                const nv = enemy.nivelEvo+1;
                const ev = new Enemy(enemy.x+(Math.random()-0.5)*40, enemy.y+(Math.random()-0.5)*40, nv, Math.floor(enemy.hpMax*1.4), enemy.radio*1.2, enemy.speed*0.9, enemy.tipo);
                ev.evolucionando = true; setTimeout(() => ev.evolucionando = false, 500);
                events.push({ type:'spawn', enemy:ev }, { type:'message', text:`🌟 ¡Evolución a Nv.${nv}!`, color:'#ffd700' }, { type:'death' });
            }
            return events;
        }
    }

    class DropService {
        generarLoot(enemy, player) {
            if (Math.random() > CONFIG.combat.dropChance) return null;
            let ri = 0;
            if (enemy.nivelEvo >= 2) ri = Math.min(3, enemy.nivelEvo);
            else if (enemy.nivelEvo === 1) ri = 1;
            const ra = CONFIG.drops.rarezas; let total = 0;
            for (let i = 0; i <= ri; i++) total += ra[i].peso;
            let r = Math.random()*total, sel = ra[0];
            for (let i = 0; i <= ri; i++) { r -= ra[i].peso; if (r <= 0) { sel = ra[i]; break; } }
            const tipos = Object.keys(CONFIG.drops.tipos), tk = tipos[Math.floor(Math.random()*tipos.length)];
            const td = CONFIG.drops.tipos[tk];
            const val = td.base + player.weaponLevel*td.porNivel;
            return { tipo:tk, valor:val, icono:td.icon, color:sel.color, rareza:sel.id, label:td.label, x:enemy.x+(Math.random()-0.5)*30, y:enemy.y+(Math.random()-0.5)*30, alive:true, radio:10 };
        }
        generarModule(enemy) {
            const runa = CONFIG.modules.runas[Math.floor(Math.random()*CONFIG.modules.runas.length)];
            const tipo = CONFIG.modules.tipos[Math.floor(Math.random()*CONFIG.modules.tipos.length)];
            const afinidad = 1 + Math.floor(Math.random()*CONFIG.elements.afinidadMax);
            const stats = {};
            if (tipo === 'ataque') stats.damage = 1 + afinidad;
            else if (tipo === 'defensa') stats.armor = 1;
            else if (tipo === 'utilidad') stats.speed = 0.2*afinidad;
            else if (tipo === 'orbe') stats.damage = afinidad;
            return new Pieza(tipo, runa, stats, afinidad);
        }
    }

    class NivelService {
        constructor(player) { this.player = player; }
        addXP(xp) {
            this.player.xp += xp;
            if (this.player.xp >= this.player.xpProximoNivel) {
                this.player.xp -= this.player.xpProximoNivel;
                this.player.nivel++;
                this.player.xpProximoNivel = Math.floor(CONFIG.combat.levelBaseXP * Math.pow(CONFIG.combat.levelScaling, this.player.nivel-1));
                return true;
            }
            return false;
        }
        getOptions() {
            const nivel = this.player.nivel, desbloqueados = this.player.sistemasDesbloqueados;
            if (nivel === 2 && !desbloqueados.includes('stats')) {
                desbloqueados.push('stats');
                return [
                    { texto:'+20 Vida (Stats)', accion:()=>this.player.permanentUpgrades.hpBonus++ },
                    { texto:'+2 Daño (Stats)', accion:()=>this.player.permanentUpgrades.damageBonus+=2 },
                    { texto:'+0.3 Velocidad (Stats)', accion:()=>this.player.permanentUpgrades.speedBonus+=0.3 }
                ];
            }
            if (nivel === 3 && !desbloqueados.includes('proyectil')) {
                desbloqueados.push('proyectil');
                return [
                    { texto:'-2 Cadencia (Proyectil)', accion:()=>this.player.permanentUpgrades.fireRateBonus-=2 },
                    { texto:'+1 Proyectil (Proyectil)', accion:()=>this.player.upgradeWeapon() },
                    { texto:'+5% Crítico (Proyectil)', accion:()=>this.player.permanentUpgrades.critBonus++ }
                ];
            }
            if (nivel === 5 && !desbloqueados.includes('modulos')) {
                desbloqueados.push('modulos');
                return [
                    { texto:'Recibir módulo aleatorio', accion:()=>{ /* se maneja en Game */ } },
                    { texto:'+1 Proyectil', accion:()=>this.player.upgradeWeapon() },
                    { texto:'+2 Daño', accion:()=>this.player.permanentUpgrades.damageBonus+=2 }
                ];
            }
            const pool = [
                { texto:'+20 Vida', accion:()=>this.player.permanentUpgrades.hpBonus++ },
                { texto:'+2 Daño', accion:()=>this.player.permanentUpgrades.damageBonus+=2 },
                { texto:'+0.3 Velocidad', accion:()=>this.player.permanentUpgrades.speedBonus+=0.3 },
                { texto:'-2 Cadencia', accion:()=>this.player.permanentUpgrades.fireRateBonus-=2 },
                { texto:'+1 Proyectil', accion:()=>this.player.upgradeWeapon() },
                { texto:'+5% Crítico', accion:()=>this.player.permanentUpgrades.critBonus++ }
            ];
            return pool.sort(()=>Math.random()-0.5).slice(0,3);
        }
    }

    class SinergiaService {
        calculate(modules) {
            const res = {};
            const pares = [[0,2],[1,3]];
            for (const [a,b] of pares) {
                if (modules[a] && modules[b]) {
                    const key = modules[a].runa + modules[b].runa;
                    const key2 = modules[b].runa + modules[a].runa;
                    const s = CONFIG.modules.sinergias?.[key] || CONFIG.modules.sinergias?.[key2];
                    if (s) Object.assign(res, s);
                }
            }
            return res;
        }
    }

    class ProyectilService {
        constructor(player, sinergiaService) {
            this.player = player;
            this.sinergiaService = sinergiaService;
        }
        getStats() {
            const p = this.player;
            let speed = CONFIG.player.baseSpeed + p.permanentUpgrades.speedBonus*0.2;
            let damage = CONFIG.player.baseDamage + p.permanentUpgrades.damageBonus*2;
            let fireRate = CONFIG.player.baseFireRate + p.permanentUpgrades.fireRateBonus;
            let projectiles = CONFIG.player.baseProjectiles + p.weaponLevel - 1 + p.permanentUpgrades.projectilesBonus;
            let armor = CONFIG.player.baseArmor + p.permanentUpgrades.armorBonus;
            let critExtra = 0;
            for (const b of p.buffs) {
                if (b.tipo === 'speed') speed += b.valor;
                if (b.tipo === 'damage') damage += b.valor;
                if (b.tipo === 'fireRate') fireRate += b.valor;
                if (b.tipo === 'projectiles') projectiles += b.valor;
                if (b.tipo === 'armor') armor += b.valor;
            }
            for (const m of p.modulosEquipados) {
                if (!m) continue;
                if (m.stats.damage) damage += m.stats.damage;
                if (m.stats.speed) speed += m.stats.speed;
                if (m.stats.fireRate) fireRate += m.stats.fireRate;
                if (m.stats.projectiles) projectiles += m.stats.projectiles;
                if (m.stats.critChance) critExtra += m.stats.critChance;
                if (m.stats.armor) armor += m.stats.armor;
            }
            const sinergias = this.sinergiaService.calculate(p.modulosEquipados);
            if (sinergias.dañoFuego) damage += sinergias.dañoFuego;
            if (sinergias.velocidadAtaque) fireRate -= sinergias.velocidadAtaque;
            if (sinergias.escudo) armor += sinergias.escudo;
            if (sinergias.dañoExtra) damage += sinergias.dañoExtra;
            if (sinergias.velocidad) speed += sinergias.velocidad;
            fireRate = Math.max(3, fireRate);
            p.critChance = CONFIG.player.baseCritChance + (p.permanentUpgrades.critBonus||0)*0.05 + critExtra;
            return { speed, damage, fireRate, projectiles, armor };
        }
        getDominantElement() {
            const af = this.player.obtenerAfinidades();
            let dom = 'fisico', max = 0;
            for (const el in af) if (af[el] > max) { max = af[el]; dom = el; }
            return dom;
        }
    }

    class DifficultyService {
        constructor() {
            this.enemigosMuertos = 0;
            this.turnos = 0;
            this.ultimoDanioTurno = 0;
            this.multSpeed = 1.0;
            this.multDamage = 1.0;
            this.multHp = 1.0;
        }
        update(player, totalMuertos) {
            this.enemigosMuertos = totalMuertos;
            this.turnos++;
            if (player.invincible) this.ultimoDanioTurno = this.turnos;
            const turnosSinDanio = this.turnos - this.ultimoDanioTurno;
            let objSpeed = 1.0, objDamage = 1.0, objHp = 1.0;
            if (turnosSinDanio > 100 && this.enemigosMuertos > 5) {
                objSpeed = 1.3; objDamage = 1.2; objHp = 1.2;
            }
            const vidaPorc = player.hp / player.getMaxHp();
            if (vidaPorc < 0.3) {
                objSpeed = 0.8; objDamage = 0.7; objHp = 0.7;
            }
            this.multSpeed += (objSpeed - this.multSpeed) * 0.05;
            this.multDamage += (objDamage - this.multDamage) * 0.05;
            this.multHp += (objHp - this.multHp) * 0.05;
            this.multSpeed = Math.max(0.5, Math.min(2.0, this.multSpeed));
            this.multDamage = Math.max(0.5, Math.min(2.0, this.multDamage));
            this.multHp = Math.max(0.5, Math.min(2.0, this.multHp));
        }
        getMultipliers() {
            return { speed: this.multSpeed, damage: this.multDamage, hp: this.multHp };
        }
    }

    class CanvasRenderer extends RendererPort {
        constructor(canvas) { super(); this.canvas = canvas; this.ctx = canvas.getContext('2d'); }
        clear() { this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height); }
        drawBackground() {
            const ctx = this.ctx;
            ctx.strokeStyle = '#2a2a40'; ctx.lineWidth = 1;
            for (let x = 0; x < this.canvas.width; x += 50) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, this.canvas.height); ctx.stroke(); }
            for (let y = 0; y < this.canvas.height; y += 50) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(this.canvas.width, y); ctx.stroke(); }
        }
        drawPlayer(player) {
            const ctx = this.ctx;
            ctx.save();
            ctx.shadowColor = '#fff'; ctx.shadowBlur = 20;
            ctx.beginPath(); ctx.arc(player.x, player.y, player.radio, 0, Math.PI*2);
            ctx.fillStyle = '#00d2ff'; ctx.fill();
            ctx.shadowBlur = 0;
            const pos = [{x:0,y:-player.radio-8},{x:0,y:player.radio+8},{x:player.radio+8,y:0},{x:-player.radio-8,y:0}];
            for (let i = 0; i < 4; i++) {
                const m = player.modulosEquipados[i]; if (!m) continue;
                ctx.fillStyle = m.color; ctx.beginPath(); ctx.arc(player.x+pos[i].x, player.y+pos[i].y, 6, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#fff'; ctx.font = '10px monospace'; ctx.textAlign = 'center'; ctx.fillText(m.runa, player.x+pos[i].x, player.y+pos[i].y+4);
            }
            for (const orb of player.orbitales) {
                const ox = player.x + Math.cos(orb.angulo)*25, oy = player.y + Math.sin(orb.angulo)*25;
                ctx.fillStyle = orb.pieza.color; ctx.beginPath(); ctx.arc(ox, oy, 5, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#fff'; ctx.font = '8px monospace'; ctx.textAlign = 'center'; ctx.fillText(orb.pieza.runa, ox, oy+3);
            }
            ctx.restore();
        }
        drawEnemy(enemy) {
            const ctx = this.ctx;
            if (enemy.evolucionando) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(enemy.x, enemy.y, enemy.radio+4, 0, Math.PI*2); ctx.fill(); }
            ctx.save();
            if (enemy.sprite) {
                const size = enemy.radio * 2;
                ctx.drawImage(enemy.sprite, enemy.x - size/2, enemy.y - size/2, size, size);
            } else {
                ctx.shadowColor = enemy.color; ctx.shadowBlur = 15;
                ctx.beginPath(); ctx.arc(enemy.x, enemy.y, enemy.radio, 0, Math.PI*2);
                ctx.fillStyle = enemy.color; ctx.fill();
                ctx.shadowBlur = 0;
            }
            if (enemy.barreraHP > 0) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(enemy.x, enemy.y, enemy.radio+2, 0, Math.PI*2); ctx.stroke(); }
            ctx.fillStyle = '#fff'; ctx.font = 'bold 12px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('⬆️'.repeat(enemy.nivelEvo) + (enemy.tipo!=='normal'?'⚡':''), enemy.x, enemy.y-enemy.radio-14);
            const ancho = enemy.radio*2.2, yb = enemy.y-enemy.radio-6;
            ctx.fillStyle = '#222'; ctx.fillRect(enemy.x-ancho/2, yb, ancho, 4);
            ctx.fillStyle = enemy.hp/enemy.hpMax>0.6?'#4ade80':enemy.hp/enemy.hpMax>0.3?'#facc15':'#ef4444';
            ctx.fillRect(enemy.x-ancho/2, yb, ancho*(enemy.hp/enemy.hpMax), 4);
            ctx.restore();
        }
        drawBullet(bullet) {
            const ctx = this.ctx;
            const col = { fuego:'#ff6600', hielo:'#00ccff', veneno:'#99cc00', agua:'#3399ff', fisico:'#0ff' };
            ctx.beginPath(); ctx.arc(bullet.x, bullet.y, bullet.radio, 0, Math.PI*2);
            ctx.fillStyle = col[bullet.elemento] || '#0ff';
            ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 12; ctx.fill(); ctx.shadowBlur = 0;
        }
        drawStructure(structure) {
            const ctx = this.ctx;
            ctx.fillStyle = structure.color;
            ctx.fillRect(structure.x - structure.radio, structure.y - structure.radio, structure.radio*2, structure.radio*2);
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(structure.x - structure.radio, structure.y - structure.radio, structure.radio*2, structure.radio*2);
            const pct = structure.hp / structure.maxHp;
            ctx.fillStyle = '#222'; ctx.fillRect(structure.x - structure.radio, structure.y - structure.radio - 6, structure.radio*2, 3);
            ctx.fillStyle = pct>0.5?'#4ade80':'#ef4444'; ctx.fillRect(structure.x - structure.radio, structure.y - structure.radio - 6, structure.radio*2*pct, 3);
        }
        drawZone(zone) {
            const ctx = this.ctx;
            ctx.fillStyle = zone.color; ctx.beginPath(); ctx.arc(zone.x, zone.y, zone.radio, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
        }
        drawDrop(drop) {
            const ctx = this.ctx;
            ctx.save();
            ctx.shadowColor = drop.color; ctx.shadowBlur = 15;
            ctx.font = '20px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = drop.color; ctx.fillText(drop.icono, drop.x, drop.y);
            ctx.restore();
        }
        drawParticles(particles) {
            const ctx = this.ctx;
            for (const p of particles) {
                ctx.globalAlpha = p.life/p.maxLife;
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
            }
            ctx.globalAlpha = 1;
        }
        drawUI(gameState) {
            const ctx = this.ctx;
            const { player, game, canvas } = gameState;
            const W = canvas.width, H = canvas.height;
            const hpPct = player.hp / player.getMaxHp();
            ctx.fillStyle = '#222'; ctx.fillRect(20, 20, 200, 20);
            ctx.fillStyle = hpPct>0.6?'#4ade80':hpPct>0.3?'#facc15':'#ef4444'; ctx.fillRect(20, 20, 200*hpPct, 20);
            ctx.strokeStyle = '#fff'; ctx.strokeRect(20, 20, 200, 20);
            ctx.fillStyle = '#fff'; ctx.font = '12px monospace'; ctx.textAlign = 'left';
            ctx.fillText(`❤️ ${Math.floor(player.hp)}/${player.getMaxHp()}`, 25, 30);
            ctx.fillStyle = '#ffd93d'; ctx.font = '14px monospace'; ctx.textAlign = 'right';
            ctx.fillText(`🔫 Nv.${player.weaponLevel}`, W-20, 30);
            ctx.fillStyle = '#ffd700'; ctx.textAlign = 'left';
            ctx.fillText(`✨ Destino: ${player.destinyPoints}`, 20, 55);
            ctx.fillText(`Nv.${game.nivel} (XP: ${Math.floor(game.xp)}/${game.xpProximoNivel})`, 20, 75);
            if (game.powerActive) { ctx.fillStyle = '#ff4500'; ctx.fillText('💥 PODER ACTIVO', W/2, 50); }
            if (game.gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#ff4757'; ctx.font = 'bold 60px monospace'; ctx.textAlign = 'center';
                ctx.fillText('💀 GAME OVER', W/2, H/2-30);
                ctx.fillStyle = '#fff'; ctx.font = '20px monospace';
                ctx.fillText('Presiona R para reiniciar', W/2, H/2+40);
            }
        }
    }

    class WebInputAdapter extends InputPort {
        constructor(canvas) {
            super();
            this.canvas = canvas;
            this.keys = { w:false, a:false, s:false, d:false, arrowup:false, arrowdown:false, arrowleft:false, arrowright:false };
            this._spacePressed = false;
            this._shiftRightPressed = false;
            this.mouse = { x:0, y:0, down:false };
            this.actionBuffer = [];
            this._bindEvents();
        }
        _bindEvents() {
            document.addEventListener('keydown', e => {
                const k = e.key.toLowerCase();
                if (k in this.keys) { this.keys[k] = true; e.preventDefault(); }
                if (k === ' ' || k === 'space') { e.preventDefault(); this._spacePressed = true; }
                if (k === 'shiftright' || e.code === 'ShiftRight') { e.preventDefault(); this._shiftRightPressed = true; }
            });
            document.addEventListener('keyup', e => {
                const k = e.key.toLowerCase();
                if (k in this.keys) { this.keys[k] = false; e.preventDefault(); }
            });
            this.canvas.addEventListener('mousemove', e => {
                const r = this.canvas.getBoundingClientRect();
                this.mouse.x = (e.clientX - r.left) * (this.canvas.width / r.width);
                this.mouse.y = (e.clientY - r.top) * (this.canvas.height / r.height);
            });
            this.canvas.addEventListener('mousedown', e => {
                const r = this.canvas.getBoundingClientRect();
                this.mouse.x = (e.clientX - r.left) * (this.canvas.width / r.width);
                this.mouse.y = (e.clientY - r.top) * (this.canvas.height / r.height);
                this.mouse.down = true; e.preventDefault();
            });
            this.canvas.addEventListener('mouseup', () => this.mouse.down = false);
        }
        getMove() {
            let dx = 0, dy = 0;
            if (this.keys.w || this.keys.arrowup) dy -= 1;
            if (this.keys.s || this.keys.arrowdown) dy += 1;
            if (this.keys.a || this.keys.arrowleft) dx -= 1;
            if (this.keys.d || this.keys.arrowright) dx += 1;
            const len = Math.hypot(dx, dy);
            if (len > 1) { dx /= len; dy /= len; }
            return { dx, dy };
        }
        getAimVector() {
            if (!this.mouse.down) return null;
            const dx = this.mouse.x - this.canvas.width/2;
            const dy = this.mouse.y - this.canvas.height/2;
            const len = Math.hypot(dx, dy);
            if (len < 5) return null;
            return { x: dx/len, y: dy/len, angle: Math.atan2(dy, dx) };
        }
        isFireHeld() { return this.mouse.down || this._shiftRightPressed; }
        bufferAction(action) { this.actionBuffer.push({ action, time: performance.now() }); }
        consumeBuffered(action, canExecute) {
            this.actionBuffer = this.actionBuffer.filter(a => performance.now() - a.time < 150);
            const idx = this.actionBuffer.findIndex(a => a.action === action);
            if (idx !== -1 && canExecute) { this.actionBuffer.splice(idx, 1); return true; }
            return false;
        }
        consumeFireRequest() { if (this._spacePressed) { this._spacePressed = false; return true; } return false; }
        update() {}
    }

    class MobileInputAdapter extends InputPort {
        constructor(canvas) {
            super();
            this.canvas = canvas;
            this.config = CONFIG.input;
            this.touches = new Map();
            this._lastTouchTime = 0;
            this._inertiaX = 0;
            this._inertiaY = 0;
            this.actionBuffer = [];
            this._bindEvents();
        }
        _bindEvents() {
            ['touchstart','touchmove','touchend','touchcancel'].forEach(ev =>
                this.canvas.addEventListener(ev, e => this._handleTouch(e), { passive: false })
            );
        }
        _handleTouch(e) {
            e.preventDefault();
            const rect = this.canvas.getBoundingClientRect();
            const sx = this.canvas.width / rect.width;
            const sy = this.canvas.height / rect.height;
            const now = performance.now();
            if (e.type === 'touchstart' || e.type === 'touchmove') {
                for (const t of e.changedTouches) {
                    const x = (t.clientX - rect.left) * sx;
                    const y = (t.clientY - rect.top) * sy;
                    if (e.type === 'touchstart') {
                        const zone = x < this.canvas.width * this.config.leftZone ? 'move' : 'aim';
                        this.touches.set(t.identifier, { zone, startX: x, startY: y, x, y, time: now });
                        if (zone === 'move' && now - this._lastTouchTime < 300) this.bufferAction('dash');
                        this._lastTouchTime = now;
                    } else {
                        const tracked = this.touches.get(t.identifier);
                        if (tracked) { tracked.x = x; tracked.y = y; }
                    }
                }
            } else if (e.type === 'touchend' || e.type === 'touchcancel') {
                for (const t of e.changedTouches) {
                    const tracked = this.touches.get(t.identifier);
                    if (tracked && tracked.zone === 'move') {
                        const dx = tracked.x - tracked.startX, dy = tracked.y - tracked.startY;
                        if (dx*dx+dy*dy > this.config.swipeDashThreshold*this.config.swipeDashThreshold && (now - tracked.time) < this.config.swipeDashTime) {
                            this.bufferAction('dash');
                        }
                    }
                    this.touches.delete(t.identifier);
                }
            }
        }
        update() {
            let rawDx = 0, rawDy = 0;
            for (const t of this.touches.values()) {
                if (t.zone === 'move') {
                    const cx = this.canvas.width * this.config.leftZone/2, cy = this.canvas.height/2;
                    let dx = t.x - cx, dy = t.y - cy;
                    const len = Math.hypot(dx, dy);
                    const maxDist = Math.min(this.canvas.width*this.config.leftZone/2, this.canvas.height/2);
                    if (len > this.config.deadzone) {
                        const norm = Math.min(1, len/maxDist);
                        rawDx = (dx/len)*norm*this.config.sensitivity;
                        rawDy = (dy/len)*norm*this.config.sensitivity;
                    }
                    break;
                }
            }
            const len = Math.hypot(rawDx, rawDy);
            if (len > 1) { rawDx /= len; rawDy /= len; }
            if (rawDx === 0 && rawDy === 0 && ![...this.touches.values()].some(t=>t.zone==='move')) {
                this._inertiaX *= this.config.inertia;
                this._inertiaY *= this.config.inertia;
                if (Math.abs(this._inertiaX)<0.01) this._inertiaX = 0;
                if (Math.abs(this._inertiaY)<0.01) this._inertiaY = 0;
            } else {
                this._inertiaX = rawDx; this._inertiaY = rawDy;
            }
        }
        getMove() { return { dx: this._inertiaX, dy: this._inertiaY }; }
        getAimVector() {
            const aimTouch = [...this.touches.values()].find(t=>t.zone==='aim');
            if (!aimTouch) return null;
            const dx = aimTouch.x - aimTouch.startX, dy = aimTouch.y - aimTouch.startY;
            const len = Math.hypot(dx, dy);
            if (len < 10) return null;
            return { x: dx/len, y: dy/len, angle: Math.atan2(dy, dx) };
        }
        isFireHeld() { return [...this.touches.values()].some(t=>t.zone==='aim'); }
        bufferAction(action) { this.actionBuffer.push({ action, time: performance.now() }); }
        consumeBuffered(action, canExecute) {
            this.actionBuffer = this.actionBuffer.filter(a => performance.now() - a.time < 150);
            const idx = this.actionBuffer.findIndex(a => a.action === action);
            if (idx !== -1 && canExecute) { this.actionBuffer.splice(idx, 1); return true; }
            return false;
        }
    }
