<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PAC-MAN REVENGE – Hexagonal Edition</title>
    <style>
        /* =========== RESET & BASE =========== */
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { width:100%; height:100%; overflow:hidden; background:#000; touch-action:none; }
        body { display:flex; justify-content:center; align-items:center; }
        canvas { display:block; position:absolute; top:0; left:0; }

        /* =========== MENÚ LATERAL =========== */
        #side-menu {
            position:fixed; top:0; right:0; width:380px; height:100vh;
            background:rgba(10,10,25,0.96); border-left:2px solid #ffd700; color:#fff;
            z-index:10000; display:none; font-family:monospace; font-size:13px;
            backdrop-filter:blur(8px); overflow-y:auto; padding:0;
        }
        #side-menu .tab-buttons { display:flex; flex-wrap:wrap; background:#111; border-bottom:1px solid #444; }
        #side-menu .tab-buttons button {
            flex:1; min-width:60px; background:transparent; border:none; color:#aaa;
            padding:10px 5px; cursor:pointer; font-weight:bold; font-size:12px; transition:0.2s;
        }
        #side-menu .tab-buttons button.active { color:#ffd700; border-bottom:2px solid #ffd700; background:#222; }
        #side-menu .tab-content { padding:15px; }
        #side-menu .tab-content > div { display:none; }
        #side-menu .tab-content > div.active { display:block; }

        /* =========== BOTONES GENÉRICOS =========== */
        button {
            background:#ffd700; color:#000; border:none; padding:6px 10px; margin:4px 2px;
            cursor:pointer; font-weight:bold; border-radius:4px;
        }
        button:disabled { opacity:0.4; cursor:default; }
        input, select {
            width:100%; margin:2px 0 8px; background:#222; color:#0f0; border:1px solid #0f0;
            padding:4px; border-radius:3px; font-family:monospace;
        }
        label { display:block; margin:6px 0 2px; color:#ccc; }

        /* =========== BOTONES MÓVILES =========== */
        .mobile-btn {
            width:55px; height:55px; border-radius:50%; background:rgba(255,255,255,0.3);
            border:2px solid #fff; font-size:22px; display:flex; align-items:center;
            justify-content:center; color:#fff; cursor:pointer; user-select:none;
            -webkit-tap-highlight-color:transparent;
        }
        #mobile-controls { position:fixed; bottom:20px; right:20px; display:none; gap:12px; z-index:9999; }
        #btn-ultimate { background:rgba(255,215,0,0.3); border-color:#ffd700; }

        /* =========== PANELES OVERLAY =========== */
        #levelup-panel {
            position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
            background:rgba(10,10,25,0.96); border:2px solid #ff00ff; color:#fff; padding:20px;
            z-index:10001; display:none; font-family:monospace; font-size:16px; border-radius:10px;
            text-align:center; width:320px;
        }
        #levelup-panel button { font-size:14px; width:100%; }
        #nemesis-overlay {
            position:fixed; top:10px; left:50%; transform:translateX(-50%);
            background:rgba(139,0,139,0.9); color:#ffd700; padding:10px 20px;
            border-radius:10px; z-index:9998; font-family:monospace; font-size:14px;
            display:none; text-align:center;
        }
        #rotate-hint {
            position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
            background:rgba(0,0,0,0.8); color:#ffd700; padding:20px; border-radius:16px;
            z-index:20000; display:none; font-family:monospace; text-align:center; font-size:1.2rem;
        }
        #pause-overlay {
            position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.5); color:#fff; z-index:9997;
            display:none; justify-content:center; align-items:center;
            font-family:monospace; font-size:3rem; pointer-events:none;
        }
        .fusion-panel { background:#1a1a2e; padding:10px; border-radius:8px; margin:10px 0; }
        .fusion-panel select { width:auto; display:inline-block; margin:2px; }
    </style>
</head>
<body>
    <canvas id="game"></canvas>

    <!-- Menú lateral -->
    <div id="side-menu">
        <div class="tab-buttons">
            <button data-tab="modulos">📦 Módulos</button>
            <button data-tab="stats">📊 Stats</button>
            <button data-tab="tienda">⭐ Tienda</button>
            <button data-tab="architect">🔧 Arquitecto</button>
        </div>
        <div class="tab-content">
            <div id="tab-modulos" class="active"></div>
            <div id="tab-stats"></div>
            <div id="tab-tienda"></div>
            <div id="tab-architect"></div>
        </div>
        <div style="text-align:center; padding:10px;">
            <button id="menu-close">Cerrar menú [Tab]</button>
        </div>
    </div>

    <!-- Overlays -->
    <div id="levelup-panel">
        <h3 style="color:#ffd700;">⬆️ ¡NIVEL SUBIDO!</h3>
        <p id="levelup-desc"></p>
        <div id="levelup-options"></div>
    </div>
    <div id="mobile-controls">
        <div class="mobile-btn" id="btn-dash">💨</div>
        <div class="mobile-btn" id="btn-ultimate">⚡</div>

    </div>
    <div id="nemesis-overlay">👻 Tu Némesis acecha...</div>
    <div id="rotate-hint">📱 Gira el dispositivo para jugar</div>
    <div id="pause-overlay">⏸️ PAUSA</div>

    <script>

    const CONFIG = {

            },

                ],

                ],

                ],

                ]
            }
        },
        modules: {
            maxSlots: 4, tipos: ['ataque','defensa','utilidad','orbe'],

            projMods: ['perforacion','rebote','explosivo','teledirigido','mina'],
            fusionCost: 5
        },
        drops: {
            rarezas: [
                { id:'comun', peso:60, color:'#aaa', icon:'📦', estrellas:1 },
                { id:'poco_comun', peso:25, color:'#4ade80', icon:'📗', estrellas:2 },
                { id:'epico', peso:10, color:'#c084fc', icon:'📘', estrellas:3 },
                { id:'legendario', peso:5, color:'#ffd700', icon:'📕', estrellas:4 }
            ],
            tipos: {
                hp:{ label:'Vida', base:20, porNivel:5, icon:'❤️', color:'#ff6b6b' },
                proyectiles:{ label:'Proyectiles', base:1, porNivel:0, icon:'🔫', color:'#ffd93d' },
                cadencia:{ label:'Cadencia', base:-0.05, porNivel:0, icon:'⏱️', color:'#74b9ff' },
                daño:{ label:'Daño', base:2, porNivel:1, icon:'⚔️', color:'#ff9f43' },
                velocidad:{ label:'Velocidad', base:18, porNivel:6, icon:'💨', color:'#00d2d3' },
                precision:{ label:'Precisión', base:0.05, porNivel:0.02, icon:'🎯', color:'#54a0ff' }
            }
        },
        gameModes: { current: 'standard' },
        persistenceKey: 'pacmanRevenge_hex_v2',
        ui: { showJoystick:true, showMessages:true },
        nemesisNames: {
            prefijos: ['Gorthak','Zyrrax','Morthul','Vexis','Kragoth','Nyloth','Xalvador','Thyria'],
            sufijos: ['el Usurpador','el Ladrón','el Ascendido','el Devorador','el Eterno','el Maldito','el Oscuro']
        }
    };

    // Utilidades matemáticas
    const rand = (min, max) => Math.random() * (max - min) + min;
    const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);

    // ==================== PUERTOS (INTERFACES) ====================
    /** @interface */
    class InputPort {
        getMove() { return { dx:0, dy:0 }; }
        getAimVector() { return null; }
        isFireHeld() { return false; }
        bufferAction(action) {}
        consumeBuffered(action, canExecute) { return false; }
        update() {}
        updateCanvasSize(w, h) {}
        onGameOverTouch(cb) { this._gameOverTouchCallback = cb; }
    }

    /** @interface */
    class RendererPort {
        clear() {}
        drawBackground() {}
        drawPlayer(player, gameState) {}
        drawEnemy(enemy) {}
        drawBullet(bullet) {}
        drawStructure(structure) {}
        drawZone(zone) {}
        drawDrop(drop) {}
        drawUI(gameState) {}
        drawParticles(particles) {}
        drawExplosion(x, y, radius, alpha) {}
        drawMineWarning(x, y, radius, alpha) {}
    }

    /** @interface */
    class PersistencePort {
        load() { return {}; }
        save(data) {}
    }
// ==================== AUDIO SERVICE ====================
    class AudioService {
        constructor() { this.ctx = null; this.initialized = false; }
        init() { if (this.initialized) return; try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); this.initialized = true; } catch(e) { console.warn('Audio no disponible'); } }
        _playTone(freq, type, duration, volume = 0.15, filterFreq = 2000) {
            if (!this.ctx || this.ctx.state === 'closed') return;
            if (this.ctx.state === 'suspended') this.ctx.resume();
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator(); osc.type = type;
            osc.frequency.setValueAtTime(freq, now);
            const gain = this.ctx.createGain();
            const filter = this.ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.setValueAtTime(filterFreq, now);
            gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(volume, now + 0.01); gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
            osc.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
            osc.start(now); osc.stop(now + duration);
        }
        _playNoise(duration, volume = 0.1, filterFreq = 1500) {
            if (!this.ctx || this.ctx.state === 'closed') return;
            if (this.ctx.state === 'suspended') this.ctx.resume();
            const now = this.ctx.currentTime;
            const bufferSize = Math.floor(this.ctx.sampleRate * duration);
            const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0); for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.5;
            const noise = this.ctx.createBufferSource(); noise.buffer = buffer;
            const gain = this.ctx.createGain(); const filter = this.ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.setValueAtTime(filterFreq, now);
            gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(volume, now + 0.01); gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
            noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
            noise.start(now); noise.stop(now + duration);
        }
        playShoot(elemento = 'fisico') { const map = { fuego:{freq:180,type:'sawtooth',vol:0.08,dur:0.08,filt:2500}, hielo:{freq:600,type:'sine',vol:0.06,dur:0.06,filt:4000}, veneno:{freq:300,type:'triangle',vol:0.05,dur:0.1,filt:1800}, agua:{freq:400,type:'sine',vol:0.07,dur:0.07,filt:3000}, fisico:{freq:220,type:'square',vol:0.1,dur:0.05,filt:2000} }; const s = map[elemento] || map.fisico; this._playTone(s.freq, s.type, s.dur, s.vol, s.filt); }
        playExplosion() { this._playNoise(0.25, 0.2, 800); this._playTone(60, 'sawtooth', 0.2, 0.15, 500); }
        playDropCollected() { this._playTone(880, 'sine', 0.1, 0.08, 5000); setTimeout(() => this._playTone(1100, 'sine', 0.08, 0.06, 6000), 60); }
        playLevelUp() { this._playTone(440, 'triangle', 0.1, 0.1, 3000); setTimeout(() => this._playTone(660, 'triangle', 0.1, 0.1, 4000), 100); setTimeout(() => this._playTone(880, 'triangle', 0.15, 0.12, 5000), 200); }
        playUltimate() { this._playNoise(0.4, 0.25, 1500); this._playTone(55, 'sawtooth', 0.5, 0.2, 400); }
        playNemesisAppear() { this._playTone(110, 'sawtooth', 0.6, 0.2, 300); setTimeout(() => this._playTone(55, 'square', 0.8, 0.3, 200), 200); }
        playCraft() { this._playTone(660, 'triangle', 0.15, 0.1, 4000); setTimeout(() => this._playTone(880, 'triangle', 0.15, 0.1, 5000), 100); }
    }

    // ==================== SPRITE GENERATOR (PAC-MAN & FANTASMAS) ====================
    class SpriteGenerator {
        constructor() { this.cache = new Map(); }
        getSprite(tipo, rareza, elemento, seed, hasModulos = false, isNemesis = false) {
            const key = `${tipo}|${rareza}|${elemento}|${seed}|${hasModulos}|${isNemesis}`;
            if(this.cache.has(key)) return this.cache.get(key);
            const canvas = document.createElement('canvas'); canvas.width=64; canvas.height=64;
            const ctx = canvas.getContext('2d'); ctx.imageSmoothingEnabled = false;
            const pal = this._palette(elemento);

            if (tipo === 'jugador') {
                // Pac-Man
                ctx.fillStyle = '#ffff00';
                ctx.beginPath(); ctx.arc(32, 32, 22, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#000';
                ctx.beginPath(); ctx.moveTo(32, 32); ctx.lineTo(50, 20); ctx.lineTo(50, 44); ctx.closePath(); ctx.fill();
                ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(38, 22, 3, 0, Math.PI*2); ctx.fill();
            } else {
                // Fantasma
                ctx.fillStyle = pal.skin[0];
                ctx.beginPath();
                ctx.arc(32, 28, 16, Math.PI, 0);
                ctx.lineTo(48, 44);
                ctx.quadraticCurveTo(44, 40, 40, 44);
                ctx.quadraticCurveTo(36, 40, 32, 44);
                ctx.quadraticCurveTo(28, 40, 24, 44);
                ctx.quadraticCurveTo(20, 40, 16, 44);
                ctx.closePath();
                ctx.fill();
                // Ojos
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(26, 24, 5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(38, 24, 5, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = pal.eye || '#0000ff';
                ctx.beginPath(); ctx.arc(26, 24, 2.5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(38, 24, 2.5, 0, Math.PI*2); ctx.fill();
                if (hasModulos) { ctx.fillStyle = '#ffd700'; ctx.beginPath(); ctx.arc(32, 6, 5, 0, Math.PI*2); ctx.fill(); }
                if (isNemesis) { ctx.fillStyle = 'rgba(139,0,139,0.6)'; ctx.beginPath(); ctx.arc(32, 32, 22, 0, Math.PI*2); ctx.fill(); }
            }
            this.cache.set(key, canvas);
            return canvas;
        }
        _palette(elemento) {
            const base = {
                fuego:{ skin:['#ff9966','#cc6633','#ffcc99'], eye:'#ff0000' },
                hielo:{ skin:['#aaccff','#7799cc','#ddeeff'], eye:'#88ccff' },
                veneno:{ skin:['#99cc00','#669900','#bbdd33'], eye:'#44aa22' },
                agua:{ skin:['#3399ff','#2266cc','#66bbff'], eye:'#0044cc' },
                fisico:{ skin:['#ffffff','#dddddd','#f0f0f0'], eye:'#0000ff' }
            };
            return base[elemento] || base.fisico;
        }
    }

    // ==================== CLASES DE DOMINIO ====================
    class Pieza {
        constructor(tipo, runa, stats = {}, afinidad = 1, projMod = null, rareza = 'comun') {
            this.tipo = tipo; this.runa = runa; this.afinidad = afinidad; this.projMod = projMod; this.rareza = rareza;
            const elemento = CONFIG.elements.runaToElemento[runa] || 'fisico'; this.elemento = elemento;
            this.stats = { damage:0, speed:0, fireRate:0, projectiles:0, critChance:0, armor:0, ...stats };
            this.color = { ataque:'#ff4444', defensa:'#44aaff', utilidad:'#44ff44', orbe:'#ffaa00' }[this.tipo] || '#fff';
            this.estrellas = CONFIG.drops.rarezas.find(r => r.id === rareza)?.estrellas || 1;
        }
        descripcion() {
            const e=this.elemento, a=this.afinidad; let d='';
            if(e==='fuego')d=`Quemadura ${(a*0.4).toFixed(1)}s`;
            else if(e==='hielo')d=`Ralentiza ${(a*10+20)}%`;
            else if(e==='veneno')d=`Veneno ${a} daño/s`;
            else if(e==='agua')d=`Empuje +${a*30}`;
            else d='Stats básicos';
            if(this.projMod)d+=` [${this.projMod}]`;
            return d;
        }
        getRarezaSuperior() { const idx = CONFIG.drops.rarezas.findIndex(r => r.id === this.rareza); if (idx < CONFIG.drops.rarezas.length-1) return CONFIG.drops.rarezas[idx+1].id; return null; }
        static fromData(data) { if(!data||!data.runa)return null; return new Pieza(data.tipo, data.runa, data.stats||{}, data.afinidad||1, data.projMod||null, data.rareza||'comun'); }
    }

    class ZonaElemental {
        constructor(x, y, tipo, duracion = CONFIG.elements.zonaDuracion) {
            this.x = x; this.y = y; this.tipo = tipo; this.duracion = duracion; this.radio = 30;
            const a = CONFIG.elements.zonaAlpha;
            this.color = { fuego:`rgba(255,80,0,${a})`, hielo:`rgba(0,180,255,${a})`, veneno:`rgba(130,200,0,${a})`, agua:`rgba(0,80,255,${a})` }[tipo] || `rgba(255,255,255,${a})`;
            this.borderColor = { fuego:'#ffcc00', hielo:'#ffffff', veneno:'#ccff00', agua:'#66aaff' }[tipo] || '#ffffff';
            this.pulse = 0;
        }
        afectaJugador(jugador) {
            if(dist(this.x,this.y,jugador.x,jugador.y)<this.radio+jugador.radio){
                if(this.tipo==='fuego')jugador.takeDamage(CONFIG.elements.zonaDaño);
                if(this.tipo==='veneno')jugador.takeDamage(CONFIG.elements.zonaDaño*0.7);
                if(this.tipo==='hielo')jugador.addBuff('speed',-60,1.0);
            }
        }
        afectaEnemigo(enemigo) {
            if(dist(this.x,this.y,enemigo.x,enemigo.y)<this.radio+enemigo.radio){
                if(this.tipo==='fuego')enemigo.applyStatusEffect('quemadura',{damage:CONFIG.elements.zonaDaño,duration:1.0});
                if(this.tipo==='veneno')enemigo.applyStatusEffect('veneno',{damage:CONFIG.elements.zonaDaño*0.7,duration:1.5});

    // ==================== PLAYER ====================
    class Player {
        constructor() {

            this.permanentUpgrades = { hpBonus:0, speedBonus:0, damageBonus:0, fireRateBonus:0, projectilesBonus:0, armorBonus:0, critBonus:0 };
            this.weaponLevel = 1; this.buffs = []; this.cooldown = 0;
            this.dashing = false; this.dashTimer = 0; this.dashCooldown = 0;
            this.invincible = false; this.invincibleTimer = 0;
            this.destinyPoints = 0; this.critChance = CONFIG.player.baseCritChance; this.lifesteal = 0;
            this.modulosEquipados = [null,null,null,null]; this.inventarioModulos = []; this.orbitales = [];
            this.hp = CONFIG.player.baseHp; this.xp = 0; this.nivel = 1;
            this.xpProximoNivel = CONFIG.combat.levelBaseXP;
            this.sistemasDesbloqueados = []; this._pasivasActivas = {}; this._pasivasTimer = 0;
            this.escudos = 0; this.vidaAcumulada = 0;
        }
        init(x, y, saveData) {
            this.x = x; this.y = y; this.weaponLevel = 1;
            this.permanentUpgrades = { hpBonus:0, speedBonus:0, damageBonus:0, fireRateBonus:0, projectilesBonus:0, armorBonus:0, critBonus:0 };
            if (saveData) {
                this.destinyPoints = saveData.destinyPoints || 0;
                if (saveData.upgrades) Object.assign(this.permanentUpgrades, saveData.upgrades);
                this.modulosEquipados = (saveData.modulosEquipados || [null,null,null,null]).map(m => m ? Pieza.fromData(m) : null);
                this.inventarioModulos = (saveData.inventarioModulos || []).map(m => Pieza.fromData(m)).filter(Boolean);
            }
            this.hp = this.getMaxHp();
            this.critChance = CONFIG.player.baseCritChance + (this.permanentUpgrades.critBonus||0)*0.05;
            this.cooldown = 0; this.buffs = []; this.dashing = false; this.invincible = false;
            this.orbitales = []; this.escudos = 0; this.vidaAcumulada = 0;

        }
        getMaxHp() { return CONFIG.player.baseHp + this.permanentUpgrades.hpBonus * 5; }
        obtenerAfinidades() {
            const af = { fuego:0, hielo:0, veneno:0, agua:0, fisico:0 };
            for (const m of this.modulosEquipados) if (m) af[m.elemento] = (af[m.elemento]||0) + m.afinidad;
            return af;
        }
        actualizarOrbitalesDesdeModulos() {
            this.orbitales = [];
            for (const m of this.modulosEquipados) if (m && m.tipo === 'orbe') this.orbitales.push({ pieza:m, angulo:Math.random()*Math.PI*2, cooldown:0 });
        }
        updateOrbitales(enemies, bullets) {
            for (const orb of this.orbitales) {
                orb.angulo += 0.02; orb.cooldown = Math.max(0, orb.cooldown - 1);
                const ox = this.x + Math.cos(orb.angulo)*25, oy = this.y + Math.sin(orb.angulo)*25;
                if (orb.cooldown <= 0 && enemies.length > 0) {
                    let t = null, md = 200;
                    for (const e of enemies) if (e.alive) { const d = dist(ox, oy, e.x, e.y); if (d < md) { md = d; t = e; } }
                    if (t) {
                        const a = Math.atan2(t.y-oy, t.x-ox);
                        bullets.push(new Bullet(ox, oy, Math.cos(a)*300, Math.sin(a)*300, 5+(orb.pieza.stats.damage||0), 0, orb.pieza.elemento));
                        orb.cooldown = 0.3;
                    }

            }
        }
        update(input) {
            this.updateBuffs(); this.cooldown = Math.max(0, this.cooldown - 0.016);
            this.dashCooldown = Math.max(0, this.dashCooldown - 0.016);
            if (this.invincibleTimer > 0) { this.invincibleTimer -= 0.016; if (this.invincibleTimer <= 0) this.invincible = false; }
            if (this.dashing) { this.dashTimer = Math.max(0, this.dashTimer - 0.016); if (this.dashTimer <= 0) { this.dashing = false; this.invincible = false; } }
        }
        updateBuffs() {
            for (let i = this.buffs.length-1; i >= 0; i--) {
                this.buffs[i].duracion = Math.max(0, this.buffs[i].duracion - 0.016);
                if (this.buffs[i].duracion <= 0) { if (this.buffs[i].tipo === 'roboVida') this.lifesteal = 0; this.buffs.splice(i,1); }
            }
        }
        addBuff(tipo, valor, duracion) {
            const e = this.buffs.find(b => b.tipo === tipo);
            if (e) e.duracion = Math.max(e.duracion, duracion);
            else { this.buffs.push({ tipo, valor, duracion }); if (tipo === 'roboVida') this.lifesteal = valor; }
        }
        takeDamage(amount) {
            if (this.invincible) return false;
            if (this.escudos > 0) { this.escudos--; this.invincible = true; this.invincibleTimer = CONFIG.player.invulnerabilityAfterHit; return false; }
            // Calcular armadura real (módulos + buffs)
            let armor = 0;
            for (const m of this.modulosEquipados) { if (m?.stats?.armor) armor += m.stats.armor; }
            for (const b of this.buffs) { if (b.tipo === 'armor') armor += b.valor; }

            this.invincible = true; this.invincibleTimer = CONFIG.player.invulnerabilityAfterHit;
            if (CONFIG.input.vibrate && navigator.vibrate) { try { navigator.vibrate(20); } catch(e) {} }
            return true;
        }
        heal(amount) {
            this.hp = Math.min(this.getMaxHp(), this.hp + amount);
            this.vidaAcumulada += amount;
            while (this.vidaAcumulada >= CONFIG.player.vidaPorEscudo && this.escudos < CONFIG.player.maxEscudos) {
                this.vidaAcumulada -= CONFIG.player.vidaPorEscudo; this.escudos++;
            }
        }
        upgradeWeapon() { if (this.weaponLevel < CONFIG.player.maxWeaponLevel) { this.weaponLevel++; return true; } return false; }
        fire(aimAngle, bullets, projectileStats) {
            if (this.cooldown > 0) return;
            const cnt = projectileStats.projectiles, ta = 0.4*(cnt-1), sa = aimAngle - ta/2;
            const af = this.obtenerAfinidades(); let dom = 'fisico', max = 0;
            for (const el in af) if (af[el] > max) { max = af[el]; dom = el; }
            let tienePerforacion=false, tieneRebote=false, tieneExplosivo=false, tieneTeledirigido=false, tieneMina=false;
            for (const m of this.modulosEquipados) {
                if (!m || !m.projMod) continue;
                if(m.projMod==='perforacion')tienePerforacion=true;
                if(m.projMod==='rebote')tieneRebote=true;
                if(m.projMod==='explosivo')tieneExplosivo=true;
                if(m.projMod==='teledirigido')tieneTeledirigido=true;
                if(m.projMod==='mina')tieneMina=true;
            }
            for (let i = 0; i < cnt; i++) {
                const ang = cnt === 1 ? aimAngle : sa + i*(ta/(cnt-1));
                const b = new Bullet(this.x+Math.cos(ang)*this.radio, this.y+Math.sin(ang)*this.radio, Math.cos(ang)*360, Math.sin(ang)*360, projectileStats.damage, tieneRebote?1:0, dom);
                b.owner = 'player';
                if (tienePerforacion) b.perforacion = 2;
                if (tieneExplosivo) b.explosivo = true;
                if (tieneTeledirigido) b.teledirigido = true;
                if (tieneMina) { b.esMina = true; b.radio = 6; }
                if (af.fuego >= 3) b.quemadura = 2+af.fuego*0.5;
                if (af.hielo >= 3) b.congelacion = 0.5-af.hielo*0.1;
                if (af.veneno >= 3) b.veneno = 2+af.veneno*0.5;
                if (af.agua >= 3) b.empuje = af.agua*50;
                for (const bf of this.buffs) {
                    if(bf.tipo==='perforacion')b.perforacion=bf.valor;
                    if(bf.tipo==='rebote')b.rebotes=bf.valor;
                    if(bf.tipo==='explosivo')b.explosivo=true;
                    if(bf.tipo==='teledirigido')b.teledirigido=true;
                }
                bullets.push(b);
            }
            this.cooldown = projectileStats.fireRate;
        }
        quitarModulo(slot) { if (this.modulosEquipados[slot]) { this.inventarioModulos.push(this.modulosEquipados[slot]); this.modulosEquipados[slot] = null; } this.actualizarOrbitalesDesdeModulos(); }
        equiparDesdeInventario(idx) { if (!this.inventarioModulos[idx]) return; const p = this.inventarioModulos.splice(idx,1)[0]; let slot = this.modulosEquipados.indexOf(null); if (slot === -1) slot = 0; if (this.modulosEquipados[slot]) this.inventarioModulos.push(this.modulosEquipados[slot]); this.modulosEquipados[slot] = p; this.actualizarOrbitalesDesdeModulos(); }
    }

    // ==================== BULLET ====================
    class Bullet {
        constructor(x,y,vx,vy,damage,rebotes=0,elemento='fisico') {
            this.x=x; this.y=y; this.vx=vx; this.vy=vy; this.damage=damage||10; this.radio=4; this.alive=true;
            this.rebotes=rebotes; this.perforacion=0; this.explosivo=false; this.teledirigido=false; this.reflected=false;
            this.esMina=false; this.quemadura=0; this.congelacion=0; this.veneno=0; this.empuje=0;
            this.elemento=elemento; this.owner='player';
        }
        update(canvas, enemies) {
            if(this.teledirigido&&enemies.length>0){
                let t=null,md=200;
                for(const e of enemies)if(e.alive){const d=dist(this.x,this.y,e.x,e.y);if(d<md){md=d;t=e;}}
                if(t){const a=Math.atan2(t.y-this.y,t.x-this.x);this.vx+=Math.cos(a)*30;this.vy+=Math.sin(a)*30;const s=Math.hypot(this.vx,this.vy);if(s>420){this.vx*=420/s;this.vy*=420/s;}}
            }
            this.x+=this.vx*0.016; this.y+=this.vy*0.016;
            if(this.x<-50||this.x>canvas.width+50||this.y<-50||this.y>canvas.height+50)this.alive=false;
        }
        bounce(tx, ty) {
            if(this.rebotes>0){const dx=tx-this.x,dy=ty-this.y,len=Math.hypot(dx,dy);if(len>1){this.vx=(dx/len)*360;this.vy=(dy/len)*360;this.rebotes--;return true;}}
            return false;
        }
    }

    // ==================== ENEMY ====================
    class Enemy {
        constructor(x,y,nivelEvo,hpBase,sizeBase,speedBase,tipo='normal') {
            this.x=x; this.y=y; this.nivelEvo=nivelEvo||0; this.tipo=tipo;
            const mult=Math.pow(1.6,this.nivelEvo);
            this.hpMax=Math.floor((hpBase||25)*mult); this.hp=this.hpMax;
            this.radio=(sizeBase||14)*(0.9+this.nivelEvo*0.2);
            this.speed=(speedBase||72)*(0.9+this.nivelEvo*0.1);
            this.dañoContacto=Math.floor(2*mult); this.alive=true; this.haMuerto=false; this.esJefe=false;
            this.statusEffects=[]; this.jefeDisparoTimer=0; this.buildTimer=CONFIG.structures.builderInterval;
            this.barreraHP=tipo==='barrera'?CONFIG.combat.barreraHP:0; this.armor=0;
            this.color = { normal:'#4ade80', barrera:'#add8e6', proyectil:'#ffb6c1', kamikaze:'#ff4500', constructor:'#a0522d', arquero:'#ffa500' }[tipo]||'#fff';
            this.evolucionando=false; this.sprite=null;
            this.maxModulos=CONFIG.combat.enemyMaxModulos[tipo]||0; this.modulosEquipados=new Array(this.maxModulos).fill(null);
            this.shootInterval=CONFIG.combat.shootIntervals[tipo]||0; this.shootTimer=this.shootInterval;
            this.bulletDamage=CONFIG.combat.enemyBulletDamage;
            this.rebotaBalas=Math.random()<CONFIG.combat.reboundChance;
            this.patternType=null;
            if((tipo==='arquero'||tipo==='proyectil'||this.esJefe)&&Math.random()<0.4){
                const patterns=['abanico','espiral','mina']; this.patternType=patterns[Math.floor(Math.random()*patterns.length)];
            }
            this.hitsRequired = 0;  // Sistema de hits (0 = muerte normal por HP)
        }
        hasStatus(tipo) { return this.statusEffects.some(e=>e.tipo===tipo); }
        recogerDrop(drop) { if(drop.tipo==='modulo'&&drop.pieza){const slot=this.modulosEquipados.indexOf(null);if(slot!==-1)this.modulosEquipados[slot]=drop.pieza;} }
        update(player, canvas, game) {
            for(let i=this.statusEffects.length-1;i>=0;i--){
                const e=this.statusEffects[i]; e.duration-=game._dt();
                if(e.tipo==='quemadura')this.hp-=e.damagePerTick*game._dt();
                if(e.tipo==='congelacion')this.speed*=e.factor||0.5;
                if(e.tipo==='veneno')this.hp-=e.damagePerTick*game._dt();
                if(e.duration<=0){if(e.tipo==='congelacion')this.speed/=(e.factor||0.5);this.statusEffects.splice(i,1);}
            }
            if(this.hp<=0){this.alive=false;this.haMuerto=true;return;}
            const dx=player.x-this.x,dy=player.y-this.y,d=Math.hypot(dx,dy);
            if(d>1){this.x+=(dx/d)*this.speed*game._dt();this.y+=(dy/d)*this.speed*game._dt();}
            this.x=Math.max(this.radio,Math.min(canvas.width-this.radio,this.x));
            this.y=Math.max(this.radio,Math.min(canvas.height-this.radio,this.y));
            if(this.esJefe){this.jefeDisparoTimer=Math.max(0,this.jefeDisparoTimer-game._dt());if(this.jefeDisparoTimer<=0){this.jefeDisparoTimer=1.5;if(dist(this.x,this.y,player.x,player.y)<200)player.takeDamage(5);}}
        }
        applyStatusEffect(tipo, p) {
            if(tipo==='quemadura')this.statusEffects.push({tipo:'quemadura',damagePerTick:p.damage,duration:p.duration});
            if(tipo==='congelacion')this.statusEffects.push({tipo:'congelacion',factor:p.factor,duration:p.duration});
            if(tipo==='veneno')this.statusEffects.push({tipo:'veneno',damagePerTick:p.damage,duration:p.duration});
        }
    }
// ==================== SERVICIOS ====================
    class CombatService {
        updateBullets(bullets, enemies, structures, player, difficulty, powerActive, game) {
            for (let i = bullets.length-1; i >= 0; i--) {
                const b = bullets[i]; if (!b.alive) { bullets.splice(i,1); continue; }
                b.update(game.canvas, enemies);
                if (b.owner === 'enemy') {
                    if (dist(b.x, b.y, player.x, player.y) < b.radio + player.radio) {
                        let dmg = b.damage; if (b.reflected) dmg *= CONFIG.combat.reboundDamageMult;
                        player.takeDamage(dmg); b.alive = false; bullets.splice(i,1); continue;
                    }
                    for (const s of structures) { if (!s.alive) continue; if (dist(b.x, b.y, s.x, s.y) < b.radio + s.radio) { s.takeDamage(b.damage); b.alive = false; bullets.splice(i,1); break; } }
                    continue;
                }
                let destruida = false;
                for (const s of structures) { if (!s.alive) continue; if (dist(b.x, b.y, s.x, s.y) < b.radio + s.radio) { s.takeDamage(b.damage); if (!s.alive) game._emitParticles(s.x, s.y, '#8b7355', 8); if (b.perforacion <= 0 && b.rebotes <= 0 && !b.explosivo && !b.esMina) destruida = true; break; } }
                if (destruida) { bullets.splice(i,1); continue; }
                for (let j = enemies.length-1; j >= 0; j--) {
                    const e = enemies[j]; if (!e.alive) continue;
                    if (dist(b.x, b.y, e.x, e.y) < b.radio + e.radio) {
                        // --- SISTEMA DE HITS PARA JEFES ---
                        if (e.hitsRequired > 0) {
                            e.hitsRequired--;
                            if (e.hitsRequired <= 0) { e.hp = 0; e.alive = false; if (!e.haMuerto) { e.haMuerto = true; game.procesarMuerteEnemigo(e); } }
                            if (b.perforacion <= 0 && b.rebotes <= 0 && !b.explosivo && !b.esMina) destruida = true;
                            break;
                        }
                        let dmg = b.damage;
                        if (e.armor > 0) dmg = Math.max(1, dmg - e.armor);
                        if (powerActive) dmg *= 2.5;
                        if (Math.random() < player.critChance) { dmg *= CONFIG.player.critMultiplier; game.criticosRealizados++; game._emitParticles(e.x, e.y, '#ffd700', 5); }
                        if (e.barreraHP > 0) { if (dmg >= e.barreraHP) { dmg -= e.barreraHP; e.barreraHP = 0; } else { e.barreraHP -= dmg; dmg = 0; } }
                        e.hp -= dmg;
                        game.powerBar = Math.min(game.maxPowerBar, game.powerBar + dmg * CONFIG.combat.powerBarChargePerDamage);
                        if (game.powerBar >= game.maxPowerBar && !game.powerActive) { game.powerActive = true; game.powerTimer = CONFIG.combat.powerBarDuration; game.powerBar = 0; }
                        if (player.lifesteal > 0) player.heal(dmg * player.lifesteal/100);
                        if (b.elemento === 'fuego') e.applyStatusEffect('quemadura', { damage:2+(player.obtenerAfinidades().fuego||0)*0.5, duration:2.0 });
                        if (b.elemento === 'hielo') { const af = player.obtenerAfinidades().hielo || 0; const freezeChance = CONFIG.combat.freezeChanceBase + af * 0.05 + (player._pasivasActivas?.hielo?.[1]?0.1:0); const willFreeze = Math.random() < freezeChance; const extraDur = player._pasivasActivas?.hielo?.[1]?0.5:0; e.applyStatusEffect('congelacion', { factor: CONFIG.combat.freezeBaseSlow - af * 0.05, duration: willFreeze ? Math.min(CONFIG.combat.freezeMaxDuration + extraDur, 0.5 + af * 0.2 + extraDur) : 1.0, freezeChance: 0 }); }
                        if (b.elemento === 'veneno') e.applyStatusEffect('veneno', { damage:2+(player.obtenerAfinidades().veneno||0)*0.5 + (player._pasivasActivas?.veneno?.[0]?1:0), duration:3.0 });
                        if (b.elemento === 'agua') { const empujeMult = 1 + (player._pasivasActivas?.agua?.[0]?0.2:0); e.x += (e.x - player.x)*0.1*empujeMult; e.y += (e.y - player.y)*0.1*empujeMult; if (player._pasivasActivas?.agua?.[1]) e.hp -= 5; }
                        if (b.esMina) { game.zonas.push(new ZonaElemental(e.x, e.y, b.elemento, CONFIG.combat.patterns.mina.zoneDuration)); game._addExplosion(e.x, e.y, 25); }
                        if (e.hasStatus('congelacion') && player._pasivasActivas?.hielo?.[2]) dmg *= 1.5;
                        if (e.hasStatus('veneno') && player._pasivasActivas?.veneno?.[2]) { for (const en of enemies) { if (en !== e && en.alive && dist(e.x, e.y, en.x, en.y) < 60) en.applyStatusEffect('veneno', { damage:2, duration:2.0 }); } }
                        if (e.rebotaBalas && b.rebotes < CONFIG.combat.maxEnemyRebounds) { b.vx *= -1; b.vy *= -1; b.owner = 'enemy'; b.reflected = true; b.rebotes++; b.alive = true; game._emitParticles(e.x, e.y, '#ff00ff', 5); }
                        else { if (!e.haMuerto && e.hp <= 0) { e.haMuerto = true; game.procesarMuerteEnemigo(e); } if (b.perforacion > 0) b.perforacion--; else if (b.rebotes > 0) { let target = null, minD = Infinity; for (let k = 0; k < enemies.length; k++) { if (k === j || !enemies[k].alive) continue; const d = dist(enemies[k].x, enemies[k].y, b.x, b.y); if (d < minD && d < 150) { minD = d; target = enemies[k]; } } if (target) b.bounce(target.x, target.y); else destruida = true; } else destruida = true; }
                        if (destruida) break;
                    }
                }
                if (destruida) bullets.splice(i,1);
            }
        }
        updateEnemies(enemies, player, canvas, game) {
            for (let i = enemies.length-1; i >= 0; i--) {
                const e = enemies[i]; if (!e.alive) { enemies.splice(i,1); continue; }
                e.update(player, canvas, game);
                if (dist(e.x, e.y, player.x, player.y) < e.radio + player.radio) {
                    let dmg = e.dañoContacto;
                    for (const m of e.modulosEquipados) { if (!m) continue; if (m.elemento === 'fuego') player.takeDamage(2 + m.afinidad); if (m.elemento === 'veneno') player.addBuff('veneno', 2 + m.afinidad, 1.0); if (m.elemento === 'hielo') player.addBuff('speed', -60, 0.5); }
                    if (player.takeDamage(dmg * 0.5)) { game._emitParticles(player.x, player.y, '#ff6b6b', 5); }
                    if (player.hp <= 0) game._checkNemesisOnDeath(e);
                }
                if (e.tipo === 'constructor') { e.buildTimer -= game._dt(); if (e.buildTimer <= 0) { e.buildTimer = CONFIG.structures.builderInterval; game.spawnStructure(e.x+(Math.random()-0.5)*40, e.y+(Math.random()-0.5)*40); } }
                if (e.shootInterval > 0) {
                    e.shootTimer -= game._dt();
                    if (e.shootTimer <= 0) {
                        e.shootTimer = e.shootInterval;
                        const enemyBullets = game.balas;
                        if (enemyBullets.filter(b => b.owner === 'enemy').length < CONFIG.combat.maxEnemyBullets) {
                            const baseAngle = Math.atan2(player.y - e.y, player.x - e.x);

    class DropService {
        generarLoot(enemy, player) {
            if (Math.random() > CONFIG.combat.dropChance) return null;
            let ri = 0; if (enemy.nivelEvo >= 2) ri = Math.min(3, enemy.nivelEvo); else if (enemy.nivelEvo === 1) ri = 1;
            const ra = CONFIG.drops.rarezas; let total = 0; for (let i = 0; i <= ri; i++) total += ra[i].peso;
            let r = Math.random()*total, sel = ra[0]; for (let i = 0; i <= ri; i++) { r -= ra[i].peso; if (r <= 0) { sel = ra[i]; break; } }
            const tipos = Object.keys(CONFIG.drops.tipos), tk = tipos[Math.floor(Math.random()*tipos.length)];
            const td = CONFIG.drops.tipos[tk]; const val = td.base + player.weaponLevel*td.porNivel;

            const tipo = CONFIG.modules.tipos[Math.floor(Math.random()*CONFIG.modules.tipos.length)];

            if (tipo === 'ataque') stats.damage = afinidad; else if (tipo === 'defensa') stats.armor = 1; else if (tipo === 'utilidad') stats.speed = 12 * afinidad; else if (tipo === 'orbe') stats.damage = afinidad;

    class CraftingService {
        constructor(game) { this.game = game; }
        fusionar(modulos) {
            if (modulos.length !== 3) return null;

    class ProyectilService {
        constructor(player, sinergiaService) { this.player = player; this.sinergiaService = sinergiaService; }
        getStats() {
            const p = this.player;
            let speed = CONFIG.player.baseSpeed + p.permanentUpgrades.speedBonus;
            let damage = CONFIG.player.baseDamage + p.permanentUpgrades.damageBonus*2;
            let fireRate = CONFIG.player.baseFireRate + p.permanentUpgrades.fireRateBonus;
            let projectiles = CONFIG.player.baseProjectiles + p.weaponLevel - 1 + p.permanentUpgrades.projectilesBonus;
            let armor = CONFIG.player.baseArmor + p.permanentUpgrades.armorBonus; let critExtra = 0;
            for (const b of p.buffs) { if (b.tipo === 'speed') speed += b.valor; if (b.tipo === 'damage') damage += b.valor; if (b.tipo === 'fireRate') fireRate += b.valor; if (b.tipo === 'projectiles') projectiles += b.valor; if (b.tipo === 'armor') armor += b.valor; }
            for (const m of p.modulosEquipados) { if (!m) continue; if (m.stats.damage) damage += m.stats.damage; if (m.stats.speed) speed += m.stats.speed; if (m.stats.fireRate) fireRate += m.stats.fireRate; if (m.stats.projectiles) projectiles += m.stats.projectiles; if (m.stats.critChance) critExtra += m.stats.critChance; if (m.stats.armor) armor += m.stats.armor; }
            const sinergias = this.sinergiaService.calculate(p.modulosEquipados);
            if (sinergias.dañoFuego) damage += sinergias.dañoFuego; if (sinergias.velocidadAtaque) fireRate -= sinergias.velocidadAtaque; if (sinergias.escudo) armor += sinergias.escudo; if (sinergias.dañoExtra) damage += sinergias.dañoExtra; if (sinergias.velocidad) speed += sinergias.velocidad;

            fireRate = Math.max(CONFIG.player.minFireRate, fireRate);

        }

            }
            if (this.kills > 0 && this.kills % CONFIG.combat.miniBossInterval === 0 && !this.enemigos.some(e=>e.esJefe&&e.alive && e.nivelEvo<3)) this.spawnMiniBoss();
            if (this.kills > 0 && this.kills % CONFIG.combat.bossInterval === 0 && !this.enemigos.some(e=>e.esJefe&&e.alive)) this.spawnBoss();
            if (this.nemesisActivo) { this.nemesisTimer -= dt; if (this.nemesisTimer <= 0) { this.spawnNemesis(); } }
            this.jugador.updateOrbitales(this.enemigos, this.balas); this.difficulty.update(this.jugador, this.kills, dt);
            for (let i = this.ui.particles.length-1; i >= 0; i--) { const p = this.ui.particles[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.98; p.vy *= 0.98; p.life -= dt; if (p.life <= 0) this.ui.particles.splice(i,1); }
            if (this.ui.cameraShake.intensity > 0) { this.ui.cameraShake.intensity *= 0.9; if (this.ui.cameraShake.intensity < 0.01) this.ui.cameraShake.intensity = 0; }
            if (this.jugador.hp <= 0 && !this.practiceMode) { this.gameOver = true; this.jugador.hp = 0; this.finalizarPartida(); }
        }
        _draw() {
            this.renderer.clear(); const ctx = this.renderer.ctx; const shaking = this.ui.cameraShake.intensity > 0.001;
            if (shaking) { ctx.save(); ctx.translate((Math.random()-0.5)*this.ui.cameraShake.intensity*2, (Math.random()-0.5)*this.ui.cameraShake.intensity*2); }
            this.renderer.drawBackground();
            for (const z of this.zonas) this.renderer.drawZone(z);
            for (const s of this.estructuras) this.renderer.drawStructure(s);
            for (const d of this.drops) this.renderer.drawDrop(d);
            for (const e of this.enemigos) this.renderer.drawEnemy(e);
            for (const b of this.balas) this.renderer.drawBullet(b);
            for (const ex of this.explosiones) this.renderer.drawExplosion(ex.x, ex.y, ex.radius, ex.alpha);
            this.renderer.drawParticles(this.ui.particles);
            this.renderer.drawPlayer(this.jugador, { player: this.jugador, game: this, canvas: this.canvas });
            if (shaking) ctx.restore();
            this.renderer.drawUI({ player: this.jugador, game: this, canvas: this.canvas });
        }
    }

    // ==================== INICIALIZACIÓN ====================
    document.addEventListener('DOMContentLoaded', () => {
        const canvas = document.getElementById('game');
        if (!canvas) return;
        const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        const input = isMobile ? new MobileInputAdapter(canvas) : new WebInputAdapter(canvas);
        const renderer = new CanvasRenderer(canvas);
        const persistence = new LocalStorageRepo();
        const game = new Game(canvas, input, renderer, persistence);
        const activateAudio = () => {
            game.audio.init();
            document.removeEventListener('click', activateAudio);
            document.removeEventListener('touchstart', activateAudio);
            document.removeEventListener('keydown', activateAudio);
        };
        document.addEventListener('click', activateAudio);
        document.addEventListener('touchstart', activateAudio);
        document.addEventListener('keydown', activateAudio);
        window.__game = game;
    });
    </script>
</body>
</html>
