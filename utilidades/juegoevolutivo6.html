            this.hp = 120;
            this.xp = 0; this.nivel = 1; this.xpProximoNivel = CONFIG.combat.levelBaseXP;
            this.sistemasDesbloqueados = [];
        }
        init(x, y, saveData) {
            this.x = x; this.y = y; this.weaponLevel = 1;
            this.permanentUpgrades = { hpBonus:0, speedBonus:0, damageBonus:0, fireRateBonus:0, projectilesBonus:0, armorBonus:0, critBonus:0 };
            if (saveData) {
                this.destinyPoints = saveData.destinyPoints || 0;
                if (saveData.upgrades) Object.assign(this.permanentUpgrades, saveData.upgrades);
                this.modulosEquipados = saveData.modulosEquipados || [null,null,null,null];
                this.inventarioModulos = saveData.inventarioModulos || [];
            }
            this.hp = this.getMaxHp();
            this.critChance = CONFIG.player.baseCritChance + (this.permanentUpgrades.critBonus||0)*0.05;
            this.cooldown = 0; this.buffs = []; this.dashing = false; this.invincible = false;
            this.orbitales = []; this.actualizarOrbitalesDesdeModulos();
        }
        getMaxHp() { return CONFIG.player.baseHp + this.permanentUpgrades.hpBonus * 5; }
        obtenerAfinidades() {
            const af = { fuego:0, hielo:0, veneno:0, agua:0, fisico:0 };
            for (const m of this.modulosEquipados) if (m) af[m.elemento] = (af[m.elemento]||0) + m.afinidad;
            return af;
        }
        actualizarOrbitalesDesdeModulos() {
            this.orbitales = [];
            for (const m of this.modulosEquipados) if (m && m.tipo === 'orbe') this.orbitales.push({ pieza:m, angulo:Math.random()*Math.PI*2, cooldown:0 });
        }
        updateOrbitales(enemies, bullets) {
            for (const orb of this.orbitales) {
                orb.angulo += 0.02; orb.cooldown--;
                const ox = this.x + Math.cos(orb.angulo)*25, oy = this.y + Math.sin(orb.angulo)*25;
                if (orb.cooldown <= 0 && enemies.length > 0) {
                    let t = null, md = 200;
                    for (const e of enemies) if (e.alive) { const d = dist(ox, oy, e.x, e.y); if (d < md) { md = d; t = e; } }
                    if (t) {
                        const a = Math.atan2(t.y-oy, t.x-ox);
                        bullets.push(new Bullet(ox, oy, Math.cos(a)*5, Math.sin(a)*5, 5+(orb.pieza.stats.damage||0), 0, orb.pieza.elemento));
                        orb.cooldown = 20;
                    }
                }
            }
        }
        update(input) {
            this.updateBuffs();
            if (this.cooldown > 0) this.cooldown--;
            if (this.dashCooldown > 0) this.dashCooldown--;
            if (this.dashing) { this.dashTimer--; if (this.dashTimer <= 0) { this.dashing = false; this.invincible = false; } }
        }
        updateBuffs() {
            for (let i = this.buffs.length-1; i >= 0; i--) {
                this.buffs[i].duracion--;
                if (this.buffs[i].duracion <= 0) { if (this.buffs[i].tipo === 'roboVida') this.lifesteal = 0; this.buffs.splice(i,1); }
            }
        }
        addBuff(tipo, valor, duracion) {
            const e = this.buffs.find(b => b.tipo === tipo);
            if (e) e.duracion = Math.max(e.duracion, duracion);
            else { this.buffs.push({ tipo, valor, duracion }); if (tipo === 'roboVida') this.lifesteal = valor; }
        }
        takeDamage(amount) {
            if (this.invincible) return false;
            const armor = 0;
            const final = Math.max(1, amount - (armor||0));
            this.hp -= final;
            if (this.hp < 0) this.hp = 0;
            if (CONFIG.input.vibrate && navigator.vibrate) navigator.vibrate(20);
            return true;
        }
        heal(amount) { this.hp = Math.min(this.getMaxHp(), this.hp + amount); }
        upgradeWeapon() { if (this.weaponLevel < CONFIG.player.maxWeaponLevel) { this.weaponLevel++; return true; } return false; }
        fire(aimAngle, bullets, projectileStats) {
            if (this.cooldown > 0) return;
            const cnt = projectileStats.projectiles;
            const ta = 0.4*(cnt-1), sa = aimAngle - ta/2;
            const af = this.obtenerAfinidades();
            let dom = 'fisico', max = 0;
            for (const el in af) if (af[el] > max) { max = af[el]; dom = el; }
            for (let i = 0; i < cnt; i++) {
                const ang = cnt === 1 ? aimAngle : sa + i*(ta/(cnt-1));
                const b = new Bullet(
                    this.x + Math.cos(ang)*this.radio, this.y + Math.sin(ang)*this.radio,
                    Math.cos(ang)*6, Math.sin(ang)*6, projectileStats.damage, 0, dom
                );
                if (af.fuego >= 3) b.quemadura = 2+af.fuego*0.5;
                if (af.hielo >= 3) b.congelacion = 0.5-af.hielo*0.1;
                if (af.veneno >= 3) b.veneno = 2+af.veneno*0.5;
                if (af.agua >= 3) b.empuje = af.agua*50;
                for (const bf of this.buffs) {
                    if (bf.tipo === 'perforacion') b.perforacion = bf.valor;
                    if (bf.tipo === 'rebote') b.rebotes = bf.valor;
                    if (bf.tipo === 'explosivo') b.explosivo = true;
                    if (bf.tipo === 'teledirigido') b.teledirigido = true;
                }
                bullets.push(b);
            }
            this.cooldown = projectileStats.fireRate;
        }
        quitarModulo(slot) {
            if (this.modulosEquipados[slot]) { this.inventarioModulos.push(this.modulosEquipados[slot]); this.modulosEquipados[slot] = null; }
            this.actualizarOrbitalesDesdeModulos();
        }
        equiparDesdeInventario(idx) {
            if (!this.inventarioModulos[idx]) return;
            const p = this.inventarioModulos.splice(idx,1)[0];
            let slot = this.modulosEquipados.indexOf(null);
            if (slot === -1) slot = 0;
            if (this.modulosEquipados[slot]) this.inventarioModulos.push(this.modulosEquipados[slot]);
            this.modulosEquipados[slot] = p;
            this.actualizarOrbitalesDesdeModulos();
        }
    }

    // ==================== BULLET ====================
    class Bullet {
        constructor(x,y,vx,vy,damage,rebotes=0,elemento='fisico') {
            this.x = x; this.y = y; this.vx = vx; this.vy = vy;
            this.damage = damage||10; this.radio = 4; this.alive = true;
            this.rebotes = rebotes; this.perforacion = 0; this.explosivo = false;
            this.teledirigido = false; this.quemadura = 0; this.congelacion = 0; this.veneno = 0; this.empuje = 0;
            this.elemento = elemento;
        }
        update(canvas, enemies) {
            if (this.teledirigido && enemies.length > 0) {
                let t = null, md = 200;
                for (const e of enemies) if (e.alive) { const d = dist(this.x, this.y, e.x, e.y); if (d < md) { md = d; t = e; } }
                if (t) {
                    const a = Math.atan2(t.y-this.y, t.x-this.x);
                    this.vx += Math.cos(a)*0.5; this.vy += Math.sin(a)*0.5;
                    const s = Math.hypot(this.vx, this.vy); if (s > 7) { this.vx *= 7/s; this.vy *= 7/s; }
                }
            }
            this.x += this.vx; this.y += this.vy;
            if (this.x < -50 || this.x > canvas.width+50 || this.y < -50 || this.y > canvas.height+50) this.alive = false;
        }
        bounce(tx, ty) {
            if (this.rebotes > 0) {
                const dx = tx-this.x, dy = ty-this.y, len = Math.hypot(dx, dy);
                if (len > 1) { this.vx = (dx/len)*6; this.vy = (dy/len)*6; this.rebotes--; return true; }
            }
            return false;
        }
    }

    // ==================== ENEMY ====================
    class Enemy {
        constructor(x,y,nivelEvo,hpBase,sizeBase,speedBase,tipo='normal') {
            this.x = x; this.y = y; this.nivelEvo = nivelEvo||0; this.tipo = tipo;
            const mult = Math.pow(1.6, this.nivelEvo);
            this.hpMax = Math.floor((hpBase||25)*mult); this.hp = this.hpMax;
            this.radio = (sizeBase||14)*(0.9+this.nivelEvo*0.2);
            this.speed = (speedBase||1.2)*(0.9+this.nivelEvo*0.1);
            this.dañoContacto = Math.floor(8*mult);
            this.alive = true; this.haMuerto = false; this.esJefe = false;
            this.statusEffects = []; this.jefeDisparoTimer = 0;
            this.buildTimer = CONFIG.structures.builderInterval;
            this.barreraHP = tipo==='barrera'?CONFIG.combat.barreraHP:0;
            this.color = { normal:['#4ade80','#facc15','#f87171','#c084fc'][Math.min(this.nivelEvo,3)],
                barrera:'#add8e6', proyectil:'#ffb6c1', kamikaze:'#ff4500', constructor:'#a0522d' }[tipo]||'#fff';
            this.evolucionando = false;
            this.sprite = null; // lo asigna Game.spawnEnemy
        }
        hasStatus(tipo) { return this.statusEffects.some(e=>e.tipo===tipo); }
        update(player, canvas, game) {
            for (let i = this.statusEffects.length-1; i >= 0; i--) {
                const e = this.statusEffects[i];
                if (e.tipo==='quemadura') { this.hp -= e.damagePerTick; e.duration--; if (e.duration<=0) this.statusEffects.splice(i,1); }
                if (e.tipo==='congelacion') { this.speed *= e.factor||0.5; e.duration--; if (e.duration<=0) { this.speed /= (e.factor||0.5); this.statusEffects.splice(i,1); } }
                if (e.tipo==='veneno') { this.hp -= e.damagePerTick; e.duration--; if (e.duration<=0) this.statusEffects.splice(i,1); }
            }
            if (this.hp <= 0) { this.alive = false; this.haMuerto = true; return; }
            const dx = player.x - this.x, dy = player.y - this.y, d = Math.hypot(dx, dy);
            if (d > 1) { this.x += (dx/d)*this.speed; this.y += (dy/d)*this.speed; }
            this.x = Math.max(this.radio, Math.min(canvas.width-this.radio, this.x));
            this.y = Math.max(this.radio, Math.min(canvas.height-this.radio, this.y));
            if (this.esJefe) {
                this.jefeDisparoTimer++;
                if (this.jefeDisparoTimer >= 90) { this.jefeDisparoTimer = 0; if (dist(this.x, this.y, player.x, player.y) < 200) player.takeDamage(5); }
            }
        }
        applyStatusEffect(tipo, p) {
            if (tipo==='quemadura') this.statusEffects.push({ tipo:'quemadura', damagePerTick:p.damage, duration:p.duration });
            if (tipo==='congelacion') this.statusEffects.push({ tipo:'congelacion', factor:p.factor, duration:p.duration });
            if (tipo==='veneno') this.statusEffects.push({ tipo:'veneno', damagePerTick:p.damage, duration:p.duration });
        }
    }

    // ==================== GAME ====================
    class Game {
        constructor(canvas, inputPort, rendererPort, persistencePort) {
            this.canvas = canvas;
            this.input = inputPort;
            this.renderer = rendererPort;
            this.persistence = persistencePort;
            this.esMovil = inputPort instanceof MobileInputAdapter;
            this.baseWidth = 900; this.baseHeight = 600;

            // Servicios (se crean después del jugador)
            this.difficulty = new DifficultyService();
            this.combatService = new CombatService();
            this.evolutionService = new EvolutionService();
            this.dropService = new DropService();
            this.spriteGenerator = new SpriteGenerator();
            this.sinergiaService = new SinergiaService();

            // Estado
            this.enemigos = []; this.balas = []; this.drops = []; this.estructuras = []; this.zonas = [];
            this.pausado = false; this.gameOver = false;
            this.kills = 0; this.tiempoSobrevivido = 0;
            this.spawnTimer = CONFIG.combat.spawnInterval;
            this.cargaUltimate = 0; this.maxCargaUltimate = 100;
            this.ultiUsos = 0; this.criticosRealizados = 0;
            this.dropsRecogidos = 0; this.jefesDerrotados = 0;
            this.powerBar = 0; this.maxPowerBar = 100;
            this.powerActive = false; this.powerTimer = 0;
            this.practiceMode = false;
            this.oleadaTimer = 600;
            this.ui = { messages: [], particles: [], cameraShake: { x:0, y:0, intensity:0 } };

            // Jugador (se crea antes que los servicios que dependen de él)
            this.jugador = new Player();
            const save = this.persistence.load();
            this.jugador.init(canvas.width/2, canvas.height/2, save);
            this.logrosDesbloqueados = save.logros || [];
            this.jugador.modulosEquipados = save.modulosEquipados || [null,null,null,null];
            this.jugador.inventarioModulos = save.inventarioModulos || [];

            // Servicios que dependen del jugador
            this.proyectilService = new ProyectilService(this.jugador, this.sinergiaService);
            this.nivelService = new NivelService(this.jugador);

            this._initSideMenu();
            this.resize();
            window.addEventListener('resize', () => this.resize());
            this._bindInput();
            this._loop();
        }

        _initSideMenu() {
            this.menuPanel = document.getElementById('side-menu');
            this.tabButtons = this.menuPanel.querySelectorAll('.tab-buttons button');
            this.tabContents = {
                modulos: document.getElementById('tab-modulos'),
                stats: document.getElementById('tab-stats'),
                tienda: document.getElementById('tab-tienda'),
                architect: document.getElementById('tab-architect')
            };
            this.tabButtons.forEach(btn => btn.addEventListener('click', () => this._switchTab(btn.dataset.tab)));
            document.getElementById('menu-close').addEventListener('click', () => this.toggleMenu());
            this._buildArchitectTab();
            this._buildTiendaTab();
        }

        toggleMenu() {
            if (this.menuPanel.style.display === 'block') {
                this.menuPanel.style.display = 'none';
                if (!this._opcionesNivel) this.pausado = false;
            } else {
                this.pausado = true;
                this._refreshModulosTab();
                this._refreshStatsTab();
                this._refreshTiendaTab();
                this.menuPanel.style.display = 'block';
                this._switchTab('modulos');
            }
        }

        _switchTab(id) {
            this.tabButtons.forEach(b => b.classList.remove('active'));
            this.menuPanel.querySelector(`[data-tab="${id}"]`).classList.add('active');
            Object.keys(this.tabContents).forEach(k => this.tabContents[k].classList.remove('active'));
            this.tabContents[id].classList.add('active');
            if (id === 'modulos') this._refreshModulosTab();
            if (id === 'stats') this._refreshStatsTab();
            if (id === 'tienda') this._refreshTiendaTab();
        }

        _refreshModulosTab() {
            let html = '<h4>Slots equipados</h4>';
            const nombres = ['Norte','Sur','Este','Oeste'];
            for (let i = 0; i < 4; i++) {
                const m = this.jugador.modulosEquipados[i];
                html += `<div style="margin:4px 0">${nombres[i]}: `;
                if (m) {
                    html += `<span style="color:${m.color}">${m.runa} (${m.elemento})</span> ${m.descripcion()}`;
                    html += ` <button onclick="window.__game.jugador.quitarModulo(${i});window.__game._refreshModulosTab();">X</button>`;
                } else {
                    html += `vacío <button onclick="window.__game.asignarModuloASlot(${i})">Asignar</button>`;
                }
                html += `</div>`;
            }
            html += '<h4>Inventario</h4>';
            this.jugador.inventarioModulos.forEach((m, idx) => {
                html += `<div><span style="color:${m.color}">${m.runa} (${m.elemento})</span> ${m.descripcion()} <button onclick="window.__game.jugador.equiparDesdeInventario(${idx});window.__game._refreshModulosTab();">Equipar (auto)</button></div>`;
            });
            this.tabContents.modulos.innerHTML = html;
        }

        asignarModuloASlot(slot) {
            if (this.jugador.inventarioModulos.length === 0) { alert('No hay módulos'); return; }
            const nombres = ['Norte','Sur','Este','Oeste'];
            const lista = this.jugador.inventarioModulos.map((m,i) => `${i}: ${m.runa} (${m.elemento}) - ${m.descripcion()}`).join('\n');
            const idx = parseInt(prompt(`Selecciona módulo para ${nombres[slot]}:\n${lista}\nNúmero:`));
            if (!isNaN(idx) && idx >= 0 && idx < this.jugador.inventarioModulos.length) {
                const pieza = this.jugador.inventarioModulos.splice(idx, 1)[0];
                if (this.jugador.modulosEquipados[slot]) this.jugador.inventarioModulos.push(this.jugador.modulosEquipados[slot]);
                this.jugador.modulosEquipados[slot] = pieza;
                this.jugador.actualizarOrbitalesDesdeModulos();
                this._refreshModulosTab();
            }
        }

        _refreshStatsTab() {
            const s = this.proyectilService.getStats();
            const af = this.jugador.obtenerAfinidades();
            let html = '<h4>Estadísticas</h4>';
            html += `<p>❤️ Vida: ${Math.floor(this.jugador.hp)}/${this.jugador.getMaxHp()}</p>`;
            html += `<p>⚔️ Daño: ${s.damage}</p><p>⏱️ Cadencia: ${s.fireRate} frames</p>`;
            html += `<p>🔫 Proyectiles: ${s.projectiles}</p><p>🎯 Crítico: ${(this.jugador.critChance*100).toFixed(1)}% (x${CONFIG.player.critMultiplier})</p>`;
            html += `<p>💨 Velocidad: ${s.speed.toFixed(2)}</p><p>🛡️ Armadura: ${s.armor}</p>`;
            html += '<h4>Afinidades elementales</h4>';
            for (const el in af) html += `<p style="color:${this._colorElemento(el)}">${el}: ${af[el]} / ${CONFIG.elements.afinidadMax}</p>`;
            html += '<h4>Efectos activos</h4>';
            html += this.jugador.buffs.map(b => `${b.tipo}: ${b.valor} (${b.duracion}f)`).join('<br>') || 'Ninguno';
            this.tabContents.stats.innerHTML = html;
        }

        _colorElemento(el) {
            return { fuego:'#ff6600', hielo:'#00ccff', veneno:'#99cc00', agua:'#3399ff', fisico:'#ccc' }[el] || '#fff';
        }

        _buildTiendaTab() {}
        _refreshTiendaTab() {
            const pts = this.jugador.destinyPoints;
            const mejoras = [
                { id:'hpBonus', n:'Vida +5', c:10, a:'hpBonus' }, { id:'damageBonus', n:'Daño +2', c:15, a:'damageBonus' },
                { id:'speedBonus', n:'Velocidad +0.2', c:12, a:'speedBonus' }, { id:'fireRateBonus', n:'Cadencia -1', c:20, a:'fireRateBonus' },
                { id:'projectilesBonus', n:'Proyectil +1', c:30, a:'projectilesBonus' }, { id:'critBonus', n:'Crítico +5%', c:18, a:'critBonus' }
            ];
            let html = `<p>Puntos de Destino: ${pts}</p>`;
            mejoras.forEach(m => {
                const act = this.jugador.permanentUpgrades[m.a] || 0;
                html += `<button ${pts >= m.c ? '' : 'disabled'} onclick="window.__game.comprarMejora('${m.a}',${m.c})">${m.n} (${m.c} PD) [${act}]</button><br>`;
            });
            this.tabContents.tienda.innerHTML = html;
        }

        comprarMejora(attr, costo) {
            if (this.jugador.destinyPoints >= costo) {
                this.jugador.destinyPoints -= costo;
                this.jugador.permanentUpgrades[attr] = (this.jugador.permanentUpgrades[attr] || 0) + 1;
                if (attr === 'critBonus') this.jugador.critChance = CONFIG.player.baseCritChance + this.jugador.permanentUpgrades.critBonus * 0.05;
                this._guardarProgreso();
                this._refreshTiendaTab();
                this._refreshStatsTab();
            }
        }

        _buildArchitectTab() {
            let h = '<h4>Controles</h4>';
            h += `Asistencia: <input type="range" id="arch-aimassist" min="0" max="90" step="5" value="${CONFIG.input.aimAssist}"><br>`;
            h += `<label><input type="checkbox" id="arch-autofire" ${CONFIG.input.autoFire?'checked':''}> Disparo automático</label><br>`;
            h += `<label><input type="checkbox" id="arch-freeautoaim" ${CONFIG.input.freeAutoAim?'checked':''}> Autoapuntado libre</label><br>`;
            h += `<h4>Combate</h4>`;
            h += `Spawn: <input type="range" id="arch-spawninterval" min="20" max="200" step="5" value="${CONFIG.combat.spawnInterval}"><br>`;
            h += `Max enemigos: <input type="range" id="arch-maxenemies" min="10" max="60" step="5" value="${CONFIG.combat.maxEnemies}"><br>`;
            h += `Especiales: <input type="range" id="arch-specialenemychance" min="0" max="0.5" step="0.05" value="${CONFIG.combat.specialEnemyChance}"><br>`;
            h += `<button id="arch-forzar-modulo">Forzar módulo</button><br>`;
            h += `<button id="arch-invencible">Invencibilidad 30s</button><br>`;
            h += `<button id="arch-practica">${this.practiceMode?'Desactivar':'Activar'} práctica</button><br>`;
            h += `<button id="arch-reset">Reset progreso</button>`;
            this.tabContents.architect.innerHTML = h;
            this.tabContents.architect.querySelectorAll('input[type="range"]').forEach(s => s.addEventListener('input', () => this._applyArchitect(s.id.replace('arch-',''), parseFloat(s.value))));
            this.tabContents.architect.querySelectorAll('input[type="checkbox"][id]').forEach(cb => cb.addEventListener('change', () => this._applyArchitect(cb.id.replace('arch-',''), cb.checked)));
            document.getElementById('arch-forzar-modulo').addEventListener('click', () => {
                const p = this.dropService.generarModule({ nivelEvo:1 });
                this.jugador.inventarioModulos.push(p);
                if (this.menuPanel.style.display === 'block') this._refreshModulosTab();
            });
            document.getElementById('arch-invencible').addEventListener('click', () => {
                this.jugador.invincible = true;
                setTimeout(() => { this.jugador.invincible = false; }, 30000);
            });
            document.getElementById('arch-practica').addEventListener('click', () => {
                this.practiceMode = !this.practiceMode;
                this._buildArchitectTab();
            });
            document.getElementById('arch-reset').addEventListener('click', () => {
                this.persistence.save(this.persistence.getDefault());
                this.jugador.init(this.canvas.width/2, this.canvas.height/2, this.persistence.load());
                this._refreshModulosTab(); this._refreshStatsTab();
            });
        }

        _applyArchitect(id, val) {
            const map = { aimassist:'input.aimAssist', autofire:'input.autoFire', freeautoaim:'input.freeAutoAim', spawninterval:'combat.spawnInterval', maxenemies:'combat.maxEnemies', specialenemychance:'combat.specialEnemyChance' };
            if (map[id]) { const k = map[id].split('.'); let o = CONFIG; for (let i = 0; i < k.length-1; i++) o = o[k[i]]; o[k[k.length-1]] = val; }
        }

        resize() {
            const mw = window.innerWidth, mh = window.innerHeight;
            let w, h;
            if (mw/mh > this.baseWidth/this.baseHeight) { h = mh; w = (this.baseWidth/this.baseHeight)*h; }
            else { w = mw; h = (this.baseHeight/this.baseWidth)*w; }
            this.canvas.width = w; this.canvas.height = h;
        }

        _bindInput() {
            document.addEventListener('keydown', e => {
                if (e.key.toLowerCase() === 'e' && !this.gameOver && !this.pausado) { e.preventDefault(); this.activarUltimate(); }
                if (e.key === 'Tab' && !this.gameOver) { e.preventDefault(); this.toggleMenu(); }
                if (e.key.toLowerCase() === 'r' && this.gameOver) this.reiniciarJuego();
            });
            if (this.esMovil) {
                document.getElementById('mobile-controls').style.display = 'flex';
                document.getElementById('btn-dash').addEventListener('touchstart', e => { e.preventDefault(); this.input.bufferAction('dash'); });
                document.getElementById('btn-ultimate').addEventListener('touchstart', e => { e.preventDefault(); this.input.bufferAction('ultimate'); });
                document.getElementById('btn-menu').addEventListener('touchstart', e => { e.preventDefault(); this.toggleMenu(); });
            }
        }

        reiniciarJuego() {
            const save = this.persistence.load();
            this.jugador.init(this.canvas.width/2, this.canvas.height/2, save);
            this.jugador.modulosEquipados = save.modulosEquipados || [null,null,null,null];
            this.jugador.inventarioModulos = save.inventarioModulos || [];
            this.enemigos = []; this.balas = []; this.drops = []; this.estructuras = []; this.zonas = [];
            this.pausado = false; this.gameOver = false;
            this.kills = 0; this.tiempoSobrevivido = 0;
            this.cargaUltimate = 0; this.ultiUsos = 0;
            this.criticosRealizados = 0; this.dropsRecogidos = 0; this.jefesDerrotados = 0;
            this.spawnTimer = CONFIG.combat.spawnInterval;
            this.powerBar = 0; this.powerActive = false; this.powerTimer = 0;
            this.oleadaTimer = 600;
            this.ui.messages = []; this.ui.particles = [];
            this.difficulty = new DifficultyService();
            this.spriteGenerator.cache.clear();
            document.getElementById('levelup-panel').style.display = 'none';
        }

        activarUltimate() {
            if (this.cargaUltimate >= this.maxCargaUltimate && !this.pausado) {
                this.cargaUltimate = 0; this.ultiUsos++;
                const ang = this._getAimAngle();
                for (const e of this.enemigos) {
                    if (!e.alive) continue;
                    const d = Math.abs((this.jugador.y-e.y)*Math.cos(ang)-(this.jugador.x-e.x)*Math.sin(ang));
                    if (d < e.radio+40) { e.hp -= 80; e.applyStatusEffect('quemadura', { damage:5, duration:120 }); }
                }
                this.ui.cameraShake.intensity = 0.4;
                this._emitParticles(this.jugador.x, this.jugador.y, '#ffd700', 30);
            }
        }

        _getAimAngle() {
            const aimVec = this.input.getAimVector();
            if (aimVec) return aimVec.angle;
            if (CONFIG.input.freeAutoAim && this.enemigos.length > 0) {
                let be = null, bd = Infinity;
                for (const e of this.enemigos) if (e.alive) { const d = dist(this.jugador.x, this.jugador.y, e.x, e.y); if (d < bd) { bd = d; be = e; } }
                if (be) return Math.atan2(be.y-this.jugador.y, be.x-this.jugador.x);
            }
            const move = this.input.getMove();
            return (move.dx !== 0 || move.dy !== 0) ? Math.atan2(move.dy, move.dx) : -Math.PI/2;
        }

        spawnEnemy() {
            const lado = Math.floor(Math.random()*4); let x,y;
            const W = this.canvas.width, H = this.canvas.height, m = 30;
            switch(lado) { case 0: x=Math.random()*W; y=-m; break; case 1: x=W+m; y=Math.random()*H; break; case 2: x=Math.random()*W; y=H+m; break; case 3: x=-m; y=Math.random()*H; break; }
            const scaling = 1+(this.kills*CONFIG.combat.scalingPerKill/100);
            const mult = this.difficulty.getMultipliers();
            const hp = CONFIG.combat.enemyBaseHp*scaling*mult.hp;
            const sz = CONFIG.combat.enemyBaseSize*(1+scaling*0.2);
            const sp = CONFIG.combat.enemyBaseSpeed*(1+scaling*0.1)*mult.speed;
            const ni = Math.random()<0.1+scaling*0.05?1:0;
            let tipo = 'normal';
            if (Math.random()<CONFIG.combat.specialEnemyChance) tipo = ['barrera','proyectil','kamikaze','constructor'][Math.floor(Math.random()*4)];
            const enemy = new Enemy(x,y,ni,hp,sz,sp,tipo);
            // Asignar sprite
            const elemento = ['fuego','hielo','veneno','agua','fisico'][Math.floor(Math.random()*5)];
            const rareza = ni >= 2 ? 'jefe' : (ni === 1 ? 'elite' : 'comun');
            enemy.sprite = this.spriteGenerator.getSprite(tipo, rareza, elemento, `${x},${y},${this.kills}`);
            this.enemigos.push(enemy);
        }

        spawnStructure(x,y) { if (this.estructuras.length < CONFIG.structures.maxOnScreen) this.estructuras.push(new Structure(x,y)); }

        _emitParticles(x,y,color,count=10) {
            for (let i=0;i<count;i++) { const a=Math.random()*Math.PI*2, s=Math.random()*4+1; this.ui.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:30+Math.random()*30,maxLife:60,color,size:2+Math.random()*4}); }
        }

        procesarMuerteEnemigo(e) {
            if (e.tipo==='proyectil'&&!e.alive) for(let i=0;i<CONFIG.combat.proyectilCount;i++){const a=Math.random()*Math.PI*2;this.balas.push(new Bullet(e.x,e.y,Math.cos(a)*4,Math.sin(a)*4,8));}
            if (e.tipo==='kamikaze'&&!e.alive){
                for(const en of this.enemigos)if(en.alive&&dist(e.x,e.y,en.x,en.y)<CONFIG.combat.kamikazeArea)en.hp-=30;
                if(dist(e.x,e.y,this.jugador.x,this.jugador.y)<CONFIG.combat.kamikazeArea)this.jugador.takeDamage(15);
                this._emitParticles(e.x,e.y,'#ff4500',20);
            }
            const estadosActivos=[];
            if(e.hasStatus('quemadura'))estadosActivos.push('fuego');
            if(e.hasStatus('congelacion'))estadosActivos.push('hielo');
            if(e.hasStatus('veneno'))estadosActivos.push('veneno');
            if(estadosActivos.length>=2){
                const clave=`${estadosActivos[0]}+${estadosActivos[1]}`;
                const reaccion=CONFIG.elements.reacciones[clave]||CONFIG.elements.reacciones[`${estadosActivos[1]}+${estadosActivos[0]}`];
                if(reaccion){
                    if(reaccion.dejaZona)this.zonas.push(new ZonaElemental(e.x,e.y,reaccion.dejaZona,CONFIG.elements.zonaDuracion));
                    if(reaccion.accion==='choqueTermico'){for(const en of this.enemigos)if(en.alive&&dist(e.x,e.y,en.x,en.y)<reaccion.area)en.hp-=reaccion.daño;}
                    if(reaccion.accion==='nubeInflamable'){this.zonas.push(new ZonaElemental(e.x,e.y,'fuego',120));}
                    if(reaccion.accion==='vapor'){for(const en of this.enemigos)if(en.alive&&dist(e.x,e.y,en.x,en.y)<reaccion.area){en.x+=(en.x-e.x)*0.3;en.y+=(en.y-e.y)*0.3;en.applyStatusEffect('quemadura',{damage:5,duration:90});}}
                }
            }
            const events = this.evolutionService.processDeath(e);
            for (const ev of events) {
                if (ev.type==='spawn') {
                    const hijo = ev.enemy;
                    hijo.sprite = this.spriteGenerator.getSprite(hijo.tipo, 'comun', 'fisico', `${hijo.x},${hijo.y},${this.kills}`);
                    this.enemigos.push(hijo);
                } else if (ev.type==='loot') {
                    if (Math.random()<CONFIG.combat.moduleDropChance) {
                        const pieza = this.dropService.generarModule(e);
                        this.jugador.inventarioModulos.push(pieza);
                    } else {
                        const loot = this.dropService.generarLoot(e, this.jugador);
                        if (loot) this.drops.push(loot);
                    }
                } else if (ev.type==='death') {
                    this.kills++;
                    this.cargaUltimate = Math.min(this.maxCargaUltimate, this.cargaUltimate+CONFIG.combat.ultimateChargePerKill);
                    if (e.esJefe) this.jefesDerrotados++;
                    if (this.nivelService.addXP(CONFIG.combat.xpPerKill)) this._mostrarOpcionesNivel();
                }
            }
        }

        _mostrarOpcionesNivel() {
            const panel = document.getElementById('levelup-panel');
            const desc = document.getElementById('levelup-desc');
            const op = document.getElementById('levelup-options');
            const ops = this.nivelService.getOptions();
            desc.textContent = `Nivel ${this.jugador.nivel}: Elige una mejora.`;
            op.innerHTML = ops.map((o,i) => `<button onclick="window.__game._elegirMejoraNivel(${i})">${o.texto}</button>`).join('');
            panel.style.display = 'block';
            this._opcionesNivel = ops;
            this.pausado = true;
        }

        _elegirMejoraNivel(i) {
            if (!this._opcionesNivel || !this._opcionesNivel[i]) return;
            this._opcionesNivel[i].accion();
            document.getElementById('levelup-panel').style.display = 'none';
            this.pausado = false;
            this._opcionesNivel = null;
            this.jugador.critChance = CONFIG.player.baseCritChance + (this.jugador.permanentUpgrades.critBonus||0)*0.05;
        }

        recogerDrop(d) {
            this.dropsRecogidos++;
            switch(d.tipo) {
                case 'hp': this.jugador.heal(d.valor); break;
                case 'proyectiles': this.jugador.upgradeWeapon(); break;
                case 'cadencia': this.jugador.permanentUpgrades.fireRateBonus+=d.valor; break;
                case 'daño': this.jugador.permanentUpgrades.damageBonus+=d.valor; break;
                case 'velocidad': this.jugador.permanentUpgrades.speedBonus+=d.valor; break;
                case 'precision': this.jugador.critChance+=d.valor; break;
            }
        }

        spawnBoss() {
            const b = new Enemy(this.canvas.width/2,this.canvas.height/2,3,CONFIG.combat.enemyBaseHp*3,CONFIG.combat.enemyBaseSize*1.6,CONFIG.combat.enemyBaseSpeed*0.7,'normal');
            b.esJefe = true;
            b.sprite = this.spriteGenerator.getSprite('normal','jefe','fisico',`boss,${this.kills}`);
            this.enemigos.push(b);
        }

        finalizarPartida() {
            const s = this.persistence.load();
            s.destinyPoints = (s.destinyPoints||0)+2;
            s.kills = (s.kills||0)+this.kills;
            s.upgrades = { ...this.jugador.permanentUpgrades };
            s.modulosEquipados = this.jugador.modulosEquipados;
            s.inventarioModulos = this.jugador.inventarioModulos;
            this.persistence.save(s);
        }

        _guardarProgreso() {
            const s = this.persistence.load();
            s.destinyPoints = this.jugador.destinyPoints;
            s.upgrades = { ...this.jugador.permanentUpgrades };
            s.modulosEquipados = this.jugador.modulosEquipados;
            s.inventarioModulos = this.jugador.inventarioModulos;
            this.persistence.save(s);
        }

        _loop() {
            this._update();
            this._draw();
            requestAnimationFrame(() => this._loop());
        }

        _update() {
            if (this.gameOver || this.pausado) return;
            this.input.update();
            this.jugador.update(this.input);
            this.tiempoSobrevivido++;

            const move = this.input.getMove();
            let speed = this.proyectilService.getStats().speed;
            if (this.jugador.dashing) speed *= CONFIG.input.dashSpeed;
            this.jugador.x += move.dx * speed;
            this.jugador.y += move.dy * speed;
            const margen = this.jugador.radio + 10;
            this.jugador.x = Math.max(margen, Math.min(this.canvas.width - margen, this.jugador.x));
            this.jugador.y = Math.max(margen, Math.min(this.canvas.height - margen, this.jugador.y));

            if (this.jugador.cooldown === 0 && (CONFIG.input.autoFire || this.input.isFireHeld() || this.input.consumeFireRequest?.())) {
                const stats = this.proyectilService.getStats();
                this.jugador.fire(this._getAimAngle(), this.balas, stats);
            }

            if (this.input.consumeBuffered('dash', this.jugador.dashCooldown === 0)) {
                this.jugador.dashing = true;
                this.jugador.dashTimer = CONFIG.input.dashDuration;
                this.jugador.invincible = true;
                this.jugador.dashCooldown = CONFIG.input.dashCooldown;
            }
            if (this.input.consumeBuffered('ultimate', this.cargaUltimate >= this.maxCargaUltimate)) {
                this.activarUltimate();
            }

            if (this.powerActive) { this.powerTimer--; if (this.powerTimer <= 0) this.powerActive = false; }

            this.combatService.updateBullets(this.balas, this.enemigos, this.estructuras, this.jugador, this.difficulty, this.powerActive, this);
            this.combatService.updateEnemies(this.enemigos, this.jugador, this.canvas, this);

            for (let i = this.estructuras.length-1; i >= 0; i--) if (!this.estructuras[i].alive) this.estructuras.splice(i,1);
            for (let i = this.drops.length-1; i >= 0; i--) {
                const d = this.drops[i];
                if (dist(d.x, d.y, this.jugador.x, this.jugador.y) < this.jugador.radio + d.radio) { this.recogerDrop(d); this.drops.splice(i,1); }
            }
            for (let i = this.zonas.length-1; i >= 0; i--) {
                this.zonas[i].duracion--;
                if (this.zonas[i].duracion <= 0) this.zonas.splice(i,1);
                else { this.zonas[i].afectaJugador(this.jugador); for (const e of this.enemigos) if (e.alive) this.zonas[i].afectaEnemigo(e); }
            }

            const maxEn = CONFIG.combat.maxEnemies;
            this.spawnTimer--;
            const enVivos = this.enemigos.filter(e=>e.alive).length;
            if (this.spawnTimer <= 0 || (CONFIG.combat.spawnAdaptativo && enVivos < 3 && this.spawnTimer > 10)) {
                this.spawnEnemy();
                this.spawnTimer = CONFIG.combat.spawnInterval;
                if (CONFIG.combat.spawnAdaptativo && enVivos < 3) this.spawnTimer = 20;
            }
            if (CONFIG.combat.oleadasPeriodicas) {
                this.oleadaTimer--;
                if (this.oleadaTimer <= 0) { this.oleadaTimer = 600; for (let i = 0; i < 5; i++) this.spawnEnemy(); }
            }
            if (this.kills > 0 && this.kills % CONFIG.combat.bossInterval === 0 && !this.enemigos.some(e=>e.esJefe&&e.alive)) this.spawnBoss();

            this.jugador.updateOrbitales(this.enemigos, this.balas);
            this.difficulty.update(this.jugador, this.kills);

            for (let i = this.ui.particles.length-1; i >= 0; i--) {
                const p = this.ui.particles[i]; p.x += p.vx; p.y += p.vy; p.vx *= 0.98; p.vy *= 0.98; p.life--;
                if (p.life <= 0) this.ui.particles.splice(i,1);
            }
            if (this.ui.cameraShake.intensity > 0) { this.ui.cameraShake.intensity *= 0.9; if (this.ui.cameraShake.intensity < 0.01) this.ui.cameraShake.intensity = 0; }

            if (this.jugador.hp <= 0 && !this.practiceMode) { this.gameOver = true; this.jugador.hp = 0; this.finalizarPartida(); }
        }

        _draw() {
            this.renderer.clear();
            if (this.ui.cameraShake.intensity > 0.001) {
                const ctx = this.renderer.ctx;
                ctx.save();
                ctx.translate((Math.random()-0.5)*this.ui.cameraShake.intensity*2, (Math.random()-0.5)*this.ui.cameraShake.intensity*2);
                this.renderer.drawBackground();
                ctx.restore();
            } else {
                this.renderer.drawBackground();
            }
            for (const z of this.zonas) this.renderer.drawZone(z);
            for (const s of this.estructuras) this.renderer.drawStructure(s);
            for (const d of this.drops) this.renderer.drawDrop(d);
            for (const e of this.enemigos) this.renderer.drawEnemy(e);
            for (const b of this.balas) this.renderer.drawBullet(b);
            this.renderer.drawParticles(this.ui.particles);
            this.renderer.drawPlayer(this.jugador);
            this.renderer.drawUI({ player: this.jugador, game: this, canvas: this.canvas });
        }
    }

    // ==================== INICIALIZACIÓN ====================
    document.addEventListener('DOMContentLoaded', () => {
        const canvas = document.getElementById('game');
        if (!canvas) return;
        const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        const input = isMobile ? new MobileInputAdapter(canvas) : new WebInputAdapter(canvas);
        const renderer = new CanvasRenderer(canvas);
        const persistence = new LocalStorageRepo();
        window.__game = new Game(canvas, input, renderer, persistence);
    });
    </script>
